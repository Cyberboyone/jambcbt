name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEY_ALIAS: jambcbt
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEYSTORE_PATH: ${{ github.workspace }}/android/app/jambcbt-upload.keystore

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: flutter pub run flutter_launcher_icons

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d ' \t\r\n`"' > /tmp/ks.b64
          base64 -d /tmp/ks.b64 > android/app/jambcbt-upload.keystore
          SIZE=$(stat -c%s android/app/jambcbt-upload.keystore)
          if [ "$SIZE" -ne 4418 ]; then
            echo "::error::Keystore decoded to $SIZE bytes but expected 4418. The ANDROID_KEYSTORE_BASE64 secret is truncated or belongs to a different keystore. Re-paste it from keystore_b64_only.txt (select-all, single line, 5892 chars)."
            exit 1
          fi
          echo "Keystore decoded OK ($SIZE bytes)"

      - name: Verify Keystore Password
        env:
          KS_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          sha256sum android/app/jambcbt-upload.keystore
          echo "Expected sha256: 72754efbc7ac3123294d12903c8caf6ede1cbd0cead18135553a0634cdc55a52"
          keytool -list -keystore android/app/jambcbt-upload.keystore -storepass "$KS_PASS" -alias jambcbt

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JAMB-CBT-App-Release
          path: build/app/outputs/flutter-apk/app-release.apk
