<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="310" fill="#FFFFFF"/>
<rect x="0" y="0" width="760" height="310" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="380.0" y="26" font-family="DejaVu Sans" font-size="13" fill="#0E1F40" text-anchor="middle" font-weight="bold">Iago's Three Engines</text>
<text x="380.0" y="45" font-family="DejaVu Sans" font-size="9.2" fill="#64748B" text-anchor="middle" font-weight="normal">He does not lie about facts. He arranges them, and lets the general finish the thought</text>
<rect x="300" y="68" width="160" height="60" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.6"/>
<text x="380" y="94" font-family="DejaVu Sans" font-size="13" fill="#008751" text-anchor="middle" font-weight="bold">IAGO</text>
<text x="380" y="112" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">“I am not what I am”</text>
<rect x="14" y="180" width="236" height="92" rx="7" fill="#FFFFFF" stroke="#D97706" stroke-width="1.3"/>
<text x="132" y="200" font-family="DejaVu Sans" font-size="9.6" fill="#D97706" text-anchor="middle" font-weight="bold">THE PLANT</text>
<text x="132" y="218" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">“I like not that.”</text>
<text x="132" y="236" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="middle" font-weight="normal">an unfinished observation, dropped and not</text>
<text x="132" y="247" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="middle" font-weight="normal">explained</text>
<line x1="380" y1="132" x2="132" y2="176" stroke="#008751" stroke-width="1.7" marker-end="url(#ag)"/>
<rect x="262" y="180" width="236" height="92" rx="7" fill="#FFFFFF" stroke="#D97706" stroke-width="1.3"/>
<text x="380" y="200" font-family="DejaVu Sans" font-size="9.6" fill="#D97706" text-anchor="middle" font-weight="bold">THE PROOF</text>
<text x="380" y="218" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">the handkerchief in Cassio's room</text>
<text x="380" y="236" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="middle" font-weight="normal">a physical object, presented as evidence</text>
<line x1="380" y1="132" x2="380" y2="176" stroke="#008751" stroke-width="1.7" marker-end="url(#ag)"/>
<rect x="510" y="180" width="236" height="92" rx="7" fill="#FFFFFF" stroke="#D97706" stroke-width="1.3"/>
<text x="628" y="200" font-family="DejaVu Sans" font-size="9.6" fill="#D97706" text-anchor="middle" font-weight="bold">THE ECHO</text>
<text x="628" y="218" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">“Indeed?” “Is't possible?”</text>
<text x="628" y="236" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="middle" font-weight="normal">the general's own words returned to him</text>
<line x1="380" y1="132" x2="628" y2="176" stroke="#008751" stroke-width="1.7" marker-end="url(#ag)"/>
<text x="380.0" y="298" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="middle" font-weight="normal">Each engine needs the last: a plant without proof is gossip, and proof without an echo is a fact Othello would refuse.</text>
</svg>
