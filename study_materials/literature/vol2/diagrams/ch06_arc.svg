<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="320" fill="#F8FAFC"/>
<rect x="0" y="0" width="760" height="320" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="380.0" y="26" font-family="DejaVu Sans" font-size="13" fill="#0E1F40" text-anchor="middle" font-weight="bold">Native Son: Fear, Flight, Fate</text>
<text x="380.0" y="45" font-family="DejaVu Sans" font-size="9.2" fill="#64748B" text-anchor="middle" font-weight="normal">Three books, one direction: a man runs, and the running is the plot</text>
<rect x="24" y="66" width="228" height="210" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<rect x="24" y="66" width="228" height="6" rx="3" fill="#2563EB"/>
<text x="138" y="94" font-family="DejaVu Sans" font-size="13" fill="#2563EB" text-anchor="middle" font-weight="bold">FEAR</text>
<text x="138" y="112" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="middle" font-weight="normal">Book One</text>
<text x="40" y="140" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">• the rat in the dark room</text>
<text x="40" y="172" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">• the Dalton house</text>
<text x="40" y="204" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">• the car, the drink, the murder</text>
<line x1="254" y1="170" x2="264" y2="170" stroke="#008751" stroke-width="2.0" marker-end="url(#ag)"/>
<rect x="268" y="66" width="228" height="210" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
<rect x="268" y="66" width="228" height="6" rx="3" fill="#D97706"/>
<text x="382" y="94" font-family="DejaVu Sans" font-size="13" fill="#D97706" text-anchor="middle" font-weight="bold">FLIGHT</text>
<text x="382" y="112" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="middle" font-weight="normal">Book Two</text>
<text x="284" y="140" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">• the furnace, the alibi</text>
<text x="284" y="172" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">• Bessie, the roof, the snow</text>
<text x="284" y="204" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">• the capture</text>
<line x1="498" y1="170" x2="508" y2="170" stroke="#008751" stroke-width="2.0" marker-end="url(#ag)"/>
<rect x="512" y="66" width="228" height="210" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
<rect x="512" y="66" width="228" height="6" rx="3" fill="#DC2626"/>
<text x="626" y="94" font-family="DejaVu Sans" font-size="13" fill="#DC2626" text-anchor="middle" font-weight="bold">FATE</text>
<text x="626" y="112" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="middle" font-weight="normal">Book Three</text>
<text x="528" y="140" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">• the confession</text>
<text x="528" y="172" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">• Max's argument</text>
<text x="528" y="204" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">• the cell, and the last word</text>
<text x="380.0" y="308" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="middle" font-weight="normal">The three titles are the argument: Wright names the sequence that produces the crime before the crime occurs.</text>
</svg>
