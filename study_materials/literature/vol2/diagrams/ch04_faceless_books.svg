<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="250" fill="#FFFFFF"/>
<text x="380" y="24" font-family="DejaVu Sans" font-size="12.5" fill="#0E1F40" text-anchor="middle" font-weight="bold">Three books, three questions</text>
<rect x="46" y="56" width="208" height="150" rx="9" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
<rect x="46" y="56" width="208" height="5" rx="2.5" fill="#2563EB"/>
<text x="150" y="82" font-family="DejaVu Sans" font-size="8.6" fill="#2563EB" text-anchor="middle" font-weight="bold">BOOK ONE</text>
<text x="150" y="104" font-family="DejaVu Sans" font-size="11" fill="#0E1F40" text-anchor="middle" font-weight="bold">Who is Fofo?</text>
<text x="150" y="128" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">the street, Poison, Odarley,</text>
<text x="150" y="142" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">and a fourteen-year-old</text>
<text x="150" y="156" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">who is already an adult</text>
<line x1="256" y1="132" x2="282" y2="132" stroke="#CBD5E1" stroke-width="1.4" marker-end="url(#ag)"/>
<rect x="274" y="56" width="208" height="150" rx="9" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/>
<rect x="274" y="56" width="208" height="5" rx="2.5" fill="#D97706"/>
<text x="378" y="82" font-family="DejaVu Sans" font-size="8.6" fill="#D97706" text-anchor="middle" font-weight="bold">BOOK TWO</text>
<text x="378" y="104" font-family="DejaVu Sans" font-size="11" fill="#0E1F40" text-anchor="middle" font-weight="bold">Who was Baby T?</text>
<text x="378" y="128" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">Maa Tsuru's story, Kpakpo,</text>
<text x="378" y="142" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">Onko, the sale, and the</text>
<text x="378" y="156" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">household that failed her</text>
<line x1="484" y1="132" x2="510" y2="132" stroke="#CBD5E1" stroke-width="1.4" marker-end="url(#ag)"/>
<rect x="502" y="56" width="208" height="150" rx="9" fill="#FFFFFF" stroke="#008751" stroke-width="1.4"/>
<rect x="502" y="56" width="208" height="5" rx="2.5" fill="#008751"/>
<text x="606" y="82" font-family="DejaVu Sans" font-size="8.6" fill="#008751" text-anchor="middle" font-weight="bold">BOOK THREE</text>
<text x="606" y="104" font-family="DejaVu Sans" font-size="11" fill="#0E1F40" text-anchor="middle" font-weight="bold">Who killed her?</text>
<text x="606" y="128" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">MUTE, Sylv Po, the radio,</text>
<text x="606" y="142" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">the mortuary report, and</text>
<text x="606" y="156" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">the left-hand print</text>
<text x="380" y="232" font-family="DejaVu Sans" font-size="8.9" fill="#64748B" text-anchor="middle" font-weight="normal">The novel answers the question of the title by showing how many people failed before anyone was charged.</text>
</svg>
