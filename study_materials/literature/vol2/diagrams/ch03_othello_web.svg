<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="300" fill="#FFFFFF"/>
<text x="380" y="24" font-family="DejaVu Sans" font-size="12.5" fill="#0E1F40" text-anchor="middle" font-weight="bold">Iago's method: four handles, one hand</text>
<rect x="316" y="120" width="128" height="52" rx="9" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/>
<text x="380" y="142" font-family="DejaVu Sans" font-size="11" fill="#DC2626" text-anchor="middle" font-weight="bold">IAGO</text>
<text x="380" y="158" font-family="DejaVu Sans" font-size="8" fill="#334155" text-anchor="middle" font-weight="normal">the engine</text>
<rect x="56" y="52" width="148" height="48" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.3"/>
<text x="130" y="71" font-family="DejaVu Sans" font-size="9.2" fill="#D97706" text-anchor="middle" font-weight="bold">RODERIGO</text>
<text x="130" y="87" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">money and a grudge</text>
<rect x="56" y="196" width="148" height="48" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
<text x="130" y="215" font-family="DejaVu Sans" font-size="9.2" fill="#2563EB" text-anchor="middle" font-weight="bold">CASSIO</text>
<text x="130" y="231" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">the demotion</text>
<rect x="556" y="52" width="148" height="48" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/>
<text x="630" y="71" font-family="DejaVu Sans" font-size="9.2" fill="#7C3AED" text-anchor="middle" font-weight="bold">OTHELLO</text>
<text x="630" y="87" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">jealousy, once planted</text>
<rect x="556" y="196" width="148" height="48" rx="8" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<text x="630" y="215" font-family="DejaVu Sans" font-size="9.2" fill="#008751" text-anchor="middle" font-weight="bold">EMILIA</text>
<text x="630" y="231" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">the handkerchief</text>
<line x1="204" y1="84" x2="316" y2="128" stroke="#DC2626" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="204" y1="210" x2="316" y2="160" stroke="#DC2626" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="444" y1="128" x2="556" y2="84" stroke="#DC2626" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="444" y1="160" x2="556" y2="210" stroke="#DC2626" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="380" y="250" font-family="DejaVu Sans" font-size="8.8" fill="#64748B" text-anchor="middle" font-weight="normal">Each handle is a weakness the victim already has. Iago supplies nothing but the pull.</text>
<text x="380" y="268" font-family="DejaVu Sans" font-size="8.8" fill="#64748B" text-anchor="middle" font-weight="normal">That is why the play is a tragedy of character as much as of villainy.</text>
</svg>
