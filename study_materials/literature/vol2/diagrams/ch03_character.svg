<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="330" fill="#F8FAFC"/>
<rect x="0" y="0" width="760" height="330" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3"/>
<text x="380.0" y="26" font-family="DejaVu Sans" font-size="13" fill="#0E1F40" text-anchor="middle" font-weight="bold">Character: Five Questions, Not a Description</text>
<text x="380.0" y="45" font-family="DejaVu Sans" font-size="9.2" fill="#64748B" text-anchor="middle" font-weight="normal">A character in an exam answer is a function before he is a person</text>
<rect x="22" y="64" width="340" height="72" rx="8" fill="#FFFFFF" stroke="#008751" stroke-width="1.4"/>
<text x="38" y="88" font-family="DejaVu Sans" font-size="9.0" fill="#008751" text-anchor="start" font-weight="bold">1  WHAT DOES HE WANT?</text>
<text x="38" y="108" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">the desire that drives his scenes, in this unit</text>
<rect x="382" y="64" width="340" height="72" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
<text x="398" y="88" font-family="DejaVu Sans" font-size="9.0" fill="#2563EB" text-anchor="start" font-weight="bold">2  WHAT STOPS HIM?</text>
<text x="398" y="108" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">the obstacle, and who holds it</text>
<rect x="22" y="148" width="340" height="72" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/>
<text x="38" y="172" font-family="DejaVu Sans" font-size="9.0" fill="#D97706" text-anchor="start" font-weight="bold">3  WHAT DOES HE DO WHEN IT COSTS?</text>
<text x="38" y="192" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">the choice that reveals him</text>
<rect x="382" y="148" width="340" height="72" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
<text x="398" y="172" font-family="DejaVu Sans" font-size="9.0" fill="#7C3AED" text-anchor="start" font-weight="bold">4  WHAT CAN HE NOT SAY?</text>
<text x="398" y="192" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">the silence the text has designed</text>
<rect x="22" y="232" width="340" height="72" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.4"/>
<text x="38" y="256" font-family="DejaVu Sans" font-size="9.0" fill="#DC2626" text-anchor="start" font-weight="bold">5  WHAT WOULD THE TEXT LOSE WITHOUT HIM?</text>
<text x="38" y="276" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">his function in the structure</text>
<text x="380.0" y="318" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="middle" font-weight="normal">If the fifth answer is “nothing”, the character is scenery — and a question about him is really asking about someone else.</text>
</svg>
