<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="290" fill="#FFFFFF"/>
<rect x="0" y="0" width="760" height="290" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
<text x="380.0" y="26" font-family="DejaVu Sans" font-size="13" fill="#0E1F40" text-anchor="middle" font-weight="bold">The Theme Ledger: A Claim, Its Evidence, and the Case Against</text>
<text x="380.0" y="45" font-family="DejaVu Sans" font-size="9.2" fill="#64748B" text-anchor="middle" font-weight="normal">A theme is not a word. It is a sentence, and it must be arguable</text>
<rect x="20" y="64" width="720" height="34" rx="6" fill="#ECFDF5" stroke="#008751" stroke-width="1.2"/>
<text x="30" y="86" font-family="DejaVu Sans" font-size="9.2" fill="#008751" text-anchor="start" font-weight="bold">CLAIM:</text>
<text x="80" y="86" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">“The play argues that reputation is a story other people tell about you.”</text>
<rect x="20" y="108" width="350" height="120" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
<text x="195" y="128" font-family="DejaVu Sans" font-size="9.4" fill="#2563EB" text-anchor="middle" font-weight="bold">FOR — three moments</text>
<text x="36" y="150" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">• Cassio's brawl costs him the name of soldier</text>
<text x="36" y="174" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">• Iago's “reputation” speech to Cassio</text>
<text x="36" y="198" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">• Othello's “name ... as indifferent as my birth”</text>
<rect x="390" y="108" width="350" height="120" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.3"/>
<text x="565" y="128" font-family="DejaVu Sans" font-size="9.4" fill="#DC2626" text-anchor="middle" font-weight="bold">AGAINST — two moments</text>
<text x="406" y="150" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">• Desdemona is valued for her mind, not her name</text>
<text x="406" y="174" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">• Emilia dies telling the truth about the name</text>
<text x="380.0" y="278" font-family="DejaVu Sans" font-size="8.8" fill="#64748B" text-anchor="middle" font-weight="normal">A ledger with a column against is an argument. A ledger with only a column for is a summary.</text>
</svg>
