<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="280" fill="#F8FAFC"/>
<rect x="0" y="0" width="760" height="280" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3"/>
<text x="380.0" y="26" font-family="DejaVu Sans" font-size="13" fill="#0E1F40" text-anchor="middle" font-weight="bold">Four Axes for Any Comparison</text>
<text x="380.0" y="45" font-family="DejaVu Sans" font-size="9.2" fill="#64748B" text-anchor="middle" font-weight="normal">Never compare two texts on everything. Compare them on one axis, then let the axis do the work</text>
<line x1="40" y1="210" x2="720" y2="210" stroke="#64748B" stroke-width="1.4"/>
<line x1="100" y1="210" x2="100" y2="190" stroke="#2563EB" stroke-width="2.0"/>
<circle cx="100" cy="210" r="4.6" fill="#2563EB"/>
<text x="100" y="176" font-family="DejaVu Sans" font-size="9.0" fill="#2563EB" text-anchor="middle" font-weight="bold">WHO HOLDS THE POWER</text>
<text x="100" y="232" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">and how the text distributes it</text>
<line x1="260" y1="210" x2="260" y2="190" stroke="#008751" stroke-width="2.0"/>
<circle cx="260" cy="210" r="4.6" fill="#008751"/>
<text x="260" y="176" font-family="DejaVu Sans" font-size="9.0" fill="#008751" text-anchor="middle" font-weight="bold">WHO IS ALLOWED TO SPEAK</text>
<text x="260" y="232" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">and in what form</text>
<line x1="420" y1="210" x2="420" y2="190" stroke="#D97706" stroke-width="2.0"/>
<circle cx="420" cy="210" r="4.6" fill="#D97706"/>
<text x="420" y="176" font-family="DejaVu Sans" font-size="9.0" fill="#D97706" text-anchor="middle" font-weight="bold">WHAT THE ENDING COSTS</text>
<text x="420" y="232" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">who pays, and who is spared</text>
<line x1="580" y1="210" x2="580" y2="190" stroke="#7C3AED" stroke-width="2.0"/>
<circle cx="580" cy="210" r="4.6" fill="#7C3AED"/>
<text x="580" y="176" font-family="DejaVu Sans" font-size="9.0" fill="#7C3AED" text-anchor="middle" font-weight="bold">WHAT THE TEXT REFUSES TO</text>
<text x="580" y="165" font-family="DejaVu Sans" font-size="9.0" fill="#7C3AED" text-anchor="middle" font-weight="bold">SAY</text>
<text x="580" y="232" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">the silence at the centre</text>
<text x="380.0" y="268" font-family="DejaVu Sans" font-size="8.8" fill="#64748B" text-anchor="middle" font-weight="normal">One axis per paragraph. Two texts, one question, and the comparison becomes an argument rather than a list.</text>
</svg>
