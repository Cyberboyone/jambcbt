<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="310" fill="#FFFFFF"/>
<rect x="0" y="0" width="760" height="310" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="380.0" y="26" font-family="DejaVu Sans" font-size="13" fill="#0E1F40" text-anchor="middle" font-weight="bold">Native Son: Four Rooms and What Each One Allows</text>
<text x="380.0" y="45" font-family="DejaVu Sans" font-size="9.2" fill="#64748B" text-anchor="middle" font-weight="normal">Bigger is defined by the space he is in — and by the one space he is never allowed</text>
<rect x="20" y="66" width="350" height="94" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
<text x="36" y="90" font-family="DejaVu Sans" font-size="9.6" fill="#2563EB" text-anchor="start" font-weight="bold">THE RAT ROOM</text>
<text x="36" y="108" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">one room, four people, no privacy</text>
<text x="36" y="146" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="start" font-weight="normal">→ the family as a pressure</text>
<rect x="390" y="66" width="350" height="94" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/>
<text x="406" y="90" font-family="DejaVu Sans" font-size="9.6" fill="#D97706" text-anchor="start" font-weight="bold">THE DALTON HOUSE</text>
<text x="406" y="108" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">space, blindness, a daughter who touches him</text>
<text x="406" y="146" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="start" font-weight="normal">→ charity as a trap</text>
<rect x="20" y="174" width="350" height="94" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.4"/>
<text x="36" y="198" font-family="DejaVu Sans" font-size="9.6" fill="#DC2626" text-anchor="start" font-weight="bold">THE FURNACE</text>
<text x="36" y="216" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">the building's throat</text>
<text x="36" y="254" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="start" font-weight="normal">→ the crime becomes literal</text>
<rect x="390" y="174" width="350" height="94" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
<text x="406" y="198" font-family="DejaVu Sans" font-size="9.6" fill="#7C3AED" text-anchor="start" font-weight="bold">THE CELL</text>
<text x="406" y="216" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">the only room of his own</text>
<text x="406" y="254" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="start" font-weight="normal">→ the confession, and the argument</text>
<text x="380.0" y="298" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="middle" font-weight="normal">Ask of any scene: which room is this, and what does this room permit that the last one did not?</text>
</svg>
