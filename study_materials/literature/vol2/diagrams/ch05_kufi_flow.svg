<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="300" fill="#FFFFFF"/>
<text x="380" y="24" font-family="DejaVu Sans" font-size="12.5" fill="#0E1F40" text-anchor="middle" font-weight="bold">What Kufi asks of a widow, and where Yaremi stops</text>
<rect x="40" y="60" width="210" height="74" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.4"/>
<rect x="40" y="60" width="5" height="74" rx="2.5" fill="#DC2626"/>
<text x="58" y="84" font-family="DejaVu Sans" font-size="9.4" fill="#DC2626" text-anchor="start" font-weight="bold">BEREAVEMENT</text>
<text x="58" y="102" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">the husband dies;</text>
<text x="58" y="115" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">the wife is suspected</text>
<line x1="252" y1="97" x2="276" y2="97" stroke="#CBD5E1" stroke-width="1.4" marker-end="url(#ag)"/>
<rect x="280" y="60" width="210" height="74" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/>
<rect x="280" y="60" width="5" height="74" rx="2.5" fill="#D97706"/>
<text x="298" y="84" font-family="DejaVu Sans" font-size="9.4" fill="#D97706" text-anchor="start" font-weight="bold">RITES</text>
<text x="298" y="102" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">head shaved, black cloth,</text>
<text x="298" y="115" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">widow's road only</text>
<line x1="492" y1="97" x2="516" y2="97" stroke="#CBD5E1" stroke-width="1.4" marker-end="url(#ag)"/>
<rect x="520" y="60" width="210" height="74" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/>
<rect x="520" y="60" width="5" height="74" rx="2.5" fill="#D97706"/>
<text x="538" y="84" font-family="DejaVu Sans" font-size="9.4" fill="#D97706" text-anchor="start" font-weight="bold">CONFESSION</text>
<text x="538" y="102" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">libation, and sins</text>
<text x="538" y="115" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">she did not commit</text>
<rect x="40" y="152" width="210" height="74" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
<rect x="40" y="152" width="5" height="74" rx="2.5" fill="#7C3AED"/>
<text x="58" y="176" font-family="DejaVu Sans" font-size="9.4" fill="#7C3AED" text-anchor="start" font-weight="bold">CAP PICKING</text>
<text x="58" y="194" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">choose a new husband</text>
<text x="58" y="207" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">from the suitors</text>
<rect x="280" y="152" width="210" height="74" rx="8" fill="#FFFFFF" stroke="#008751" stroke-width="1.4"/>
<rect x="280" y="152" width="5" height="74" rx="2.5" fill="#008751"/>
<text x="298" y="176" font-family="DejaVu Sans" font-size="9.4" fill="#008751" text-anchor="start" font-weight="bold">REFUSAL</text>
<text x="298" y="194" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">Yaremi will not pick</text>
<rect x="520" y="152" width="210" height="74" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.4"/>
<rect x="520" y="152" width="5" height="74" rx="2.5" fill="#DC2626"/>
<text x="538" y="176" font-family="DejaVu Sans" font-size="9.4" fill="#DC2626" text-anchor="start" font-weight="bold">THE PRICE</text>
<text x="538" y="194" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">property seized;</text>
<text x="538" y="207" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">threat of banishment</text>
<line x1="460" y1="134" x2="460" y2="152" stroke="#CBD5E1" stroke-width="1.4" marker-end="url(#ag)"/>
<text x="380" y="276" font-family="DejaVu Sans" font-size="8.9" fill="#64748B" text-anchor="middle" font-weight="normal">The last box is the novel's argument: the community punishes the refusal more heavily than the death.</text>
</svg>
