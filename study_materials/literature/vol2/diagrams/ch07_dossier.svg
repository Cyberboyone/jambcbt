<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="320" fill="#F8FAFC"/>
<rect x="0" y="0" width="760" height="320" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="380.0" y="26" font-family="DejaVu Sans" font-size="13" fill="#0E1F40" text-anchor="middle" font-weight="bold">The Dossier: Five Parts Per Text</text>
<text x="380.0" y="45" font-family="DejaVu Sans" font-size="9.2" fill="#64748B" text-anchor="middle" font-weight="normal">What you build after one reading, so that revision stops being a rereading</text>
<rect x="20" y="66" width="30" height="30" rx="5" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="35" y="86" font-family="DejaVu Sans" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text>
<text x="62" y="79" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="start" font-weight="bold">World</text>
<text x="140" y="79" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="start" font-weight="normal">the setting, the institutions, and the rules that press on the characters</text>
<rect x="20" y="110" width="30" height="30" rx="5" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="35" y="130" font-family="DejaVu Sans" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text>
<text x="62" y="123" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="start" font-weight="bold">Spine</text>
<text x="140" y="123" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="start" font-weight="normal">the story in six beats, each one a change rather than an event</text>
<rect x="20" y="154" width="30" height="30" rx="5" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="35" y="174" font-family="DejaVu Sans" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text>
<text x="62" y="167" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="start" font-weight="bold">Cast</text>
<text x="140" y="167" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="start" font-weight="normal">name, want, obstacle, function — one line each</text>
<rect x="20" y="198" width="30" height="30" rx="5" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="35" y="218" font-family="DejaVu Sans" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text>
<text x="62" y="211" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="start" font-weight="bold">Moments</text>
<text x="140" y="211" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="start" font-weight="normal">five scenes that carry several questions and can be quoted in six words</text>
<rect x="20" y="242" width="30" height="30" rx="5" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="35" y="262" font-family="DejaVu Sans" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text>
<text x="62" y="255" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="start" font-weight="bold">Claims</text>
<text x="140" y="255" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="start" font-weight="normal">three arguable sentences, the openings of three essays</text>
<text x="380.0" y="306" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="middle" font-weight="normal">Five parts a text, an hour of work, and the text stops being a blur and becomes a set of answerable questions.</text>
</svg>
