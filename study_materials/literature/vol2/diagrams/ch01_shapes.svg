<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="300" fill="#F8FAFC"/>
<rect x="0" y="0" width="760" height="300" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3"/>
<text x="380.0" y="26" font-family="DejaVu Sans" font-size="13" fill="#0E1F40" text-anchor="middle" font-weight="bold">The Four Shapes of a Set-Text Question</text>
<text x="380.0" y="45" font-family="DejaVu Sans" font-size="9.2" fill="#64748B" text-anchor="middle" font-weight="normal">Every question about a prescribed text is one of these, and each wants a different kind of evidence</text>
<rect x="20" y="68" width="170" height="190" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<rect x="20" y="68" width="170" height="6" rx="3" fill="#2563EB"/>
<text x="105" y="96" font-family="DejaVu Sans" font-size="12" fill="#2563EB" text-anchor="middle" font-weight="bold">FACT</text>
<text x="105" y="114" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="middle" font-weight="normal">who, where, when</text>
<text x="105" y="140" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="middle" font-weight="normal">“Who speaks this line?”</text>
<text x="105" y="164" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="middle" font-weight="normal">“Where is the scene set?”</text>
<text x="105" y="188" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="middle" font-weight="normal">one word, no argument</text>
<rect x="205" y="68" width="170" height="190" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
<rect x="205" y="68" width="170" height="6" rx="3" fill="#D97706"/>
<text x="290" y="96" font-family="DejaVu Sans" font-size="12" fill="#D97706" text-anchor="middle" font-weight="bold">FUNCTION</text>
<text x="290" y="114" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="middle" font-weight="normal">what the part does</text>
<text x="290" y="140" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="middle" font-weight="normal">“What is the function of the</text>
<text x="290" y="164" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="middle" font-weight="normal">subplot / the fool / the letter?”</text>
<text x="290" y="188" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="middle" font-weight="normal">a relationship, not a summary</text>
<rect x="390" y="68" width="170" height="190" rx="8" fill="#FFFFFF" stroke="#008751" stroke-width="1.5"/>
<rect x="390" y="68" width="170" height="6" rx="3" fill="#008751"/>
<text x="475" y="96" font-family="DejaVu Sans" font-size="12" fill="#008751" text-anchor="middle" font-weight="bold">EFFECT</text>
<text x="475" y="114" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="middle" font-weight="normal">what the reader feels</text>
<text x="475" y="140" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="middle" font-weight="normal">“What is the effect of the</text>
<text x="475" y="164" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="middle" font-weight="normal">repetition in this speech?”</text>
<text x="475" y="188" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="middle" font-weight="normal">a consequence for the audience</text>
<rect x="575" y="68" width="170" height="190" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
<rect x="575" y="68" width="170" height="6" rx="3" fill="#DC2626"/>
<text x="660" y="96" font-family="DejaVu Sans" font-size="12" fill="#DC2626" text-anchor="middle" font-weight="bold">JUDGEMENT</text>
<text x="660" y="114" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="middle" font-weight="normal">how good, at what cost</text>
<text x="660" y="140" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="middle" font-weight="normal">“How far does the play</text>
<text x="660" y="164" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="middle" font-weight="normal">persuade us that …?”</text>
<text x="660" y="188" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="middle" font-weight="normal">a claim, an objection, a verdict</text>
<text x="380.0" y="286" font-family="DejaVu Sans" font-size="8.8" fill="#64748B" text-anchor="middle" font-weight="normal">Answer the shape that was asked. A function question answered with a plot summary is the commonest lost mark on the text paper.</text>
</svg>
