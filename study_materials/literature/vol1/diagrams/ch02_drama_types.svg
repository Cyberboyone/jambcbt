<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="340" fill="#FFFFFF"/>
<rect x="0" y="0" width="760" height="340" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="380.0" y="26" font-family="DejaVu Sans" font-size="13" fill="#0E1F40" text-anchor="middle" font-weight="bold">The Types of Drama on One Axis</text>
<text x="380.0" y="44" font-family="DejaVu Sans" font-size="9.2" fill="#64748B" text-anchor="middle" font-weight="normal">Left: the hero is destroyed. Right: the hero is laughed at. Every type sits somewhere between.</text>
<rect x="50" y="74" width="660" height="8" rx="4" fill="#A7F3D0" stroke="#A7F3D0" stroke-width="0"/>
<circle cx="63.2" cy="78" r="7" fill="#DC2626"/>
<text x="63.2" y="96" font-family="DejaVu Sans" font-size="9.8" fill="#DC2626" text-anchor="middle" font-weight="bold">TRAGEDY</text>
<text x="63.2" y="110" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">ends in death</text>
<circle cx="208.4" cy="78" r="7" fill="#D97706"/>
<text x="208.4" y="168" font-family="DejaVu Sans" font-size="9.8" fill="#D97706" text-anchor="middle" font-weight="bold">TRAGICOMEDY</text>
<text x="208.4" y="182" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">both, in turn</text>
<circle cx="366.8" cy="78" r="7" fill="#7C3AED"/>
<text x="366.8" y="96" font-family="DejaVu Sans" font-size="9.8" fill="#7C3AED" text-anchor="middle" font-weight="bold">MELODRAMA</text>
<text x="366.8" y="110" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">feeling over truth</text>
<circle cx="525.2" cy="78" r="7" fill="#2563EB"/>
<text x="525.2" y="168" font-family="DejaVu Sans" font-size="9.8" fill="#2563EB" text-anchor="middle" font-weight="bold">COMEDY</text>
<text x="525.2" y="182" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">ends in union</text>
<circle cx="677.0" cy="78" r="7" fill="#008751"/>
<text x="677.0" y="96" font-family="DejaVu Sans" font-size="9.8" fill="#008751" text-anchor="middle" font-weight="bold">FARCE</text>
<text x="677.0" y="110" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">the body, not the mind</text>
<line x1="40" y1="214" x2="720" y2="214" stroke="#CBD5E1" stroke-width="1.0"/>
<text x="48" y="236" font-family="DejaVu Sans" font-size="8.8" fill="#DC2626" text-anchor="start" font-weight="bold">Tragedy</text>
<text x="150" y="236" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="start" font-weight="normal">the hero falls through a flaw, and we feel pity and fear</text>
<text x="48" y="255" font-family="DejaVu Sans" font-size="8.8" fill="#D97706" text-anchor="start" font-weight="bold">Tragicomedy</text>
<text x="150" y="255" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="start" font-weight="normal">a serious threat resolved without death</text>
<text x="48" y="274" font-family="DejaVu Sans" font-size="8.8" fill="#7C3AED" text-anchor="start" font-weight="bold">Melodrama</text>
<text x="150" y="274" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="start" font-weight="normal">good and evil painted plainly; the plot is implausible</text>
<text x="48" y="293" font-family="DejaVu Sans" font-size="8.8" fill="#2563EB" text-anchor="start" font-weight="bold">Comedy</text>
<text x="150" y="293" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="start" font-weight="normal">a confusion resolved into a marriage or a truce</text>
<text x="48" y="312" font-family="DejaVu Sans" font-size="8.8" fill="#008751" text-anchor="start" font-weight="bold">Farce</text>
<text x="150" y="312" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="start" font-weight="normal">mistaken identity, doors, and physical absurdity</text>
</svg>
