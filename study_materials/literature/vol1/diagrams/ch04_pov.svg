<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<rect x="0" y="0" width="760" height="360" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="380.0" y="26" font-family="DejaVu Sans" font-size="13" fill="#0E1F40" text-anchor="middle" font-weight="bold">Point of View — Where the Narrator Stands</text>
<text x="380.0" y="44" font-family="DejaVu Sans" font-size="9.2" fill="#64748B" text-anchor="middle" font-weight="normal">Five positions, and the thing each one can and cannot tell you</text>
<circle cx="380" cy="96" r="26" fill="#ECFDF5" stroke="#008751" stroke-width="1.0"/>
<text x="380" y="100" font-family="DejaVu Sans" font-size="8.0" fill="#008751" text-anchor="middle" font-weight="bold">STORY</text>
<line x1="380" y1="120" x2="110" y2="144" stroke="#CBD5E1" stroke-width="1.1"/>
<rect x="2" y="150" width="216" height="74" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
<text x="110" y="168" font-family="DejaVu Sans" font-size="9.0" fill="#2563EB" text-anchor="middle" font-weight="bold">FIRST PERSON</text>
<text x="110" y="182" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">“I” — inside the story</text>
<text x="110" y="206" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="middle" font-weight="normal">knows one mind: unreliable, limited, close</text>
<line x1="380" y1="120" x2="300" y2="144" stroke="#CBD5E1" stroke-width="1.1"/>
<rect x="192" y="150" width="216" height="74" rx="7" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/>
<text x="300" y="168" font-family="DejaVu Sans" font-size="9.0" fill="#D97706" text-anchor="middle" font-weight="bold">THIRD LIMITED</text>
<text x="300" y="182" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">“he/she” — one mind</text>
<text x="300" y="206" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="middle" font-weight="normal">knows one mind from outside</text>
<line x1="380" y1="120" x2="490" y2="144" stroke="#CBD5E1" stroke-width="1.1"/>
<rect x="382" y="150" width="216" height="74" rx="7" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
<text x="490" y="168" font-family="DejaVu Sans" font-size="9.0" fill="#7C3AED" text-anchor="middle" font-weight="bold">OMNISCIENT</text>
<text x="490" y="182" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">“he/she” — every mind</text>
<text x="490" y="206" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="middle" font-weight="normal">knows all minds, and comments</text>
<line x1="380" y1="120" x2="110" y2="244" stroke="#CBD5E1" stroke-width="1.1"/>
<rect x="2" y="250" width="216" height="74" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.4"/>
<text x="110" y="268" font-family="DejaVu Sans" font-size="9.0" fill="#008751" text-anchor="middle" font-weight="bold">SECOND PERSON</text>
<text x="110" y="282" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">“you” — the reader is addressed</text>
<text x="110" y="306" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="middle" font-weight="normal">rare; makes the reader complicit</text>
<line x1="380" y1="120" x2="380" y2="244" stroke="#CBD5E1" stroke-width="1.1"/>
<rect x="272" y="250" width="216" height="74" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.4"/>
<text x="380" y="268" font-family="DejaVu Sans" font-size="9.0" fill="#DC2626" text-anchor="middle" font-weight="bold">STREAM OF CONSCIOUSNESS</text>
<text x="380" y="282" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">thought before it is tidied</text>
<text x="380" y="306" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="middle" font-weight="normal">no punctuation of logic; association rules</text>
<text x="380.0" y="348" font-family="DejaVu Sans" font-size="8.8" fill="#64748B" text-anchor="middle" font-weight="normal">The narrating choice is an argument: what the writer lets you know is what the book is about.</text>
</svg>
