<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="330" fill="#F8FAFC"/>
<rect x="0" y="0" width="760" height="330" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="380.0" y="26" font-family="DejaVu Sans" font-size="13" fill="#0E1F40" text-anchor="middle" font-weight="bold">Four Ways to Describe a Character</text>
<text x="380.0" y="44" font-family="DejaVu Sans" font-size="9.2" fill="#64748B" text-anchor="middle" font-weight="normal">Two are about depth, two about function — and a question can ask for either</text>
<rect x="24" y="66" width="348" height="96" rx="8" fill="#FFFFFF" stroke="#008751" stroke-width="1.5"/>
<rect x="24" y="66" width="6" height="96" rx="3" fill="#008751"/>
<text x="46" y="90" font-family="DejaVu Sans" font-size="11.5" fill="#008751" text-anchor="start" font-weight="bold">ROUND</text>
<text x="46" y="110" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="start" font-weight="normal">many sides, capable of change</text>
<text x="46" y="130" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="start" font-weight="normal">Test: does the character surprise you, and explainably?</text>
<rect x="390" y="66" width="348" height="96" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
<rect x="390" y="66" width="6" height="96" rx="3" fill="#D97706"/>
<text x="412" y="90" font-family="DejaVu Sans" font-size="11.5" fill="#D97706" text-anchor="start" font-weight="bold">FLAT</text>
<text x="412" y="110" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="start" font-weight="normal">one side, fixed</text>
<text x="412" y="130" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="start" font-weight="normal">Test: could you predict every line before it is spoken?</text>
<rect x="24" y="178" width="348" height="96" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<rect x="24" y="178" width="6" height="96" rx="3" fill="#2563EB"/>
<text x="46" y="202" font-family="DejaVu Sans" font-size="11.5" fill="#2563EB" text-anchor="start" font-weight="bold">FOIL</text>
<text x="46" y="222" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="start" font-weight="normal">exists to set off another</text>
<text x="46" y="242" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="start" font-weight="normal">Test: does the contrast make the hero clearer?</text>
<rect x="390" y="178" width="348" height="96" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
<rect x="390" y="178" width="6" height="96" rx="3" fill="#7C3AED"/>
<text x="412" y="202" font-family="DejaVu Sans" font-size="11.5" fill="#7C3AED" text-anchor="start" font-weight="bold">STOCK</text>
<text x="412" y="222" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="start" font-weight="normal">a type, not a person</text>
<text x="412" y="242" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="start" font-weight="normal">Test: is the role all there is — the guard, the gossip?</text>
<text x="380.0" y="314" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="middle" font-weight="normal">And the functional pair: the protagonist drives the action; the antagonist is the force arranged against it.</text>
</svg>
