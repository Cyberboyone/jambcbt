<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="300" fill="#FFFFFF"/>
<text x="380" y="24" font-family="DejaVu Sans" font-size="12.5" fill="#0E1F40" text-anchor="middle" font-weight="bold">The chain of cause: how a boast becomes a beggar</text>
<rect x="22.0" y="62" width="92" height="116" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
<text x="68.0" y="82" font-family="DejaVu Sans" font-size="10" fill="#2563EB" text-anchor="middle" font-weight="bold">1</text>
<text x="68.0" y="100" font-family="DejaVu Sans" font-size="8.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">PRIDE</text>
<text x="68.0" y="120" font-family="DejaVu Sans" font-size="7.1" fill="#334155" text-anchor="middle" font-weight="normal">counts his titles,</text>
<text x="68.0" y="133" font-family="DejaVu Sans" font-size="7.1" fill="#334155" text-anchor="middle" font-weight="normal">thinks he needs no priest</text>
<line x1="115.0" y1="120" x2="125.0" y2="120" stroke="#CBD5E1" stroke-width="1.2" marker-end="url(#ag)"/>
<rect x="126.0" y="62" width="92" height="116" rx="7" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
<text x="172.0" y="82" font-family="DejaVu Sans" font-size="10" fill="#7C3AED" text-anchor="middle" font-weight="bold">2</text>
<text x="172.0" y="100" font-family="DejaVu Sans" font-size="8.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">BOAST</text>
<text x="172.0" y="120" font-family="DejaVu Sans" font-size="7.1" fill="#334155" text-anchor="middle" font-weight="normal">"Am I not God,</text>
<text x="172.0" y="133" font-family="DejaVu Sans" font-size="7.1" fill="#334155" text-anchor="middle" font-weight="normal">whiles that I live"</text>
<line x1="219.0" y1="120" x2="229.0" y2="120" stroke="#CBD5E1" stroke-width="1.2" marker-end="url(#ag)"/>
<rect x="230.0" y="62" width="92" height="116" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.4"/>
<text x="276.0" y="82" font-family="DejaVu Sans" font-size="10" fill="#008751" text-anchor="middle" font-weight="bold">3</text>
<text x="276.0" y="100" font-family="DejaVu Sans" font-size="8.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">HUNT</text>
<text x="276.0" y="120" font-family="DejaVu Sans" font-size="7.1" fill="#334155" text-anchor="middle" font-weight="normal">a hart leads him</text>
<text x="276.0" y="133" font-family="DejaVu Sans" font-size="7.1" fill="#334155" text-anchor="middle" font-weight="normal">alone to the river</text>
<line x1="323.0" y1="120" x2="333.0" y2="120" stroke="#CBD5E1" stroke-width="1.2" marker-end="url(#ag)"/>
<rect x="334.0" y="62" width="92" height="116" rx="7" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/>
<text x="380.0" y="82" font-family="DejaVu Sans" font-size="10" fill="#D97706" text-anchor="middle" font-weight="bold">4</text>
<text x="380.0" y="100" font-family="DejaVu Sans" font-size="8.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">BATH</text>
<text x="380.0" y="120" font-family="DejaVu Sans" font-size="7.1" fill="#334155" text-anchor="middle" font-weight="normal">he strips; the angel</text>
<text x="380.0" y="133" font-family="DejaVu Sans" font-size="7.1" fill="#334155" text-anchor="middle" font-weight="normal">takes clothes and horse</text>
<line x1="427.0" y1="120" x2="437.0" y2="120" stroke="#CBD5E1" stroke-width="1.2" marker-end="url(#ag)"/>
<rect x="438.0" y="62" width="92" height="116" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.4"/>
<text x="484.0" y="82" font-family="DejaVu Sans" font-size="10" fill="#DC2626" text-anchor="middle" font-weight="bold">5</text>
<text x="484.0" y="100" font-family="DejaVu Sans" font-size="8.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">DENIAL</text>
<text x="484.0" y="120" font-family="DejaVu Sans" font-size="7.1" fill="#334155" text-anchor="middle" font-weight="normal">porter, ranger, duke,</text>
<text x="484.0" y="133" font-family="DejaVu Sans" font-size="7.1" fill="#334155" text-anchor="middle" font-weight="normal">queen, soldiers</text>
<line x1="531.0" y1="120" x2="541.0" y2="120" stroke="#CBD5E1" stroke-width="1.2" marker-end="url(#ag)"/>
<rect x="542.0" y="62" width="92" height="116" rx="7" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
<text x="588.0" y="82" font-family="DejaVu Sans" font-size="10" fill="#7C3AED" text-anchor="middle" font-weight="bold">6</text>
<text x="588.0" y="100" font-family="DejaVu Sans" font-size="8.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">PRAYER</text>
<text x="588.0" y="120" font-family="DejaVu Sans" font-size="7.1" fill="#334155" text-anchor="middle" font-weight="normal">"give me back</text>
<text x="588.0" y="133" font-family="DejaVu Sans" font-size="7.1" fill="#334155" text-anchor="middle" font-weight="normal">myself again"</text>
<line x1="635.0" y1="120" x2="645.0" y2="120" stroke="#CBD5E1" stroke-width="1.2" marker-end="url(#ag)"/>
<rect x="646.0" y="62" width="92" height="116" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.4"/>
<text x="692.0" y="82" font-family="DejaVu Sans" font-size="10" fill="#008751" text-anchor="middle" font-weight="bold">7</text>
<text x="692.0" y="100" font-family="DejaVu Sans" font-size="8.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">MERCY</text>
<text x="692.0" y="120" font-family="DejaVu Sans" font-size="7.1" fill="#334155" text-anchor="middle" font-weight="normal">the angel in white</text>
<text x="692.0" y="133" font-family="DejaVu Sans" font-size="7.1" fill="#334155" text-anchor="middle" font-weight="normal">returns the kingdom</text>
<rect x="40" y="200" width="680" height="84" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.2"/>
<text x="380" y="222" font-family="DejaVu Sans" font-size="10" fill="#008751" text-anchor="middle" font-weight="bold">Two things travel down the chain</text>
<text x="380" y="244" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">First his rank, then his name. At the bottom he has neither, and only then does he pray.</text>
<text x="380" y="262" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">The poem's argument is not 'pride is punished' but 'a man is what God permits him to be'.</text>
<text x="380" y="278" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal" font-style="italic">That is why the restoration is a gift and not a reward.</text>
</svg>
