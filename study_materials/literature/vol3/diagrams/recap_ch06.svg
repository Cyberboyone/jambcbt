<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 232" width="760" height="232">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="232" fill="#FFFFFF"/>
<rect x="0" y="0" width="760" height="232" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6"/>
<rect x="0" y="0" width="760" height="8" rx="4" fill="#DC2626"/>
<text x="24" y="36" font-family="DejaVu Sans" font-size="8.6" fill="#DC2626" text-anchor="start" font-weight="bold">CHAPTER 6</text>
<text x="24" y="58" font-family="DejaVu Sans" font-size="14.5" fill="#0E1F40" text-anchor="start" font-weight="bold">The Proud King — William Morris</text>
<circle cx="30" cy="88" r="3.2" fill="#DC2626"/>
<text x="42" y="92" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="start" font-weight="bold">Form</text>
<text x="230" y="92" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">narrative poem, rhyme royal, ~850 lines</text>
<circle cx="30" cy="114" r="3.2" fill="#DC2626"/>
<text x="42" y="118" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="start" font-weight="bold">Sin</text>
<text x="230" y="118" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">"Am I not God, whiles that I live at least"</text>
<circle cx="30" cy="140" r="3.2" fill="#DC2626"/>
<text x="42" y="144" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="start" font-weight="bold">Fall</text>
<text x="230" y="144" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">the angel takes his clothes, horse and place</text>
<circle cx="30" cy="166" r="3.2" fill="#DC2626"/>
<text x="42" y="170" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="start" font-weight="bold">Lesson</text>
<text x="230" y="170" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">rank is lent, not owned</text>
<circle cx="30" cy="192" r="3.2" fill="#DC2626"/>
<text x="42" y="196" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="start" font-weight="bold">Frame</text>
<text x="230" y="196" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">the old king has the tale written down</text>
</svg>
