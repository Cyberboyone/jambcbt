  <rect x="0" y="0" width="760" height="232" fill="#FFFFFF"/>
<rect x="0" y="0" width="760" height="232" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6"/>
<rect x="0" y="0" width="760" height="8" rx="4" fill="#D97706"/>
<text x="24" y="36" font-family="DejaVu Sans" font-size="8.6" fill="#D97706" text-anchor="start" font-weight="bold">CHAPTER 4</text>
<text x="24" y="58" font-family="DejaVu Sans" font-size="14.5" fill="#0E1F40" text-anchor="start" font-weight="bold">The Anvil and the Hammer — Kofi Awoonor</text>
<circle cx="30" cy="88" r="3.2" fill="#D97706"/>
<text x="42" y="92" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="start" font-weight="bold">Form</text>
<text x="230" y="92" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">two stanzas, free verse, no rhyme</text>
<circle cx="30" cy="114" r="3.2" fill="#D97706"/>
<text x="42" y="118" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="start" font-weight="bold">Stanza 1</text>
<text x="230" y="118" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">the forge: anvil, hammer, pangs, new songs</text>
<circle cx="30" cy="140" r="3.2" fill="#D97706"/>
<text x="42" y="144" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="start" font-weight="bold">Stanza 2</text>
<text x="230" y="144" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">the sewing: old days worn under a new garment</text>
<circle cx="30" cy="166" r="3.2" fill="#D97706"/>
<text x="42" y="170" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="start" font-weight="bold">Key phrase</text>
<text x="230" y="170" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">"flimsy glories of paved streets"</text>
<circle cx="30" cy="192" r="3.2" fill="#D97706"/>
<text x="42" y="196" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="start" font-weight="bold">Theme</text>
<text x="230" y="196" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">cultural clash and the syncretism that answers it</text>
</svg>
