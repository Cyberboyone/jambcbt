<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="24" font-family="DejaVu Sans" font-size="12.5" fill="#0E1F40" text-anchor="middle" font-weight="bold">Crossing the Bar: one voyage, four stanzas, no return</text>
<rect x="40" y="190" width="680" height="96" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.1"/>
<rect x="40" y="258" width="680" height="28" rx="6" fill="#DBEAFE" stroke="#BFDBFE" stroke-width="1.1"/>
<text x="120" y="282" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">the harbour</text>
<text x="400" y="282" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">the bar — sand, sound, foam</text>
<text x="690" y="282" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="end" font-weight="normal">the open sea</text>
<path d="M 330 262 Q 360 244 390 262 Q 420 280 450 262" fill="none" stroke="#D97706" stroke-width="3" stroke-linecap="round"/>
<polygon points="150,232 196,232 186,248 160,248" fill="#0E1F40" stroke="#0E1F40" stroke-width="1.8"/>
<line x1="173" y1="232" x2="173" y2="206" stroke="#0E1F40" stroke-width="2"/>
<polygon points="173,206 173,228 194,228" fill="#A7F3D0" stroke="#008751" stroke-width="1.8"/>
<circle cx="640" cy="150" r="22" fill="#D97706" opacity="0.75"/>
<text x="640" y="120" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="middle" font-weight="normal">sunset and evening star</text>
<rect x="30" y="48" width="160" height="62" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
<text x="110" y="66" font-family="DejaVu Sans" font-size="11" fill="#2563EB" text-anchor="middle" font-weight="bold">1</text>
<text x="110" y="82" font-family="DejaVu Sans" font-size="7.2" fill="#0E1F40" text-anchor="middle" font-weight="normal" font-style="italic">"Sunset and evening star"</text>
<text x="110" y="98" font-family="DejaVu Sans" font-size="7.4" fill="#64748B" text-anchor="middle" font-weight="normal">the call is heard</text>
<line x1="110" y1="112" x2="110" y2="186" stroke="#2563EB" stroke-width="1.2" marker-end="url(#ag)" stroke-dasharray="3 3"/>
<rect x="220" y="48" width="160" height="62" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<text x="300" y="66" font-family="DejaVu Sans" font-size="11" fill="#008751" text-anchor="middle" font-weight="bold">2</text>
<text x="300" y="82" font-family="DejaVu Sans" font-size="7.2" fill="#0E1F40" text-anchor="middle" font-weight="normal" font-style="italic">"such a tide as moving seems asleep"</text>
<text x="300" y="98" font-family="DejaVu Sans" font-size="7.4" fill="#64748B" text-anchor="middle" font-weight="normal">the fullness before departure</text>
<line x1="300" y1="112" x2="300" y2="186" stroke="#008751" stroke-width="1.2" marker-end="url(#ag)" stroke-dasharray="3 3"/>
<rect x="390" y="48" width="160" height="62" rx="7" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/>
<text x="470" y="66" font-family="DejaVu Sans" font-size="11" fill="#7C3AED" text-anchor="middle" font-weight="bold">3</text>
<text x="470" y="82" font-family="DejaVu Sans" font-size="7.2" fill="#0E1F40" text-anchor="middle" font-weight="normal" font-style="italic">"Twilight and evening bell"</text>
<text x="470" y="98" font-family="DejaVu Sans" font-size="7.4" fill="#64748B" text-anchor="middle" font-weight="normal">the dark accepted</text>
<line x1="470" y1="112" x2="470" y2="186" stroke="#7C3AED" stroke-width="1.2" marker-end="url(#ag)" stroke-dasharray="3 3"/>
<rect x="570" y="48" width="160" height="62" rx="7" fill="#FFFFFF" stroke="#D97706" stroke-width="1.3"/>
<text x="650" y="66" font-family="DejaVu Sans" font-size="11" fill="#D97706" text-anchor="middle" font-weight="bold">4</text>
<text x="650" y="82" font-family="DejaVu Sans" font-size="7.2" fill="#0E1F40" text-anchor="middle" font-weight="normal" font-style="italic">"I hope to see my Pilot face to face"</text>
<text x="650" y="98" font-family="DejaVu Sans" font-size="7.4" fill="#64748B" text-anchor="middle" font-weight="normal">faith, not fear</text>
<line x1="650" y1="112" x2="650" y2="186" stroke="#D97706" stroke-width="1.2" marker-end="url(#ag)" stroke-dasharray="3 3"/>
<rect x="40" y="296" width="680" height="26" rx="6" fill="#ECFDF5" stroke="#008751" stroke-width="1.0"/>
<text x="380" y="313" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">The bar is the sandbank at the harbour mouth: the last obstacle before open water.</text>
</svg>
