<rect x="40" y="162" width="680" height="112" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
<text x="380" y="184" font-family="DejaVu Sans" font-size="10" fill="#0E1F40" text-anchor="middle" font-weight="bold">The sixty minutes</text>
<text x="80" y="206" font-family="DejaVu Sans" font-size="7.8" fill="#008751" text-anchor="start" font-weight="bold">0–2</text>
<text x="140" y="206" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">read the unseen poem twice</text>
<text x="80" y="220" font-family="DejaVu Sans" font-size="7.8" fill="#008751" text-anchor="start" font-weight="bold">2–14</text>
<text x="140" y="220" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">unseen questions</text>
<text x="80" y="234" font-family="DejaVu Sans" font-size="7.8" fill="#008751" text-anchor="start" font-weight="bold">14–44</text>
<text x="140" y="234" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">the five prescribed blocks, six minutes each</text>
<text x="80" y="248" font-family="DejaVu Sans" font-size="7.8" fill="#008751" text-anchor="start" font-weight="bold">44–56</text>
<text x="140" y="248" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">flagged questions</text>
<text x="80" y="262" font-family="DejaVu Sans" font-size="7.8" fill="#008751" text-anchor="start" font-weight="bold">56–60</text>
<text x="140" y="262" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">transfer and check every number</text>
<text x="380" y="292" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="middle" font-weight="normal" font-style="italic">A poem question is won in the first twenty seconds: locate the stanza, then answer.</text>
