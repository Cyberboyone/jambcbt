<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="340" fill="#FFFFFF"/>
<text x="380" y="24" font-family="DejaVu Sans" font-size="12.5" fill="#0E1F40" text-anchor="middle" font-weight="bold">Vanity: six stanzas, one question repeated five ways</text>
<rect x="40" y="52" width="42" height="34" rx="6" fill="#2563EB" stroke="#2563EB" stroke-width="1.2"/>
<text x="61" y="74" font-family="DejaVu Sans" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text>
<rect x="92" y="52" width="330" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
<text x="104" y="74" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="normal" font-style="italic">"If we tell, gently, gently"</text>
<text x="442" y="74" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">the telling</text>
<line x1="61" y1="86" x2="61" y2="95" stroke="#CBD5E1" stroke-width="1.2" marker-end="url(#ag)"/>
<rect x="40" y="96" width="42" height="34" rx="6" fill="#2563EB" stroke="#2563EB" stroke-width="1.2"/>
<text x="61" y="118" font-family="DejaVu Sans" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text>
<rect x="92" y="96" width="330" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
<text x="104" y="118" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="normal" font-style="italic">"If we cry roughly of our torments"</text>
<text x="442" y="118" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">the crying</text>
<line x1="61" y1="130" x2="61" y2="139" stroke="#CBD5E1" stroke-width="1.2" marker-end="url(#ag)"/>
<rect x="40" y="140" width="42" height="34" rx="6" fill="#7C3AED" stroke="#7C3AED" stroke-width="1.2"/>
<text x="61" y="162" font-family="DejaVu Sans" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text>
<rect x="92" y="140" width="330" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
<text x="104" y="162" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="normal" font-style="italic">"What heart will listen?"</text>
<text x="442" y="162" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">the question turns on us</text>
<line x1="61" y1="174" x2="61" y2="183" stroke="#CBD5E1" stroke-width="1.2" marker-end="url(#ag)"/>
<rect x="40" y="184" width="42" height="34" rx="6" fill="#D97706" stroke="#D97706" stroke-width="1.2"/>
<text x="61" y="206" font-family="DejaVu Sans" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text>
<rect x="92" y="184" width="330" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
<text x="104" y="206" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="normal" font-style="italic">"When our Dead come with their Dead"</text>
<text x="442" y="206" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">the dead arrive</text>
<line x1="61" y1="218" x2="61" y2="227" stroke="#CBD5E1" stroke-width="1.2" marker-end="url(#ag)"/>
<rect x="40" y="228" width="42" height="34" rx="6" fill="#D97706" stroke="#D97706" stroke-width="1.2"/>
<text x="61" y="250" font-family="DejaVu Sans" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text>
<rect x="92" y="228" width="330" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
<text x="104" y="250" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="normal" font-style="italic">"They have left on the earth their cries"</text>
<text x="442" y="250" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">the signs they left</text>
<line x1="61" y1="262" x2="61" y2="271" stroke="#CBD5E1" stroke-width="1.2" marker-end="url(#ag)"/>
<rect x="40" y="272" width="42" height="34" rx="6" fill="#DC2626" stroke="#DC2626" stroke-width="1.2"/>
<text x="61" y="294" font-family="DejaVu Sans" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">6</text>
<rect x="92" y="272" width="330" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
<text x="104" y="294" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="normal" font-style="italic">"And since we did not understand"</text>
<text x="442" y="294" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">the verdict: since, not if</text>
<rect x="560" y="52" width="160" height="214" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.2"/>
<text x="640" y="76" font-family="DejaVu Sans" font-size="10" fill="#008751" text-anchor="middle" font-weight="bold">The movement</text>
<text x="640" y="100" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">if → if → what?</text>
<text x="640" y="118" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">then the dead</text>
<text x="640" y="136" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">then the verdict</text>
<text x="640" y="154" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal"></text>
<text x="640" y="172" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">The poem stops</text>
<text x="640" y="190" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">asking and starts</text>
<text x="640" y="208" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">accusing.</text>
<rect x="40" y="292" width="680" height="32" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
<text x="380" y="313" font-family="DejaVu Sans" font-size="9.2" fill="#64748B" text-anchor="middle" font-weight="normal" font-style="italic">No stanza answers the question it asks: that refusal is the poem's argument.</text>
</svg>
