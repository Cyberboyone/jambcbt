<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 306" width="760" height="306">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="306" fill="#FFFFFF"/>
<text x="380" y="24" font-family="DejaVu Sans" font-size="12.5" fill="#0E1F40" text-anchor="middle" font-weight="bold">Five passes over a poem, in the order that pays</text>
<rect x="19.0" y="62" width="130" height="112" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<rect x="19.0" y="62" width="130" height="5" rx="2.5" fill="#2563EB"/>
<text x="84.0" y="90" font-family="DejaVu Sans" font-size="17" fill="#2563EB" text-anchor="middle" font-weight="bold">1</text>
<text x="84.0" y="112" font-family="DejaVu Sans" font-size="10" fill="#0E1F40" text-anchor="middle" font-weight="bold">HEAR</text>
<text x="84.0" y="134" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">read it aloud;</text>
<text x="84.0" y="147" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">mark the pauses</text>
<line x1="150.0" y1="118" x2="165.0" y2="118" stroke="#CBD5E1" stroke-width="1.4" marker-end="url(#ag)"/>
<rect x="167.0" y="62" width="130" height="112" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
<rect x="167.0" y="62" width="130" height="5" rx="2.5" fill="#7C3AED"/>
<text x="232.0" y="90" font-family="DejaVu Sans" font-size="17" fill="#7C3AED" text-anchor="middle" font-weight="bold">2</text>
<text x="232.0" y="112" font-family="DejaVu Sans" font-size="10" fill="#0E1F40" text-anchor="middle" font-weight="bold">TURN</text>
<text x="232.0" y="134" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">where does the</text>
<text x="232.0" y="147" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">poem change its mind?</text>
<line x1="298.0" y1="118" x2="313.0" y2="118" stroke="#CBD5E1" stroke-width="1.4" marker-end="url(#ag)"/>
<rect x="315.0" y="62" width="130" height="112" rx="8" fill="#FFFFFF" stroke="#008751" stroke-width="1.5"/>
<rect x="315.0" y="62" width="130" height="5" rx="2.5" fill="#008751"/>
<text x="380.0" y="90" font-family="DejaVu Sans" font-size="17" fill="#008751" text-anchor="middle" font-weight="bold">3</text>
<text x="380.0" y="112" font-family="DejaVu Sans" font-size="10" fill="#0E1F40" text-anchor="middle" font-weight="bold">VOICE</text>
<text x="380.0" y="134" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">who speaks, to</text>
<text x="380.0" y="147" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">whom, and how</text>
<line x1="446.0" y1="118" x2="461.0" y2="118" stroke="#CBD5E1" stroke-width="1.4" marker-end="url(#ag)"/>
<rect x="463.0" y="62" width="130" height="112" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
<rect x="463.0" y="62" width="130" height="5" rx="2.5" fill="#D97706"/>
<text x="528.0" y="90" font-family="DejaVu Sans" font-size="17" fill="#D97706" text-anchor="middle" font-weight="bold">4</text>
<text x="528.0" y="112" font-family="DejaVu Sans" font-size="10" fill="#0E1F40" text-anchor="middle" font-weight="bold">IMAGE</text>
<text x="528.0" y="134" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">the two or three</text>
<text x="528.0" y="147" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">images that carry it</text>
<line x1="594.0" y1="118" x2="609.0" y2="118" stroke="#CBD5E1" stroke-width="1.4" marker-end="url(#ag)"/>
<rect x="611.0" y="62" width="130" height="112" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
<rect x="611.0" y="62" width="130" height="5" rx="2.5" fill="#DC2626"/>
<text x="676.0" y="90" font-family="DejaVu Sans" font-size="17" fill="#DC2626" text-anchor="middle" font-weight="bold">5</text>
<text x="676.0" y="112" font-family="DejaVu Sans" font-size="10" fill="#0E1F40" text-anchor="middle" font-weight="bold">ARGUE</text>
<text x="676.0" y="134" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">the claim the whole</text>
<text x="676.0" y="147" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">poem is making</text>
<rect x="30" y="196" width="700" height="86" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.2"/>
<text x="380" y="218" font-family="DejaVu Sans" font-size="10.6" fill="#008751" text-anchor="middle" font-weight="bold">The rule the paper is really testing</text>
<text x="380" y="240" font-family="DejaVu Sans" font-size="8.9" fill="#334155" text-anchor="middle" font-weight="normal">A line is never asked about on its own. It is asked about as a move in an argument,</text>
<text x="380" y="256" font-family="DejaVu Sans" font-size="8.9" fill="#334155" text-anchor="middle" font-weight="normal">so the answer is always one of: what it says, what it does, or what it changes.</text>
<text x="380" y="274" font-family="DejaVu Sans" font-size="8.9" fill="#64748B" text-anchor="middle" font-weight="normal" font-style="italic">Find the move first; the meaning is much easier afterwards.</text>
</svg>
