  <rect x="0" y="0" width="760" height="232" fill="#FFFFFF"/>
<rect x="0" y="0" width="760" height="232" rx="12" fill="#FFFFFF" stroke="#008751" stroke-width="1.6"/>
<rect x="0" y="0" width="760" height="8" rx="4" fill="#008751"/>
<text x="24" y="36" font-family="DejaVu Sans" font-size="8.6" fill="#008751" text-anchor="start" font-weight="bold">CHAPTER 7</text>
<text x="24" y="58" font-family="DejaVu Sans" font-size="14.5" fill="#0E1F40" text-anchor="start" font-weight="bold">The sixty-question paper</text>
<circle cx="30" cy="88" r="3.2" fill="#008751"/>
<text x="42" y="92" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="start" font-weight="bold">Shape</text>
<text x="230" y="92" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">unseen poem, then five prescribed blocks</text>
<circle cx="30" cy="114" r="3.2" fill="#008751"/>
<text x="42" y="118" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="start" font-weight="bold">Time</text>
<text x="230" y="118" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">one minute a question, banked early</text>
<circle cx="30" cy="140" r="3.2" fill="#008751"/>
<text x="42" y="144" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="start" font-weight="bold">Order</text>
<text x="230" y="144" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">unseen first: it is self-contained</text>
<circle cx="30" cy="166" r="3.2" fill="#008751"/>
<text x="42" y="170" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="start" font-weight="bold">Comparison</text>
<text x="230" y="170" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">two poems in one stem: answer both halves</text>
<circle cx="30" cy="192" r="3.2" fill="#008751"/>
<text x="42" y="196" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="start" font-weight="bold">Check</text>
<text x="230" y="196" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">number every block before you hand in</text>
</svg>
