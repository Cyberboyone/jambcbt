<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 376" width="760" height="376">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="376" fill="#FFFFFF"/>
<text x="380.0" y="24" font-family="DejaVu Sans" font-size="13" fill="#0E1F40" text-anchor="middle" font-weight="bold">The map is a set of conversions, and each one is a mark</text>
<text x="190" y="54" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">Scale: three ways of saying the same thing</text>
<rect x="20" y="68" width="150" height="34" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.0"/>
<rect x="178" y="68" width="170" height="34" rx="5" fill="#ECFDF5" stroke="#008751" stroke-width="1.0"/>
<text x="95" y="89" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">Representative fraction</text>
<text x="263" y="89" font-family="DejaVu Sans" font-size="8.2" fill="#008751" text-anchor="middle" font-weight="bold">1 : 50 000</text>
<rect x="20" y="110" width="150" height="34" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.0"/>
<rect x="178" y="110" width="170" height="34" rx="5" fill="#ECFDF5" stroke="#008751" stroke-width="1.0"/>
<text x="95" y="131" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">Statement</text>
<text x="263" y="131" font-family="DejaVu Sans" font-size="8.2" fill="#008751" text-anchor="middle" font-weight="bold">1 cm represents 0.5 km</text>
<rect x="20" y="152" width="150" height="34" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.0"/>
<rect x="178" y="152" width="170" height="34" rx="5" fill="#ECFDF5" stroke="#008751" stroke-width="1.0"/>
<text x="95" y="173" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">Linear</text>
<text x="263" y="173" font-family="DejaVu Sans" font-size="8.2" fill="#008751" text-anchor="middle" font-weight="bold">a bar divided into kilometres</text>
<rect x="20" y="202" width="340" height="60" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.1"/>
<text x="190" y="220" font-family="DejaVu Sans" font-size="8.4" fill="#D97706" text-anchor="middle" font-weight="bold">1 : 50 000 means 1 cm = 50 000 cm = 500 m = 0.5 km</text>
<text x="190" y="236" font-family="DejaVu Sans" font-size="8.1" fill="#334155" text-anchor="middle" font-weight="normal">Convert once, write the unit, then multiply.</text>
<text x="190" y="250" font-family="DejaVu Sans" font-size="8.1" fill="#334155" text-anchor="middle" font-weight="normal">Large scale = small area, more detail.</text>
<text x="560" y="54" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">Contours to a cross-section</text>
<rect x="400" y="64" width="340" height="108" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.0"/>
<ellipse cx="570" cy="120" rx="62" ry="34" fill="none" stroke="#D97706" stroke-width="1.1"/>
<ellipse cx="570" cy="120" rx="51" ry="28" fill="none" stroke="#D97706" stroke-width="1.1"/>
<ellipse cx="570" cy="120" rx="40" ry="22" fill="none" stroke="#D97706" stroke-width="1.1"/>
<ellipse cx="570" cy="120" rx="29" ry="16" fill="none" stroke="#D97706" stroke-width="1.1"/>
<ellipse cx="570" cy="120" rx="18" ry="10" fill="none" stroke="#D97706" stroke-width="1.1"/>
<text x="416" y="80" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="start" font-weight="normal">a hill, in plan</text>
<text x="570" y="168" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">closer contours = steeper ground</text>
<line x1="400" y1="244" x2="740" y2="244" stroke="#334155" stroke-width="1.2"/>

<polyline points="420,236 450,232 480,224 510,208 540,190 570,182 600,190 630,208 660,224 690,232" fill="none" stroke="#0E1F40" stroke-width="2"/>
<text x="420" y="258" font-family="DejaVu Sans" font-size="8" fill="#0E1F40" text-anchor="middle" font-weight="bold">A</text>
<text x="690" y="258" font-family="DejaVu Sans" font-size="8" fill="#0E1F40" text-anchor="middle" font-weight="bold">B</text>
<text x="570" y="272" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="middle" font-weight="normal">the same hill seen from the side</text>
<text x="570" y="290" font-family="DejaVu Sans" font-size="8.2" fill="#0E1F40" text-anchor="middle" font-weight="bold">gradient = vertical interval ÷ horizontal distance</text>
<rect x="20" y="310" width="720" height="52" rx="7" fill="#ECFDF5" stroke="#008751" stroke-width="1.2"/>
<text x="380" y="330" font-family="DejaVu Sans" font-size="9.2" fill="#008751" text-anchor="middle" font-weight="bold">Every map question is one of five: distance, bearing, grid reference, relief, land use.</text>
<text x="380" y="345" font-family="DejaVu Sans" font-size="8.3" fill="#334155" text-anchor="middle" font-weight="normal">Name the conversion, show the arithmetic, then answer the question that was asked.</text>
<text x="380" y="357" font-family="DejaVu Sans" font-size="8.3" fill="#334155" text-anchor="middle" font-weight="normal">A bearing is measured clockwise from north, in three figures — 045°, not 45°.</text>
</svg>
