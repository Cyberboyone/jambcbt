<text x="130" y="288" font-family="DejaVu Sans" font-size="8.8" fill="#008751" text-anchor="middle" font-weight="bold">UPPER COURSE</text>
<text x="130" y="302" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="middle" font-weight="normal">steep, fast, vertical erosion</text>
<text x="130" y="320" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">V-shaped valley</text>
<text x="130" y="333" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">rapids and waterfalls</text>
<text x="130" y="346" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">interlocking spurs</text>
