<text x="630" y="320" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">flood plain</text>
<text x="630" y="333" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">levees</text>
<text x="630" y="346" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">delta or estuary</text>
<text x="560" y="66" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal" font-style="italic">energy falls as the gradient falls</text>
<rect x="10" y="386" width="740" height="44" rx="7" fill="#ECFDF5" stroke="#008751" stroke-width="1.2"/>
<text x="380" y="404" font-family="DejaVu Sans" font-size="9" fill="#008751" text-anchor="middle" font-weight="bold">Erosion dominates the upper course, transport the middle, deposition the lower.</text>
<text x="380" y="418" font-family="DejaVu Sans" font-size="8.3" fill="#334155" text-anchor="middle" font-weight="normal">A landform names the process and the position: waterfall = upper, levee = lower.</text>
