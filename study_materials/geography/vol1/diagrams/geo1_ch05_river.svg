<text x="380" y="288" font-family="DejaVu Sans" font-size="8.8" fill="#008751" text-anchor="middle" font-weight="bold">MIDDLE COURSE</text>
<text x="380" y="302" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="middle" font-weight="normal">gradient falls, lateral erosion</text>
<text x="380" y="320" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">meanders</text>
<text x="380" y="333" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">ox-bow lakes</text>
<text x="380" y="346" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">bluffs and slip-off slopes</text>
