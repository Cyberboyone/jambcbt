  <rect x="0" y="0" width="760" height="388" fill="#FFFFFF"/>
<text x="380.0" y="24" font-family="DejaVu Sans" font-size="13" fill="#0E1F40" text-anchor="middle" font-weight="bold">The globe the examiner draws: latitude first, then time</text>
<circle cx="210" cy="210" r="140" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/>
<line x1="70.0" y1="210.0" x2="350.0" y2="210.0" stroke="#0E1F40" stroke-width="1.6"/>
