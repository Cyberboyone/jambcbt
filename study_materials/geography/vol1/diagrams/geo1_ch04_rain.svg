<text x="380.0" y="24" font-family="DejaVu Sans" font-size="13" fill="#0E1F40" text-anchor="middle" font-weight="bold">Three ways air is forced to rise — and only three</text>
<rect x="10" y="42" width="240" height="250" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
<text x="130" y="62" font-family="DejaVu Sans" font-size="9.4" fill="#008751" text-anchor="middle" font-weight="bold">RELIEF</text>
<text x="130" y="76" font-family="DejaVu Sans" font-size="7.9" fill="#64748B" text-anchor="middle" font-weight="normal">air climbs a hill</text>
<rect x="260" y="42" width="240" height="250" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
<text x="380" y="62" font-family="DejaVu Sans" font-size="9.4" fill="#008751" text-anchor="middle" font-weight="bold">CONVECTIONAL</text>
<text x="380" y="76" font-family="DejaVu Sans" font-size="7.9" fill="#64748B" text-anchor="middle" font-weight="normal">air climbs because it is hot</text>
<rect x="510" y="42" width="240" height="250" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
<text x="630" y="62" font-family="DejaVu Sans" font-size="9.4" fill="#008751" text-anchor="middle" font-weight="bold">FRONTAL</text>
<text x="630" y="76" font-family="DejaVu Sans" font-size="7.9" fill="#64748B" text-anchor="middle" font-weight="normal">air climbs over a wedge</text>
