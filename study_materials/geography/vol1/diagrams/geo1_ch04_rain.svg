<text x="630" y="268" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">where two air masses meet</text>
<rect x="10" y="306" width="740" height="36" rx="7" fill="#ECFDF5" stroke="#008751" stroke-width="1.2"/>
<text x="380" y="322" font-family="DejaVu Sans" font-size="9" fill="#008751" text-anchor="middle" font-weight="bold">All three lift air, cool it to the dew point, and make cloud. The trigger is what differs.</text>
<text x="380" y="335" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">Relief: a barrier. Convectional: a hot surface. Frontal: a boundary between air masses.</text>
