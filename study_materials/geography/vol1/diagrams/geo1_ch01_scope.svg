<text x="380" y="333" font-family="DejaVu Sans" font-size="9.6" fill="#008751" text-anchor="middle" font-weight="bold">The test of a definition: name the process, name the scale, name the example.</text>
<text x="380" y="348" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">Physical geography explains a landform; human geography explains a pattern of people.</text>
