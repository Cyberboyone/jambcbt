  <rect x="0" y="0" width="760" height="256" fill="#ECFDF5"/>
<text x="380" y="22" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">Four farming systems, and the belts they occupy</text>
<rect x="12" y="34" width="348" height="70" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="12" y="34" width="5" height="70" rx="2.5" fill="#008751"/>
<text x="28" y="56" font-family="DejaVu Sans" font-size="9.2" fill="#008751" text-anchor="start" font-weight="bold">SUBSISTENCE · INTENSIVE</text>
<text x="28" y="74" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">small plot, hand tools, food for the family</text>
<text x="28" y="90" font-family="DejaVu Sans" font-size="0.1" fill="#334155" text-anchor="middle" font-weight="normal">intensive = more labour per hectare</text>
<rect x="372" y="34" width="348" height="70" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
<rect x="372" y="34" width="5" height="70" rx="2.5" fill="#2563EB"/>
<text x="388" y="56" font-family="DejaVu Sans" font-size="9.2" fill="#2563EB" text-anchor="start" font-weight="bold">SUBSISTENCE · EXTENSIVE</text>
<text x="388" y="74" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">shifting cultivation, land rested, low yield</text>
<text x="388" y="90" font-family="DejaVu Sans" font-size="0.1" fill="#334155" text-anchor="middle" font-weight="normal"></text>
<rect x="12" y="112" width="348" height="70" rx="7" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/>
<rect x="12" y="112" width="5" height="70" rx="2.5" fill="#7C3AED"/>
<text x="28" y="134" font-family="DejaVu Sans" font-size="9.2" fill="#7C3AED" text-anchor="start" font-weight="bold">COMMERCIAL · INTENSIVE</text>
<text x="28" y="152" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">plantation, capital, one cash crop</text>
<text x="28" y="168" font-family="DejaVu Sans" font-size="0.1" fill="#334155" text-anchor="middle" font-weight="normal"></text>
<rect x="372" y="112" width="348" height="70" rx="7" fill="#FFFFFF" stroke="#D97706" stroke-width="1.3"/>
<rect x="372" y="112" width="5" height="70" rx="2.5" fill="#D97706"/>
<text x="388" y="134" font-family="DejaVu Sans" font-size="9.2" fill="#D97706" text-anchor="start" font-weight="bold">COMMERCIAL · EXTENSIVE</text>
<text x="388" y="152" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">ranching and grain, machines, large area</text>
<text x="388" y="168" font-family="DejaVu Sans" font-size="0.1" fill="#334155" text-anchor="middle" font-weight="normal"></text>
<rect x="12" y="190" width="736" height="58" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.2"/>
<text x="380" y="208" font-family="DejaVu Sans" font-size="8.8" fill="#008751" text-anchor="middle" font-weight="bold">THE BELTS OF NIGERIA, SOUTH TO NORTH</text>
