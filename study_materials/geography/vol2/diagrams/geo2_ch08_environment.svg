<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="290" fill="#ECFDF5"/>
<text x="380" y="22" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">How a hazard becomes a disaster, and the four ways to break the chain</text>
<rect x="12" y="36" width="170" height="92" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<text x="97" y="56" font-family="DejaVu Sans" font-size="9" fill="#008751" text-anchor="middle" font-weight="bold">CAUSE</text>
<text x="97" y="74" font-family="DejaVu Sans" font-size="8" fill="#334155" text-anchor="middle" font-weight="normal">drought,</text>
<text x="97" y="88" font-family="DejaVu Sans" font-size="8" fill="#334155" text-anchor="middle" font-weight="normal">overgrazing,</text>
<text x="97" y="102" font-family="DejaVu Sans" font-size="8" fill="#334155" text-anchor="middle" font-weight="normal">felling</text>
<line x1="182" y1="82" x2="196" y2="82" stroke="#64748B" stroke-width="1.4" marker-end="url(#ag)"/>
<rect x="198" y="36" width="170" height="92" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
<text x="283" y="56" font-family="DejaVu Sans" font-size="9" fill="#2563EB" text-anchor="middle" font-weight="bold">PROCESS</text>
<text x="283" y="74" font-family="DejaVu Sans" font-size="8" fill="#334155" text-anchor="middle" font-weight="normal">soil dries,</text>
<text x="283" y="88" font-family="DejaVu Sans" font-size="8" fill="#334155" text-anchor="middle" font-weight="normal">cover is lost,</text>
<text x="283" y="102" font-family="DejaVu Sans" font-size="8" fill="#334155" text-anchor="middle" font-weight="normal">wind lifts it</text>
<line x1="368" y1="82" x2="382" y2="82" stroke="#64748B" stroke-width="1.4" marker-end="url(#ag)"/>
<rect x="384" y="36" width="170" height="92" rx="7" fill="#FFFFFF" stroke="#D97706" stroke-width="1.3"/>
<text x="469" y="56" font-family="DejaVu Sans" font-size="9" fill="#D97706" text-anchor="middle" font-weight="bold">EFFECT</text>
<text x="469" y="74" font-family="DejaVu Sans" font-size="8" fill="#334155" text-anchor="middle" font-weight="normal">desert spreads,</text>
<text x="469" y="88" font-family="DejaVu Sans" font-size="8" fill="#334155" text-anchor="middle" font-weight="normal">yields fall,</text>
<text x="469" y="102" font-family="DejaVu Sans" font-size="8" fill="#334155" text-anchor="middle" font-weight="normal">people move</text>
<line x1="554" y1="82" x2="568" y2="82" stroke="#64748B" stroke-width="1.4" marker-end="url(#ag)"/>
<rect x="570" y="36" width="170" height="92" rx="7" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/>
<text x="655" y="56" font-family="DejaVu Sans" font-size="9" fill="#7C3AED" text-anchor="middle" font-weight="bold">RESPONSE</text>
<text x="655" y="74" font-family="DejaVu Sans" font-size="8" fill="#334155" text-anchor="middle" font-weight="normal">plant trees,</text>
<text x="655" y="88" font-family="DejaVu Sans" font-size="8" fill="#334155" text-anchor="middle" font-weight="normal">terrace, rotate,</text>
<text x="655" y="102" font-family="DejaVu Sans" font-size="8" fill="#334155" text-anchor="middle" font-weight="normal">insure the crop</text>
<rect x="12" y="142" width="736" height="104" rx="8" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<text x="380" y="162" font-family="DejaVu Sans" font-size="9" fill="#008751" text-anchor="middle" font-weight="bold">SUSTAINABLE DEVELOPMENT: THREE CIRCLES THAT MUST OVERLAP</text>
<circle cx="150" cy="204" r="34" fill="none" stroke="#008751" stroke-width="2"/>
<text x="150" y="200" font-family="DejaVu Sans" font-size="8.4" fill="#008751" text-anchor="middle" font-weight="bold">environment</text>
<text x="150" y="214" font-family="DejaVu Sans" font-size="7.4" fill="#64748B" text-anchor="middle" font-weight="normal">carrying capacity</text>
<circle cx="380" cy="204" r="34" fill="none" stroke="#2563EB" stroke-width="2"/>
<text x="380" y="200" font-family="DejaVu Sans" font-size="8.4" fill="#2563EB" text-anchor="middle" font-weight="bold">economy</text>
<text x="380" y="214" font-family="DejaVu Sans" font-size="7.4" fill="#64748B" text-anchor="middle" font-weight="normal">needs met now</text>
<circle cx="610" cy="204" r="34" fill="none" stroke="#D97706" stroke-width="2"/>
<text x="610" y="200" font-family="DejaVu Sans" font-size="8.4" fill="#D97706" text-anchor="middle" font-weight="bold">society</text>
<text x="610" y="214" font-family="DejaVu Sans" font-size="7.4" fill="#64748B" text-anchor="middle" font-weight="normal">fairness</text>
<text x="380" y="262" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">run any one circle alone and the other two pay for it</text>
</svg>
