<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 202" width="760" height="202">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="202" fill="#ECFDF5"/>
<text x="380" y="20" font-family="DejaVu Sans" font-size="11.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">Chapter 5 — transport, trade and tourism</text>
<rect x="12" y="34" width="736" height="34" rx="6" fill="#FFFFFF" stroke="#008751" stroke-width="1.1"/>
<text x="28" y="49" font-family="DejaVu Sans" font-size="8.8" fill="#008751" text-anchor="start" font-weight="bold">Choosing a mode</text>
<text x="28" y="62" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="start" font-weight="normal">cost, speed, distance, bulk and route decide — water is cheapest, air fastest, road most flexible</text>
<rect x="12" y="74" width="736" height="34" rx="6" fill="#FFFFFF" stroke="#008751" stroke-width="1.1"/>
<text x="28" y="89" font-family="DejaVu Sans" font-size="8.8" fill="#008751" text-anchor="start" font-weight="bold">Trade balance</text>
<text x="28" y="102" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="start" font-weight="normal">exports − imports = visible balance; add invisibles for the balance of payments</text>
<rect x="12" y="114" width="736" height="34" rx="6" fill="#FFFFFF" stroke="#008751" stroke-width="1.1"/>
<text x="28" y="129" font-family="DejaVu Sans" font-size="8.8" fill="#008751" text-anchor="start" font-weight="bold">Terms of trade</text>
<text x="28" y="142" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="start" font-weight="normal">export price index ÷ import price index × 100; below 100 means the country is losing</text>
<rect x="12" y="154" width="736" height="34" rx="6" fill="#FFFFFF" stroke="#008751" stroke-width="1.1"/>
<text x="28" y="169" font-family="DejaVu Sans" font-size="8.8" fill="#008751" text-anchor="start" font-weight="bold">Tourism</text>
<text x="28" y="182" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="start" font-weight="normal">earns foreign exchange and jobs, but leaks and pressures the site that attracts it</text>
</svg>
