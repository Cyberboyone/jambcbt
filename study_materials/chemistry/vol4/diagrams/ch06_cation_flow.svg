<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" width="560" height="372">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="560" height="372" fill="#FFFFFF"/>
<text x="280" y="22" font-family="DejaVu Sans" font-size="10.2" fill="#0E1F40" text-anchor="middle" font-weight="bold">IDENTIFYING A CATION WITH SODIUM HYDROXIDE, THEN AMMONIA</text>
<rect x="186" y="40" width="188" height="32" rx="6" fill="#0E1F40" stroke="#0E1F40" stroke-width="0"/>
<text x="280" y="61" font-family="DejaVu Sans" font-size="8.0" fill="#FFFFFF" text-anchor="middle" font-weight="bold">add NaOH (aq), drop by drop</text>
<line x1="280" y1="72" x2="280" y2="88" stroke="#CBD5E1" stroke-width="1.2"/>
<line x1="74" y1="88" x2="280" y2="88" stroke="#CBD5E1" stroke-width="1.2"/>
<line x1="74" y1="88" x2="74" y2="98" stroke="#2563EB" stroke-width="1.4"/>
<rect x="10" y="98" width="128" height="30" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
<text x="74" y="117" font-family="DejaVu Sans" font-size="7.4" fill="#2563EB" text-anchor="middle" font-weight="bold">White precipitate</text>
<rect x="10" y="132" width="128" height="96" rx="5" fill="#ECFDF5" stroke="#CBD5E1" stroke-width="0.9"/>
<text x="18" y="148" font-family="DejaVu Sans" font-size="6.6" fill="#0E1F40" text-anchor="start" font-weight="normal">Pb²⁺, Zn²⁺ or Al³⁺ dissolve</text>
<text x="18" y="165" font-family="DejaVu Sans" font-size="6.6" fill="#0E1F40" text-anchor="start" font-weight="normal">in excess NaOH</text>
<text x="18" y="182" font-family="DejaVu Sans" font-size="6.6" fill="#0E1F40" text-anchor="start" font-weight="normal">Ca²⁺ does not dissolve</text>
<text x="18" y="199" font-family="DejaVu Sans" font-size="6.6" fill="#0E1F40" text-anchor="start" font-weight="normal">it gives a brick-red flame</text>
<text x="18" y="240" font-family="DejaVu Sans" font-size="6.4" fill="#64748B" text-anchor="start" font-weight="normal">Zn²⁺ and Al³⁺ dissolve in excess NH₃;</text>
<text x="18" y="252" font-family="DejaVu Sans" font-size="6.4" fill="#64748B" text-anchor="start" font-weight="normal">Pb²⁺ does not.</text>
<line x1="280" y1="72" x2="280" y2="88" stroke="#CBD5E1" stroke-width="1.2"/>
<line x1="212" y1="88" x2="280" y2="88" stroke="#CBD5E1" stroke-width="1.2"/>
<line x1="212" y1="88" x2="212" y2="98" stroke="#2563EB" stroke-width="1.4"/>
<rect x="148" y="98" width="128" height="30" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
<text x="212" y="117" font-family="DejaVu Sans" font-size="7.4" fill="#2563EB" text-anchor="middle" font-weight="bold">Pale blue precipitate</text>
<rect x="148" y="132" width="128" height="96" rx="5" fill="#ECFDF5" stroke="#CBD5E1" stroke-width="0.9"/>
<text x="156" y="148" font-family="DejaVu Sans" font-size="6.6" fill="#0E1F40" text-anchor="start" font-weight="normal">Cu²⁺ dissolves in excess</text>
<text x="156" y="165" font-family="DejaVu Sans" font-size="6.6" fill="#0E1F40" text-anchor="start" font-weight="normal">ammonia to a deep blue</text>
<text x="156" y="182" font-family="DejaVu Sans" font-size="6.6" fill="#0E1F40" text-anchor="start" font-weight="normal">solution — that deep blue</text>
<text x="156" y="199" font-family="DejaVu Sans" font-size="6.6" fill="#0E1F40" text-anchor="start" font-weight="normal">is the identification</text>
<text x="156" y="240" font-family="DejaVu Sans" font-size="6.4" fill="#64748B" text-anchor="start" font-weight="normal">Fe²⁺ is green, not blue; do not</text>
<text x="156" y="252" font-family="DejaVu Sans" font-size="6.4" fill="#64748B" text-anchor="start" font-weight="normal">confuse them.</text>
<line x1="280" y1="72" x2="280" y2="88" stroke="#CBD5E1" stroke-width="1.2"/>
<line x1="350" y1="88" x2="280" y2="88" stroke="#CBD5E1" stroke-width="1.2"/>
<line x1="350" y1="88" x2="350" y2="98" stroke="#008751" stroke-width="1.4"/>
<rect x="286" y="98" width="128" height="30" rx="5" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<text x="350" y="117" font-family="DejaVu Sans" font-size="7.4" fill="#008751" text-anchor="middle" font-weight="bold">Green precipitate</text>
<rect x="286" y="132" width="128" height="96" rx="5" fill="#ECFDF5" stroke="#CBD5E1" stroke-width="0.9"/>
<text x="294" y="148" font-family="DejaVu Sans" font-size="6.6" fill="#0E1F40" text-anchor="start" font-weight="normal">Fe²⁺ — insoluble in excess</text>
<text x="294" y="165" font-family="DejaVu Sans" font-size="6.6" fill="#0E1F40" text-anchor="start" font-weight="normal">NaOH and in excess NH₃</text>
<text x="294" y="182" font-family="DejaVu Sans" font-size="6.6" fill="#0E1F40" text-anchor="start" font-weight="normal">the precipitate turns</text>
<text x="294" y="199" font-family="DejaVu Sans" font-size="6.6" fill="#0E1F40" text-anchor="start" font-weight="normal">brown on standing in air</text>
<text x="294" y="240" font-family="DejaVu Sans" font-size="6.4" fill="#64748B" text-anchor="start" font-weight="normal">That browning is Fe²⁺ oxidised to</text>
<text x="294" y="252" font-family="DejaVu Sans" font-size="6.4" fill="#64748B" text-anchor="start" font-weight="normal">Fe³⁺ by the air.</text>
<line x1="280" y1="72" x2="280" y2="88" stroke="#CBD5E1" stroke-width="1.2"/>
<line x1="488" y1="88" x2="280" y2="88" stroke="#CBD5E1" stroke-width="1.2"/>
<line x1="488" y1="88" x2="488" y2="98" stroke="#D97706" stroke-width="1.4"/>
<rect x="424" y="98" width="128" height="30" rx="5" fill="#FFFFFF" stroke="#D97706" stroke-width="1.3"/>
<text x="488" y="117" font-family="DejaVu Sans" font-size="7.4" fill="#D97706" text-anchor="middle" font-weight="bold">No precipitate</text>
<rect x="424" y="132" width="128" height="96" rx="5" fill="#ECFDF5" stroke="#CBD5E1" stroke-width="0.9"/>
<text x="432" y="148" font-family="DejaVu Sans" font-size="6.6" fill="#0E1F40" text-anchor="start" font-weight="normal">NH₄⁺: warm the mixture</text>
<text x="432" y="165" font-family="DejaVu Sans" font-size="6.6" fill="#0E1F40" text-anchor="start" font-weight="normal">and ammonia is given off</text>
<text x="432" y="182" font-family="DejaVu Sans" font-size="6.6" fill="#0E1F40" text-anchor="start" font-weight="normal">test the gas with damp</text>
<text x="432" y="199" font-family="DejaVu Sans" font-size="6.6" fill="#0E1F40" text-anchor="start" font-weight="normal">red litmus — it turns blue</text>
<text x="432" y="240" font-family="DejaVu Sans" font-size="6.4" fill="#64748B" text-anchor="start" font-weight="normal">Na⁺ and K⁺ give no precipitate</text>
<text x="432" y="252" font-family="DejaVu Sans" font-size="6.4" fill="#64748B" text-anchor="start" font-weight="normal">either; use a flame test.</text>
<rect x="8" y="276" width="544" height="84" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.0"/>
<text x="280" y="296" font-family="DejaVu Sans" font-size="7.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">Then confirm with a flame test: Na yellow · K lilac · Ca brick-red · Cu blue-green · Ba apple-green · Li crimson</text>
<text x="280" y="316" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">A precipitate that dissolves in excess reagent is worth two marks; a colour alone is worth one.</text>
<text x="280" y="336" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">Always add the reagent in excess before writing “insoluble”: the second observation is the discriminating one.</text>
</svg>
