<text x="280" y="22" font-family="DejaVu Sans" font-size="10.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">ETHENE — ONE σ BOND AND ONE π BOND BETWEEN THE CARBONS</text>
<text x="280" y="40" font-family="DejaVu Sans" font-size="7.9" fill="#64748B" text-anchor="middle" font-weight="normal">All six atoms are coplanar, the H–C–H angle is about 120°, and the π cloud sits above and below the plane.</text>
