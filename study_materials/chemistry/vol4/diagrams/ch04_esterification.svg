<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 286" width="560" height="286">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="560" height="286" fill="#FFFFFF"/>
<text x="280" y="22" font-family="DejaVu Sans" font-size="10.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">ESTERIFICATION — AN ACID AND AN ALCOHOL JOIN AND WATER IS LOST</text>
<rect x="44" y="76" width="132" height="48" rx="6" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<text x="110" y="98" font-family="DejaVu Sans" font-size="11.4" fill="#008751" text-anchor="middle" font-weight="bold">CH₃COOH</text>
<text x="110" y="114" font-family="DejaVu Sans" font-size="7.4" fill="#64748B" text-anchor="middle" font-weight="normal">ethanoic acid</text>
<rect x="44" y="166" width="132" height="48" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
<text x="110" y="188" font-family="DejaVu Sans" font-size="11.4" fill="#2563EB" text-anchor="middle" font-weight="bold">C₂H₅OH</text>
<text x="110" y="204" font-family="DejaVu Sans" font-size="7.4" fill="#64748B" text-anchor="middle" font-weight="normal">ethanol</text>
<text x="110" y="132" font-family="DejaVu Sans" font-size="12" fill="#64748B" text-anchor="middle" font-weight="bold">+</text>
<text x="110" y="148" font-family="DejaVu Sans" font-size="12" fill="#64748B" text-anchor="middle" font-weight="bold">↓</text>
<line x1="196" y1="146" x2="287.6" y2="146.0" stroke="#D97706" stroke-width="2.0"/><polygon points="300.0,146.0 287.6,150.6 287.6,141.4" fill="#D97706"/>
<text x="248" y="134" font-family="DejaVu Sans" font-size="7.6" fill="#D97706" text-anchor="middle" font-weight="bold">conc. H₂SO₄</text>
<text x="248" y="162" font-family="DejaVu Sans" font-size="7.2" fill="#64748B" text-anchor="middle" font-weight="normal">warm, reflux</text>
<rect x="334" y="94" width="132" height="48" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/>
<text x="400" y="116" font-family="DejaVu Sans" font-size="11.4" fill="#7C3AED" text-anchor="middle" font-weight="bold">CH₃COOC₂H₅</text>
<text x="400" y="132" font-family="DejaVu Sans" font-size="7.4" fill="#64748B" text-anchor="middle" font-weight="normal">ethyl ethanoate</text>
<text x="400" y="156" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">an ester — sweet, fruity smell</text>
<line x1="400" y1="170" x2="400.0" y2="206.7" stroke="#334155" stroke-width="1.4"/><polygon points="400.0,216.0 396.5,206.7 403.5,206.7" fill="#334155"/>
<rect x="334" y="218" width="132" height="48" rx="6" fill="#FFFFFF" stroke="#334155" stroke-width="1.3"/>
<text x="400" y="240" font-family="DejaVu Sans" font-size="11.4" fill="#334155" text-anchor="middle" font-weight="bold">H₂O</text>
<text x="400" y="256" font-family="DejaVu Sans" font-size="7.4" fill="#64748B" text-anchor="middle" font-weight="normal">water — from the acid's OH and the alcohol's H</text>
<rect x="8" y="246" width="250" height="30" rx="5" fill="#ECFDF5" stroke="#008751" stroke-width="1.0"/>
<text x="133" y="265" font-family="DejaVu Sans" font-size="8.0" fill="#0E1F40" text-anchor="middle" font-weight="normal">Acid + alcohol ⇌ ester + water</text>
<rect x="290" y="246" width="262" height="30" rx="5" fill="#FFFBEB" stroke="#D97706" stroke-width="1.0"/>
<text x="421" y="265" font-family="DejaVu Sans" font-size="7.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">The reaction is reversible — H₂SO₄ removes the water</text>
</svg>
