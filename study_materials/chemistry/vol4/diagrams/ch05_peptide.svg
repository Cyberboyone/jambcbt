<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 288" width="560" height="288">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="560" height="288" fill="#FFFFFF"/>
<text x="280" y="22" font-family="DejaVu Sans" font-size="10.8" fill="#0E1F40" text-anchor="middle" font-weight="bold">AMINO ACIDS JOIN HEAD TO TAIL — THE PEPTIDE BOND</text>
<rect x="34" y="74" width="124" height="68" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<text x="96" y="96" font-family="DejaVu Sans" font-size="7.4" fill="#0E1F40" text-anchor="middle" font-weight="normal">H₂N–CH–COOH</text>
<text x="96" y="116" font-family="DejaVu Sans" font-size="8" fill="#334155" text-anchor="middle" font-weight="normal">|</text>
<text x="96" y="132" font-family="DejaVu Sans" font-size="8.0" fill="#008751" text-anchor="middle" font-weight="bold">R</text>
<rect x="218" y="74" width="124" height="68" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
<text x="280" y="96" font-family="DejaVu Sans" font-size="7.4" fill="#0E1F40" text-anchor="middle" font-weight="normal">H₂N–CH–COOH</text>
<text x="280" y="116" font-family="DejaVu Sans" font-size="8" fill="#334155" text-anchor="middle" font-weight="normal">|</text>
<text x="280" y="132" font-family="DejaVu Sans" font-size="8.0" fill="#2563EB" text-anchor="middle" font-weight="bold">R′</text>
<text x="188" y="112" font-family="DejaVu Sans" font-size="12" fill="#64748B" text-anchor="middle" font-weight="bold">+</text>
<line x1="196" y1="160" x2="329.15" y2="160.0" stroke="#D97706" stroke-width="1.8"/><polygon points="340.0,160.0 329.1,164.1 329.1,155.9" fill="#D97706"/>
<text x="268" y="150" font-family="DejaVu Sans" font-size="7.4" fill="#D97706" text-anchor="middle" font-weight="normal">condensation</text>
<text x="268" y="176" font-family="DejaVu Sans" font-size="7.4" fill="#64748B" text-anchor="middle" font-weight="normal">− H₂O</text>
<rect x="120" y="190" width="320" height="54" rx="7" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/>
<text x="280" y="212" font-family="DejaVu Sans" font-size="8.2" fill="#0E1F40" text-anchor="middle" font-weight="bold">H₂N–CH(R)–CO–NH–CH(R′)–COOH</text>
<text x="280" y="232" font-family="DejaVu Sans" font-size="7.4" fill="#64748B" text-anchor="middle" font-weight="normal">a dipeptide — the –CO–NH– is the peptide bond</text>
<text x="280" y="262" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">A chain of many amino acids is a polypeptide; a protein is one or more folded polypeptides.</text>
<text x="280" y="278" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="middle" font-weight="normal">Hydrolysis — boiling with dilute acid or alkali, or an enzyme — puts the amino acids back.</text>
</svg>
