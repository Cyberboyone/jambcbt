<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="560" height="250">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="560" height="250" fill="#FFFFFF"/>
<text x="280" y="22" font-family="DejaVu Sans" font-size="10.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">CRACKING — A LONG CHAIN BROKEN INTO A SHORT ONE AND AN ALKENE</text>
<rect x="14" y="44" width="210" height="128" rx="8" fill="#FFFFFF" stroke="#0E1F40" stroke-width="1.4"/>
<text x="119" y="62" font-family="DejaVu Sans" font-size="15" fill="#0E1F40" text-anchor="middle" font-weight="bold">C₁₆H₃₄</text>
<text x="119" y="80" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="middle" font-weight="normal">hexadecane, from diesel</text>
<path d="M 34 96 L 49 116 L 64 96 L 79 116 L 94 96 L 109 116 L 124 96 L 139 116 L 154 96 L 169 116 L 184 96 L 199 116 L 214 96 L 229 116 L 244 96 L 259 116" fill="none" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
<line x1="230" y1="108" x2="306.05" y2="108.0" stroke="#D97706" stroke-width="2.0"/><polygon points="320.0,108.0 306.1,113.2 306.1,102.8" fill="#D97706"/>
<text x="275" y="98" font-family="DejaVu Sans" font-size="8.2" fill="#D97706" text-anchor="middle" font-weight="bold">heat</text>
<text x="275" y="128" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">≈ 500 °C</text>
<rect x="326" y="44" width="220" height="62" rx="8" fill="#FFFFFF" stroke="#008751" stroke-width="1.4"/>
<text x="436" y="64" font-family="DejaVu Sans" font-size="12.5" fill="#008751" text-anchor="middle" font-weight="bold">C₈H₁₈</text>
<text x="436" y="80" font-family="DejaVu Sans" font-size="8.0" fill="#64748B" text-anchor="middle" font-weight="normal">octane — petrol</text>
<text x="436" y="96" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">a saturated alkane</text>
<rect x="326" y="116" width="220" height="62" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
<text x="436" y="136" font-family="DejaVu Sans" font-size="12.5" fill="#2563EB" text-anchor="middle" font-weight="bold">C₈H₁₆</text>
<text x="436" y="152" font-family="DejaVu Sans" font-size="8.0" fill="#64748B" text-anchor="middle" font-weight="normal">octene — for polymers</text>
<text x="436" y="168" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">one C=C double bond</text>
<text x="280" y="202" font-family="DejaVu Sans" font-size="10.4" fill="#0E1F40" text-anchor="middle" font-weight="normal">C₁₆H₃₄ → C₈H₁₈ + C₈H₁₆</text>
<text x="280" y="224" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="middle" font-weight="normal">Cracking makes petrol from the heavy fractions nobody wants, and it supplies the alkenes the polymer industry lives on.</text>
</svg>
