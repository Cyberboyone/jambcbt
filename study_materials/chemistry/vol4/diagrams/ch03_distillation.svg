<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 268" width="560" height="268">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="560" height="268" fill="#FFFFFF"/>
<text x="280" y="22" font-family="DejaVu Sans" font-size="10.2" fill="#0E1F40" text-anchor="middle" font-weight="bold">FRACTIONAL DISTILLATION — THE ALCOHOL IS BOILED OUT AND CONDENSED BACK</text>
<text x="280" y="40" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="middle" font-weight="normal">the thermometer bulb sits at the side arm; the fraction is collected at a fixed boiling point</text>
<circle cx="120" cy="168" r="42" fill="#FFFFFF" stroke="#334155" stroke-width="1.6"/>
<path d="M 88 186 Q 120 206 152 186 L 152 166 Q 120 186 88 166 Z" fill="#D97706" opacity="0.30"/>
<text x="120" y="172" font-family="DejaVu Sans" font-size="7.8" fill="#0E1F40" text-anchor="middle" font-weight="normal">ethanol +</text>
<text x="120" y="184" font-family="DejaVu Sans" font-size="7.8" fill="#0E1F40" text-anchor="middle" font-weight="normal">water</text>
<line x1="120" y1="126" x2="120" y2="108" stroke="#334155" stroke-width="1.8"/>
<text x="120" y="236" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">heated to about 78 °C</text>
<path d="M 108 108 L 132 108 L 132 96 L 108 96 Z" fill="#E2E8F0" stroke="#334155" stroke-width="1.2" stroke-linecap="round"/>
<path d="M 132 100 L 250 100" fill="none" stroke="#334155" stroke-width="2.0" stroke-linecap="round"/>
<line x1="120" y1="96" x2="120" y2="62" stroke="#334155" stroke-width="1.6"/>
<rect x="112" y="52" width="16" height="12" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="1.2"/>
<text x="120" y="46" font-family="DejaVu Sans" font-size="7.4" fill="#64748B" text-anchor="middle" font-weight="normal">thermometer</text>
<path d="M 250 100 L 340 148" fill="none" stroke="#334155" stroke-width="2.0" stroke-linecap="round"/>
<path d="M 236 118 L 330 168 L 344 142 L 250 92 Z" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.0" stroke-linecap="round"/>
<text x="296" y="110" font-family="DejaVu Sans" font-size="7.4" fill="#2563EB" text-anchor="middle" font-weight="normal">condenser</text>
<text x="296" y="182" font-family="DejaVu Sans" font-size="7.0" fill="#2563EB" text-anchor="middle" font-weight="normal">cold water in at the bottom</text>
<rect x="330" y="186" width="54" height="66" rx="8" fill="#FFFFFF" stroke="#334155" stroke-width="1.4"/>
<path d="M 334 216 L 334 244 Q 334 248 340 248 L 374 248 Q 380 248 380 244 L 380 216 Z" fill="#008751" opacity="0.22"/>
<text x="357" y="266" font-family="DejaVu Sans" font-size="7.4" fill="#64748B" text-anchor="middle" font-weight="normal">distillate</text>
<rect x="408" y="70" width="140" height="160" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.2"/>
<text x="478" y="88" font-family="DejaVu Sans" font-size="8.6" fill="#008751" text-anchor="middle" font-weight="bold">What separates</text>
<text x="478" y="108" font-family="DejaVu Sans" font-size="7.8" fill="#0E1F40" text-anchor="middle" font-weight="normal">ethanol 78 °C</text>
<text x="478" y="124" font-family="DejaVu Sans" font-size="7.8" fill="#0E1F40" text-anchor="middle" font-weight="normal">water 100 °C</text>
<text x="478" y="148" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">The vapour is richer in</text>
<text x="478" y="162" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">the more volatile liquid,</text>
<text x="478" y="176" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">so the distillate is a</text>
<text x="478" y="190" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">mixture — never pure.</text>
<text x="478" y="210" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">A fractionating column</text>
<text x="478" y="222" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">gives a sharper split.</text>
</svg>
