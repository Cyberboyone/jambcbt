<text x="66" y="66" font-family="DejaVu Sans" font-size="7.4" fill="#0E1F40" text-anchor="start" font-weight="normal">relights a glowing splint</text>
<rect x="280" y="44" width="264" height="50" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.1"/>
<rect x="280" y="44" width="48" height="50" rx="5" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="304" y="74" font-family="DejaVu Sans" font-size="9.0" fill="#FFFFFF" text-anchor="middle" font-weight="bold">H₂</text>
<text x="338" y="66" font-family="DejaVu Sans" font-size="7.4" fill="#0E1F40" text-anchor="start" font-weight="normal">burns with a squeaky pop</text>
<rect x="8" y="102" width="264" height="50" rx="6" fill="#FFFFFF" stroke="#334155" stroke-width="1.1"/>
<rect x="8" y="102" width="48" height="50" rx="5" fill="#334155" stroke="#334155" stroke-width="0"/>
<text x="32" y="132" font-family="DejaVu Sans" font-size="9.0" fill="#FFFFFF" text-anchor="middle" font-weight="bold">CO₂</text>
<text x="66" y="124" font-family="DejaVu Sans" font-size="7.4" fill="#0E1F40" text-anchor="start" font-weight="normal">turns limewater milky</text>
<text x="66" y="139" font-family="DejaVu Sans" font-size="7.0" fill="#64748B" text-anchor="start" font-weight="normal">clears in excess</text>
<rect x="280" y="102" width="264" height="50" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.1"/>
<rect x="280" y="102" width="48" height="50" rx="5" fill="#7C3AED" stroke="#7C3AED" stroke-width="0"/>
<text x="304" y="132" font-family="DejaVu Sans" font-size="9.0" fill="#FFFFFF" text-anchor="middle" font-weight="bold">NH₃</text>
<text x="338" y="124" font-family="DejaVu Sans" font-size="7.4" fill="#0E1F40" text-anchor="start" font-weight="normal">turns damp red litmus blue</text>
<text x="338" y="139" font-family="DejaVu Sans" font-size="7.0" fill="#64748B" text-anchor="start" font-weight="normal">pungent</text>
<rect x="8" y="160" width="264" height="50" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.1"/>
<rect x="8" y="160" width="48" height="50" rx="5" fill="#D97706" stroke="#D97706" stroke-width="0"/>
<text x="32" y="190" font-family="DejaVu Sans" font-size="9.0" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Cl₂</text>
<text x="66" y="182" font-family="DejaVu Sans" font-size="7.4" fill="#0E1F40" text-anchor="start" font-weight="normal">bleaches damp litmus</text>
<text x="66" y="197" font-family="DejaVu Sans" font-size="7.0" fill="#64748B" text-anchor="start" font-weight="normal">yellow-green</text>
<rect x="280" y="160" width="264" height="50" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.1"/>
<rect x="280" y="160" width="48" height="50" rx="5" fill="#DC2626" stroke="#DC2626" stroke-width="0"/>
<text x="304" y="190" font-family="DejaVu Sans" font-size="9.0" fill="#FFFFFF" text-anchor="middle" font-weight="bold">SO₂</text>
<text x="338" y="182" font-family="DejaVu Sans" font-size="7.4" fill="#0E1F40" text-anchor="start" font-weight="normal">turns acidified dichromate green</text>
<text x="338" y="197" font-family="DejaVu Sans" font-size="7.0" fill="#64748B" text-anchor="start" font-weight="normal">choking</text>
<rect x="8" y="218" width="264" height="50" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.1"/>
<rect x="8" y="218" width="48" height="50" rx="5" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="32" y="248" font-family="DejaVu Sans" font-size="9.0" fill="#FFFFFF" text-anchor="middle" font-weight="bold">H₂O (vapour)</text>
<text x="66" y="240" font-family="DejaVu Sans" font-size="7.4" fill="#0E1F40" text-anchor="start" font-weight="normal">turns anhydrous CuSO₄ from white to blue</text>
<rect x="280" y="218" width="264" height="50" rx="6" fill="#FFFFFF" stroke="#334155" stroke-width="1.1"/>
<rect x="280" y="218" width="48" height="50" rx="5" fill="#334155" stroke="#334155" stroke-width="0"/>
<text x="304" y="248" font-family="DejaVu Sans" font-size="9.0" fill="#FFFFFF" text-anchor="middle" font-weight="bold">HCl</text>
<text x="338" y="240" font-family="DejaVu Sans" font-size="7.4" fill="#0E1F40" text-anchor="start" font-weight="normal">white fumes with ammonia</text>
<text x="338" y="255" font-family="DejaVu Sans" font-size="7.0" fill="#64748B" text-anchor="start" font-weight="normal">damp blue litmus red</text>
<text x="280" y="282" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="middle" font-weight="normal">Say what you did, what you saw and what it proves — in that order, and in one line.</text>
