  <rect x="0" y="0" width="560" height="292" fill="#FFFFFF"/>
<text x="280" y="22" font-family="DejaVu Sans" font-size="10.2" fill="#0E1F40" text-anchor="middle" font-weight="bold">THE GAS TESTS — A TEST IS A SENTENCE WITH AN OBSERVATION IN IT</text>
