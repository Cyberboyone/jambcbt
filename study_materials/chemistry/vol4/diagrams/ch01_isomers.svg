<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 262" width="560" height="262">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="560" height="262" fill="#FFFFFF"/>
<text x="280" y="22" font-family="DejaVu Sans" font-size="10.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">C₄H₁₀ HAS TWO ISOMERS — SAME FORMULA, DIFFERENT SKELETON</text>
<rect x="12" y="40" width="262" height="150" rx="8" fill="#FFFFFF" stroke="#008751" stroke-width="1.4"/>
<text x="143" y="60" font-family="DejaVu Sans" font-size="10.4" fill="#008751" text-anchor="middle" font-weight="bold">butane</text>
<text x="143" y="74" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="middle" font-weight="normal">straight chain — b.p. −0.5 °C</text>
<path d="M 46 118 L 96 96 L 146 118 L 196 96 L 240 118" fill="none" stroke="#0E1F40" stroke-width="2.0" stroke-linecap="round"/>
<text x="46" y="106" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">CH₃</text>
<text x="96" y="84" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">CH₂</text>
<text x="146" y="106" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">CH₂</text>
<text x="196" y="84" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">CH₂</text>
<text x="240" y="106" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">CH₃</text>
<text x="143" y="156" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">every carbon on one line</text>
<rect x="286" y="40" width="262" height="150" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/>
<text x="417" y="60" font-family="DejaVu Sans" font-size="10.4" fill="#D97706" text-anchor="middle" font-weight="bold">2-methylpropane</text>
<text x="417" y="74" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="middle" font-weight="normal">branched — b.p. −12 °C</text>
<path d="M 340 128 L 390 128 L 440 128 L 490 128" fill="none" stroke="#0E1F40" stroke-width="2.0" stroke-linecap="round"/>
<path d="M 390 128 L 390 100" fill="none" stroke="#0E1F40" stroke-width="2.0" stroke-linecap="round"/>
<text x="340" y="116" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">CH₃</text>
<text x="390" y="92" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">CH₃</text>
<text x="440" y="116" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">CH₃</text>
<text x="390" y="146" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">CH</text>
<text x="490" y="116" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">CH₃</text>
<text x="417" y="170" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">one carbon carries three methyl groups</text>
<text x="280" y="214" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">Isomers have the same molecular formula but different structural formulae, so they have different physical properties.</text>
<text x="280" y="236" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="middle" font-weight="normal">The more branched the chain, the smaller the surface contact, the weaker the van der Waals force, and the lower the boiling point.</text>
</svg>
