<text x="141" y="204" font-family="DejaVu Sans" font-size="8.6" fill="#008751" text-anchor="middle" font-weight="bold">Made from calcium carbide</text>
<text x="141" y="220" font-family="DejaVu Sans" font-size="8.2" fill="#0E1F40" text-anchor="middle" font-weight="normal">CaC₂ + 2H₂O → C₂H₂ + Ca(OH)₂</text>
<text x="141" y="238" font-family="DejaVu Sans" font-size="7.4" fill="#64748B" text-anchor="middle" font-weight="normal">the carbide is made in the electric furnace</text>
<text x="141" y="250" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">CaO + 3C → CaC₂ + CO</text>
<rect x="290" y="186" width="258" height="70" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.2"/>
<text x="419" y="204" font-family="DejaVu Sans" font-size="8.6" fill="#DC2626" text-anchor="middle" font-weight="bold">The oxy-acetylene flame</text>
<text x="419" y="220" font-family="DejaVu Sans" font-size="8.2" fill="#0E1F40" text-anchor="middle" font-weight="normal">2C₂H₂ + 5O₂ → 4CO₂ + 2H₂O</text>
<text x="419" y="238" font-family="DejaVu Sans" font-size="7.4" fill="#64748B" text-anchor="middle" font-weight="normal">about 3000 °C — hot enough to weld steel</text>
<text x="419" y="250" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">the only gas flame that hot</text>
