<text x="280" y="276" font-family="DejaVu Sans" font-size="7.8" fill="#0E1F40" text-anchor="middle" font-weight="normal">Ruminants and termites carry the enzyme we lack; that is the whole reason grass feeds a cow and not a candidate.</text>
