<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 262" width="560" height="262">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="560" height="262" fill="#FFFFFF"/>
<text x="280" y="22" font-family="DejaVu Sans" font-size="10.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">SAPONIFICATION — BOILING A FAT WITH ALKALI TO MAKE SOAP</text>
<rect x="12" y="48" width="172" height="96" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/>
<rect x="12" y="48" width="172" height="5" rx="2.5" fill="#D97706"/>
<text x="98" y="74" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">Fat or oil</text>
<text x="98" y="94" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">a triglyceride</text>
<text x="98" y="110" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">glyceryl triester</text>
<line x1="188" y1="96" x2="188.7" y2="96.0" stroke="#008751" stroke-width="1.6"/><polygon points="198.0,96.0 188.7,99.5 188.7,92.5" fill="#008751"/>
<rect x="196" y="48" width="172" height="96" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
<rect x="196" y="48" width="172" height="5" rx="2.5" fill="#2563EB"/>
<text x="282" y="74" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">+ NaOH (aq)</text>
<text x="282" y="94" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">boiled, about 100 °C</text>
<text x="282" y="110" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">the alkali is in excess</text>
<line x1="372" y1="96" x2="372.7" y2="96.0" stroke="#008751" stroke-width="1.6"/><polygon points="382.0,96.0 372.7,99.5 372.7,92.5" fill="#008751"/>
<rect x="380" y="48" width="172" height="96" rx="8" fill="#FFFFFF" stroke="#008751" stroke-width="1.4"/>
<rect x="380" y="48" width="172" height="5" rx="2.5" fill="#008751"/>
<text x="466" y="74" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">Soap + glycerol</text>
<text x="466" y="94" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">sodium salts of the acids</text>
<text x="466" y="110" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">the soap is salted out</text>
<rect x="12" y="158" width="536" height="88" rx="7" fill="#ECFDF5" stroke="#008751" stroke-width="1.2"/>
<text x="280" y="176" font-family="DejaVu Sans" font-size="8.4" fill="#008751" text-anchor="middle" font-weight="bold">The equation, in the form the examiner wants</text>
<text x="280" y="198" font-family="DejaVu Sans" font-size="10.2" fill="#0E1F40" text-anchor="middle" font-weight="bold">fat + 3NaOH → 3RCOONa + C₃H₅(OH)₃</text>
<text x="280" y="218" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">ester + alkali → soap + glycerol</text>
<text x="280" y="236" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">Salt (NaCl) is added to precipitate the soap: it is insoluble in the concentrated brine.</text>
</svg>
