      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="560" height="424" fill="#FFFFFF"/>
<text x="280" y="22" font-family="DejaVu Sans" font-size="10.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">THE TITRATION SET — WHAT HANGS FROM WHAT, AND WHAT YOU READ</text>
<rect x="16" y="392" width="146" height="9" rx="3" fill="#E2E8F0" stroke="#334155" stroke-width="1.2"/>
<rect x="28" y="70" width="9" height="324" rx="3" fill="#E2E8F0" stroke="#334155" stroke-width="1.2"/>
<rect x="37" y="128" width="56" height="7" rx="3" fill="#E2E8F0" stroke="#334155" stroke-width="1.0"/>
<text x="24" y="414" font-family="DejaVu Sans" font-size="6.8" fill="#64748B" text-anchor="start" font-weight="normal">retort stand</text>
<rect x="94" y="58" width="18" height="222" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="1.4"/>
<rect x="97" y="116" width="12" height="160" fill="#7C3AED" opacity="0.50"/>
<line x1="94" y1="70" x2="88" y2="70" stroke="#334155" stroke-width="0.8"/>
<line x1="94" y1="100" x2="88" y2="100" stroke="#334155" stroke-width="0.8"/>
<line x1="94" y1="130" x2="88" y2="130" stroke="#334155" stroke-width="0.8"/>
<line x1="94" y1="160" x2="88" y2="160" stroke="#334155" stroke-width="0.8"/>
<line x1="94" y1="190" x2="88" y2="190" stroke="#334155" stroke-width="0.8"/>
<line x1="94" y1="220" x2="88" y2="220" stroke="#334155" stroke-width="0.8"/>
<text x="84" y="62" font-family="DejaVu Sans" font-size="6.6" fill="#64748B" text-anchor="end" font-weight="normal">0.00</text>
<text x="84" y="152" font-family="DejaVu Sans" font-size="6.4" fill="#64748B" text-anchor="end" font-weight="normal">10</text>
<text x="84" y="242" font-family="DejaVu Sans" font-size="6.4" fill="#64748B" text-anchor="end" font-weight="normal">20</text>
<path d="M 94 280 L 112 280 L 108 294 L 98 294 Z" fill="#E2E8F0" stroke="#334155" stroke-width="1.0" stroke-linecap="round"/>
<line x1="103" y1="294" x2="103" y2="322" stroke="#334155" stroke-width="1.2"/>
<text x="103" y="46" font-family="DejaVu Sans" font-size="6.8" fill="#7C3AED" text-anchor="middle" font-weight="normal">burette — the acid of unknown concentration</text>
<path d="M 94 326 L 94 340 L 58 380 L 58 392 L 148 392 L 148 380 L 112 340 L 112 326 Z" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
<path d="M 66 374 L 140 374 L 146 388 L 60 388 Z" fill="#008751" opacity="0.25"/>
<text x="280" y="414" font-family="DejaVu Sans" font-size="7.0" fill="#008751" text-anchor="middle" font-weight="normal">conical flask: 25.0 cm³ of alkali + 3 drops of indicator</text>
<rect x="196" y="54" width="356" height="340" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.2"/>
<text x="374" y="74" font-family="DejaVu Sans" font-size="9.0" fill="#008751" text-anchor="middle" font-weight="bold">The routine</text>
<text x="208" y="96" font-family="DejaVu Sans" font-size="7.6" fill="#008751" text-anchor="start" font-weight="normal">•</text>
<text x="218" y="96" font-family="DejaVu Sans" font-size="7.5" fill="#0E1F40" text-anchor="start" font-weight="normal">Rinse the burette with the acid, then fill it.</text>
<text x="208" y="115" font-family="DejaVu Sans" font-size="7.6" fill="#008751" text-anchor="start" font-weight="normal">•</text>
<text x="218" y="115" font-family="DejaVu Sans" font-size="7.5" fill="#0E1F40" text-anchor="start" font-weight="normal">Pipette 25.0 cm³ of alkali into the flask.</text>
<text x="208" y="134" font-family="DejaVu Sans" font-size="7.6" fill="#008751" text-anchor="start" font-weight="normal">•</text>
<text x="218" y="134" font-family="DejaVu Sans" font-size="7.5" fill="#0E1F40" text-anchor="start" font-weight="normal">Add two or three drops of indicator.</text>
<text x="208" y="153" font-family="DejaVu Sans" font-size="7.6" fill="#008751" text-anchor="start" font-weight="normal">•</text>
<text x="218" y="153" font-family="DejaVu Sans" font-size="7.5" fill="#0E1F40" text-anchor="start" font-weight="normal">Run the acid in, swirling, until the first</text>
<text x="208" y="172" font-family="DejaVu Sans" font-size="7.6" fill="#008751" text-anchor="start" font-weight="normal">•</text>
<text x="218" y="172" font-family="DejaVu Sans" font-size="7.5" fill="#0E1F40" text-anchor="start" font-weight="normal">permanent colour change — the end point.</text>
<text x="208" y="191" font-family="DejaVu Sans" font-size="7.6" fill="#008751" text-anchor="start" font-weight="normal">•</text>
<text x="218" y="191" font-family="DejaVu Sans" font-size="7.5" fill="#0E1F40" text-anchor="start" font-weight="normal">Record the burette reading to 0.05 cm³.</text>
<text x="208" y="210" font-family="DejaVu Sans" font-size="7.6" fill="#008751" text-anchor="start" font-weight="normal">•</text>
<text x="218" y="210" font-family="DejaVu Sans" font-size="7.5" fill="#0E1F40" text-anchor="start" font-weight="normal">Repeat until two titres agree within 0.10 cm³.</text>
<text x="208" y="229" font-family="DejaVu Sans" font-size="7.6" fill="#008751" text-anchor="start" font-weight="normal">•</text>
<text x="218" y="229" font-family="DejaVu Sans" font-size="7.5" fill="#0E1F40" text-anchor="start" font-weight="normal">Average the concordant titres only.</text>
<line x1="208" y1="250" x2="540" y2="250" stroke="#CBD5E1" stroke-width="0.8"/>
<text x="208" y="270" font-family="DejaVu Sans" font-size="7.6" fill="#0E1F40" text-anchor="start" font-weight="normal">moles of acid  =  c(acid) × V(acid) ÷ 1000</text>
<text x="208" y="288" font-family="DejaVu Sans" font-size="7.6" fill="#0E1F40" text-anchor="start" font-weight="normal">moles of alkali =  c(alkali) × 25.0 ÷ 1000</text>
<text x="208" y="308" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="start" font-weight="normal">Use the equation to get the ratio, then solve for c(acid).</text>
<text x="208" y="330" font-family="DejaVu Sans" font-size="7.4" fill="#64748B" text-anchor="start" font-weight="normal">Read the burette at eye level, at the bottom of the meniscus.</text>
<text x="208" y="348" font-family="DejaVu Sans" font-size="7.4" fill="#64748B" text-anchor="start" font-weight="normal">The end point is where the indicator changes, not the equivalence point.</text>
</svg>
