<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="300" fill="#FFFFFF"/>
<text x="350" y="24" font-family="DejaVu Sans" font-size="13.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">ONE ACID, THREE JOBS</text>
<text x="350" y="43" font-family="DejaVu Sans" font-size="8.8" fill="#64748B" text-anchor="middle" font-weight="normal">What sulphuric acid does depends on how concentrated it is, and how hot.</text>
<rect x="14" y="58" width="672" height="70" rx="8" fill="#FFFFFF" stroke="#008751" stroke-width="1.4"/>
<text x="32" y="79" font-family="DejaVu Sans" font-size="9.6" fill="#008751" text-anchor="start" font-weight="bold">DILUTE — ACIDIC</text>
<text x="32" y="99" font-family="DejaVu Sans" font-size="9.8" fill="#0E1F40" text-anchor="start" font-weight="normal">Mg + H₂SO₄ → MgSO₄ + H₂</text>
<text x="32" y="117" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">It behaves like any other dilute acid: it gives up H⁺ to a metal, a base or a carbonate.</text>
<rect x="14" y="136" width="672" height="70" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/>
<text x="32" y="157" font-family="DejaVu Sans" font-size="9.6" fill="#D97706" text-anchor="start" font-weight="bold">CONCENTRATED — DEHYDRATING</text>
<text x="32" y="177" font-family="DejaVu Sans" font-size="9.8" fill="#0E1F40" text-anchor="start" font-weight="normal">C₁₂H₂₂O₁₁ → 12C + 11H₂O</text>
<text x="32" y="195" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">Sugar turns to a black column of carbon as the acid pulls hydrogen and oxygen out as water.</text>
<rect x="14" y="214" width="672" height="70" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.4"/>
<text x="32" y="235" font-family="DejaVu Sans" font-size="9.6" fill="#DC2626" text-anchor="start" font-weight="bold">HOT CONCENTRATED — OXIDISING</text>
<text x="32" y="255" font-family="DejaVu Sans" font-size="9.8" fill="#0E1F40" text-anchor="start" font-weight="normal">Cu + 2H₂SO₄ → CuSO₄ + SO₂ + 2H₂O</text>
<text x="32" y="273" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">It oxidises copper, which dilute acid cannot touch: sulphur falls from +6 to +4.</text>
</svg>
