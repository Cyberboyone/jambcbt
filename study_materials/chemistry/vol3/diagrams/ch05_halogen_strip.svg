<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="24" font-family="DejaVu Sans" font-size="12.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">THE HALOGENS — A GROUP THAT GOES THE OTHER WAY</text>
<text x="380" y="42" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="middle" font-weight="normal">Colour deepens, density rises and reactivity falls as you go down: the reverse of Group 1.</text>
<text x="124" y="62" font-family="DejaVu Sans" font-size="6.8" fill="#64748B" text-anchor="start" font-weight="normal">halogen</text>
<text x="214" y="62" font-family="DejaVu Sans" font-size="6.8" fill="#64748B" text-anchor="start" font-weight="normal">at room temperature</text>
<text x="432" y="62" font-family="DejaVu Sans" font-size="6.8" fill="#64748B" text-anchor="middle" font-weight="normal">m.p. / °C</text>
<text x="516" y="62" font-family="DejaVu Sans" font-size="6.8" fill="#64748B" text-anchor="middle" font-weight="normal">b.p. / °C</text>
<text x="600" y="62" font-family="DejaVu Sans" font-size="6.8" fill="#64748B" text-anchor="start" font-weight="normal">where you meet it</text>
<rect x="20" y="72" width="720" height="46" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8"/>
<rect x="88" y="84" width="24" height="22" rx="3" fill="#FEF9C3" stroke="#64748B" stroke-width="0.8"/>
<text x="124" y="100" font-family="DejaVu Sans" font-size="11.5" fill="#854D0E" text-anchor="start" font-weight="bold">F₂</text>
<text x="214" y="99" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="start" font-weight="normal">pale yellow gas</text>
<text x="432" y="99" font-family="DejaVu Sans" font-size="8.0" fill="#0E1F40" text-anchor="middle" font-weight="normal">−220</text>
<text x="516" y="99" font-family="DejaVu Sans" font-size="8.0" fill="#0E1F40" text-anchor="middle" font-weight="normal">−188</text>
<text x="600" y="99" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="start" font-weight="normal">never handled in school</text>
<rect x="20" y="126" width="720" height="46" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
<rect x="88" y="138" width="24" height="22" rx="3" fill="#D9F99D" stroke="#64748B" stroke-width="0.8"/>
<text x="124" y="154" font-family="DejaVu Sans" font-size="11.5" fill="#3F6212" text-anchor="start" font-weight="bold">Cl₂</text>
<text x="214" y="153" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="start" font-weight="normal">greenish-yellow gas, 2.5 × denser than air</text>
<text x="432" y="153" font-family="DejaVu Sans" font-size="8.0" fill="#0E1F40" text-anchor="middle" font-weight="normal">−101</text>
<text x="516" y="153" font-family="DejaVu Sans" font-size="8.0" fill="#0E1F40" text-anchor="middle" font-weight="normal">−34.6</text>
<text x="600" y="153" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="start" font-weight="normal">bleaches damp litmus</text>
<rect x="20" y="180" width="720" height="46" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8"/>
<rect x="88" y="192" width="24" height="22" rx="3" fill="#9A3412" stroke="#64748B" stroke-width="0.8"/>
<text x="124" y="208" font-family="DejaVu Sans" font-size="11.5" fill="#7C2D12" text-anchor="start" font-weight="bold">Br₂</text>
<text x="214" y="207" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="start" font-weight="normal">red-brown liquid, orange vapour</text>
<text x="432" y="207" font-family="DejaVu Sans" font-size="8.0" fill="#0E1F40" text-anchor="middle" font-weight="normal">−7.2</text>
<text x="516" y="207" font-family="DejaVu Sans" font-size="8.0" fill="#0E1F40" text-anchor="middle" font-weight="normal">58.8</text>
<text x="600" y="207" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="start" font-weight="normal">turns starch orange-brown</text>
<rect x="20" y="234" width="720" height="46" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
<rect x="88" y="246" width="24" height="22" rx="3" fill="#374151" stroke="#64748B" stroke-width="0.8"/>
<text x="124" y="262" font-family="DejaVu Sans" font-size="11.5" fill="#1E1B4B" text-anchor="start" font-weight="bold">I₂</text>
<text x="214" y="261" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="start" font-weight="normal">grey-black solid, purple vapour on heating</text>
<text x="432" y="261" font-family="DejaVu Sans" font-size="8.0" fill="#0E1F40" text-anchor="middle" font-weight="normal">114</text>
<text x="516" y="261" font-family="DejaVu Sans" font-size="8.0" fill="#0E1F40" text-anchor="middle" font-weight="normal">184</text>
<text x="600" y="261" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="start" font-weight="normal">starch → blue-black</text>
<text x="40" y="300" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="start" font-weight="normal">Going down the group: more electrons, stronger van der Waals forces, higher melting and boiling points.</text>
<text x="40" y="316" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="start" font-weight="normal">But the outermost shell is further from the nucleus, so the atom gains an electron less easily.</text>
</svg>
