<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="300" fill="#FFFFFF"/>
<text x="380" y="24" font-family="DejaVu Sans" font-size="12.2" fill="#0E1F40" text-anchor="middle" font-weight="bold">FROM BAUXITE TO ALUMINIUM</text>
<text x="380" y="42" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">Two processes in series: Bayer purifies the ore, Hall–Héroult reduces the purified oxide.</text>
<rect x="16" y="60" width="138" height="150" rx="8" fill="#FED7AA" stroke="#7C2D12" stroke-width="1.5"/>
<text x="85.0" y="84" font-family="DejaVu Sans" font-size="8.8" fill="#7C2D12" text-anchor="middle" font-weight="bold">BAUXITE</text>
<text x="85.0" y="104" font-family="DejaVu Sans" font-size="7.0" fill="#334155" text-anchor="middle" font-weight="normal">Al₂O₃ with Fe₂O₃</text>
<text x="85.0" y="116" font-family="DejaVu Sans" font-size="7.0" fill="#334155" text-anchor="middle" font-weight="normal">and SiO₂ impurities</text>
<line x1="155" y1="135" x2="150.6" y2="135.0" stroke="#008751" stroke-width="1.5"/><polygon points="163.0,135.0 150.6,139.6 150.6,130.4" fill="#008751"/>
<rect x="164" y="60" width="138" height="150" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="233.0" y="84" font-family="DejaVu Sans" font-size="8.8" fill="#D97706" text-anchor="middle" font-weight="bold">DIGEST</text>
<text x="233.0" y="104" font-family="DejaVu Sans" font-size="7.0" fill="#334155" text-anchor="middle" font-weight="normal">hot NaOH, 150 °C</text>
<text x="233.0" y="116" font-family="DejaVu Sans" font-size="7.0" fill="#334155" text-anchor="middle" font-weight="normal">Al₂O₃ dissolves</text>
<text x="233.0" y="128" font-family="DejaVu Sans" font-size="7.0" fill="#334155" text-anchor="middle" font-weight="normal">Fe₂O₃ does not</text>
<line x1="303" y1="135" x2="298.6" y2="135.0" stroke="#008751" stroke-width="1.5"/><polygon points="311.0,135.0 298.6,139.6 298.6,130.4" fill="#008751"/>
<rect x="312" y="60" width="138" height="150" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="381.0" y="84" font-family="DejaVu Sans" font-size="8.8" fill="#2563EB" text-anchor="middle" font-weight="bold">FILTER + SEED</text>
<text x="381.0" y="104" font-family="DejaVu Sans" font-size="7.0" fill="#334155" text-anchor="middle" font-weight="normal">cool and seed</text>
<text x="381.0" y="116" font-family="DejaVu Sans" font-size="7.0" fill="#334155" text-anchor="middle" font-weight="normal">Al(OH)₃ precipitates</text>
<text x="381.0" y="128" font-family="DejaVu Sans" font-size="7.0" fill="#334155" text-anchor="middle" font-weight="normal">impurities stay behind</text>
<line x1="451" y1="135" x2="446.6" y2="135.0" stroke="#008751" stroke-width="1.5"/><polygon points="459.0,135.0 446.6,139.6 446.6,130.4" fill="#008751"/>
<rect x="460" y="60" width="138" height="150" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
<text x="529.0" y="84" font-family="DejaVu Sans" font-size="8.8" fill="#7C3AED" text-anchor="middle" font-weight="bold">CALCINE</text>
<text x="529.0" y="104" font-family="DejaVu Sans" font-size="7.0" fill="#334155" text-anchor="middle" font-weight="normal">heat to 1200 °C</text>
<text x="529.0" y="116" font-family="DejaVu Sans" font-size="7.0" fill="#334155" text-anchor="middle" font-weight="normal">2Al(OH)₃ → Al₂O₃</text>
<text x="529.0" y="128" font-family="DejaVu Sans" font-size="7.0" fill="#334155" text-anchor="middle" font-weight="normal">+ 3H₂O</text>
<line x1="599" y1="135" x2="594.6" y2="135.0" stroke="#008751" stroke-width="1.5"/><polygon points="607.0,135.0 594.6,139.6 594.6,130.4" fill="#008751"/>
<rect x="608" y="60" width="138" height="150" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.5"/>
<text x="677.0" y="84" font-family="DejaVu Sans" font-size="8.8" fill="#008751" text-anchor="middle" font-weight="bold">ELECTROLYSE</text>
<text x="677.0" y="104" font-family="DejaVu Sans" font-size="7.0" fill="#334155" text-anchor="middle" font-weight="normal">Al₂O₃ in cryolite</text>
<text x="677.0" y="116" font-family="DejaVu Sans" font-size="7.0" fill="#334155" text-anchor="middle" font-weight="normal">950 °C, carbon anodes</text>
<text x="677.0" y="128" font-family="DejaVu Sans" font-size="7.0" fill="#334155" text-anchor="middle" font-weight="normal">4Al³⁺ + 12e⁻ → 4Al</text>
<rect x="16" y="224" width="728" height="58" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.2"/>
<text x="380" y="244" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">Why not reduce alumina with carbon? Aluminium sits above carbon in the series,</text>
<text x="380" y="260" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">so carbon cannot take the oxygen. Electricity has to do it — which is why aluminium</text>
<text x="380" y="276" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">smelting is built beside a hydro-electric station, and why recycled aluminium saves 95 % of the energy.</text>
</svg>
