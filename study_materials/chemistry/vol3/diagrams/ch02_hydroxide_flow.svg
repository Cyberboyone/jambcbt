<text x="548" y="132" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">weakly alkaline, sparingly soluble</text>
<rect x="20" y="156" width="216" height="34" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/>
<text x="128" y="178" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">CaO + H₂O</text>
