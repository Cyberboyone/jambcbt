<text x="380" y="22" font-family="DejaVu Sans" font-size="12.2" fill="#0E1F40" text-anchor="middle" font-weight="bold">OXIDES, HYDROXIDES AND THE pH THAT FOLLOWS</text>
<text x="380" y="40" font-family="DejaVu Sans" font-size="8.0" fill="#64748B" text-anchor="middle" font-weight="normal">Every Group 1 and Group 2 oxide is basic; the more reactive the metal, the more vigorously the oxide reacts.</text>
