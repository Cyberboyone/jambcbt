<rect x="292" y="110" width="200" height="34" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/>
<text x="392" y="132" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">Mg(OH)₂</text>
