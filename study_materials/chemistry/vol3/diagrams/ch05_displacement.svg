<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="340" fill="#FFFFFF"/>
<text x="380" y="24" font-family="DejaVu Sans" font-size="12.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">DISPLACEMENT — THE MORE REACTIVE HALOGEN WINS</text>
<text x="380" y="42" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="middle" font-weight="normal">Add halogen water to a halide solution: a colour appears only if the halogen can take the halide's electron.</text>
<text x="108" y="62" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="bold">Cl₂ water</text>
<text x="108" y="74" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="bold">+ KBr</text>
<rect x="76" y="82" width="64" height="128" rx="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.3"/>
<path d="M 80 135.76 L 80 191.44 Q 80 207.44 108.0 207.44 Q 136 207.44 136 191.44 L 136 135.76 Z" fill="#C2410C" stroke="none" stroke-width="1.8" stroke-linecap="round"/>
<line x1="80" y1="135.76" x2="136" y2="135.76" stroke="#FFFFFF" stroke-width="1.2"/>
<text x="108" y="226" font-family="DejaVu Sans" font-size="7.4" fill="#0E1F40" text-anchor="middle" font-weight="normal">solution turns orange</text>
<text x="108" y="241" font-family="DejaVu Sans" font-size="7.4" fill="#008751" text-anchor="middle" font-weight="normal">Cl₂ + 2KBr → 2KCl + Br₂</text>
<text x="288" y="62" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="bold">Cl₂ water</text>
<text x="288" y="74" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="bold">+ KI</text>
<rect x="256" y="82" width="64" height="128" rx="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.3"/>
<path d="M 260 135.76 L 260 191.44 Q 260 207.44 288.0 207.44 Q 316 207.44 316 191.44 L 316 135.76 Z" fill="#7C2D12" stroke="none" stroke-width="1.8" stroke-linecap="round"/>
<line x1="260" y1="135.76" x2="316" y2="135.76" stroke="#FFFFFF" stroke-width="1.2"/>
<text x="288" y="226" font-family="DejaVu Sans" font-size="7.4" fill="#0E1F40" text-anchor="middle" font-weight="normal">solution turns brown</text>
<text x="288" y="241" font-family="DejaVu Sans" font-size="7.4" fill="#008751" text-anchor="middle" font-weight="normal">Cl₂ + 2KI → 2KCl + I₂</text>
<text x="468" y="62" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="bold">Br₂ water</text>
<text x="468" y="74" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="bold">+ KI</text>
<rect x="436" y="82" width="64" height="128" rx="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.3"/>
<path d="M 440 135.76 L 440 191.44 Q 440 207.44 468.0 207.44 Q 496 207.44 496 191.44 L 496 135.76 Z" fill="#92400E" stroke="none" stroke-width="1.8" stroke-linecap="round"/>
<line x1="440" y1="135.76" x2="496" y2="135.76" stroke="#FFFFFF" stroke-width="1.2"/>
<text x="468" y="226" font-family="DejaVu Sans" font-size="7.4" fill="#0E1F40" text-anchor="middle" font-weight="normal">orange turns brown</text>
<text x="468" y="241" font-family="DejaVu Sans" font-size="7.4" fill="#008751" text-anchor="middle" font-weight="normal">Br₂ + 2KI → 2KBr + I₂</text>
<text x="648" y="62" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="bold">I₂ water</text>
<text x="648" y="74" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="bold">+ KBr</text>
<rect x="616" y="82" width="64" height="128" rx="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.3"/>
<path d="M 620 135.76 L 620 191.44 Q 620 207.44 648.0 207.44 Q 676 207.44 676 191.44 L 676 135.76 Z" fill="#A16207" stroke="none" stroke-width="1.8" stroke-linecap="round"/>
<line x1="620" y1="135.76" x2="676" y2="135.76" stroke="#FFFFFF" stroke-width="1.2"/>
<text x="648" y="226" font-family="DejaVu Sans" font-size="7.4" fill="#0E1F40" text-anchor="middle" font-weight="normal">no change at all</text>
<text x="648" y="241" font-family="DejaVu Sans" font-size="7.4" fill="#008751" text-anchor="middle" font-weight="normal">I₂ + KBr → no reaction</text>
<rect x="20" y="262" width="720" height="32" rx="5" fill="#ECFDF5" stroke="#008751" stroke-width="0.9"/>
<text x="380" y="282" font-family="DejaVu Sans" font-size="7.5" fill="#334155" text-anchor="middle" font-weight="normal">A halogen below iodine in reactivity cannot displace iodine, so nothing happens — the last tube is the control.</text>
<text x="380" y="312" font-family="DejaVu Sans" font-size="7.5" fill="#334155" text-anchor="middle" font-weight="normal">With starch added, the iodine tubes go blue-black: that is the standard test for I₂.</text>
</svg>
