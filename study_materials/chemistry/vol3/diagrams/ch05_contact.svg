<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="300" fill="#FFFFFF"/>
<text x="380" y="24" font-family="DejaVu Sans" font-size="12.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">THE CONTACT PROCESS — SULPHUR TO SULPHURIC ACID</text>
<text x="380" y="42" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="middle" font-weight="normal">One reversible step does the work, and that step is the one the conditions are chosen for.</text>
<rect x="24" y="80" width="128" height="108" rx="7" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
<text x="88.0" y="102" font-family="DejaVu Sans" font-size="8.4" fill="#D97706" text-anchor="middle" font-weight="bold">BURN</text>
<text x="88.0" y="120" font-family="DejaVu Sans" font-size="6.9" fill="#334155" text-anchor="middle" font-weight="normal">S + O₂ → SO₂</text>
<text x="88.0" y="133" font-family="DejaVu Sans" font-size="6.9" fill="#334155" text-anchor="middle" font-weight="normal">sulphur burnt</text>
<text x="88.0" y="146" font-family="DejaVu Sans" font-size="6.9" fill="#334155" text-anchor="middle" font-weight="normal">in dry air</text>
<line x1="154" y1="140" x2="155.6" y2="140.0" stroke="#008751" stroke-width="1.4"/><polygon points="168.0,140.0 155.6,144.6 155.6,135.4" fill="#008751"/>
<rect x="170" y="80" width="128" height="108" rx="7" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
<text x="234.0" y="102" font-family="DejaVu Sans" font-size="8.4" fill="#D97706" text-anchor="middle" font-weight="bold">PURIFY</text>
<text x="234.0" y="120" font-family="DejaVu Sans" font-size="6.9" fill="#334155" text-anchor="middle" font-weight="normal">dust and arsenic</text>
<text x="234.0" y="133" font-family="DejaVu Sans" font-size="6.9" fill="#334155" text-anchor="middle" font-weight="normal">removed: they poison</text>
<text x="234.0" y="146" font-family="DejaVu Sans" font-size="6.9" fill="#334155" text-anchor="middle" font-weight="normal">the catalyst</text>
<line x1="300" y1="140" x2="301.6" y2="140.0" stroke="#008751" stroke-width="1.4"/><polygon points="314.0,140.0 301.6,144.6 301.6,135.4" fill="#008751"/>
<rect x="316" y="80" width="128" height="108" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
<text x="380.0" y="102" font-family="DejaVu Sans" font-size="8.4" fill="#DC2626" text-anchor="middle" font-weight="bold">CONVERT</text>
<text x="380.0" y="120" font-family="DejaVu Sans" font-size="6.9" fill="#334155" text-anchor="middle" font-weight="normal">2SO₂ + O₂ ⇌ 2SO₃</text>
<text x="380.0" y="133" font-family="DejaVu Sans" font-size="6.9" fill="#334155" text-anchor="middle" font-weight="normal">V₂O₅, 450 °C</text>
<text x="380.0" y="146" font-family="DejaVu Sans" font-size="6.9" fill="#334155" text-anchor="middle" font-weight="normal">1–2 atm</text>
<line x1="446" y1="140" x2="447.6" y2="140.0" stroke="#008751" stroke-width="1.4"/><polygon points="460.0,140.0 447.6,144.6 447.6,135.4" fill="#008751"/>
<rect x="462" y="80" width="128" height="108" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<text x="526.0" y="102" font-family="DejaVu Sans" font-size="8.4" fill="#2563EB" text-anchor="middle" font-weight="bold">ABSORB</text>
<text x="526.0" y="120" font-family="DejaVu Sans" font-size="6.9" fill="#334155" text-anchor="middle" font-weight="normal">SO₃ in 98 %</text>
<text x="526.0" y="133" font-family="DejaVu Sans" font-size="6.9" fill="#334155" text-anchor="middle" font-weight="normal">H₂SO₄ → oleum</text>
<text x="526.0" y="146" font-family="DejaVu Sans" font-size="6.9" fill="#334155" text-anchor="middle" font-weight="normal">H₂S₂O₇</text>
<line x1="592" y1="140" x2="593.6" y2="140.0" stroke="#008751" stroke-width="1.4"/><polygon points="606.0,140.0 593.6,144.6 593.6,135.4" fill="#008751"/>
<rect x="608" y="80" width="128" height="108" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.5"/>
<text x="672.0" y="102" font-family="DejaVu Sans" font-size="8.4" fill="#008751" text-anchor="middle" font-weight="bold">DILUTE</text>
<text x="672.0" y="120" font-family="DejaVu Sans" font-size="6.9" fill="#334155" text-anchor="middle" font-weight="normal">oleum + water</text>
<text x="672.0" y="133" font-family="DejaVu Sans" font-size="6.9" fill="#334155" text-anchor="middle" font-weight="normal">→ concentrated</text>
<text x="672.0" y="146" font-family="DejaVu Sans" font-size="6.9" fill="#334155" text-anchor="middle" font-weight="normal">H₂SO₄</text>
<path d="M 420 80 L 420 60 L 340 60 L 340 78" fill="none" stroke="#D97706" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="4 3"/>
<line x1="340" y1="66" x2="340.0" y2="67.6" stroke="#D97706" stroke-width="1.3"/><polygon points="340.0,80.0 335.4,67.6 344.6,67.6" fill="#D97706"/>
<rect x="20" y="206" width="720" height="30" rx="5" fill="#FEE2E2" stroke="#DC2626" stroke-width="0.9"/>
<text x="380" y="225" font-family="DejaVu Sans" font-size="7.5" fill="#334155" text-anchor="middle" font-weight="normal">450 °C and 1–2 atm are a compromise: low enough for a good yield, high enough for a workable rate.</text>
<rect x="20" y="246" width="720" height="34" rx="5" fill="#ECFDF5" stroke="#008751" stroke-width="0.9"/>
<text x="380" y="261" font-family="DejaVu Sans" font-size="7.5" fill="#334155" text-anchor="middle" font-weight="normal">Unreacted SO₂ and O₂ are recycled to the converter.</text>
<text x="380" y="273" font-family="DejaVu Sans" font-size="7.5" fill="#334155" text-anchor="middle" font-weight="normal">Never absorb SO₃ in water: the mist is too fine to collect. Absorb it in 98 % acid first.</text>
</svg>
