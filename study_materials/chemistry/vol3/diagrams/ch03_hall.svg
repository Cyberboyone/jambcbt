<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="24" font-family="DejaVu Sans" font-size="12.2" fill="#0E1F40" text-anchor="middle" font-weight="bold">THE HALL–HÉROULT CELL</text>
<text x="380" y="42" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="middle" font-weight="normal">A steel box lined with carbon, carbon anodes dipping in, and cryolite to melt the alumina at 950 °C.</text>
<rect x="112" y="112" width="536" height="216" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="2.0"/>
<rect x="120" y="120" width="520" height="200" rx="4" fill="#334155" stroke="#1E293B" stroke-width="1.2"/>
<rect x="136" y="172" width="488" height="104" rx="3" fill="#FDE68A" stroke="#B45309" stroke-width="1.0"/>
<text x="380" y="212" font-family="DejaVu Sans" font-size="8.0" fill="#7C2D12" text-anchor="middle" font-weight="normal">molten cryolite + dissolved Al₂O₃ at about 950 °C</text>
<rect x="136" y="276" width="488" height="34" rx="3" fill="#CBD5E1" stroke="#64748B" stroke-width="1.2"/>
<text x="380" y="298" font-family="DejaVu Sans" font-size="8.0" fill="#0E1F40" text-anchor="middle" font-weight="normal">molten aluminium (cathode surface)</text>
<rect x="230" y="94" width="40" height="74" rx="3" fill="#1F2937" stroke="#111827" stroke-width="1.2"/>
<line x1="250" y1="94" x2="250" y2="60" stroke="#111827" stroke-width="3.0"/>
<text x="250" y="52" font-family="DejaVu Sans" font-size="6.8" fill="#64748B" text-anchor="middle" font-weight="normal">carbon anode</text>
<rect x="360" y="94" width="40" height="74" rx="3" fill="#1F2937" stroke="#111827" stroke-width="1.2"/>
<line x1="380" y1="94" x2="380" y2="60" stroke="#111827" stroke-width="3.0"/>
<text x="380" y="52" font-family="DejaVu Sans" font-size="6.8" fill="#64748B" text-anchor="middle" font-weight="normal">carbon anode</text>
<rect x="490" y="94" width="40" height="74" rx="3" fill="#1F2937" stroke="#111827" stroke-width="1.2"/>
<line x1="510" y1="94" x2="510" y2="60" stroke="#111827" stroke-width="3.0"/>
<text x="510" y="52" font-family="DejaVu Sans" font-size="6.8" fill="#64748B" text-anchor="middle" font-weight="normal">carbon anode</text>
<line x1="230" y1="60" x2="530" y2="60" stroke="#111827" stroke-width="2.4"/>
<text x="556" y="52" font-family="DejaVu Sans" font-size="7.4" fill="#DC2626" text-anchor="start" font-weight="normal">positive (+)</text>
<line x1="240" y1="344" x2="520" y2="344" stroke="#334155" stroke-width="2.0"/>
<text x="380" y="358" font-family="DejaVu Sans" font-size="7.4" fill="#2563EB" text-anchor="middle" font-weight="normal">negative (−) bus bar</text>
<text x="660" y="160" font-family="DejaVu Sans" font-size="7.6" fill="#DC2626" text-anchor="start" font-weight="normal">O²⁻ → O₂ + 4e⁻</text>
<text x="660" y="174" font-family="DejaVu Sans" font-size="6.8" fill="#64748B" text-anchor="start" font-weight="normal">the anodes burn</text>
<text x="660" y="186" font-family="DejaVu Sans" font-size="6.8" fill="#64748B" text-anchor="start" font-weight="normal">away as CO₂</text>
<text x="660" y="250" font-family="DejaVu Sans" font-size="7.6" fill="#2563EB" text-anchor="start" font-weight="normal">Al³⁺ + 3e⁻ → Al</text>
<text x="660" y="264" font-family="DejaVu Sans" font-size="6.8" fill="#64748B" text-anchor="start" font-weight="normal">liquid metal,</text>
<text x="660" y="276" font-family="DejaVu Sans" font-size="6.8" fill="#64748B" text-anchor="start" font-weight="normal">tapped from below</text>
<rect x="24" y="386" width="712" height="22" rx="5" fill="#ECFDF5" stroke="#008751" stroke-width="0.9"/>
<text x="380" y="401" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">The anodes must be replaced regularly, which is the main running cost after electricity.</text>
</svg>
