<text x="380" y="292" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">Group I — alkali metals · Group II — alkaline earth metals · Group VII — halogens · Group 0 — noble gases</text>
<text x="380" y="312" font-family="DejaVu Sans" font-size="8.2" fill="#0E1F40" text-anchor="middle" font-weight="bold">Elements in the same group have the same number of outer-shell electrons, which is why their chemistry is so similar.</text>
<text x="380" y="332" font-family="DejaVu Sans" font-size="8.6" fill="#DC2626" text-anchor="middle" font-weight="bold">Metallic character increases down a group, and towards the left across a period.</text>
