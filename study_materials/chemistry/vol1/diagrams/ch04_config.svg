<text x="534" y="140" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="start" font-weight="normal">energy</text>
<text x="530" y="232" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="middle" font-weight="normal">one box = one orbital, holding at most two electrons</text>
<text x="530" y="246" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="middle" font-weight="normal">with opposite spins (↑↓); degenerate orbitals fill singly first</text>
<rect x="20" y="268" width="230" height="50" rx="7" fill="#ECFDF5" stroke="#008751" stroke-width="1.1"/>
<text x="135" y="286" font-family="DejaVu Sans" font-size="9.2" fill="#008751" text-anchor="middle" font-weight="bold">AUFBAU</text>
<text x="135" y="302" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="middle" font-weight="normal">fill the lowest energy level first</text>
<text x="135" y="313" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="middle" font-weight="normal"></text>
<rect x="264" y="268" width="230" height="50" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.1"/>
<text x="379" y="286" font-family="DejaVu Sans" font-size="9.2" fill="#008751" text-anchor="middle" font-weight="bold">PAULI</text>
<text x="379" y="302" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="middle" font-weight="normal">no orbital holds more than two electrons</text>
<text x="379" y="313" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="middle" font-weight="normal"></text>
<rect x="508" y="268" width="230" height="50" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.1"/>
<text x="623" y="286" font-family="DejaVu Sans" font-size="9.2" fill="#008751" text-anchor="middle" font-weight="bold">HUND</text>
<text x="623" y="302" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="middle" font-weight="normal">degenerate orbitals fill singly before pairing</text>
<text x="623" y="313" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="middle" font-weight="normal"></text>
