<text x="150" y="262" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">shells hold at most 2, 8, 8 …</text>
<text x="530" y="46" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="middle" font-weight="bold">Sodium — 1s² 2s² 2p⁶ 3s¹</text>
<text x="320" y="76" font-family="DejaVu Sans" font-size="9" fill="#7C3AED" text-anchor="middle" font-weight="bold">3s</text>
