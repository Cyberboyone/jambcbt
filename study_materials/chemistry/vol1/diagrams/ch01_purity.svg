<text x="380" y="24" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">MELTING POINT — HOW A PURE SUBSTANCE IS RECOGNISED</text>
<line x1="96" y1="272" x2="680" y2="272" stroke="#0E1F40" stroke-width="1.4"/>
<line x1="96" y1="272" x2="96" y2="62" stroke="#0E1F40" stroke-width="1.4"/>
<text x="104" y="74" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="start" font-weight="normal">temperature</text>
<text x="680" y="290" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="end" font-weight="normal">time of heating</text>
<path d="M 96 246 L 210 186 L 250 158" fill="none" stroke="#008751" stroke-width="2.0" stroke-linecap="round"/>
