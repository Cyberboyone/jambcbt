<line x1="340" y1="158" x2="340" y2="266" stroke="#CBD5E1" stroke-width="0.9" stroke-dasharray="3 3"/>
<text x="340" y="262" font-family="DejaVu Sans" font-size="7.4" fill="#64748B" text-anchor="middle" font-weight="normal">m.p. of the pure solid</text>
<line x1="600" y1="80" x2="640" y2="80" stroke="#008751" stroke-width="3.2"/>
<text x="648" y="83" font-family="DejaVu Sans" font-size="7.6" fill="#008751" text-anchor="start" font-weight="normal">pure: a sharp plateau at a</text>
<text x="648" y="95" font-family="DejaVu Sans" font-size="7.6" fill="#008751" text-anchor="start" font-weight="normal">constant temperature</text>
<line x1="600" y1="118" x2="640" y2="118" stroke="#D97706" stroke-width="3.2"/>
<text x="648" y="121" font-family="DejaVu Sans" font-size="7.6" fill="#D97706" text-anchor="start" font-weight="normal">impure: melts lower and</text>
<text x="648" y="133" font-family="DejaVu Sans" font-size="7.6" fill="#D97706" text-anchor="start" font-weight="normal">over a range of temperature</text>
<text x="150" y="210" font-family="DejaVu Sans" font-size="7.4" fill="#64748B" text-anchor="start" font-weight="normal">liquid</text>
<rect x="60" y="300" width="640" height="22" rx="6" fill="#ECFDF5" stroke="#008751" stroke-width="1.0"/>
<text x="380" y="315" font-family="DejaVu Sans" font-size="8.4" fill="#008751" text-anchor="middle" font-weight="bold">A pure solid melts sharply; an impurity lowers the melting point and spreads it over a range.</text>
