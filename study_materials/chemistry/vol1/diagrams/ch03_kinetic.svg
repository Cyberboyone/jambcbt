<text x="136" y="168" font-family="DejaVu Sans" font-size="9.8" fill="#008751" text-anchor="middle" font-weight="bold">1 · THE MODEL</text>
<text x="136" y="184" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">Pressure comes from the total</text>
<text x="136" y="197" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">force of the collisions per unit</text>
<text x="136" y="210" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">area of the walls.</text>
