<text x="452" y="84" font-family="DejaVu Sans" font-size="8.4" fill="#2563EB" text-anchor="middle" font-weight="bold">push</text>
<text x="343" y="168" font-family="DejaVu Sans" font-size="9.8" fill="#2563EB" text-anchor="middle" font-weight="bold">2 · SMALLER VOLUME</text>
<text x="343" y="184" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">The same molecules now hit</text>
<text x="343" y="197" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">the walls more often, so the</text>
<text x="343" y="210" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">pressure rises (Boyle).</text>
