<text x="624" y="168" font-family="DejaVu Sans" font-size="9.8" fill="#D97706" text-anchor="middle" font-weight="bold">3 · HIGHER TEMPERATURE</text>
<text x="624" y="184" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">Heat added: the molecules move</text>
<text x="624" y="197" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">faster, collide harder and more</text>
<text x="624" y="210" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">often, so the pressure rises if</text>
<text x="624" y="223" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">the volume is held constant.</text>
<rect x="24" y="234" width="712" height="48" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.1"/>
<text x="380" y="252" font-family="DejaVu Sans" font-size="9.2" fill="#008751" text-anchor="middle" font-weight="bold">Volume down → pressure up  ·  Temperature up → pressure up  ·  More moles → pressure up</text>
<text x="380" y="272" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">Absolute temperature means kelvin: T(K) = °C + 273. At 0 K every motion stops and the pressure would be zero.</text>
