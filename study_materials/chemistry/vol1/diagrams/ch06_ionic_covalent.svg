<text x="380" y="263" font-family="DejaVu Sans" font-size="8.4" fill="#008751" text-anchor="middle" font-weight="bold">Ionic: electrons are transferred, and the ions then attract one another.   Covalent: electrons are shared between two atoms.</text>
<text x="380" y="279" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">Crosses show electrons that came from one atom; dots show electrons from the other — the origin is the only difference.</text>
