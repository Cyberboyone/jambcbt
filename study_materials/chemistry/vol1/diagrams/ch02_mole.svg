<text x="380" y="319" font-family="DejaVu Sans" font-size="8.2" fill="#0E1F40" text-anchor="middle" font-weight="normal">One mole of any substance contains 6.02 × 10²³ particles and has a mass equal to its M_r in grams.</text>
