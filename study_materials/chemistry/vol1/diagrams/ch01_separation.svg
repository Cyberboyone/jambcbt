<rect x="30" y="274" width="700" height="56" rx="8" fill="#F8FBF9" stroke="#008751" stroke-width="1.1"/>
<text x="380" y="292" font-family="DejaVu Sans" font-size="8.4" fill="#008751" text-anchor="middle" font-weight="bold">Choose by the difference you can use: particle size (filtration), boiling point (distillation),</text>
<text x="380" y="308" font-family="DejaVu Sans" font-size="8.4" fill="#008751" text-anchor="middle" font-weight="bold">density and immiscibility (separating funnel), solubility and adsorption (chromatography),</text>
<text x="380" y="324" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">or the ability to sublime (iodine from sand) and magnetic attraction (iron from sulphur).</text>
</svg>
