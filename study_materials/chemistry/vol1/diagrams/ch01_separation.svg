<text x="380" y="24" font-family="DejaVu Sans" font-size="12.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">FOUR SEPARATION TECHNIQUES AND THE MIXTURE EACH ONE SUITS</text>
<text x="112" y="52" font-family="DejaVu Sans" font-size="9.0" fill="#008751" text-anchor="middle" font-weight="bold">1 · FILTRATION</text>
