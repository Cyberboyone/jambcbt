<text x="112" y="244" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="middle" font-weight="normal">solid stays on the paper</text>
<text x="320" y="52" font-family="DejaVu Sans" font-size="9.0" fill="#008751" text-anchor="middle" font-weight="bold">2 · SIMPLE DISTILLATION</text>
