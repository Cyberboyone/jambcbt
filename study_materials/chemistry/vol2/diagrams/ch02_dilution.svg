<circle cx="130.84533502181245" cy="128.915823620065" r="3.0" fill="#008751"/>
<circle cx="152.2231684943542" cy="155.3183915268793" r="3.0" fill="#008751"/>
<text x="150" y="54" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="middle" font-weight="bold">0.10 M, 100 cm³</text>
<text x="150" y="182" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">0.10 mol dm⁻³</text>
<text x="150" y="196" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">100 cm³ = 0.010 mol</text>
<line x1="230" y1="120" x2="317.6" y2="120.0" stroke="#0E1F40" stroke-width="1.9"/><polygon points="330.0,120.0 317.6,124.6 317.6,115.4" fill="#0E1F40"/>
<text x="280" y="110" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">add water</text>
<text x="280" y="136" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">to 1 dm³</text>
<path d="M 374 66 L 382 154 Q 420 164 458 154 L 466 66 Z" fill="#FFFFFF" stroke="#0E1F40" stroke-width="1.5" stroke-linecap="round"/>
