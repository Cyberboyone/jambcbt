  <rect x="0" y="0" width="760" height="300" fill="#FFFFFF"/>
<text x="380" y="24" font-family="DejaVu Sans" font-size="12.2" fill="#0E1F40" text-anchor="middle" font-weight="bold">DILUTION KEEPS THE MOLES AND CHANGES THE CONCENTRATION</text>
<path d="M 104 66 L 112 154 Q 150 164 188 154 L 196 66 Z" fill="#FFFFFF" stroke="#0E1F40" stroke-width="1.5" stroke-linecap="round"/>
<path d="M 107 110 L 112 154 Q 150 164 188 154 L 193 110 Z" fill="#DCFCE7" stroke="none" stroke-width="0" stroke-linecap="round"/>
