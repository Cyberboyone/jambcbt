<text x="420" y="54" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="middle" font-weight="bold">0.010 M, 1 dm³</text>
<text x="420" y="182" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">0.010 mol dm⁻³</text>
<text x="420" y="196" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">1000 cm³ = 0.010 mol</text>
<rect x="510" y="56" width="220" height="158" rx="7" fill="#ECFDF5" stroke="#008751" stroke-width="1.2"/>
<text x="520" y="76" font-family="DejaVu Sans" font-size="8.8" fill="#008751" text-anchor="start" font-weight="bold">THE ONLY DILUTION FORMULA</text>
<text x="520" y="100" font-family="DejaVu Sans" font-size="14" fill="#0E1F40" text-anchor="start" font-weight="bold">c₁V₁ = c₂V₂</text>
<text x="520" y="124" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="start" font-weight="normal">Dilute 25.0 cm³ of 2.00 M to 250 cm³:</text>
<text x="520" y="138" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="start" font-weight="normal">c₂ = 2.00 × 25.0 ÷ 250 = 0.200 M.</text>
<text x="520" y="152" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="start" font-weight="normal"></text>
<text x="520" y="166" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="start" font-weight="normal">The moles never change: n = c₁V₁ = c₂V₂.</text>
</svg>
