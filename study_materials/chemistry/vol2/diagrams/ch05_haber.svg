    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(56.299325 25.498471)">High pressure and low temperature favour ammonia.</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(56.299325 35.998471)">But at a low temperature the reaction is too slow,</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(56.299325 46.498471)">so industry compromises at 450 °C and about 200 atm.</text>
