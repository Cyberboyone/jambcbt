<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="24" font-family="DejaVu Sans" font-size="12.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">HESS'S LAW AS A TRIANGLE: TWO ROUTES, ONE ANSWER</text>
<rect x="14" y="78" width="196" height="52" rx="7" fill="#FFFFFF" stroke="#0E1F40" stroke-width="1.3"/>
<text x="112" y="100" font-family="DejaVu Sans" font-size="9.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">C(s) + O₂(g)</text>
<text x="112" y="116" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">the elements</text>
<rect x="14" y="226" width="196" height="52" rx="7" fill="#FFFFFF" stroke="#0E1F40" stroke-width="1.3"/>
<text x="112" y="248" font-family="DejaVu Sans" font-size="9.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">CO(g) + ½O₂(g)</text>
<text x="112" y="264" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">after one step</text>
<rect x="502" y="226" width="196" height="52" rx="7" fill="#FFFFFF" stroke="#0E1F40" stroke-width="1.3"/>
<text x="600" y="248" font-family="DejaVu Sans" font-size="9.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">CO₂(g)</text>
<text x="600" y="264" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">the same product by either route</text>
<line x1="213" y1="110" x2="487.8016361993054" y2="240.67490392694242" stroke="#008751" stroke-width="2.0"/><polygon points="499.0,246.0 485.8,244.9 489.8,236.5" fill="#008751"/>
<text x="560" y="186" font-family="DejaVu Sans" font-size="8.2" fill="#008751" text-anchor="middle" font-weight="bold">route 1 · burn carbon directly</text>
<text x="560" y="200" font-family="DejaVu Sans" font-size="8.2" fill="#008751" text-anchor="middle" font-weight="normal">ΔH = −393 kJ mol⁻¹</text>
<line x1="112" y1="134" x2="112.0" y2="209.6" stroke="#2563EB" stroke-width="2.0"/><polygon points="112.0,222.0 107.4,209.6 116.6,209.6" fill="#2563EB"/>
<text x="30" y="172" font-family="DejaVu Sans" font-size="8.0" fill="#2563EB" text-anchor="start" font-weight="normal">route 2a</text>
<text x="30" y="186" font-family="DejaVu Sans" font-size="8.0" fill="#2563EB" text-anchor="start" font-weight="normal">ΔH = −110</text>
<line x1="213" y1="252" x2="486.6" y2="252.0" stroke="#2563EB" stroke-width="2.0"/><polygon points="499.0,252.0 486.6,256.6 486.6,247.4" fill="#2563EB"/>
<text x="356" y="276" font-family="DejaVu Sans" font-size="8.2" fill="#2563EB" text-anchor="middle" font-weight="normal">route 2b · CO → CO₂,  ΔH = −283 kJ mol⁻¹</text>
<rect x="452" y="40" width="278" height="100" rx="7" fill="#ECFDF5" stroke="#008751" stroke-width="1.1"/>
<text x="464" y="60" font-family="DejaVu Sans" font-size="8.8" fill="#008751" text-anchor="start" font-weight="bold">BY HESS'S LAW</text>
<text x="464" y="78" font-family="DejaVu Sans" font-size="7.9" fill="#334155" text-anchor="start" font-weight="normal">route 1 = route 2a + route 2b</text>
<text x="464" y="93" font-family="DejaVu Sans" font-size="7.9" fill="#334155" text-anchor="start" font-weight="normal">−393 = −110 + (−283)  ✓</text>
<text x="464" y="108" font-family="DejaVu Sans" font-size="7.9" fill="#334155" text-anchor="start" font-weight="normal">Enthalpy is a state function: the path does</text>
<text x="464" y="123" font-family="DejaVu Sans" font-size="7.9" fill="#334155" text-anchor="start" font-weight="normal">not matter, only where you start and end.</text>
</svg>
