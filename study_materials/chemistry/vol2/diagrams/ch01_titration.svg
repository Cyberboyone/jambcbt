<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="24" font-family="DejaVu Sans" font-size="12.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">THE TITRATION APPARATUS, AND WHERE THE ERROR HIDES</text>
<rect x="120" y="46" width="18" height="150" rx="3" fill="#FFFFFF" stroke="#0E1F40" stroke-width="1.4"/>
<rect x="122" y="80" width="14" height="114" rx="0" fill="#DBEAFE" stroke="#FFFFFF" stroke-width="0"/>
<line x1="120" y1="58" x2="125" y2="58" stroke="#CBD5E1" stroke-width="0.8"/>
<line x1="120" y1="74" x2="125" y2="74" stroke="#CBD5E1" stroke-width="0.8"/>
<line x1="120" y1="90" x2="125" y2="90" stroke="#CBD5E1" stroke-width="0.8"/>
<line x1="120" y1="106" x2="125" y2="106" stroke="#CBD5E1" stroke-width="0.8"/>
<line x1="120" y1="122" x2="125" y2="122" stroke="#CBD5E1" stroke-width="0.8"/>
<line x1="120" y1="138" x2="125" y2="138" stroke="#CBD5E1" stroke-width="0.8"/>
<line x1="120" y1="154" x2="125" y2="154" stroke="#CBD5E1" stroke-width="0.8"/>
<line x1="120" y1="170" x2="125" y2="170" stroke="#CBD5E1" stroke-width="0.8"/>
<line x1="120" y1="186" x2="125" y2="186" stroke="#CBD5E1" stroke-width="0.8"/>
<text x="112" y="64" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="end" font-weight="normal">0</text>
<text x="112" y="176" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="end" font-weight="normal">50</text>
<text x="108" y="50" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="end" font-weight="bold">burette</text>
<line x1="129.0" y1="46" x2="129.0" y2="30" stroke="#0E1F40" stroke-width="1.4"/>
<rect x="114" y="196" width="30" height="10" rx="3" fill="#FFFFFF" stroke="#0E1F40" stroke-width="1.2"/>
<line x1="129.0" y1="206" x2="129.0" y2="222" stroke="#0E1F40" stroke-width="1.4"/>
<circle cx="129.0" cy="226" r="2.4" fill="#2563EB"/>
<text x="154" y="222" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="start" font-weight="normal">tap</text>
<polygon points="117.0,206 141.0,206 175.0,292 83.0,292" fill="#FFFFFF" stroke="#0E1F40" stroke-width="1.4"/>
<polygon points="89.0,276 169.0,276 175.0,292 83.0,292" fill="#FCE7D6" stroke="none" stroke-width="0"/>
<text x="189.0" y="246" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="bold">conical flask</text>
<text x="189.0" y="260" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="start" font-weight="normal">25.0 cm³ of acid</text>
<text x="189.0" y="272" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="start" font-weight="normal">+ 2 drops of indicator</text>
<rect x="73.0" y="294" width="112" height="8" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.0"/>
<text x="129.0" y="316" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="middle" font-weight="normal">white tile — the colour change is easier to see</text>
<rect x="400" y="60" width="330" height="116" rx="7" fill="#ECFDF5" stroke="#008751" stroke-width="1.2"/>
<text x="414" y="82" font-family="DejaVu Sans" font-size="9.4" fill="#008751" text-anchor="start" font-weight="bold">READING THE BURETTE</text>
<text x="414" y="100" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">• Read at eye level, to the bottom of the meniscus.</text>
<text x="414" y="114" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">• Record the initial and the final reading, and subtract.</text>
<text x="414" y="128" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">• Two concordant titres within 0.10 cm³ are required.</text>
<text x="414" y="142" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">• Rinse the burette with the solution it will hold,</text>
<text x="414" y="156" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">   and the pipette with the solution it will deliver.</text>
<rect x="400" y="190" width="330" height="108" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.0"/>
<text x="414" y="210" font-family="DejaVu Sans" font-size="9.0" fill="#0E1F40" text-anchor="start" font-weight="bold">WHY THE MENISCUS IS READ AT THE BOTTOM</text>
<text x="414" y="228" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">Water wets glass and curves downwards, so the</text>
<text x="414" y="241" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">lowest point is the true volume. A reading taken at</text>
<text x="414" y="254" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">the top of the curve is always too high — and a</text>
<text x="414" y="267" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">0.5 cm³ error in 25 cm³ is a 2 % error in the answer.</text>
</svg>
