<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 248" width="760" height="248">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="248" fill="#FFFFFF"/>
<text x="380" y="22" font-family="DejaVu Sans" font-size="12.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">E-commerce: four models, one office, one set of risks</text>
<rect x="10" y="40" width="176" height="70" rx="8" fill="#FFFFFF" stroke="#008751" stroke-width="1.5"/>
<rect x="10" y="40" width="176" height="5" rx="2.5" fill="#008751"/>
<text x="98.0" y="64" font-family="DejaVu Sans" font-size="11.0" fill="#008751" text-anchor="middle" font-weight="bold">B2C</text>
<text x="98.0" y="82" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="middle" font-weight="normal">business to consumer</text>
<text x="98.0" y="100" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">a shop that is a website</text>
<rect x="192" y="40" width="176" height="70" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<rect x="192" y="40" width="176" height="5" rx="2.5" fill="#2563EB"/>
<text x="280.0" y="64" font-family="DejaVu Sans" font-size="11.0" fill="#2563EB" text-anchor="middle" font-weight="bold">B2B</text>
<text x="280.0" y="82" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="middle" font-weight="normal">business to business</text>
<text x="280.0" y="100" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">suppliers and buyers, on-line</text>
<rect x="374" y="40" width="176" height="70" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
<rect x="374" y="40" width="176" height="5" rx="2.5" fill="#7C3AED"/>
<text x="462.0" y="64" font-family="DejaVu Sans" font-size="11.0" fill="#7C3AED" text-anchor="middle" font-weight="bold">C2C</text>
<text x="462.0" y="82" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="middle" font-weight="normal">consumer to consumer</text>
<text x="462.0" y="100" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">a marketplace between traders</text>
<rect x="556" y="40" width="176" height="70" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
<rect x="556" y="40" width="176" height="5" rx="2.5" fill="#D97706"/>
<text x="644.0" y="64" font-family="DejaVu Sans" font-size="11.0" fill="#D97706" text-anchor="middle" font-weight="bold">C2B</text>
<text x="644.0" y="82" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="middle" font-weight="normal">consumer to business</text>
<text x="644.0" y="100" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">a buyer names the price</text>
<rect x="10" y="124" width="366" height="88" rx="8" fill="#FFFFFF" stroke="#008751" stroke-width="1.2"/>
<text x="193" y="146" font-family="DejaVu Sans" font-size="9.2" fill="#008751" text-anchor="middle" font-weight="bold">WHAT E-COMMERCE GIVES</text>
<text x="24" y="168" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">•  a market with no closing time</text>
<text x="24" y="180" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">•  lower rent, wider reach</text>
<text x="24" y="192" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">•  a record of every order</text>
<text x="24" y="204" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">•  payment without cash</text>
<rect x="384" y="124" width="366" height="88" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.2"/>
<text x="567" y="146" font-family="DejaVu Sans" font-size="9.2" fill="#DC2626" text-anchor="middle" font-weight="bold">WHAT IT COSTS</text>
<text x="398" y="168" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">•  fraud and card crime</text>
<text x="398" y="180" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">•  delivery and returns</text>
<text x="398" y="192" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">•  the buyer who cannot touch the good</text>
<text x="398" y="204" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">•  data and privacy</text>
<text x="380" y="234" font-family="DejaVu Sans" font-size="8.8" fill="#64748B" text-anchor="middle" font-weight="normal">An entrepreneur spots the gap, takes the risk, and organises the factors of production to fill it. The office is where the record of that risk is kept.</text>
</svg>
