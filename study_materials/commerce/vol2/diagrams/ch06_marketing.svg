  <rect x="0" y="0" width="760" height="266" fill="#FFFFFF"/>
<text x="380" y="22" font-family="DejaVu Sans" font-size="12.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">The marketing mix, and the research behind it</text>
<rect x="10" y="40" width="176" height="62" rx="8" fill="#FFFFFF" stroke="#008751" stroke-width="1.5"/>
<rect x="10" y="40" width="176" height="5" rx="2.5" fill="#008751"/>
<text x="98.0" y="66" font-family="DejaVu Sans" font-size="10.2" fill="#008751" text-anchor="middle" font-weight="bold">PRODUCT</text>
<text x="98.0" y="88" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">the good, its quality, brand and pack</text>
<rect x="192" y="40" width="176" height="62" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<rect x="192" y="40" width="176" height="5" rx="2.5" fill="#2563EB"/>
<text x="280.0" y="66" font-family="DejaVu Sans" font-size="10.2" fill="#2563EB" text-anchor="middle" font-weight="bold">PRICE</text>
<text x="280.0" y="88" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">what the market will pay, and the margin</text>
<rect x="374" y="40" width="176" height="62" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
<rect x="374" y="40" width="176" height="5" rx="2.5" fill="#7C3AED"/>
<text x="462.0" y="66" font-family="DejaVu Sans" font-size="10.2" fill="#7C3AED" text-anchor="middle" font-weight="bold">PLACE</text>
<text x="462.0" y="88" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">the channel from factory to buyer</text>
<rect x="556" y="40" width="176" height="62" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
<rect x="556" y="40" width="176" height="5" rx="2.5" fill="#D97706"/>
<text x="644.0" y="66" font-family="DejaVu Sans" font-size="10.2" fill="#D97706" text-anchor="middle" font-weight="bold">PROMOTION</text>
<text x="644.0" y="88" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">advertising, selling and the offer</text>
<rect x="10" y="116" width="742" height="96" rx="8" fill="#FFFFFF" stroke="#0E1F40" stroke-width="1.2"/>
<text x="380" y="138" font-family="DejaVu Sans" font-size="9.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">MARKET RESEARCH: FIVE STEPS THAT ANSWER THE FOUR Ps</text>
<rect x="18" y="150" width="134" height="46" rx="6" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.0"/>
<text x="85" y="168" font-family="DejaVu Sans" font-size="7.6" fill="#008751" text-anchor="middle" font-weight="bold">step 1</text>
<text x="85" y="186" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">define the problem</text>
<rect x="164" y="150" width="134" height="46" rx="6" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.0"/>
<text x="231" y="168" font-family="DejaVu Sans" font-size="7.6" fill="#008751" text-anchor="middle" font-weight="bold">step 2</text>
<text x="231" y="186" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">collect the data</text>
<rect x="310" y="150" width="134" height="46" rx="6" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.0"/>
<text x="377" y="168" font-family="DejaVu Sans" font-size="7.6" fill="#008751" text-anchor="middle" font-weight="bold">step 3</text>
<text x="377" y="186" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">sort and tabulate</text>
<rect x="456" y="150" width="134" height="46" rx="6" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.0"/>
<text x="523" y="168" font-family="DejaVu Sans" font-size="7.6" fill="#008751" text-anchor="middle" font-weight="bold">step 4</text>
<text x="523" y="186" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">analyse and interpret</text>
<rect x="602" y="150" width="134" height="46" rx="6" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.0"/>
<text x="669" y="168" font-family="DejaVu Sans" font-size="7.6" fill="#008751" text-anchor="middle" font-weight="bold">step 5</text>
<text x="669" y="186" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">decide and act</text>
<text x="380" y="238" font-family="DejaVu Sans" font-size="8.8" fill="#64748B" text-anchor="middle" font-weight="normal">Primary data is collected for this problem; secondary data already exists and was gathered for another.</text>
<text x="380" y="252" font-family="DejaVu Sans" font-size="8.8" fill="#64748B" text-anchor="middle" font-weight="normal">A questionnaire is a primary instrument; a published report is a secondary source.</text>
