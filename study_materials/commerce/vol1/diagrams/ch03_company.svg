<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" width="760" height="268">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="268" fill="#FFFFFF"/>
<text x="380" y="22" font-family="DejaVu Sans" font-size="12.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">From promoter to certificate</text>
<rect x="10" y="42" width="140" height="86" rx="8" fill="#FFFFFF" stroke="#008751" stroke-width="1.5"/>
<rect x="10" y="42" width="140" height="5" rx="2.5" fill="#008751"/>
<text x="80.0" y="66" font-family="DejaVu Sans" font-size="9.2" fill="#008751" text-anchor="middle" font-weight="bold">1  PROMOTION</text>
<text x="80.0" y="86" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">the promoter finds the idea,</text>
<text x="80.0" y="99" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">the capital and the people</text>
<line x1="151" y1="85" x2="157" y2="85" stroke="#64748B" stroke-width="1.3" marker-end="url(#ag)"/>
<rect x="158" y="42" width="140" height="86" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<rect x="158" y="42" width="140" height="5" rx="2.5" fill="#2563EB"/>
<text x="228.0" y="66" font-family="DejaVu Sans" font-size="9.2" fill="#2563EB" text-anchor="middle" font-weight="bold">2  INCORPORATION</text>
<text x="228.0" y="86" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">documents filed with the</text>
<text x="228.0" y="99" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">Corporate Affairs Commission</text>
<line x1="299" y1="85" x2="305" y2="85" stroke="#64748B" stroke-width="1.3" marker-end="url(#ag)"/>
<rect x="306" y="42" width="140" height="86" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
<rect x="306" y="42" width="140" height="5" rx="2.5" fill="#7C3AED"/>
<text x="376.0" y="66" font-family="DejaVu Sans" font-size="9.2" fill="#7C3AED" text-anchor="middle" font-weight="bold">3  MEMORANDUM</text>
<text x="376.0" y="86" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">the company's relationship</text>
<text x="376.0" y="99" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">with the outside world</text>
<line x1="447" y1="85" x2="453" y2="85" stroke="#64748B" stroke-width="1.3" marker-end="url(#ag)"/>
<rect x="454" y="42" width="140" height="86" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
<rect x="454" y="42" width="140" height="5" rx="2.5" fill="#D97706"/>
<text x="524.0" y="66" font-family="DejaVu Sans" font-size="9.2" fill="#D97706" text-anchor="middle" font-weight="bold">4  ARTICLES</text>
<text x="524.0" y="86" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">the rules by which the</text>
<text x="524.0" y="99" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">company is run inside</text>
<line x1="595" y1="85" x2="601" y2="85" stroke="#64748B" stroke-width="1.3" marker-end="url(#ag)"/>
<rect x="602" y="42" width="140" height="86" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
<rect x="602" y="42" width="140" height="5" rx="2.5" fill="#DC2626"/>
<text x="672.0" y="66" font-family="DejaVu Sans" font-size="9.2" fill="#DC2626" text-anchor="middle" font-weight="bold">5  CERTIFICATE</text>
<text x="672.0" y="86" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">the company becomes a</text>
<text x="672.0" y="99" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">legal person</text>
<rect x="10" y="146" width="366" height="92" rx="8" fill="#FFFFFF" stroke="#008751" stroke-width="1.4"/>
<rect x="10" y="146" width="366" height="5" rx="2.5" fill="#008751"/>
<text x="193" y="170" font-family="DejaVu Sans" font-size="10.2" fill="#008751" text-anchor="middle" font-weight="bold">PRIVATE LIMITED (Ltd)</text>
<text x="193" y="192" font-family="DejaVu Sans" font-size="9.0" fill="#0E1F40" text-anchor="middle" font-weight="normal">2–50 members · shares not offered to the public</text>
<text x="193" y="210" font-family="DejaVu Sans" font-size="9.0" fill="#0E1F40" text-anchor="middle" font-weight="normal">transfer restricted · no prospectus</text>
<text x="193" y="228" font-family="DejaVu Sans" font-size="9.0" fill="#0E1F40" text-anchor="middle" font-weight="normal">'Ltd' after the name</text>
<rect x="384" y="146" width="366" height="92" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
<rect x="384" y="146" width="366" height="5" rx="2.5" fill="#2563EB"/>
<text x="567" y="170" font-family="DejaVu Sans" font-size="10.2" fill="#2563EB" text-anchor="middle" font-weight="bold">PUBLIC LIMITED (Plc)</text>
<text x="567" y="192" font-family="DejaVu Sans" font-size="9.0" fill="#0E1F40" text-anchor="middle" font-weight="normal">minimum 2, no maximum · shares sold to the public</text>
<text x="567" y="210" font-family="DejaVu Sans" font-size="9.0" fill="#0E1F40" text-anchor="middle" font-weight="normal">prospectus required · shares freely transferable</text>
<text x="567" y="228" font-family="DejaVu Sans" font-size="9.0" fill="#0E1F40" text-anchor="middle" font-weight="normal">'Plc' after the name · quoted on the exchange</text>
<text x="380" y="254" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">Both are separate legal persons: the company owns, owes and can be sued in its own name, and the members' liability stops at their shares.</text>
</svg>
