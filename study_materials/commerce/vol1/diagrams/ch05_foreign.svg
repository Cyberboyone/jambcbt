<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 272" width="760" height="272">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="272" fill="#FFFFFF"/>
<text x="380" y="22" font-family="DejaVu Sans" font-size="12.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">Foreign trade, and the two balances</text>
<rect x="10" y="40" width="366" height="74" rx="8" fill="#FFFFFF" stroke="#008751" stroke-width="1.4"/>
<rect x="10" y="40" width="366" height="5" rx="2.5" fill="#008751"/>
<text x="193" y="64" font-family="DejaVu Sans" font-size="10.2" fill="#008751" text-anchor="middle" font-weight="bold">VISIBLE TRADE</text>
<text x="193" y="84" font-family="DejaVu Sans" font-size="9.0" fill="#0E1F40" text-anchor="middle" font-weight="normal">goods you can see and touch: cocoa, oil, machines</text>
<text x="193" y="102" font-family="DejaVu Sans" font-size="9.0" fill="#0E1F40" text-anchor="middle" font-weight="normal">recorded in the balance of trade</text>
<rect x="384" y="40" width="366" height="74" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
<rect x="384" y="40" width="366" height="5" rx="2.5" fill="#2563EB"/>
<text x="567" y="64" font-family="DejaVu Sans" font-size="10.2" fill="#2563EB" text-anchor="middle" font-weight="bold">INVISIBLE TRADE</text>
<text x="567" y="84" font-family="DejaVu Sans" font-size="9.0" fill="#0E1F40" text-anchor="middle" font-weight="normal">services: shipping, insurance, tourism, remittances</text>
<text x="567" y="102" font-family="DejaVu Sans" font-size="9.0" fill="#0E1F40" text-anchor="middle" font-weight="normal">recorded in the balance of payments</text>
<rect x="10" y="128" width="742" height="108" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
<rect x="10" y="128" width="742" height="5" rx="2.5" fill="#7C3AED"/>
<text x="380" y="152" font-family="DejaVu Sans" font-size="9.8" fill="#7C3AED" text-anchor="middle" font-weight="bold">BALANCE OF PAYMENTS = CURRENT ACCOUNT + CAPITAL ACCOUNT + FINANCIAL ACCOUNT</text>
<text x="380" y="176" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="middle" font-weight="normal">Current account: visible trade + invisible trade + transfers</text>
<text x="380" y="196" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="middle" font-weight="normal">Capital account: capital transfers and the acquisition of non-produced assets</text>
<text x="380" y="216" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="middle" font-weight="normal">Financial account: direct investment, portfolio investment, reserves</text>
<text x="380" y="258" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">Balance of trade = visible exports − visible imports. Balance of payments = every credit minus every debit, and it must, in the end, balance.</text>
</svg>
