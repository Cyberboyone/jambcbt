<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" width="760" height="236">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="236" fill="#FFFFFF"/>
<text x="380" y="22" font-family="DejaVu Sans" font-size="12.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">The aids to trade: six problems, six services</text>
<rect x="8" y="40" width="244" height="78" rx="8" fill="#FFFFFF" stroke="#008751" stroke-width="1.4"/>
<rect x="8" y="40" width="244" height="5" rx="2.5" fill="#008751"/>
<text x="130.0" y="66" font-family="DejaVu Sans" font-size="10.0" fill="#008751" text-anchor="middle" font-weight="bold">BANKING</text>
<text x="130.0" y="86" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">the gap between paying</text>
<text x="130.0" y="99" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">and being paid</text>
<rect x="258" y="40" width="244" height="78" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
<rect x="258" y="40" width="244" height="5" rx="2.5" fill="#2563EB"/>
<text x="380.0" y="66" font-family="DejaVu Sans" font-size="10.0" fill="#2563EB" text-anchor="middle" font-weight="bold">INSURANCE</text>
<text x="380.0" y="86" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">the risk of loss in</text>
<text x="380.0" y="99" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">transit or at sea</text>
<rect x="508" y="40" width="244" height="78" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
<rect x="508" y="40" width="244" height="5" rx="2.5" fill="#7C3AED"/>
<text x="630.0" y="66" font-family="DejaVu Sans" font-size="10.0" fill="#7C3AED" text-anchor="middle" font-weight="bold">TRANSPORT</text>
<text x="630.0" y="86" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">the distance between</text>
<text x="630.0" y="99" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">maker and market</text>
<rect x="8" y="126" width="244" height="78" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/>
<rect x="8" y="126" width="244" height="5" rx="2.5" fill="#D97706"/>
<text x="130.0" y="152" font-family="DejaVu Sans" font-size="10.0" fill="#D97706" text-anchor="middle" font-weight="bold">WAREHOUSING</text>
<text x="130.0" y="172" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">the gap between harvest</text>
<text x="130.0" y="185" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">and demand</text>
<rect x="258" y="126" width="244" height="78" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.4"/>
<rect x="258" y="126" width="244" height="5" rx="2.5" fill="#DC2626"/>
<text x="380.0" y="152" font-family="DejaVu Sans" font-size="10.0" fill="#DC2626" text-anchor="middle" font-weight="bold">ADVERTISING</text>
<text x="380.0" y="172" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">the buyer does not</text>
<text x="380.0" y="185" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">know the goods exist</text>
<rect x="508" y="126" width="244" height="78" rx="8" fill="#FFFFFF" stroke="#00A859" stroke-width="1.4"/>
<rect x="508" y="126" width="244" height="5" rx="2.5" fill="#00A859"/>
<text x="630.0" y="152" font-family="DejaVu Sans" font-size="10.0" fill="#00A859" text-anchor="middle" font-weight="bold">COMMUNICATION</text>
<text x="630.0" y="172" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">the parties cannot</text>
<text x="630.0" y="185" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">agree in person</text>
<text x="380" y="224" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">Each aid exists because trade would otherwise stop at that point. If you can name the problem, you can name the aid.</text>
</svg>
