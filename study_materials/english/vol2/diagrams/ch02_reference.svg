<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 247" width="760" height="247">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="247" fill="#FFFFFF"/>
<text x="380.0" y="26" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">Four pronouns, and where each one points</text>
<text x="380.0" y="40" font-family="DejaVu Sans" font-size="9.4" fill="#64748B" text-anchor="middle" font-weight="normal">“The council rejected the plan, which surprised the residents who had proposed it.” — *it* is the plan; *which* is the whole clause; *who* is the residents.</text>
<rect x="220.0" y="61" width="320" height="34" rx="7" fill="#ECFDF5" stroke="#008751" stroke-width="1.5"/>
<text x="380.0" y="83" font-family="DejaVu Sans" font-size="11.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">it</text>
<line x1="380.0" y1="95" x2="380.0" y2="109" stroke="#008751" stroke-width="1.6"/>
<line x1="107.0" y1="109" x2="653.0" y2="109" stroke="#008751" stroke-width="1.6"/>
<line x1="107.0" y1="109" x2="107.0" y2="119" stroke="#008751" stroke-width="1.6"/>
<rect x="21.0" y="119" width="172.0" height="88.048" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<text x="107.0" y="139" font-family="DejaVu Sans" font-size="9.8" fill="#0E1F40" text-anchor="middle" font-weight="bold">it / its</text>
<text x="107.0" y="155.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">a singular thing named in the</text>
<text x="107.0" y="167.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">same or the previous sentence</text>
<text x="107.0" y="180.024" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">— the nearest noun that agrees</text>
<text x="107.0" y="192.536" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">in number</text>
<line x1="289.0" y1="109" x2="289.0" y2="119" stroke="#008751" stroke-width="1.6"/>
<rect x="203.0" y="119" width="172.0" height="88.048" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<text x="289.0" y="139" font-family="DejaVu Sans" font-size="9.8" fill="#0E1F40" text-anchor="middle" font-weight="bold">they / them / their</text>
<text x="289.0" y="155.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">a plural noun, often two</text>
<text x="289.0" y="167.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">sentences back, and usually the</text>
<text x="289.0" y="180.024" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">subject of the previous clause</text>
<line x1="471.0" y1="109" x2="471.0" y2="119" stroke="#008751" stroke-width="1.6"/>
<rect x="385.0" y="119" width="172.0" height="88.048" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<text x="471.0" y="139" font-family="DejaVu Sans" font-size="9.8" fill="#0E1F40" text-anchor="middle" font-weight="bold">this / these</text>
<text x="471.0" y="155.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">the whole clause or sentence</text>
<text x="471.0" y="167.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">just finished, not one word in it</text>
<line x1="653.0" y1="109" x2="653.0" y2="119" stroke="#008751" stroke-width="1.6"/>
<rect x="567.0" y="119" width="172.0" height="88.048" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<text x="653.0" y="139" font-family="DejaVu Sans" font-size="9.8" fill="#0E1F40" text-anchor="middle" font-weight="bold">which / that</text>
<text x="653.0" y="155.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">the noun immediately before the</text>
<text x="653.0" y="167.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">comma, or the whole clause</text>
<text x="653.0" y="180.024" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">when the comma is there</text>
<text x="380.0" y="224.048" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">Test the reference by putting it back: if the sentence still makes sense with the noun substituted, the reference is right.</text>
<rect x="12" y="10" width="736" height="234.648" rx="9" fill="none" stroke="#008751" stroke-width="1.4"/>
</svg>
