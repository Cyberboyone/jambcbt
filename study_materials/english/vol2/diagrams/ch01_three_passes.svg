  <rect x="0" y="0" width="760" height="211" fill="#FFFFFF"/>
<text x="380.0" y="26" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">Pass one, pass two, pass three — and what each one is for</text>
<rect x="12" y="38" width="736" height="24" rx="5" fill="#0E1F40" stroke="#0E1F40" stroke-width="0"/>
<text x="20" y="54" font-family="DejaVu Sans" font-size="9.0" fill="#FFFFFF" text-anchor="start" font-weight="bold">Pass</text>
<text x="128.44444444444446" y="54" font-family="DejaVu Sans" font-size="9.0" fill="#FFFFFF" text-anchor="start" font-weight="bold">What you read</text>
<text x="386.0" y="54" font-family="DejaVu Sans" font-size="9.0" fill="#FFFFFF" text-anchor="start" font-weight="bold">Time</text>
<text x="453.77777777777777" y="54" font-family="DejaVu Sans" font-size="9.0" fill="#FFFFFF" text-anchor="start" font-weight="bold">What you get out of it</text>
<text x="20" y="76.0" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">Preview</text>
<text x="128.44444444444446" y="76.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">the four questions and their options</text>
<text x="386.0" y="76.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">40 s</text>
<text x="453.77777777777777" y="76.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">the four things to look for as you read</text>
<line x1="12" y1="86.328" x2="748" y2="86.328" stroke="#CBD5E1" stroke-width="0.6"/>
<rect x="12" y="86.328" width="736" height="36.656" rx="0" fill="#F8FAFC" stroke="none" stroke-width="0"/>
<text x="20" y="100.328" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">Skim</text>
<text x="128.44444444444446" y="100.328" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">the first and last sentence of every paragraph</text>
<text x="386.0" y="100.328" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">90 s</text>
<text x="453.77777777777777" y="100.328" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">the shape of the argument and the paragraph that answers</text>
<text x="453.77777777777777" y="112.656" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">each question</text>
<line x1="12" y1="122.98400000000001" x2="748" y2="122.98400000000001" stroke="#CBD5E1" stroke-width="0.6"/>
<text x="20" y="136.984" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">Scan</text>
<text x="128.44444444444446" y="136.984" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">the one sentence each question points at</text>
<text x="386.0" y="136.984" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">3 min</text>
<text x="453.77777777777777" y="136.984" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">the answer, with the sentence still in front of you</text>
<line x1="12" y1="147.312" x2="748" y2="147.312" stroke="#CBD5E1" stroke-width="0.6"/>
<rect x="12" y="147.312" width="736" height="24.328" rx="0" fill="#F8FAFC" stroke="none" stroke-width="0"/>
<text x="20" y="161.312" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">Check</text>
<text x="128.44444444444446" y="161.312" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">your four choices against the passage</text>
<text x="386.0" y="161.312" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">40 s</text>
<text x="453.77777777777777" y="161.312" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">the confidence to leave them alone</text>
<line x1="12" y1="171.64000000000001" x2="748" y2="171.64000000000001" stroke="#CBD5E1" stroke-width="0.6"/>
<text x="380.0" y="188.64000000000001" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">Nothing in the method asks you to remember the passage. It asks you to find the four sentences and read them twice.</text>
<rect x="12" y="10" width="736" height="197.24" rx="9" fill="none" stroke="#008751" stroke-width="1.4"/>
</svg>
