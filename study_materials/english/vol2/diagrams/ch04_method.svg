  <rect x="0" y="0" width="760" height="157" fill="#FFFFFF"/>
<text x="380.0" y="26" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">The five moves of a summary answer</text>
<rect x="12.0" y="40" width="126.4" height="77.536" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="12.0" y="40" width="126.4" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="75.2" y="62" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">READ</text>
<text x="75.2" y="78.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">the instruction twice —</text>
<text x="75.2" y="90.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">it fixes the length and</text>
<text x="75.2" y="103.024" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">the number of points</text>
<line x1="142.4" y1="78.768" x2="150.32500000000002" y2="78.768" stroke="#008751" stroke-width="1.6"/><polygon points="160.4,78.8 150.3,82.5 150.3,75.0" fill="#008751"/>
<rect x="164.4" y="40" width="126.4" height="77.536" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="164.4" y="40" width="126.4" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="227.60000000000002" y="62" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">FIND</text>
<text x="227.60000000000002" y="78.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">the topic sentence of</text>
<text x="227.60000000000002" y="90.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">every paragraph;</text>
<text x="227.60000000000002" y="103.024" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">number them</text>
<line x1="294.8" y1="78.768" x2="302.725" y2="78.768" stroke="#008751" stroke-width="1.6"/><polygon points="312.8,78.8 302.7,82.5 302.7,75.0" fill="#008751"/>
<rect x="316.8" y="40" width="126.4" height="77.536" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="316.8" y="40" width="126.4" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="380.0" y="62" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">STRIP</text>
<text x="380.0" y="78.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">the examples, figures</text>
<text x="380.0" y="90.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">and quotations from</text>
<text x="380.0" y="103.024" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">each one</text>
<line x1="447.20000000000005" y1="78.768" x2="455.12500000000006" y2="78.768" stroke="#008751" stroke-width="1.6"/><polygon points="465.2,78.8 455.1,82.5 455.1,75.0" fill="#008751"/>
<rect x="469.20000000000005" y="40" width="126.4" height="77.536" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="469.20000000000005" y="40" width="126.4" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="532.4000000000001" y="62" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">JOIN</text>
<text x="532.4000000000001" y="78.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">the points with *and*,</text>
<text x="532.4000000000001" y="90.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">*but*, *because* or *so</text>
<text x="532.4000000000001" y="103.024" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">that*</text>
<line x1="599.6" y1="78.768" x2="607.525" y2="78.768" stroke="#008751" stroke-width="1.6"/><polygon points="617.6,78.8 607.5,82.5 607.5,75.0" fill="#008751"/>
<rect x="621.6" y="40" width="126.4" height="77.536" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="621.6" y="40" width="126.4" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="684.8000000000001" y="62" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">COUNT</text>
<text x="684.8000000000001" y="78.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">the words, and cut</text>
<text x="684.8000000000001" y="90.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">until the limit is met</text>
<text x="380.0" y="134.536" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">The instruction is the marking scheme. *In one sentence* means one finite verb; *in not more than twenty words* means twenty words and no more.</text>
<rect x="12" y="10" width="736" height="145.136" rx="9" fill="none" stroke="#008751" stroke-width="1.4"/>
</svg>
