<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 228" width="760" height="228">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="228" fill="#FFFFFF"/>
<text x="380.0" y="26" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">What a summary is, in four rules</text>
<rect x="12.0" y="38.0" width="364.0" height="71.024" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="12.0" y="38.0" width="364.0" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="22.0" y="59.0" font-family="DejaVu Sans" font-size="9.8" fill="#0E1F40" text-anchor="start" font-weight="bold">Shorter</text>
<text x="22.0" y="75.4" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">It is a fraction of the original — the exam instruction usually says *in one</text>
<text x="22.0" y="87.912" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">sentence* or *in not more than twenty words*.</text>
<rect x="384.0" y="38.0" width="364.0" height="71.024" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="384.0" y="38.0" width="364.0" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="394.0" y="59.0" font-family="DejaVu Sans" font-size="9.8" fill="#0E1F40" text-anchor="start" font-weight="bold">The same meaning</text>
<text x="394.0" y="75.4" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">It says what the passage says, not what you think about it. No opinion is</text>
<text x="394.0" y="87.912" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">ever required.</text>
<rect x="12.0" y="117.024" width="364.0" height="71.024" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="12.0" y="117.024" width="364.0" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="22.0" y="138.024" font-family="DejaVu Sans" font-size="9.8" fill="#0E1F40" text-anchor="start" font-weight="bold">In your words</text>
<text x="22.0" y="154.424" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">Lifting whole sentences loses marks; the words must be yours, the sense</text>
<text x="22.0" y="166.936" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">must be the writer's.</text>
<rect x="384.0" y="117.024" width="364.0" height="71.024" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="384.0" y="117.024" width="364.0" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="394.0" y="138.024" font-family="DejaVu Sans" font-size="9.8" fill="#0E1F40" text-anchor="start" font-weight="bold">Only the main points</text>
<text x="394.0" y="154.424" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">Examples, figures, names and repetition are paid for in words and earn</text>
<text x="394.0" y="166.936" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">nothing.</text>
<text x="380.0" y="205.048" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">A summary question is marked against a list of points. Find the list in the passage, write it in your own words, and count your words before you stop.</text>
<rect x="12" y="10" width="736" height="213.648" rx="9" fill="none" stroke="#008751" stroke-width="1.4"/>
</svg>
