<text x="106.84745762711863" y="343.60799999999995" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">about</text>
<text x="243.32203389830505" y="343.60799999999995" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">any unstressed vowel</text>
<text x="429.42372881355925" y="343.60799999999995" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">every other vowel — it is the weakest of the twelve</text>
<line x1="12" y1="353.9359999999999" x2="748" y2="353.9359999999999" stroke="#CBD5E1" stroke-width="0.6"/>
<text x="380.0" y="370.9359999999999" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">The paper asks which word contains the same vowel sound, so the symbol matters less than the pair. Learn the pairs: seat / sit, bad / bed, book / food, hot /</text>
<text x="380.0" y="383.53599999999994" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">saw.</text>
