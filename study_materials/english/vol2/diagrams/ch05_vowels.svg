<text x="106.84745762711863" y="270.624" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">food</text>
<text x="243.32203389830505" y="270.624" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">oo, ue, ew</text>
<text x="429.42372881355925" y="270.624" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">/ʊ/ book</text>
