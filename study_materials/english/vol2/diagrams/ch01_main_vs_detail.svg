<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 248" width="760" height="248">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="248" fill="#FFFFFF"/>
<text x="380.0" y="26" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">Main-idea questions and detail questions do not want the same thing</text>
<rect x="12" y="38" width="736" height="24" rx="5" fill="#0E1F40" stroke="#0E1F40" stroke-width="0"/>
<text x="20" y="54" font-family="DejaVu Sans" font-size="9.0" fill="#FFFFFF" text-anchor="start" font-weight="bold">The question sounds like</text>
<text x="248.75" y="54" font-family="DejaVu Sans" font-size="9.0" fill="#FFFFFF" text-anchor="start" font-weight="bold">It is really asking for</text>
<text x="500.375" y="54" font-family="DejaVu Sans" font-size="9.0" fill="#FFFFFF" text-anchor="start" font-weight="bold">Where the answer sits</text>
<text x="20" y="76.0" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">“What is the passage mainly about?”</text>
<text x="248.75" y="76.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">the claim the whole passage supports</text>
<text x="500.375" y="76.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">the first or last paragraph, in one sentence</text>
<line x1="12" y1="86.328" x2="748" y2="86.328" stroke="#CBD5E1" stroke-width="0.6"/>
<rect x="12" y="86.328" width="736" height="36.656" rx="0" fill="#F8FAFC" stroke="none" stroke-width="0"/>
<text x="20" y="100.328" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">“The writer's purpose is to…”</text>
<text x="248.75" y="100.328" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">the verb behind the passage: persuade, warn,</text>
<text x="248.75" y="112.656" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">describe, compare</text>
<text x="500.375" y="100.328" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">the opening paragraph and the closing sentence</text>
<line x1="12" y1="122.98400000000001" x2="748" y2="122.98400000000001" stroke="#CBD5E1" stroke-width="0.6"/>
<text x="20" y="136.984" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">“According to the passage, …”</text>
<text x="248.75" y="136.984" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">one stated fact</text>
<text x="500.375" y="136.984" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">one sentence, found by its key word</text>
<line x1="12" y1="147.312" x2="748" y2="147.312" stroke="#CBD5E1" stroke-width="0.6"/>
<rect x="12" y="147.312" width="736" height="24.328" rx="0" fill="#F8FAFC" stroke="none" stroke-width="0"/>
<text x="20" y="161.312" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">“Which of these is NOT…”</text>
<text x="248.75" y="161.312" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">three stated facts and one that is absent</text>
<text x="500.375" y="161.312" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">three separate sentences, and one silence</text>
<line x1="12" y1="171.64000000000001" x2="748" y2="171.64000000000001" stroke="#CBD5E1" stroke-width="0.6"/>
<text x="20" y="185.64000000000001" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">“The word *X* as used in line 12 means…”</text>
<text x="248.75" y="185.64000000000001" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">the sense the sentence forces on the word</text>
<text x="500.375" y="185.64000000000001" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">the sentence around line 12</text>
<line x1="12" y1="195.96800000000002" x2="748" y2="195.96800000000002" stroke="#CBD5E1" stroke-width="0.6"/>
<text x="380.0" y="212.96800000000002" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">A main-idea answer is never a detail, however true the detail is. That is the commonest wrong option on the paper: a sentence from the passage that answers a</text>
<text x="380.0" y="225.568" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">different question.</text>
<rect x="12" y="10" width="736" height="234.168" rx="9" fill="none" stroke="#008751" stroke-width="1.4"/>
</svg>
