<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 272" width="760" height="272">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="272" fill="#FFFFFF"/>
<text x="380.0" y="26" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">Figures of speech, and what an exam question does with them</text>
<rect x="12" y="38" width="736" height="24" rx="5" fill="#0E1F40" stroke="#0E1F40" stroke-width="0"/>
<text x="20" y="54" font-family="DejaVu Sans" font-size="9.0" fill="#FFFFFF" text-anchor="start" font-weight="bold">Figure</text>
<text x="166.4" y="54" font-family="DejaVu Sans" font-size="9.0" fill="#FFFFFF" text-anchor="start" font-weight="bold">What it does</text>
<text x="485.81818181818176" y="54" font-family="DejaVu Sans" font-size="9.0" fill="#FFFFFF" text-anchor="start" font-weight="bold">What the question asks</text>
<text x="20" y="76.0" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">Metaphor</text>
<text x="166.4" y="76.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">says one thing is another: *the city is a furnace*</text>
<text x="485.81818181818176" y="76.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">what is being compared, and what the comparison</text>
<text x="485.81818181818176" y="88.328" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">suggests</text>
<line x1="12" y1="98.656" x2="748" y2="98.656" stroke="#CBD5E1" stroke-width="0.6"/>
<rect x="12" y="98.656" width="736" height="24.328" rx="0" fill="#F8FAFC" stroke="none" stroke-width="0"/>
<text x="20" y="112.656" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">Simile</text>
<text x="166.4" y="112.656" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">compares with *like* or *as*: *as dry as a bone*</text>
<text x="485.81818181818176" y="112.656" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">the quality shared by the two things</text>
<line x1="12" y1="122.98400000000001" x2="748" y2="122.98400000000001" stroke="#CBD5E1" stroke-width="0.6"/>
<text x="20" y="136.984" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">Personification</text>
<text x="166.4" y="136.984" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">gives a thing human action: *the wind argued*</text>
<text x="485.81818181818176" y="136.984" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">which human quality is being borrowed</text>
<line x1="12" y1="147.312" x2="748" y2="147.312" stroke="#CBD5E1" stroke-width="0.6"/>
<rect x="12" y="147.312" width="736" height="24.328" rx="0" fill="#F8FAFC" stroke="none" stroke-width="0"/>
<text x="20" y="161.312" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">Hyperbole</text>
<text x="166.4" y="161.312" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">deliberate exaggeration: *a thousand letters*</text>
<text x="485.81818181818176" y="161.312" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">what the exaggeration is meant to make you feel</text>
<line x1="12" y1="171.64000000000001" x2="748" y2="171.64000000000001" stroke="#CBD5E1" stroke-width="0.6"/>
<text x="20" y="185.64000000000001" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">Irony</text>
<text x="166.4" y="185.64000000000001" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">says the opposite of what is meant</text>
<text x="485.81818181818176" y="185.64000000000001" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">what the writer actually believes</text>
<line x1="12" y1="195.96800000000002" x2="748" y2="195.96800000000002" stroke="#CBD5E1" stroke-width="0.6"/>
<rect x="12" y="195.96800000000002" width="736" height="36.656" rx="0" fill="#F8FAFC" stroke="none" stroke-width="0"/>
<text x="20" y="209.96800000000002" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">Idiom</text>
<text x="166.4" y="209.96800000000002" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">a fixed phrase with a single meaning: *break the ice*</text>
<text x="485.81818181818176" y="209.96800000000002" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">the meaning of the phrase as a whole, never word by</text>
<text x="485.81818181818176" y="222.29600000000002" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">word</text>
<line x1="12" y1="232.62400000000002" x2="748" y2="232.62400000000002" stroke="#CBD5E1" stroke-width="0.6"/>
<text x="380.0" y="249.62400000000002" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">The paper rarely names the figure. It asks what the phrase means, and the phrase is doing one of these six things.</text>
<rect x="12" y="10" width="736" height="258.22400000000005" rx="9" fill="none" stroke="#008751" stroke-width="1.4"/>
</svg>
