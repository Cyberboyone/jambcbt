<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="760" height="180">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="180" fill="#FFFFFF"/>
<text x="380.0" y="26" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">Stated, implied, assumed — three rungs, and only two of them are on the paper</text>
<text x="380.0" y="40" font-family="DejaVu Sans" font-size="9.4" fill="#64748B" text-anchor="middle" font-weight="normal">“The market closed at noon, and by one o'clock the street was empty.”</text>
<rect x="12.0" y="63" width="228.0" height="65.024" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="12.0" y="63" width="228.0" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="126.0" y="85" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">STATED</text>
<text x="126.0" y="101.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">The passage says it in words. A direct-detail</text>
<text x="126.0" y="113.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">question.</text>
<line x1="244.0" y1="95.512" x2="251.925" y2="95.512" stroke="#008751" stroke-width="1.6"/><polygon points="262.0,95.5 251.9,99.3 251.9,91.7" fill="#008751"/>
<rect x="266.0" y="63" width="228.0" height="65.024" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="266.0" y="63" width="228.0" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="380.0" y="85" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">IMPLIED</text>
<text x="380.0" y="101.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">The passage says something else, and the</text>
<text x="380.0" y="113.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">answer must follow. An inference question.</text>
<line x1="498.0" y1="95.512" x2="505.925" y2="95.512" stroke="#008751" stroke-width="1.6"/><polygon points="516.0,95.5 505.9,99.3 505.9,91.7" fill="#008751"/>
<rect x="520.0" y="63" width="228.0" height="65.024" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="520.0" y="63" width="228.0" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="634.0" y="85" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">ASSUMED</text>
<text x="634.0" y="101.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">The passage never commits itself. Nothing</text>
<text x="634.0" y="113.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">on the paper turns on this.</text>
<text x="380.0" y="145.024" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">An inference is a step the writer has already taken: *the traders left early* is implied, *the traders were unhappy* is assumed. The wrong options are the</text>
<text x="380.0" y="157.624" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">assumptions.</text>
<rect x="12" y="10" width="736" height="168.224" rx="9" fill="none" stroke="#008751" stroke-width="1.4"/>
</svg>
