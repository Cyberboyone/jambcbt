<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 228" width="760" height="228">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="228" fill="#FFFFFF"/>
<text x="380.0" y="26" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">The four columns of a chapter card</text>
<rect x="12.0" y="38.0" width="364.0" height="71.024" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="12.0" y="38.0" width="364.0" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="22.0" y="59.0" font-family="DejaVu Sans" font-size="9.8" fill="#0E1F40" text-anchor="start" font-weight="bold">1 · What happens</text>
<text x="22.0" y="75.4" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">One line, in the order it happens, in your own words. If you cannot write</text>
<text x="22.0" y="87.912" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">the line, you have not read the chapter.</text>
<rect x="384.0" y="38.0" width="364.0" height="71.024" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="384.0" y="38.0" width="364.0" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="394.0" y="59.0" font-family="DejaVu Sans" font-size="9.8" fill="#0E1F40" text-anchor="start" font-weight="bold">2 · Who is there</text>
<text x="394.0" y="75.4" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">Every named person who acts, speaks or is spoken about. JAMB sets</text>
<text x="394.0" y="87.912" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">questions on the third servant as readily as on the principal.</text>
<rect x="12.0" y="117.024" width="364.0" height="71.024" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="12.0" y="117.024" width="364.0" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="22.0" y="138.024" font-family="DejaVu Sans" font-size="9.8" fill="#0E1F40" text-anchor="start" font-weight="bold">3 · What it shows</text>
<text x="22.0" y="154.424" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">The trait, theme or turning point the scene exists for. This is the column</text>
<text x="22.0" y="166.936" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">the interpretive questions come from.</text>
<rect x="384.0" y="117.024" width="364.0" height="71.024" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="384.0" y="117.024" width="364.0" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="394.0" y="138.024" font-family="DejaVu Sans" font-size="9.8" fill="#0E1F40" text-anchor="start" font-weight="bold">4 · The line</text>
<text x="394.0" y="154.424" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">One short quotation — a proverb, an insult, a promise. The novel's style</text>
<text x="394.0" y="166.936" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">questions are almost always answered from a line you can find again.</text>
<text x="380.0" y="205.048" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">Twelve chapters, twelve cards, four columns. The file is the revision; the novel is the reading.</text>
<rect x="12" y="10" width="736" height="213.648" rx="9" fill="none" stroke="#008751" stroke-width="1.4"/>
</svg>
