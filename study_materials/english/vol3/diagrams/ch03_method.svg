<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 193" width="760" height="193">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="193" fill="#FFFFFF"/>
<text x="380.0" y="26" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">A four-step method for any character question</text>
<text x="380.0" y="40" font-family="DejaVu Sans" font-size="9.4" fill="#64748B" text-anchor="middle" font-weight="normal">Trait questions are evidence questions wearing a different hat.</text>
<rect x="12.0" y="63" width="164.5" height="90.048" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="12.0" y="63" width="164.5" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="94.25" y="85" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">NAME THE ACT</text>
<text x="94.25" y="101.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">Find the one action the</text>
<text x="94.25" y="113.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">question points at. Not the</text>
<text x="94.25" y="126.024" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">person's job, the deed.</text>
<line x1="180.5" y1="108.024" x2="188.425" y2="108.024" stroke="#008751" stroke-width="1.6"/><polygon points="198.5,108.0 188.4,111.8 188.4,104.3" fill="#008751"/>
<rect x="202.5" y="63" width="164.5" height="90.048" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="202.5" y="63" width="164.5" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="284.75" y="85" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">ADJECTIVE</text>
<text x="284.75" y="101.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">Choose the word the deed</text>
<text x="284.75" y="113.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">supports — patient, obstinate,</text>
<text x="284.75" y="126.024" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">generous, afraid.</text>
<line x1="371.0" y1="108.024" x2="378.925" y2="108.024" stroke="#008751" stroke-width="1.6"/><polygon points="389.0,108.0 378.9,111.8 378.9,104.3" fill="#008751"/>
<rect x="393.0" y="63" width="164.5" height="90.048" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="393.0" y="63" width="164.5" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="475.25" y="85" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">TEST IT</text>
<text x="475.25" y="101.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">Ask what the opposite trait</text>
<text x="475.25" y="113.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">would have produced. If the</text>
<text x="475.25" y="126.024" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">scene would read the same,</text>
<text x="475.25" y="138.536" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">the trait is wrong.</text>
<line x1="561.5" y1="108.024" x2="569.425" y2="108.024" stroke="#008751" stroke-width="1.6"/><polygon points="579.5,108.0 569.4,111.8 569.4,104.3" fill="#008751"/>
<rect x="583.5" y="63" width="164.5" height="90.048" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="583.5" y="63" width="164.5" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="665.75" y="85" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">FIND THE LINE</text>
<text x="665.75" y="101.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">Quote the clause in your head.</text>
<text x="665.75" y="113.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">If no clause supports the word,</text>
<text x="665.75" y="126.024" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">the option is a guess dressed</text>
<text x="665.75" y="138.536" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">as an answer.</text>
<text x="380.0" y="170.048" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">“Bepo is best described as …” is never answered by *a headmaster*. The job is the setting, not the character.</text>
<rect x="12" y="10" width="736" height="180.648" rx="9" fill="none" stroke="#008751" stroke-width="1.4"/>
</svg>
