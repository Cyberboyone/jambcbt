<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 255" width="760" height="255">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="255" fill="#FFFFFF"/>
<text x="380.0" y="26" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">Five ways a wrong option is built</text>
<text x="380.0" y="38" font-family="DejaVu Sans" font-size="9.4" fill="#64748B" text-anchor="middle" font-weight="normal">The right answer is not the only sensible sentence — it is the only one the text supports.</text>
<rect x="12" y="57" width="736" height="24" rx="5" fill="#0E1F40" stroke="#0E1F40" stroke-width="0"/>
<text x="20" y="73" font-family="DejaVu Sans" font-size="9.0" fill="#FFFFFF" text-anchor="start" font-weight="bold">The lie</text>
<text x="163.5294117647059" y="73" font-family="DejaVu Sans" font-size="9.0" fill="#FFFFFF" text-anchor="start" font-weight="bold">What it looks like</text>
<text x="464.9411764705883" y="73" font-family="DejaVu Sans" font-size="9.0" fill="#FFFFFF" text-anchor="start" font-weight="bold">How to kill it</text>
<text x="20" y="95.0" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">The wrong name</text>
<text x="163.5294117647059" y="95.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">A real character, but not the one who did it</text>
<text x="464.9411764705883" y="95.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">Match the actor to the action, not just to the chapter</text>
<line x1="12" y1="105.328" x2="748" y2="105.328" stroke="#CBD5E1" stroke-width="0.6"/>
<rect x="12" y="105.328" width="736" height="24.328" rx="0" fill="#F8FAFC" stroke="none" stroke-width="0"/>
<text x="20" y="119.328" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">The wrong chapter</text>
<text x="163.5294117647059" y="119.328" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">A real event, placed one chapter early or late</text>
<text x="464.9411764705883" y="119.328" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">Put the event on the timeline before choosing</text>
<line x1="12" y1="129.656" x2="748" y2="129.656" stroke="#CBD5E1" stroke-width="0.6"/>
<text x="20" y="143.656" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">The half-truth</text>
<text x="163.5294117647059" y="143.656" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">The first half is right and the second half is invented</text>
<text x="464.9411764705883" y="143.656" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">Read the whole option; the turn usually comes after the</text>
<text x="464.9411764705883" y="155.984" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">comma</text>
<line x1="12" y1="166.312" x2="748" y2="166.312" stroke="#CBD5E1" stroke-width="0.6"/>
<rect x="12" y="166.312" width="736" height="24.328" rx="0" fill="#F8FAFC" stroke="none" stroke-width="0"/>
<text x="20" y="180.312" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">The true irrelevance</text>
<text x="163.5294117647059" y="180.312" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">True of the novel, but not what the question asked</text>
<text x="464.9411764705883" y="180.312" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">Re-read the question's last three words</text>
<line x1="12" y1="190.64000000000001" x2="748" y2="190.64000000000001" stroke="#CBD5E1" stroke-width="0.6"/>
<text x="20" y="204.64000000000001" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">The overstatement</text>
<text x="163.5294117647059" y="204.64000000000001" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">Always, never, entirely, only</text>
<text x="464.9411764705883" y="204.64000000000001" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">A novel rarely supports an absolute; find the exception</text>
<line x1="12" y1="214.96800000000002" x2="748" y2="214.96800000000002" stroke="#CBD5E1" stroke-width="0.6"/>
<text x="380.0" y="231.96800000000002" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">Three of these five can be eliminated without knowing the answer, which is why elimination is worth teaching before memory.</text>
<rect x="12" y="10" width="736" height="240.568" rx="9" fill="none" stroke="#008751" stroke-width="1.4"/>
</svg>
