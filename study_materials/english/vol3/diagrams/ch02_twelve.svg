<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" width="760" height="384">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="384" fill="#FFFFFF"/>
<text x="380.0" y="26" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">The twelve chapters, in one line each</text>
<rect x="12" y="38" width="736" height="24" rx="5" fill="#0E1F40" stroke="#0E1F40" stroke-width="0"/>
<text x="20" y="54" font-family="DejaVu Sans" font-size="9.0" fill="#FFFFFF" text-anchor="start" font-weight="bold">Ch.</text>
<text x="61.82857142857143" y="54" font-family="DejaVu Sans" font-size="9.0" fill="#FFFFFF" text-anchor="start" font-weight="bold">Title</text>
<text x="312.8" y="54" font-family="DejaVu Sans" font-size="9.0" fill="#FFFFFF" text-anchor="start" font-weight="bold">What happens</text>
<text x="20" y="76.0" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="bold">1</text>
<text x="61.82857142857143" y="76.0" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">Dusk</text>
<text x="312.8" y="76.0" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">Bepo breaks down at morning assembly and cannot say why.</text>
<line x1="12" y1="85.524" x2="748" y2="85.524" stroke="#CBD5E1" stroke-width="0.6"/>
<rect x="12" y="85.524" width="736" height="23.524" rx="0" fill="#F8FAFC" stroke="none" stroke-width="0"/>
<text x="20" y="99.524" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="bold">2</text>
<text x="61.82857142857143" y="99.524" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">The Enticement</text>
<text x="312.8" y="99.524" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">Five days later he admits he is leaving for the UK; Seri and the children are already there.</text>
<line x1="12" y1="109.048" x2="748" y2="109.048" stroke="#CBD5E1" stroke-width="0.6"/>
<text x="20" y="123.048" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="bold">3</text>
<text x="61.82857142857143" y="123.048" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">Migration Tales</text>
<text x="312.8" y="123.048" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">Colleagues and friends trade stories of those who japa — the successes and the humiliations.</text>
<line x1="12" y1="132.572" x2="748" y2="132.572" stroke="#CBD5E1" stroke-width="0.6"/>
<rect x="12" y="132.572" width="736" height="23.524" rx="0" fill="#F8FAFC" stroke="none" stroke-width="0"/>
<text x="20" y="146.572" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="bold">4</text>
<text x="61.82857142857143" y="146.572" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">A Case of Visa Denied</text>
<text x="312.8" y="146.572" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">A parent's family collapses when a visa medical reveals a paternity secret.</text>
<line x1="12" y1="156.096" x2="748" y2="156.096" stroke="#CBD5E1" stroke-width="0.6"/>
<text x="20" y="170.096" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="bold">5</text>
<text x="61.82857142857143" y="170.096" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">Snake in the Roof</text>
<text x="312.8" y="170.096" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">Cars on school land lead the board to the cooperative's ₦95 million and a cap on loans.</text>
<line x1="12" y1="179.62" x2="748" y2="179.62" stroke="#CBD5E1" stroke-width="0.6"/>
<rect x="12" y="179.62" width="736" height="23.524" rx="0" fill="#F8FAFC" stroke="none" stroke-width="0"/>
<text x="20" y="193.62" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="bold">6</text>
<text x="61.82857142857143" y="193.62" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">Ade as Well as Jide COMES vs. COME</text>
<text x="312.8" y="193.62" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">A parent demands a teacher's sack over a sentence the teacher got right.</text>
<line x1="12" y1="203.144" x2="748" y2="203.144" stroke="#CBD5E1" stroke-width="0.6"/>
<text x="20" y="217.144" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="bold">7</text>
<text x="61.82857142857143" y="217.144" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">Ritualists</text>
<text x="312.8" y="217.144" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">Bepo remembers Beesway, the cow buried alive, and the night he left.</text>
<line x1="12" y1="226.668" x2="748" y2="226.668" stroke="#CBD5E1" stroke-width="0.6"/>
<rect x="12" y="226.668" width="736" height="23.524" rx="0" fill="#F8FAFC" stroke="none" stroke-width="0"/>
<text x="20" y="240.668" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="bold">8</text>
<text x="61.82857142857143" y="240.668" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">Missions Unaccomplished</text>
<text x="312.8" y="240.668" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">The Banky–Tosh feud, the prefect election and the Invention Club he will not finish.</text>
<line x1="12" y1="250.192" x2="748" y2="250.192" stroke="#CBD5E1" stroke-width="0.6"/>
<text x="20" y="264.192" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="bold">9</text>
<text x="61.82857142857143" y="264.192" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">Laughing Waterfalls</text>
<text x="312.8" y="264.192" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">Excursions across Nigeria end at Badagry, where the past accuses the present.</text>
<line x1="12" y1="273.716" x2="748" y2="273.716" stroke="#CBD5E1" stroke-width="0.6"/>
<rect x="12" y="273.716" width="736" height="23.524" rx="0" fill="#F8FAFC" stroke="none" stroke-width="0"/>
<text x="20" y="287.716" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="bold">10</text>
<text x="61.82857142857143" y="287.716" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">Passport Pains</text>
<text x="312.8" y="287.716" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">Bepo renews an expired passport and meets the state up close.</text>
<line x1="12" y1="297.24" x2="748" y2="297.24" stroke="#CBD5E1" stroke-width="0.6"/>
<text x="20" y="311.24" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="bold">11</text>
<text x="61.82857142857143" y="311.24" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">Point of No Return</text>
<text x="312.8" y="311.24" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">The school's farewell: a match, a debate, a drama, and a shout he cannot explain.</text>
<line x1="12" y1="320.764" x2="748" y2="320.764" stroke="#CBD5E1" stroke-width="0.6"/>
<rect x="12" y="320.764" width="736" height="23.524" rx="0" fill="#F8FAFC" stroke="none" stroke-width="0"/>
<text x="20" y="334.764" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="bold">12</text>
<text x="61.82857142857143" y="334.764" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">…Dawn</text>
<text x="312.8" y="334.764" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">At the airport he dreams of the slave ship, and on Monday he walks back in.</text>
<line x1="12" y1="344.288" x2="748" y2="344.288" stroke="#CBD5E1" stroke-width="0.6"/>
<text x="380.0" y="361.288" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">Learn the titles in order. A question that names a chapter is a free mark, and the titles themselves carry the structure: Dusk opens, Dawn closes.</text>
<rect x="12" y="10" width="736" height="369.88800000000003" rx="9" fill="none" stroke="#008751" stroke-width="1.4"/>
</svg>
