<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" width="760" height="344">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="344" fill="#FFFFFF"/>
<text x="380.0" y="26" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">The five things that define Bepo</text>
<rect x="12.0" y="38.0" width="364.0" height="83.536" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="12.0" y="38.0" width="364.0" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="22.0" y="59.0" font-family="DejaVu Sans" font-size="9.8" fill="#0E1F40" text-anchor="start" font-weight="bold">The method</text>
<text x="22.0" y="75.4" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">He settles quarrels by finding the fact that decides them. The grammar</text>
<text x="22.0" y="87.912" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">row, the cooperative and the prefect election are all the same scene.</text>
<rect x="384.0" y="38.0" width="364.0" height="83.536" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="384.0" y="38.0" width="364.0" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="394.0" y="59.0" font-family="DejaVu Sans" font-size="9.8" fill="#0E1F40" text-anchor="start" font-weight="bold">The record</text>
<text x="394.0" y="75.4" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">Twenty-four years at Stardom, from Stardom Kiddies to the secondary</text>
<text x="394.0" y="87.912" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">school. The length is the argument: this is not a job he drifted into.</text>
<rect x="12.0" y="129.536" width="364.0" height="83.536" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="12.0" y="129.536" width="364.0" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="22.0" y="150.536" font-family="DejaVu Sans" font-size="9.8" fill="#0E1F40" text-anchor="start" font-weight="bold">The refusal</text>
<text x="22.0" y="166.936" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">He would not perform the rite at Fruitful Future and would not keep quiet</text>
<text x="22.0" y="179.448" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">at Beesway. His integrity has already cost him once.</text>
<rect x="384.0" y="129.536" width="364.0" height="83.536" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="384.0" y="129.536" width="364.0" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="394.0" y="150.536" font-family="DejaVu Sans" font-size="9.8" fill="#0E1F40" text-anchor="start" font-weight="bold">The tell</text>
<text x="394.0" y="166.936" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">He speaks with one hand in his pocket and says *other things being</text>
<text x="394.0" y="179.448" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">equal*; his crucifix and his aphorisms mark a man who teaches even</text>
<text x="394.0" y="191.96" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">when he is not in class.</text>
<rect x="12.0" y="221.072" width="364.0" height="83.536" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="12.0" y="221.072" width="364.0" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="22.0" y="242.072" font-family="DejaVu Sans" font-size="9.8" fill="#0E1F40" text-anchor="start" font-weight="bold">The wound</text>
<text x="22.0" y="258.472" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">He loves the school and cannot say so without weeping. The breakdown</text>
<text x="22.0" y="270.984" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">in Chapter 1 is not weakness; it is the price of the choice.</text>
<text x="380.0" y="321.608" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">Note what the novel does *not* give him: no scene of private indulgence, no bribe taken, no revenge. The character is drawn by refusals.</text>
<rect x="12" y="10" width="736" height="330.208" rx="9" fill="none" stroke="#008751" stroke-width="1.4"/>
</svg>
