<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="760" height="180">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="180" fill="#FFFFFF"/>
<text x="380.0" y="26" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">The frame: Dusk opens, Dawn closes</text>
<text x="380.0" y="40" font-family="DejaVu Sans" font-size="9.4" fill="#64748B" text-anchor="middle" font-weight="normal">Two chapter titles carry the whole structure, and neither is a time of day in the plot.</text>
<rect x="12.0" y="63" width="228.0" height="77.536" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="12.0" y="63" width="228.0" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="126.0" y="85" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">DUSK</text>
<text x="126.0" y="101.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">Chapter 1. Light failing, a man unable to</text>
<text x="126.0" y="113.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">speak: the title is the mood, not the time of</text>
<text x="126.0" y="126.024" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">day.</text>
<line x1="244.0" y1="101.768" x2="251.925" y2="101.768" stroke="#008751" stroke-width="1.6"/><polygon points="262.0,101.8 251.9,105.5 251.9,98.0" fill="#008751"/>
<rect x="266.0" y="63" width="228.0" height="77.536" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="266.0" y="63" width="228.0" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="380.0" y="85" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">THE NIGHT</text>
<text x="380.0" y="101.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">Chapters 2–11. The long middle, lit by</text>
<text x="380.0" y="113.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">flashbacks and by other people's stories of</text>
<text x="380.0" y="126.024" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">abroad.</text>
<line x1="498.0" y1="101.768" x2="505.925" y2="101.768" stroke="#008751" stroke-width="1.6"/><polygon points="516.0,101.8 505.9,105.5 505.9,98.0" fill="#008751"/>
<rect x="520.0" y="63" width="228.0" height="77.536" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="520.0" y="63" width="228.0" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="634.0" y="85" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">DAWN</text>
<text x="634.0" y="101.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">Chapter 12. A new day, a man walking back</text>
<text x="634.0" y="113.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">through the gate: the title reverses Chapter</text>
<text x="634.0" y="126.024" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">1.</text>
<text x="380.0" y="157.536" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">A question on the title *Dusk* is asking about mood and direction, not about the hour of the assembly.</text>
<rect x="12" y="10" width="736" height="168.136" rx="9" fill="none" stroke="#008751" stroke-width="1.4"/>
</svg>
