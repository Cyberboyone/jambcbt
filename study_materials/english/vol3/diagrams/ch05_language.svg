<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 248" width="760" height="248">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="248" fill="#FFFFFF"/>
<text x="380.0" y="26" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">Four features of the style, with examples in view</text>
<rect x="12" y="38" width="736" height="24" rx="5" fill="#0E1F40" stroke="#0E1F40" stroke-width="0"/>
<text x="20" y="54" font-family="DejaVu Sans" font-size="9.0" fill="#FFFFFF" text-anchor="start" font-weight="bold">Feature</text>
<text x="175.27272727272728" y="54" font-family="DejaVu Sans" font-size="9.0" fill="#FFFFFF" text-anchor="start" font-weight="bold">What it sounds like</text>
<text x="474.72727272727275" y="54" font-family="DejaVu Sans" font-size="9.0" fill="#FFFFFF" text-anchor="start" font-weight="bold">Why the novel uses it</text>
<text x="20" y="76.0" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">Proverbs and sayings</text>
<text x="175.27272727272728" y="76.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">“It is like hanging a snake in the roof and going to bed.”</text>
<text x="474.72727272727275" y="76.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">Compresses a boardroom's fear into one image, in the</text>
<text x="474.72727272727275" y="88.328" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">register of the people who feel it</text>
<line x1="12" y1="98.656" x2="748" y2="98.656" stroke="#CBD5E1" stroke-width="0.6"/>
<rect x="12" y="98.656" width="736" height="36.656" rx="0" fill="#F8FAFC" stroke="none" stroke-width="0"/>
<text x="20" y="112.656" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">Humour</text>
<text x="175.27272727272728" y="112.656" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">Audu's jokes at the worst moments; the grammar row ending</text>
<text x="175.27272727272728" y="124.98400000000001" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">in laughter</text>
<text x="474.72727272727275" y="112.656" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">Lets the novel say hard things without preaching, and</text>
<text x="474.72727272727275" y="124.98400000000001" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">keeps a sad story readable</text>
<line x1="12" y1="135.312" x2="748" y2="135.312" stroke="#CBD5E1" stroke-width="0.6"/>
<text x="20" y="149.312" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">Irony</text>
<text x="175.27272727272728" y="149.312" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">A headmaster condemning japa while packing for London</text>
<text x="474.72727272727275" y="149.312" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">Puts the argument inside the character instead of on a</text>
<text x="474.72727272727275" y="161.64000000000001" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">placard</text>
<line x1="12" y1="171.96800000000002" x2="748" y2="171.96800000000002" stroke="#CBD5E1" stroke-width="0.6"/>
<rect x="12" y="171.96800000000002" width="736" height="36.656" rx="0" fill="#F8FAFC" stroke="none" stroke-width="0"/>
<text x="20" y="185.96800000000002" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">Nigerian English</text>
<text x="175.27272727272728" y="185.96800000000002" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">Japa, owambe, iru, egusi, *other things being equal*,</text>
<text x="175.27272727272728" y="198.29600000000002" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">*Noooo!*</text>
<text x="474.72727272727275" y="185.96800000000002" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">Locates the book; the code-mixing is the setting heard</text>
<text x="474.72727272727275" y="198.29600000000002" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">rather than described</text>
<line x1="12" y1="208.62400000000002" x2="748" y2="208.62400000000002" stroke="#CBD5E1" stroke-width="0.6"/>
<text x="380.0" y="225.62400000000002" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">Never call the language “simple”. It is plain on the surface and patterned underneath, which is the harder thing to do.</text>
<rect x="12" y="10" width="736" height="234.22400000000002" rx="9" fill="none" stroke="#008751" stroke-width="1.4"/>
</svg>
