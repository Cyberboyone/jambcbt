<text x="26" y="160" font-family="DejaVu Sans" font-size="9.4" fill="#334155" text-anchor="start" font-weight="normal">The three timed papers at the back rehearse all sixty, in the order a CBT engine meets them.</text>
<text x="26" y="178" font-family="DejaVu Sans" font-size="9.4" fill="#008751" text-anchor="start" font-weight="bold">Ten questions come straight from the novel, and they are the cheapest ten on the paper.</text>
