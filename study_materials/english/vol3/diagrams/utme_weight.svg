<text x="380.0" y="26" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">Where the sixty questions sit, and the block this volume is built around</text>
<text x="380.0" y="46" font-family="DejaVu Sans" font-size="9.2" fill="#64748B" text-anchor="middle" font-weight="normal">Green is the reading text: ten questions, one sixth of the paper, from a book of about sixty pages.</text>
