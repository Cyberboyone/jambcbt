<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 341" width="760" height="341">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="341" fill="#FFFFFF"/>
<text x="380.0" y="26" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">What each kind of character is doing in the book</text>
<text x="380.0" y="38" font-family="DejaVu Sans" font-size="9.4" fill="#64748B" text-anchor="middle" font-weight="normal">A character exists to do a job in the story. Name the job and the trait question answers itself.</text>
<rect x="12" y="57" width="736" height="24" rx="5" fill="#0E1F40" stroke="#0E1F40" stroke-width="0"/>
<text x="20" y="73" font-family="DejaVu Sans" font-size="9.0" fill="#FFFFFF" text-anchor="start" font-weight="bold">Character</text>
<text x="166.39999999999998" y="73" font-family="DejaVu Sans" font-size="9.0" fill="#FFFFFF" text-anchor="start" font-weight="bold">Function</text>
<text x="446.99999999999994" y="73" font-family="DejaVu Sans" font-size="9.0" fill="#FFFFFF" text-anchor="start" font-weight="bold">The scene that proves it</text>
<text x="20" y="95.0" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">Mrs Grace Apeh</text>
<text x="166.39999999999998" y="95.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">The steady second. She holds the school together when</text>
<text x="166.39999999999998" y="107.328" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">Bepo cannot.</text>
<text x="446.99999999999994" y="95.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">She takes over the assembly in Chapter 1 and addresses the</text>
<text x="446.99999999999994" y="107.328" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">students after he leaves.</text>
<line x1="12" y1="117.656" x2="748" y2="117.656" stroke="#CBD5E1" stroke-width="0.6"/>
<rect x="12" y="117.656" width="736" height="36.656" rx="0" fill="#F8FAFC" stroke="none" stroke-width="0"/>
<text x="20" y="131.656" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">Mr Audu</text>
<text x="166.39999999999998" y="131.656" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">Comic relief that tells the truth. His jokes name the thing</text>
<text x="166.39999999999998" y="143.984" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">everyone is pretending not to see.</text>
<text x="446.99999999999994" y="131.656" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">The grammar row in Chapter 6, where a joke ends a sacking.</text>
<line x1="12" y1="154.312" x2="748" y2="154.312" stroke="#CBD5E1" stroke-width="0.6"/>
<text x="20" y="168.312" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">Pastor Ope Wande</text>
<text x="166.39999999999998" y="168.312" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">The conscience with a collar. He is called when the</text>
<text x="166.39999999999998" y="180.64000000000001" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">problem is spiritual, and he fails, which is the point.</text>
<text x="446.99999999999994" y="168.312" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">Ten minutes beside Bepo in Chapter 1 with no answer.</text>
<line x1="12" y1="190.96800000000002" x2="748" y2="190.96800000000002" stroke="#CBD5E1" stroke-width="0.6"/>
<rect x="12" y="190.96800000000002" width="736" height="36.656" rx="0" fill="#F8FAFC" stroke="none" stroke-width="0"/>
<text x="20" y="204.96800000000002" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">Mrs Ibidun Gloss</text>
<text x="166.39999999999998" y="204.96800000000002" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">The employer. Firm, cost-conscious, occasionally wrong,</text>
<text x="166.39999999999998" y="217.29600000000002" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">never a villain.</text>
<text x="446.99999999999994" y="204.96800000000002" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">She orders Fafore's dismissal, then laughs when she is</text>
<text x="446.99999999999994" y="217.29600000000002" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">corrected.</text>
<line x1="12" y1="227.62400000000002" x2="748" y2="227.62400000000002" stroke="#CBD5E1" stroke-width="0.6"/>
<text x="20" y="241.62400000000002" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">Chief Mrs Solape Bayo</text>
<text x="166.39999999999998" y="241.62400000000002" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">The board's class fear in one voice.</text>
<text x="446.99999999999994" y="241.62400000000002" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">The snake-in-the-roof speech, and the cap on cooperative</text>
<text x="446.99999999999994" y="253.95200000000003" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">loans.</text>
<line x1="12" y1="264.28000000000003" x2="748" y2="264.28000000000003" stroke="#CBD5E1" stroke-width="0.6"/>
<rect x="12" y="264.28000000000003" width="736" height="36.656" rx="0" fill="#F8FAFC" stroke="none" stroke-width="0"/>
<text x="20" y="278.28000000000003" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">Egi Meko</text>
<text x="166.39999999999998" y="278.28000000000003" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">Bepo's negative image — the school owner who will do</text>
<text x="166.39999999999998" y="290.608" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">anything.</text>
<text x="446.99999999999994" y="278.28000000000003" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">The night at Beesway, and the cow buried alive.</text>
<line x1="12" y1="300.93600000000004" x2="748" y2="300.93600000000004" stroke="#CBD5E1" stroke-width="0.6"/>
<text x="380.0" y="317.93600000000004" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">Villains in this novel are not wicked people; they are people with a interest. That is why the book reads as realism rather than melodrama.</text>
<rect x="12" y="10" width="736" height="326.53600000000006" rx="9" fill="none" stroke="#008751" stroke-width="1.4"/>
</svg>
