<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 247" width="760" height="247">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="247" fill="#FFFFFF"/>
<text x="380.0" y="26" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">The japa argument, both ways</text>
<text x="380.0" y="40" font-family="DejaVu Sans" font-size="9.4" fill="#64748B" text-anchor="middle" font-weight="normal">The novel gives the case for leaving every good line, and then decides against it.</text>
<rect x="220.0" y="61" width="320" height="34" rx="7" fill="#ECFDF5" stroke="#008751" stroke-width="1.5"/>
<text x="380.0" y="83" font-family="DejaVu Sans" font-size="11.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">Should Bepo go?</text>
<line x1="380.0" y1="95" x2="380.0" y2="109" stroke="#008751" stroke-width="1.6"/>
<line x1="137.33333333333331" y1="109" x2="622.6666666666666" y2="109" stroke="#008751" stroke-width="1.6"/>
<line x1="137.33333333333331" y1="109" x2="137.33333333333331" y2="119" stroke="#008751" stroke-width="1.6"/>
<rect x="21.0" y="119" width="232.66666666666666" height="88.048" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<text x="137.33333333333331" y="139" font-family="DejaVu Sans" font-size="9.8" fill="#0E1F40" text-anchor="middle" font-weight="bold">THE CASE FOR</text>
<text x="137.33333333333331" y="155.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">Seri earns £10,000 a month; his UK post pays</text>
<text x="137.33333333333331" y="167.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">£3,600; the family is already split; the</text>
<text x="137.33333333333331" y="180.024" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">marriage is on the brink; his own salary is</text>
<text x="137.33333333333331" y="192.536" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">₦400,000.</text>
<line x1="379.99999999999994" y1="109" x2="379.99999999999994" y2="119" stroke="#008751" stroke-width="1.6"/>
<rect x="263.66666666666663" y="119" width="232.66666666666666" height="88.048" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<text x="379.99999999999994" y="139" font-family="DejaVu Sans" font-size="9.8" fill="#0E1F40" text-anchor="middle" font-weight="bold">THE CASE AGAINST</text>
<text x="379.99999999999994" y="155.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">Twenty-four years of work; a school that</text>
<text x="379.99999999999994" y="167.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">needs him; a mission unfinished; a country</text>
<text x="379.99999999999994" y="180.024" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">that trained him; a history at Badagry that</text>
<text x="379.99999999999994" y="192.536" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">makes departure feel like sale.</text>
<line x1="622.6666666666666" y1="109" x2="622.6666666666666" y2="119" stroke="#008751" stroke-width="1.6"/>
<rect x="506.3333333333333" y="119" width="232.66666666666666" height="88.048" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<text x="622.6666666666666" y="139" font-family="DejaVu Sans" font-size="9.8" fill="#0E1F40" text-anchor="middle" font-weight="bold">WHAT SETTLES IT</text>
<text x="622.6666666666666" y="155.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">Not the money. The dream on the plane, and</text>
<text x="622.6666666666666" y="167.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">the Monday morning he walks back through</text>
<text x="622.6666666666666" y="180.024" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">the gate.</text>
<text x="380.0" y="224.048" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">This is why a question that asks “why does Bepo stay?” cannot be answered with *because he was poorly paid*. The pay is the pressure, not the reason.</text>
<rect x="12" y="10" width="736" height="234.648" rx="9" fill="none" stroke="#008751" stroke-width="1.4"/>
</svg>
