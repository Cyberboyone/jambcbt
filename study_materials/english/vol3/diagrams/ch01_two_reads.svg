<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="760" height="180">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="180" fill="#FFFFFF"/>
<text x="380.0" y="26" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">Two reads, and what each one is for</text>
<text x="380.0" y="40" font-family="DejaVu Sans" font-size="9.4" fill="#64748B" text-anchor="middle" font-weight="normal">The novel is short; the mistake is reading it three times in the same way.</text>
<rect x="12.0" y="63" width="164.5" height="77.536" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="12.0" y="63" width="164.5" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="94.25" y="85" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">READ 1
STORY</text>
<text x="94.25" y="101.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">Read straight through with no</text>
<text x="94.25" y="113.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">pen. Get the shape of the story</text>
<text x="94.25" y="126.024" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">and the names into your head.</text>
<line x1="180.5" y1="101.768" x2="188.425" y2="101.768" stroke="#008751" stroke-width="1.6"/><polygon points="198.5,101.8 188.4,105.5 188.4,98.0" fill="#008751"/>
<rect x="202.5" y="63" width="164.5" height="77.536" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="202.5" y="63" width="164.5" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="284.75" y="85" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">READ 2
CARD</text>
<text x="284.75" y="101.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">Read again with the twelve</text>
<text x="284.75" y="113.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">cards open. Fill one card per</text>
<text x="284.75" y="126.024" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">chapter as you finish it.</text>
<line x1="371.0" y1="101.768" x2="378.925" y2="101.768" stroke="#008751" stroke-width="1.6"/><polygon points="389.0,101.8 378.9,105.5 378.9,98.0" fill="#008751"/>
<rect x="393.0" y="63" width="164.5" height="77.536" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="393.0" y="63" width="164.5" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="475.25" y="85" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">READ 3
LINES</text>
<text x="475.25" y="101.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">A week later, read only your</text>
<text x="475.25" y="113.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">cards and the twelve</text>
<text x="475.25" y="126.024" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">quotations. Twenty minutes.</text>
<line x1="561.5" y1="101.768" x2="569.425" y2="101.768" stroke="#008751" stroke-width="1.6"/><polygon points="579.5,101.8 569.4,105.5 569.4,98.0" fill="#008751"/>
<rect x="583.5" y="63" width="164.5" height="77.536" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="583.5" y="63" width="164.5" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="665.75" y="85" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">READ 4
TEST</text>
<text x="665.75" y="101.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">Answer forty questions from a</text>
<text x="665.75" y="113.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">bank. Every wrong answer</text>
<text x="665.75" y="126.024" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">goes back to a card.</text>
<text x="380.0" y="157.536" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">A candidate who has made the cards can revise the whole text in the last week. A candidate who has only read it has to read it again.</text>
<rect x="12" y="10" width="736" height="168.136" rx="9" fill="none" stroke="#008751" stroke-width="1.4"/>
</svg>
