  <rect x="0" y="0" width="760" height="218" fill="#FFFFFF"/>
<text x="380.0" y="26" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">The present-tense storyline, minute by minute</text>
<text x="380.0" y="40" font-family="DejaVu Sans" font-size="9.4" fill="#64748B" text-anchor="middle" font-weight="normal">Six beats hold the whole novel together.</text>
<rect x="12.0" y="63" width="101.0" height="115.072" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="12.0" y="63" width="101.0" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="62.5" y="85" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">ASSEMBLY</text>
<text x="62.5" y="101.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">Chapter 1. Bepo</text>
<text x="62.5" y="113.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">breaks down in</text>
<text x="62.5" y="126.024" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">front of the</text>
<text x="62.5" y="138.536" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">school; the MD</text>
<text x="62.5" y="151.048" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">sends for Pastor</text>
<text x="62.5" y="163.56" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">Ope Wande.</text>
<line x1="117.0" y1="120.536" x2="124.925" y2="120.536" stroke="#008751" stroke-width="1.6"/><polygon points="135.0,120.5 124.9,124.3 124.9,116.8" fill="#008751"/>
<rect x="139.0" y="63" width="101.0" height="115.072" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="139.0" y="63" width="101.0" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="189.5" y="85" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">FIVE DAYS</text>
<text x="189.5" y="101.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">Chapter 2. He</text>
<text x="189.5" y="113.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">tells the staff he</text>
<text x="189.5" y="126.024" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">is leaving. The</text>
<text x="189.5" y="138.536" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">farewell</text>
<text x="189.5" y="151.048" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">machinery</text>
<text x="189.5" y="163.56" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">begins.</text>
<line x1="244.0" y1="120.536" x2="251.925" y2="120.536" stroke="#008751" stroke-width="1.6"/><polygon points="262.0,120.5 251.9,124.3 251.9,116.8" fill="#008751"/>
<rect x="266.0" y="63" width="101.0" height="115.072" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="266.0" y="63" width="101.0" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="316.5" y="85" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">THE ROUND</text>
<text x="316.5" y="101.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">Chapters 3–10.</text>
<text x="316.5" y="113.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">The visits, the</text>
<text x="316.5" y="126.024" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">episodes and the</text>
<text x="316.5" y="138.536" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">errands that fill</text>
<text x="316.5" y="151.048" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">the wait.</text>
<line x1="371.0" y1="120.536" x2="378.925" y2="120.536" stroke="#008751" stroke-width="1.6"/><polygon points="389.0,120.5 378.9,124.3 378.9,116.8" fill="#008751"/>
<rect x="393.0" y="63" width="101.0" height="115.072" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="393.0" y="63" width="101.0" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="443.5" y="85" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">FAREWELL</text>
<text x="443.5" y="101.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">Chapter 11.</text>
<text x="443.5" y="113.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">Three days of</text>
<text x="443.5" y="126.024" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">events, ending</text>
<text x="443.5" y="138.536" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">with the drama</text>
<text x="443.5" y="151.048" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">that makes him</text>
<text x="443.5" y="163.56" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">shout.</text>
<line x1="498.0" y1="120.536" x2="505.925" y2="120.536" stroke="#008751" stroke-width="1.6"/><polygon points="516.0,120.5 505.9,124.3 505.9,116.8" fill="#008751"/>
<rect x="520.0" y="63" width="101.0" height="115.072" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="520.0" y="63" width="101.0" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="570.5" y="85" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">SATURDAY</text>
<text x="570.5" y="101.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">Chapter 12. 3</text>
<text x="570.5" y="113.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">p.m. he leaves</text>
<text x="570.5" y="126.024" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">home; 5 p.m.</text>
<text x="570.5" y="138.536" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">boarding; the</text>
<text x="570.5" y="151.048" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">dream; the plane</text>
<text x="570.5" y="163.56" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">he does not take.</text>
<line x1="625.0" y1="120.536" x2="632.925" y2="120.536" stroke="#008751" stroke-width="1.6"/><polygon points="643.0,120.5 632.9,124.3 632.9,116.8" fill="#008751"/>
<rect x="647.0" y="63" width="101.0" height="115.072" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="647.0" y="63" width="101.0" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="697.5" y="85" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">MONDAY</text>
<text x="697.5" y="101.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">Chapter 12. The</text>
<text x="697.5" y="113.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">MD addresses a</text>
<text x="697.5" y="126.024" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">school in</text>
<text x="697.5" y="138.536" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">mourning, and</text>
<text x="697.5" y="151.048" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">Bepo walks</text>
<text x="697.5" y="163.56" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">through the gate.</text>
<text x="380.0" y="195.072" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">Everything else in the book is either a flashback or an episode that fills the wait. When a question says “immediately before”, it is asking about these six.</text>
<rect x="12" y="10" width="736" height="205.672" rx="9" fill="none" stroke="#008751" stroke-width="1.4"/>
