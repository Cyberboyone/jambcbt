  <rect x="0" y="0" width="760" height="267" fill="#FFFFFF"/>
<text x="380.0" y="26" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">How the five style questions are worded</text>
<text x="380.0" y="38" font-family="DejaVu Sans" font-size="9.4" fill="#64748B" text-anchor="middle" font-weight="normal">Five shapes, and each one is answered by a device plus a purpose.</text>
<rect x="12" y="57" width="736" height="24" rx="5" fill="#0E1F40" stroke="#0E1F40" stroke-width="0"/>
<text x="20" y="73" font-family="DejaVu Sans" font-size="9.0" fill="#FFFFFF" text-anchor="start" font-weight="bold">Question</text>
<text x="241.8181818181818" y="73" font-family="DejaVu Sans" font-size="9.0" fill="#FFFFFF" text-anchor="start" font-weight="bold">What it wants</text>
<text x="485.81818181818187" y="73" font-family="DejaVu Sans" font-size="9.0" fill="#FFFFFF" text-anchor="start" font-weight="bold">The move</text>
<text x="20" y="95.0" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">“The novel is narrated in the …”</text>
<text x="241.8181818181818" y="95.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">The narrative person and its limit</text>
<text x="485.81818181818187" y="95.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">Third person, limited to Bepo</text>
<line x1="12" y1="105.328" x2="748" y2="105.328" stroke="#CBD5E1" stroke-width="0.6"/>
<rect x="12" y="105.328" width="736" height="24.328" rx="0" fill="#F8FAFC" stroke="none" stroke-width="0"/>
<text x="20" y="119.328" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">“The title of Chapter 7, *Ritualists*, is …”</text>
<text x="241.8181818181818" y="119.328" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">What the title points at</text>
<text x="485.81818181818187" y="119.328" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">The people who perform the rite, and Bepo's refusal</text>
<line x1="12" y1="129.656" x2="748" y2="129.656" stroke="#CBD5E1" stroke-width="0.6"/>
<text x="20" y="143.656" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">“The reference to the snake in the roof is an</text>
<text x="20" y="155.984" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">example of …”</text>
<text x="241.8181818181818" y="143.656" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">The device and its meaning</text>
<text x="485.81818181818187" y="143.656" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">Proverb used as metaphor; danger housed, not</text>
<text x="485.81818181818187" y="155.984" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">invaded</text>
<line x1="12" y1="166.312" x2="748" y2="166.312" stroke="#CBD5E1" stroke-width="0.6"/>
<rect x="12" y="166.312" width="736" height="24.328" rx="0" fill="#F8FAFC" stroke="none" stroke-width="0"/>
<text x="20" y="180.312" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">“The writer's tone in Chapter 12 is …”</text>
<text x="241.8181818181818" y="180.312" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">The feeling the ending leaves</text>
<text x="485.81818181818187" y="180.312" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">Hopeful, and deliberately unresolved</text>
<line x1="12" y1="190.64000000000001" x2="748" y2="190.64000000000001" stroke="#CBD5E1" stroke-width="0.6"/>
<text x="20" y="204.64000000000001" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">“The use of *japa* suggests …”</text>
<text x="241.8181818181818" y="204.64000000000001" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">The register and its effect</text>
<text x="485.81818181818187" y="204.64000000000001" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">Local idiom; the theme named in the language of the</text>
<text x="485.81818181818187" y="216.96800000000002" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">street</text>
<line x1="12" y1="227.29600000000002" x2="748" y2="227.29600000000002" stroke="#CBD5E1" stroke-width="0.6"/>
<text x="380.0" y="244.29600000000002" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">An option that names the device but not its work is half an answer, and the paper is built to punish it.</text>
<rect x="12" y="10" width="736" height="252.89600000000002" rx="9" fill="none" stroke="#008751" stroke-width="1.4"/>
</svg>
