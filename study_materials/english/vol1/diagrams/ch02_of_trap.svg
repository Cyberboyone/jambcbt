  <rect x="0" y="0" width="760" height="209" fill="#FFFFFF"/>
<text x="380.0" y="26" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">The head noun decides the verb, not the nearest noun</text>
<text x="380.0" y="40" font-family="DejaVu Sans" font-size="9.4" fill="#64748B" text-anchor="middle" font-weight="normal">A prepositional phrase after the subject is a passenger. Take it out and the agreement is obvious.</text>
<rect x="220.0" y="61" width="320" height="34" rx="7" fill="#ECFDF5" stroke="#008751" stroke-width="1.5"/>
<text x="380.0" y="83" font-family="DejaVu Sans" font-size="11.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">The verb agrees with the HEAD of the subject</text>
<line x1="380.0" y1="95" x2="380.0" y2="109" stroke="#008751" stroke-width="1.6"/>
<line x1="137.33333333333331" y1="109" x2="622.6666666666666" y2="109" stroke="#008751" stroke-width="1.6"/>
<line x1="137.33333333333331" y1="109" x2="137.33333333333331" y2="119" stroke="#008751" stroke-width="1.6"/>
<rect x="21.0" y="119" width="232.66666666666666" height="50.512" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<text x="137.33333333333331" y="139" font-family="DejaVu Sans" font-size="9.8" fill="#0E1F40" text-anchor="middle" font-weight="bold">The box of books</text>
<text x="137.33333333333331" y="155.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">head = box (singular) → is</text>
<line x1="379.99999999999994" y1="109" x2="379.99999999999994" y2="119" stroke="#008751" stroke-width="1.6"/>
<rect x="263.66666666666663" y="119" width="232.66666666666666" height="50.512" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<text x="379.99999999999994" y="139" font-family="DejaVu Sans" font-size="9.8" fill="#0E1F40" text-anchor="middle" font-weight="bold">The books in the box</text>
<text x="379.99999999999994" y="155.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">head = books (plural) → are</text>
<line x1="622.6666666666666" y1="109" x2="622.6666666666666" y2="119" stroke="#008751" stroke-width="1.6"/>
<rect x="506.3333333333333" y="119" width="232.66666666666666" height="50.512" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<text x="622.6666666666666" y="139" font-family="DejaVu Sans" font-size="9.8" fill="#0E1F40" text-anchor="middle" font-weight="bold">The list of names</text>
<text x="622.6666666666666" y="155.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">head = list (singular) → was</text>
<text x="380.0" y="186.512" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">Read the sentence twice: once in full, once with the phrase in brackets deleted. The version you can say aloud is the version the examiner wants.</text>
<rect x="12" y="10" width="736" height="197.112" rx="9" fill="none" stroke="#008751" stroke-width="1.4"/>
</svg>
