<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 161" width="760" height="161">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="161" fill="#FFFFFF"/>
<text x="380.0" y="26" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">Three modifier faults, and the repair each one needs</text>
<rect x="12.0" y="38.0" width="240.0" height="83.536" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.3"/>
<rect x="12.0" y="38.0" width="240.0" height="4.5" rx="2" fill="#DC2626" stroke="#DC2626" stroke-width="0"/>
<text x="22.0" y="59.0" font-family="DejaVu Sans" font-size="9.8" fill="#0E1F40" text-anchor="start" font-weight="bold">Dangling</text>
<text x="22.0" y="75.4" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">Walking to school, the rain began. The rain was</text>
<text x="22.0" y="87.912" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">not walking — name the doer: Walking to</text>
<text x="22.0" y="100.424" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">school, I was caught in the rain.</text>
<rect x="260.0" y="38.0" width="240.0" height="83.536" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.3"/>
<rect x="260.0" y="38.0" width="240.0" height="4.5" rx="2" fill="#DC2626" stroke="#DC2626" stroke-width="0"/>
<text x="270.0" y="59.0" font-family="DejaVu Sans" font-size="9.8" fill="#0E1F40" text-anchor="start" font-weight="bold">Misplaced</text>
<text x="270.0" y="75.4" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">She served tea to the guests in paper cups.</text>
<text x="270.0" y="87.912" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">The guests were not in cups: She served tea in</text>
<text x="270.0" y="100.424" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">paper cups to the guests.</text>
<rect x="508.0" y="38.0" width="240.0" height="83.536" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.3"/>
<rect x="508.0" y="38.0" width="240.0" height="4.5" rx="2" fill="#DC2626" stroke="#DC2626" stroke-width="0"/>
<text x="518.0" y="59.0" font-family="DejaVu Sans" font-size="9.8" fill="#0E1F40" text-anchor="start" font-weight="bold">Squinting</text>
<text x="518.0" y="75.4" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">What he said clearly annoyed her. Did he say it</text>
<text x="518.0" y="87.912" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">clearly, or was she clearly annoyed? Move the</text>
<text x="518.0" y="100.424" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">adverb.</text>
<text x="380.0" y="138.536" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">An adverb of manner sits next to the verb it describes, an only sits immediately before the word it limits, and a participial phrase opens with the doer's name.</text>
<rect x="12" y="10" width="736" height="147.136" rx="9" fill="none" stroke="#DC2626" stroke-width="1.4"/>
</svg>
