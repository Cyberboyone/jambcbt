<text x="380.0" y="26" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">Three ways to repair a comma splice</text>
<text x="380.0" y="40" font-family="DejaVu Sans" font-size="9.4" fill="#64748B" text-anchor="middle" font-weight="normal">The rain stopped, we left at once. — wrong: two full sentences, one comma.</text>
<rect x="12.0" y="63" width="228.0" height="52.512" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.3"/>
<rect x="12.0" y="63" width="228.0" height="4.5" rx="2" fill="#DC2626" stroke="#DC2626" stroke-width="0"/>
<text x="126.0" y="85" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">FULL STOP</text>
<text x="126.0" y="101.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">The rain stopped. We left at once.</text>
<line x1="244.0" y1="89.256" x2="251.925" y2="89.256" stroke="#DC2626" stroke-width="1.6"/><polygon points="262.0,89.3 251.9,93.0 251.9,85.5" fill="#DC2626"/>
<rect x="266.0" y="63" width="228.0" height="52.512" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.3"/>
<rect x="266.0" y="63" width="228.0" height="4.5" rx="2" fill="#DC2626" stroke="#DC2626" stroke-width="0"/>
<text x="380.0" y="85" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">SEMICOLON</text>
<text x="380.0" y="101.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">The rain stopped; we left at once.</text>
<line x1="498.0" y1="89.256" x2="505.925" y2="89.256" stroke="#DC2626" stroke-width="1.6"/><polygon points="516.0,89.3 505.9,93.0 505.9,85.5" fill="#DC2626"/>
<rect x="520.0" y="63" width="228.0" height="52.512" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.3"/>
<rect x="520.0" y="63" width="228.0" height="4.5" rx="2" fill="#DC2626" stroke="#DC2626" stroke-width="0"/>
<text x="634.0" y="85" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">CONJUNCTION</text>
<text x="634.0" y="101.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">The rain stopped, so we left at once.</text>
<text x="380.0" y="132.512" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">Never repair it with a comma plus however, therefore or moreover alone: those are adverbs, not conjunctions, and the splice survives.</text>
<rect x="12" y="10" width="736" height="143.112" rx="9" fill="none" stroke="#DC2626" stroke-width="1.4"/>
</svg>
