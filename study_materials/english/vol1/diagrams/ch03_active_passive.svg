<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 168" width="760" height="168">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="168" fill="#FFFFFF"/>
<text x="380.0" y="26" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">Turning an active sentence into the passive in four moves</text>
<text x="380.0" y="40" font-family="DejaVu Sans" font-size="9.4" fill="#64748B" text-anchor="middle" font-weight="normal">The player kicked the ball → The ball was kicked by the player.</text>
<rect x="12.0" y="63" width="164.5" height="65.024" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
<rect x="12.0" y="63" width="164.5" height="4.5" rx="2" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="94.25" y="85" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">1  OBJECT</text>
<text x="94.25" y="101.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">The ball — make it the new</text>
<text x="94.25" y="113.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">subject</text>
<line x1="180.5" y1="95.512" x2="188.425" y2="95.512" stroke="#2563EB" stroke-width="1.6"/><polygon points="198.5,95.5 188.4,99.3 188.4,91.7" fill="#2563EB"/>
<rect x="202.5" y="63" width="164.5" height="65.024" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
<rect x="202.5" y="63" width="164.5" height="4.5" rx="2" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="284.75" y="85" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">2  BE</text>
<text x="284.75" y="101.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">Choose the tense of be that</text>
<text x="284.75" y="113.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">matches the original verb: was</text>
<line x1="371.0" y1="95.512" x2="378.925" y2="95.512" stroke="#2563EB" stroke-width="1.6"/><polygon points="389.0,95.5 378.9,99.3 378.9,91.7" fill="#2563EB"/>
<rect x="393.0" y="63" width="164.5" height="65.024" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
<rect x="393.0" y="63" width="164.5" height="4.5" rx="2" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="475.25" y="85" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">3  PARTICIPLE</text>
<text x="475.25" y="101.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">Use the past participle: kicked</text>
<line x1="561.5" y1="95.512" x2="569.425" y2="95.512" stroke="#2563EB" stroke-width="1.6"/><polygon points="579.5,95.5 569.4,99.3 569.4,91.7" fill="#2563EB"/>
<rect x="583.5" y="63" width="164.5" height="65.024" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
<rect x="583.5" y="63" width="164.5" height="4.5" rx="2" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="665.75" y="85" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">4  AGENT</text>
<text x="665.75" y="101.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">The player — added with by, or</text>
<text x="665.75" y="113.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">dropped</text>
<text x="380.0" y="145.024" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">Only a transitive verb has a passive. Nothing can be done to sleep, arrive or happen, so a passive of those verbs is always a wrong option.</text>
<rect x="12" y="10" width="736" height="155.624" rx="9" fill="none" stroke="#2563EB" stroke-width="1.4"/>
</svg>
