    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="168" fill="#FFFFFF"/>
<text x="380.0" y="26" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">One sentence, and the job of each block</text>
<text x="380.0" y="40" font-family="DejaVu Sans" font-size="9.4" fill="#64748B" text-anchor="middle" font-weight="normal">The tall boy kicked the ball into the net.</text>
<rect x="12.0" y="63" width="164.5" height="65.024" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="12.0" y="63" width="164.5" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="94.25" y="85" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">SUBJECT</text>
<text x="94.25" y="101.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">The tall boy — who or what the</text>
<text x="94.25" y="113.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">sentence is about</text>
<line x1="180.5" y1="95.512" x2="188.425" y2="95.512" stroke="#008751" stroke-width="1.6"/><polygon points="198.5,95.5 188.4,99.3 188.4,91.7" fill="#008751"/>
<rect x="202.5" y="63" width="164.5" height="65.024" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="202.5" y="63" width="164.5" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="284.75" y="85" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">VERB</text>
<text x="284.75" y="101.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">kicked — what the subject did</text>
<line x1="371.0" y1="95.512" x2="378.925" y2="95.512" stroke="#008751" stroke-width="1.6"/><polygon points="389.0,95.5 378.9,99.3 378.9,91.7" fill="#008751"/>
<rect x="393.0" y="63" width="164.5" height="65.024" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="393.0" y="63" width="164.5" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="475.25" y="85" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">OBJECT</text>
<text x="475.25" y="101.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">the ball — what received the</text>
<text x="475.25" y="113.512" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">action</text>
<line x1="561.5" y1="95.512" x2="569.425" y2="95.512" stroke="#008751" stroke-width="1.6"/><polygon points="579.5,95.5 569.4,99.3 569.4,91.7" fill="#008751"/>
<rect x="583.5" y="63" width="164.5" height="65.024" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="583.5" y="63" width="164.5" height="4.5" rx="2" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="665.75" y="85" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">ADVERBIAL</text>
<text x="665.75" y="101.0" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">into the net — where it went</text>
<text x="380.0" y="145.024" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">Every word in the sentence must slot into one of these jobs. Naming the job is what tells you which form of the word the examiner's blank needs.</text>
<rect x="12" y="10" width="736" height="155.624" rx="9" fill="none" stroke="#008751" stroke-width="1.4"/>
</svg>
