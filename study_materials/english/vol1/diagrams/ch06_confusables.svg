<text x="20" y="270.624" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">quiet / quite</text>
<text x="179.1304347826087" y="270.624" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">silent / fairly</text>
<text x="433.7391304347826" y="270.624" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">a quiet room; quite good</text>
