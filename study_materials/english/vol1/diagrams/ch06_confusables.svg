<line x1="12" y1="353.9359999999999" x2="748" y2="353.9359999999999" stroke="#CBD5E1" stroke-width="0.6"/>
<text x="380.0" y="370.9359999999999" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">Six of these twelve have appeared in recent papers. Learn the pair, not the word: the question always sets one against the other.</text>
