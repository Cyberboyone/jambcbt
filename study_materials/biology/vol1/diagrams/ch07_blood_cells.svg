   <g id="text_1">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(28.816875 119.082586)">Red blood cells (erythrocytes):</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(32.781469 128.444719)">biconcave discs, no nucleus,</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(33.161719 137.806852)">packed with haemoglobin —</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(63.031453 147.168375)">carry oxygen</text>
   </g>
