   <g id="text_2">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(169.977609 119.081977)">White blood cells (leucocytes):</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(167.623594 128.444109)">nucleus present, change shape,</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(165.627281 137.806242)">defend the body — phagocytosis</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(200.938125 147.168375)">and antibodies</text>
   </g>
