   <g id="text_3">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(282.955828 119.081977)">Platelets (thrombocytes):</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(276.726187 128.444109)">cell fragments; start clotting</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(284.367141 137.806242)">by converting fibrinogen</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(317.082656 147.168375)">to fibrin</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #2563eb" transform="translate(401.552125 76.35825) rotate(-90)">PLASMA</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(353.859844 128.444109)">Plasma: straw-coloured</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(361.837781 137.806242)">liquid; carries cells,</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(354.873844 147.168375)">food, waste, hormones</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 10.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0e1f40" x="215.706" y="15.102375" transform="rotate(-0 215.706 15.102375)">The four components of blood</text>
   </g>
