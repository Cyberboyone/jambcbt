   <g id="text_1">
    <text style="font-weight: 700; font-size: 10.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0e1f40" x="208.333636" y="15.997692" transform="rotate(-0 208.333636 15.997692)">The nephron — the functional unit of the kidney</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #334155" x="206.685" y="39.191607" transform="rotate(-0 206.685 39.191607)">1  Glomerulus — a knot of capillaries under pressure</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #334155" x="206.685" y="51.188459" transform="rotate(-0 206.685 51.188459)">2  Bowman's capsule — ultrafiltration: water, glucose,</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #334155" x="215.587636" y="61.185836" transform="rotate(-0 215.587636 61.185836)">amino acids, urea and salts are forced out</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #334155" x="206.685" y="73.182689" transform="rotate(-0 206.685 73.182689)">3  Proximal tubule — selective reabsorption of all the</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #334155" x="215.587636" y="83.180066" transform="rotate(-0 215.587636 83.180066)">glucose and amino acids, most of the water</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #334155" x="206.685" y="95.176918" transform="rotate(-0 206.685 95.176918)">4  Loop of Henle — more water is reabsorbed, so the</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #334155" x="215.587636" y="105.174295" transform="rotate(-0 215.587636 105.174295)">urine becomes concentrated</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #334155" x="206.685" y="117.171148" transform="rotate(-0 206.685 117.171148)">5  Collecting duct — urine passes to the pelvis of the</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #334155" x="215.587636" y="127.168525" transform="rotate(-0 215.587636 127.168525)">kidney, then the ureter, bladder and urethra</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #dc2626" x="206.685" y="149.162754" transform="rotate(-0 206.685 149.162754)">What is FILTERED OUT</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #334155" x="206.685" y="159.160131" transform="rotate(-0 206.685 159.160131)">water, glucose, amino acids, urea and salts —</text>
   </g>
   <g id="text_13">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #334155" x="206.685" y="169.157508" transform="rotate(-0 206.685 169.157508)">anything small enough to pass the filter</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2563eb" x="206.685" y="185.153311" transform="rotate(-0 206.685 185.153311)">What is KEPT IN THE BLOOD</text>
   </g>
   <g id="text_15">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #334155" x="206.685" y="195.150689" transform="rotate(-0 206.685 195.150689)">blood cells and large proteins — they are too big</text>
   </g>
   <g id="text_16">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #334155" x="206.685" y="205.148066" transform="rotate(-0 206.685 205.148066)">to pass, which is why they never appear in urine</text>
   </g>
   <g id="text_17">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #64748b" x="206.685" y="223.143344" transform="rotate(-0 206.685 223.143344)">Urine therefore contains: urea, excess salts, excess water and any drugs.</text>
   </g>
