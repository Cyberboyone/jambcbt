<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="780" height="330" fill="#FFFFFF"/>
<text x="390" y="20" font-family="DejaVu Sans" font-size="12.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">ONE NEPHRON — THE KIDNEY'S WORKING UNIT</text>
<rect x="20" y="56" width="300" height="62" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<text x="170" y="74" font-family="DejaVu Sans" font-size="8.6" fill="#2563EB" text-anchor="middle" font-weight="bold">GLOMERULUS + BOWMAN'S CAPSULE</text>
<text x="170" y="94" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">Ultrafiltration: pressure forces water, salts,</text>
<text x="170" y="108" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">glucose and urea out of the blood.</text>
<line x1="324" y1="87" x2="362" y2="87" stroke="#64748B" stroke-width="1.3" marker-end="url(#ag)"/>
<rect x="366" y="56" width="258" height="62" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.5"/>
<text x="495" y="74" font-family="DejaVu Sans" font-size="8.6" fill="#008751" text-anchor="middle" font-weight="bold">PROXIMAL TUBULE</text>
<text x="495" y="94" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">Selective reabsorption: ALL glucose, most salts</text>
<text x="495" y="108" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">and much water return to the blood here.</text>
<line x1="628" y1="87" x2="666" y2="87" stroke="#64748B" stroke-width="1.3" marker-end="url(#ag)"/>
<rect x="670" y="56" width="92" height="62" rx="7" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="716" y="78" font-family="DejaVu Sans" font-size="8.4" fill="#7C3AED" text-anchor="middle" font-weight="bold">LOOP OF</text>
<text x="716" y="92" font-family="DejaVu Sans" font-size="8.4" fill="#7C3AED" text-anchor="middle" font-weight="bold">HENLE</text>
<text x="716" y="108" font-family="DejaVu Sans" font-size="6.8" fill="#334155" text-anchor="middle" font-weight="normal">more water out</text>
<line x1="716" y1="122" x2="716" y2="152" stroke="#64748B" stroke-width="1.3" marker-end="url(#ag)"/>
<rect x="366" y="202" width="258" height="62" rx="7" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
<text x="495" y="220" font-family="DejaVu Sans" font-size="8.6" fill="#D97706" text-anchor="middle" font-weight="bold">DISTAL TUBULE</text>
<text x="495" y="240" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">Reabsorption fine-tuned by hormones (ADH).</text>
<text x="495" y="254" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">Adjusts salt and water to the body's needs.</text>
<line x1="716" y1="156" x2="716" y2="213" stroke="#64748B" stroke-width="1.3" marker-end="url(#ag)"/>
<line x1="716" y1="213" x2="628" y2="232" stroke="#CBD5E1" stroke-width="1.2"/>
<line x1="362" y1="232" x2="320" y2="232" stroke="#64748B" stroke-width="1.3" marker-end="url(#ag)"/>
<rect x="20" y="202" width="296" height="62" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
<text x="168" y="220" font-family="DejaVu Sans" font-size="8.6" fill="#DC2626" text-anchor="middle" font-weight="bold">COLLECTING DUCT</text>
<text x="168" y="240" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">ADH controls final water reabsorption here.</text>
<text x="168" y="254" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">What is left = urine: water, urea, excess salts.</text>
<rect x="20" y="286" width="742" height="40" rx="7" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.1"/>
<text x="390" y="308" font-family="DejaVu Sans" font-size="7.9" fill="#0E1F40" text-anchor="middle" font-weight="normal">Rule for every exam question: nothing useful is lost in urine — glucose, proteins and blood cells are never found in a healthy person's urine.</text>
</svg>
