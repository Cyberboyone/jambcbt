<text x="232" y="100" font-family="DejaVu Sans" font-size="11" fill="#2563EB" text-anchor="middle" font-weight="bold">TISSUE</text>
<text x="232" y="122" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">muscle tissue</text>
<text x="232" y="138" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">similar cells, one job</text>
