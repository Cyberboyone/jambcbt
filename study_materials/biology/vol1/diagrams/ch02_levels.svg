  <rect x="0" y="0" width="760" height="210" fill="#FFFFFF"/>
<text x="380" y="24" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">FROM CELL TO ORGANISM — THE LEVELS OF ORGANISATION</text>
<rect x="18" y="70" width="132" height="78" rx="9" fill="#FFFFFF" stroke="#008751" stroke-width="1.6"/>
<rect x="18" y="70" width="132" height="6" rx="3" fill="#008751"/>
<text x="84" y="100" font-family="DejaVu Sans" font-size="11" fill="#008751" text-anchor="middle" font-weight="bold">CELL</text>
<text x="84" y="122" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">muscle cell</text>
<text x="84" y="138" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">smallest living unit</text>
