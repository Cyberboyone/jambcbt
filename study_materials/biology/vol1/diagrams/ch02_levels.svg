<text x="528" y="100" font-family="DejaVu Sans" font-size="11" fill="#D97706" text-anchor="middle" font-weight="bold">SYSTEM</text>
<text x="528" y="122" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">digestive system</text>
<text x="528" y="138" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">organs working together</text>
