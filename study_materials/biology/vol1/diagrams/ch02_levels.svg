<text x="380" y="100" font-family="DejaVu Sans" font-size="11" fill="#7C3AED" text-anchor="middle" font-weight="bold">ORGAN</text>
<text x="380" y="122" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">stomach</text>
<text x="380" y="138" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">tissues working together</text>
<line x1="448" y1="109" x2="460" y2="109" stroke="#64748B" stroke-width="1.4" marker-end="url(#an)"/>
<rect x="462" y="70" width="132" height="78" rx="9" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6"/>
