<rect x="610" y="70" width="132" height="78" rx="9" fill="#FFFFFF" stroke="#00A859" stroke-width="1.6"/>
<rect x="610" y="70" width="132" height="6" rx="3" fill="#00A859"/>
<text x="676" y="100" font-family="DejaVu Sans" font-size="11" fill="#00A859" text-anchor="middle" font-weight="bold">ORGANISM</text>
<text x="676" y="122" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">the whole body</text>
<text x="676" y="138" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">all systems together</text>
<text x="380" y="182" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">In the exam a “level of organisation” question is answered by naming the level and one concrete example from it.</text>
