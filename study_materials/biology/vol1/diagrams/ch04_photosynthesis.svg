<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="300" fill="#FFFFFF"/>
<text x="380" y="24" font-family="DejaVu Sans" font-size="13" fill="#0E1F40" text-anchor="middle" font-weight="bold">PHOTOSYNTHESIS — WHAT GOES IN, WHAT COMES OUT</text>
<rect x="24" y="60" width="168" height="76" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.5"/>
<rect x="24" y="156" width="168" height="76" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<rect x="300" y="92" width="176" height="112" rx="9" fill="#FFFFFF" stroke="#008751" stroke-width="1.8"/>
<rect x="566" y="60" width="170" height="76" rx="8" fill="#ECFDF5" stroke="#00A859" stroke-width="1.5"/>
<rect x="566" y="156" width="170" height="76" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="108" y="88" font-family="DejaVu Sans" font-size="8.6" fill="#008751" text-anchor="middle" font-weight="bold">RAW MATERIALS</text>
<text x="108" y="108" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">Carbon dioxide</text>
<text x="108" y="124" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">from the air, through stomata</text>
<text x="108" y="184" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">Water</text>
<text x="108" y="200" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">from the soil, by the roots</text>
<text x="388" y="120" font-family="DejaVu Sans" font-size="11.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">6CO₂ + 6H₂O</text>
<text x="388" y="146" font-family="DejaVu Sans" font-size="8.6" fill="#008751" text-anchor="middle" font-weight="normal">chlorophyll + light</text>
<text x="388" y="172" font-family="DejaVu Sans" font-size="11.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">C₆H₁₂O₆ + 6O₂</text>
<text x="388" y="192" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="middle" font-weight="normal">glucose + oxygen</text>
<text x="651" y="88" font-family="DejaVu Sans" font-size="8.6" fill="#00A859" text-anchor="middle" font-weight="bold">PRODUCTS</text>
<text x="651" y="110" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">Glucose (C₆H₁₂O₆)</text>
<text x="651" y="126" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">used for energy, starch, cellulose</text>
<text x="651" y="184" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">Oxygen</text>
<text x="651" y="200" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">released through the stomata</text>
<line x1="196" y1="98" x2="296" y2="120" stroke="#008751" stroke-width="1.8" marker-end="url(#ag)"/>
<line x1="196" y1="194" x2="296" y2="172" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ag)"/>
<line x1="480" y1="120" x2="562" y2="98" stroke="#00A859" stroke-width="1.8" marker-end="url(#ag)"/>
<line x1="480" y1="172" x2="562" y2="194" stroke="#D97706" stroke-width="1.8" marker-end="url(#ag)"/>
<text x="380" y="250" font-family="DejaVu Sans" font-size="9" fill="#334155" text-anchor="middle" font-weight="normal">Light energy is trapped by chlorophyll and stored as chemical energy in glucose.</text>
<text x="380" y="272" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="middle" font-weight="normal">Where: the chloroplasts of the palisade mesophyll.  When: in daylight.  Raw materials: carbon dioxide and water.</text>
</svg>
