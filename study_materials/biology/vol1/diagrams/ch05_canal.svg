<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="22" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">THE HUMAN ALIMENTARY CANAL — IN ORDER</text>
<rect x="30" y="44" width="190" height="34" rx="6" fill="#FFFFFF" stroke="#008751" stroke-width="1.4"/>
<text x="125" y="65" font-family="DejaVu Sans" font-size="9.2" fill="#008751" text-anchor="middle" font-weight="bold">MOUTH</text>
<rect x="240" y="44" width="250" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.0"/>
<text x="365" y="65" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">amylase</text>
<line x1="125" y1="78" x2="125" y2="88" stroke="#64748B" stroke-width="1.2" marker-end="url(#ag)"/>
<rect x="30" y="88" width="190" height="34" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
<text x="125" y="109" font-family="DejaVu Sans" font-size="9.2" fill="#2563EB" text-anchor="middle" font-weight="bold">OESOPHAGUS</text>
<rect x="240" y="88" width="250" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.0"/>
<text x="365" y="109" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">peristalsis</text>
<line x1="125" y1="122" x2="125" y2="132" stroke="#64748B" stroke-width="1.2" marker-end="url(#ag)"/>
<rect x="30" y="132" width="190" height="34" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
<text x="125" y="153" font-family="DejaVu Sans" font-size="9.2" fill="#7C3AED" text-anchor="middle" font-weight="bold">STOMACH</text>
<rect x="240" y="132" width="250" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.0"/>
<text x="365" y="153" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">pepsin + acid</text>
<line x1="125" y1="166" x2="125" y2="176" stroke="#64748B" stroke-width="1.2" marker-end="url(#ag)"/>
<rect x="30" y="176" width="190" height="34" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/>
<text x="125" y="197" font-family="DejaVu Sans" font-size="9.2" fill="#D97706" text-anchor="middle" font-weight="bold">DUODENUM</text>
<rect x="240" y="176" width="250" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.0"/>
<text x="365" y="197" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">pancreatic enzymes + bile</text>
<line x1="125" y1="210" x2="125" y2="220" stroke="#64748B" stroke-width="1.2" marker-end="url(#ag)"/>
<rect x="30" y="220" width="190" height="34" rx="6" fill="#FFFFFF" stroke="#00A859" stroke-width="1.4"/>
<text x="125" y="241" font-family="DejaVu Sans" font-size="9.2" fill="#00A859" text-anchor="middle" font-weight="bold">ILEUM</text>
<rect x="240" y="220" width="250" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.0"/>
<text x="365" y="241" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">absorption</text>
<line x1="125" y1="254" x2="125" y2="264" stroke="#64748B" stroke-width="1.2" marker-end="url(#ag)"/>
<rect x="30" y="264" width="190" height="34" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
<text x="125" y="285" font-family="DejaVu Sans" font-size="9.2" fill="#2563EB" text-anchor="middle" font-weight="bold">COLON</text>
<rect x="240" y="264" width="250" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.0"/>
<text x="365" y="285" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">water absorbed</text>
<line x1="125" y1="298" x2="125" y2="308" stroke="#64748B" stroke-width="1.2" marker-end="url(#ag)"/>
<rect x="30" y="308" width="190" height="34" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.4"/>
<text x="125" y="329" font-family="DejaVu Sans" font-size="9.2" fill="#DC2626" text-anchor="middle" font-weight="bold">RECTUM / ANUS</text>
<rect x="240" y="308" width="250" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.0"/>
<text x="365" y="329" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">egestion</text>
<rect x="516" y="60" width="226" height="110" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.2"/>
<text x="629" y="82" font-family="DejaVu Sans" font-size="9.4" fill="#008751" text-anchor="middle" font-weight="bold">Glands that add enzymes</text>
<text x="528" y="102" font-family="DejaVu Sans" font-size="8" fill="#334155" text-anchor="start" font-weight="normal">• Salivary glands → mouth</text>
<text x="528" y="118" font-family="DejaVu Sans" font-size="8" fill="#334155" text-anchor="start" font-weight="normal">• Gastric glands → stomach</text>
<text x="528" y="134" font-family="DejaVu Sans" font-size="8" fill="#334155" text-anchor="start" font-weight="normal">• Pancreas → duodenum</text>
<text x="528" y="150" font-family="DejaVu Sans" font-size="8" fill="#334155" text-anchor="start" font-weight="normal">• Liver (bile) → duodenum</text>
<text x="528" y="166" font-family="DejaVu Sans" font-size="8" fill="#334155" text-anchor="start" font-weight="normal">• Intestinal glands → ileum</text>
<rect x="516" y="190" width="226" height="120" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/>
<text x="629" y="212" font-family="DejaVu Sans" font-size="9.4" fill="#2563EB" text-anchor="middle" font-weight="bold">Where absorption happens</text>
<text x="528" y="234" font-family="DejaVu Sans" font-size="8" fill="#334155" text-anchor="start" font-weight="normal">• Stomach: water, alcohol, some drugs</text>
<text x="528" y="252" font-family="DejaVu Sans" font-size="8" fill="#334155" text-anchor="start" font-weight="normal">• Ileum: almost everything else</text>
<text x="528" y="270" font-family="DejaVu Sans" font-size="8" fill="#334155" text-anchor="start" font-weight="normal">• Colon: water and mineral salts</text>
<text x="528" y="292" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="start" font-weight="normal">The ileum is folded into villi to give</text>
<text x="528" y="304" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="start" font-weight="normal">a huge surface area.</text>
</svg>
