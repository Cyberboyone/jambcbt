<text x="380" y="276" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="middle" font-weight="normal">Dental formulae count the teeth in ONE HALF of each jaw — multiply by 4 for the total. Human: (2+1+2+3) × 4 = 32.</text>
