<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="320" fill="#FFFFFF"/>
<text x="380" y="24" font-family="DejaVu Sans" font-size="13" fill="#0E1F40" text-anchor="middle" font-weight="bold">THE TRANSPIRATION PULL</text>
<rect x="0" y="270" width="760" height="50" fill="#FEF3C7"/>
<text x="380" y="300" font-family="DejaVu Sans" font-size="8.6" fill="#D97706" text-anchor="middle" font-weight="normal">SOIL — water enters the root hair by osmosis; mineral salts by active transport</text>
<path d="M 355 270 L 340 320 M 405 270 L 420 318 M 380 270 L 380 322" stroke="#D97706" stroke-width="2.2" fill="none"/>
<rect x="345" y="120" width="70" height="152" rx="6" fill="#F0FDF4" stroke="#008751" stroke-width="1.6"/>
<rect x="368" y="120" width="10" height="152" fill="#DC2626" opacity="0.85"/>
<rect x="382" y="120" width="8" height="152" fill="#2563EB" opacity="0.85"/>
<ellipse cx="300" cy="96" rx="58" ry="26" fill="#ECFDF5" stroke="#008751" stroke-width="1.6" transform="rotate(18 300 96)"/>
<ellipse cx="460" cy="96" rx="58" ry="26" fill="#ECFDF5" stroke="#008751" stroke-width="1.6" transform="rotate(-18 460 96)"/>
<path d="M 380 120 L 300 96 M 380 120 L 460 96" stroke="#008751" stroke-width="2.2"/>
<line x1="352" y1="78" x2="318" y2="56" stroke="#2563EB" stroke-width="1.5" marker-end="url(#an)"/>
<line x1="408" y1="78" x2="442" y2="56" stroke="#2563EB" stroke-width="1.5" marker-end="url(#an)"/>
<text x="300" y="40" font-family="DejaVu Sans" font-size="8.2" fill="#2563EB" text-anchor="middle" font-weight="normal">water vapour lost</text>
<text x="470" y="40" font-family="DejaVu Sans" font-size="8.2" fill="#2563EB" text-anchor="middle" font-weight="normal">water vapour lost</text>
<text x="380" y="116" font-family="DejaVu Sans" font-size="8" fill="#0E1F40" text-anchor="middle" font-weight="normal"></text>
<text x="368" y="285" font-family="DejaVu Sans" font-size="8.2" fill="#DC2626" text-anchor="end" font-weight="bold">xylem</text>
<text x="392" y="285" font-family="DejaVu Sans" font-size="8.2" fill="#2563EB" text-anchor="start" font-weight="bold">phloem</text>
<text x="560" y="150" font-family="DejaVu Sans" font-size="8.8" fill="#DC2626" text-anchor="start" font-weight="bold">Xylem: dead, hollow, lignified</text>
<text x="560" y="168" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">Water and mineral salts travel</text>
<text x="560" y="182" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">UPWARDS only, from root to leaf,</text>
<text x="560" y="196" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">pulled by transpiration.</text>
<text x="560" y="220" font-family="DejaVu Sans" font-size="8.8" fill="#2563EB" text-anchor="start" font-weight="bold">Phloem: living cells with sieve</text>
<text x="560" y="238" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">plates; sugar and amino acids</text>
<text x="560" y="252" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">travel UP and DOWN, from leaf</text>
<text x="560" y="266" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">to root, by translocation.</text>
<text x="120" y="150" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="start" font-weight="bold">Transpiration is the loss of</text>
<text x="120" y="168" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">water vapour from the leaves,</text>
<text x="120" y="182" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">mostly through the stomata.</text>
<text x="120" y="206" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="start" font-weight="bold">It pulls water up the xylem:</text>
<text x="120" y="224" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">transpiration pull.</text>
<text x="120" y="248" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">Faster when: hot, dry, windy,</text>
<text x="120" y="262" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">bright — and when stomata open.</text>
</svg>
