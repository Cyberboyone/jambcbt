   <g id="text_2">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(309.258707 20.96118)">Epidermis — dead, keratinised</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(323.830348 29.843203)">outer cells; waterproof</text>
   </g>
   <g id="patch_9">
    <path d="M 310.688201 90.746733 
Q 249.107117 96.423366 187.526032 102.1 
" style="fill: none; stroke: #64748b; stroke-width: 0.9; stroke-linecap: round"/>
   </g>
   <g id="text_3">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(324.837199 78.357091)">Dermis — sweat glands,</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(314.680121 87.239115)">blood vessels, nerve endings,</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(347.341871 96.121138)">hair follicles</text>
   </g>
   <g id="patch_10">
    <path d="M 106.056832 86.294692 
Q 119.364504 89.698309 132.672175 93.101926 
" style="fill: none; stroke: #64748b; stroke-width: 0.9; stroke-linecap: round"/>
   </g>
   <g id="text_4">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(35.652004 74.268872)">Hair follicle with a</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(37.702614 83.150896)">sebaceous gland</text>
   </g>
   <g id="patch_11">
    <path d="M 285.203135 142.007116 
Q 248.899829 144.478371 212.596524 146.949626 
" style="fill: none; stroke: #64748b; stroke-width: 0.9; stroke-linecap: round"/>
   </g>
   <g id="text_5">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(289.197401 136.105795)">Sweat gland — cools the</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(296.633244 144.987819)">body by evaporation</text>
   </g>
   <g id="patch_12">
    <path d="M 91.255525 185.564279 
Q 88.290377 177.364329 85.325228 169.164378 
" style="fill: none; stroke: #64748b; stroke-width: 0.9; stroke-linecap: round"/>
   </g>
   <g id="text_6">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(44.155679 195.810411)">Blood capillaries — dilate to</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(41.819476 204.692434)">lose heat, constrict to keep it</text>
   </g>
   <g id="patch_13">
    <path d="M 295.388461 195.263487 
Q 280.0195 195.688507 264.650539 196.113527 
" style="fill: none; stroke: #64748b; stroke-width: 0.9; stroke-linecap: round"/>
   </g>
   <g id="text_7">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(299.387767 191.545795)">Fat (adipose) layer —</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(320.725783 200.427819)">insulation</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(327.187636 138.597041)">Two jobs at once:</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(327.187636 148.199228)">excretion of water, salts</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(327.187636 157.801416)">and urea, and temperature</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(327.187636 167.403603)">control by sweating and</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(327.187636 177.005791)">by changing blood flow.</text>
   </g>
