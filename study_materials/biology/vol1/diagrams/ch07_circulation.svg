<text x="278" y="62" font-family="DejaVu Sans" font-size="7.4" fill="#FFFFFF" text-anchor="middle" font-weight="bold">RIGHT VENTRICLE</text>
<text x="278" y="94" font-family="DejaVu Sans" font-size="6.8" fill="#334155" text-anchor="middle" font-weight="normal">semilunar valve</text>
<line x1="324" y1="81" x2="336" y2="81" stroke="#64748B" stroke-width="1.3" marker-end="url(#ag)"/>
<rect x="338" y="48" width="92" height="66" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
