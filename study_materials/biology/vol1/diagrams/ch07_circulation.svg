<text x="490" y="94" font-family="DejaVu Sans" font-size="6.8" fill="#334155" text-anchor="middle" font-weight="normal">bicuspid valve</text>
<line x1="536" y1="81" x2="548" y2="81" stroke="#64748B" stroke-width="1.3" marker-end="url(#ag)"/>
<rect x="550" y="48" width="92" height="66" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.4"/>
