<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="300" fill="#FFFFFF"/>
<text x="380" y="24" font-family="DejaVu Sans" font-size="13" fill="#0E1F40" text-anchor="middle" font-weight="bold">DOUBLE CIRCULATION</text>
<rect x="56" y="96" width="104" height="62" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/>
<text x="108" y="122" font-family="DejaVu Sans" font-size="10" fill="#0E1F40" text-anchor="middle" font-weight="bold">BODY</text>
<text x="108" y="140" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">tissues and organs</text>
<rect x="316" y="96" width="128" height="62" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.8"/>
<text x="380" y="120" font-family="DejaVu Sans" font-size="10.5" fill="#DC2626" text-anchor="middle" font-weight="bold">HEART</text>
<text x="380" y="138" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">right and left sides</text>
<rect x="600" y="96" width="104" height="62" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/>
<text x="652" y="122" font-family="DejaVu Sans" font-size="10" fill="#0E1F40" text-anchor="middle" font-weight="bold">LUNGS</text>
<text x="652" y="140" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">gaseous exchange</text>
<line x1="140" y1="66" x2="214" y2="66" stroke="#2563EB" stroke-width="2.0" marker-end="url(#an)"/>
<text x="108" y="56" font-family="DejaVu Sans" font-size="8.2" fill="#2563EB" text-anchor="middle" font-weight="bold">deoxygenated</text>
<rect x="214" y="44" width="332" height="46" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
<text x="380" y="62" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">RIGHT side of the heart → pulmonary artery → lungs</text>
<text x="380" y="80" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">pulmonary circulation (short loop)</text>
<line x1="600" y1="66" x2="520" y2="66" stroke="#DC2626" stroke-width="2.0" marker-end="url(#ar)"/>
<text x="652" y="56" font-family="DejaVu Sans" font-size="8.2" fill="#DC2626" text-anchor="middle" font-weight="bold">oxygenated</text>
<rect x="214" y="190" width="332" height="46" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.2"/>
<text x="380" y="208" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">LEFT side of the heart → aorta → body</text>
<text x="380" y="226" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">systemic circulation (long loop)</text>
<line x1="214" y1="213" x2="160" y2="213" stroke="#DC2626" stroke-width="2.0" marker-end="url(#ar)"/>
<line x1="108" y1="190" x2="108" y2="168" stroke="#2563EB" stroke-width="2.0" marker-end="url(#an)"/>
<line x1="160" y1="168" x2="300" y2="168" stroke="#2563EB" stroke-width="2.0" marker-end="url(#an)"/>
<text x="300" y="250" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="middle" font-weight="normal">Blood passes through the heart twice in every complete circuit — that is what “double” means.</text>
<text x="380" y="278" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">Advantage: the blood reaches the body at full pressure, and oxygenated and deoxygenated blood never mix.</text>
</svg>
