<text x="596" y="62" font-family="DejaVu Sans" font-size="7.4" fill="#FFFFFF" text-anchor="middle" font-weight="bold">LEFT VENTRICLE</text>
<text x="596" y="94" font-family="DejaVu Sans" font-size="6.8" fill="#334155" text-anchor="middle" font-weight="normal">semilunar valve</text>
<line x1="642" y1="81" x2="654" y2="81" stroke="#64748B" stroke-width="1.3" marker-end="url(#ag)"/>
<rect x="656" y="48" width="92" height="66" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.4"/>
<rect x="656" y="48" width="92" height="20" rx="6" fill="#DC2626" stroke="#DC2626" stroke-width="0"/>
<text x="702" y="62" font-family="DejaVu Sans" font-size="7.4" fill="#FFFFFF" text-anchor="middle" font-weight="bold">AORTA</text>
<text x="702" y="94" font-family="DejaVu Sans" font-size="6.8" fill="#334155" text-anchor="middle" font-weight="normal">to the body</text>
<rect x="20" y="140" width="348" height="86" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/>
<text x="194" y="162" font-family="DejaVu Sans" font-size="9.2" fill="#2563EB" text-anchor="middle" font-weight="bold">Pulmonary circuit (right heart)</text>
<text x="36" y="184" font-family="DejaVu Sans" font-size="8.4" fill="#0E1F40" text-anchor="start" font-weight="normal">Deoxygenated blood: heart → lungs → heart.</text>
<text x="36" y="202" font-family="DejaVu Sans" font-size="8" fill="#334155" text-anchor="start" font-weight="normal">Low pressure protects the delicate lungs.</text>
<rect x="392" y="140" width="348" height="86" rx="8" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1.2"/>
<text x="566" y="162" font-family="DejaVu Sans" font-size="9.2" fill="#DC2626" text-anchor="middle" font-weight="bold">Systemic circuit (left heart)</text>
<text x="408" y="184" font-family="DejaVu Sans" font-size="8.4" fill="#0E1F40" text-anchor="start" font-weight="normal">Oxygenated blood: heart → body → heart.</text>
<text x="408" y="202" font-family="DejaVu Sans" font-size="8" fill="#334155" text-anchor="start" font-weight="normal">High pressure reaches fingers, toes, brain.</text>
<text x="380" y="244" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">One complete circuit passes through the heart TWICE. The pulmonary artery is the only artery with deoxygenated blood; the pulmonary vein, the only vein with oxygenated blood.</text>
</svg>
