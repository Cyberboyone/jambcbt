<text x="384" y="62" font-family="DejaVu Sans" font-size="7.4" fill="#FFFFFF" text-anchor="middle" font-weight="bold">LUNGS</text>
<text x="384" y="94" font-family="DejaVu Sans" font-size="6.8" fill="#334155" text-anchor="middle" font-weight="normal">gas exchange</text>
