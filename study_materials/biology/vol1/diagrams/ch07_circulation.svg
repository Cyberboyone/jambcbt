<text x="172" y="94" font-family="DejaVu Sans" font-size="6.8" fill="#334155" text-anchor="middle" font-weight="normal">tricuspid valve</text>
<line x1="218" y1="81" x2="230" y2="81" stroke="#64748B" stroke-width="1.3" marker-end="url(#ag)"/>
