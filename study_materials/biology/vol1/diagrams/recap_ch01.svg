<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 210" width="700" height="210">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="210" fill="#FFFFFF"/>
<text x="350" y="26" font-family="DejaVu Sans" font-size="13" fill="#0E1F40" text-anchor="middle" font-weight="bold">Chapter 1 recap card — the variety of living things</text>
<rect x="18" y="46" width="664" height="34" rx="6" fill="#FFFFFF" stroke="#008751" stroke-width="1.1"/>
<text x="30" y="61" font-family="DejaVu Sans" font-size="9.2" fill="#008751" text-anchor="start" font-weight="bold">Seven characteristics</text>
<text x="30" y="75" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="start" font-weight="normal">Movement, respiration, sensitivity, growth, reproduction, excretion, nutrition (MRS GREN).</text>
<rect x="18" y="86" width="664" height="34" rx="6" fill="#FFFFFF" stroke="#008751" stroke-width="1.1"/>
<text x="30" y="101" font-family="DejaVu Sans" font-size="9.2" fill="#008751" text-anchor="start" font-weight="bold">Five kingdoms</text>
<text x="30" y="115" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="start" font-weight="normal">Monera, Protista, Fungi, Plantae, Animalia — the exam wants the kingdom and the reason.</text>
<rect x="18" y="126" width="664" height="34" rx="6" fill="#FFFFFF" stroke="#008751" stroke-width="1.1"/>
<text x="30" y="141" font-family="DejaVu Sans" font-size="9.2" fill="#008751" text-anchor="start" font-weight="bold">Virus is not a cell</text>
<text x="30" y="155" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="start" font-weight="normal">No cytoplasm, nucleus or organelles; DNA/RNA in a protein coat; parasite only.</text>
<rect x="18" y="166" width="664" height="34" rx="6" fill="#FFFFFF" stroke="#008751" stroke-width="1.1"/>
<text x="30" y="181" font-family="DejaVu Sans" font-size="9.2" fill="#008751" text-anchor="start" font-weight="bold">Binomial name</text>
<text x="30" y="195" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="start" font-weight="normal">Genus (capital) + species (small letter), both italic: Homo sapiens, Zea mays.</text>
<text x="350" y="200" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="middle" font-weight="normal">Say each line aloud once; if you can say it, you can answer it.</text>
</svg>
