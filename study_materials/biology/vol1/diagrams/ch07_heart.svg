   <g id="text_1">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #dc2626" x="337.629" y="209.294344" transform="rotate(-0 337.629 209.294344)">aorta</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 10.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0e1f40" x="205.104" y="15.254344" transform="rotate(-0 205.104 15.254344)">The mammalian heart</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #334155" x="10.734" y="229.094344" transform="rotate(-0 10.734 229.094344)">1  Vena cava — deoxygenated blood from the body</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #334155" x="10.734" y="239.390344" transform="rotate(-0 10.734 239.390344)">2  Pulmonary artery — deoxygenated blood to the lungs</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #334155" x="10.734" y="249.686344" transform="rotate(-0 10.734 249.686344)">3  Aorta — oxygenated blood to the whole body</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #334155" x="10.734" y="259.982344" transform="rotate(-0 10.734 259.982344)">4  Pulmonary vein — oxygenated blood from the lungs</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #334155" x="222.774" y="229.094344" transform="rotate(-0 222.774 229.094344)">5  Right ventricle — pumps to the lungs only</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #334155" x="222.774" y="239.390344" transform="rotate(-0 222.774 239.390344)">6  Tricuspid valve     7  Bicuspid (mitral) valve</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #334155" x="222.774" y="249.686344" transform="rotate(-0 222.774 249.686344)">8  Septum — keeps the two sides apart</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #64748b" x="222.774" y="259.982344" transform="rotate(-0 222.774 259.982344)">The left ventricle wall is thicker: it pumps to the whole body.</text>
   </g>
