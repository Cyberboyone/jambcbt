   <g id="text_12">
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(63.657068 46.835855)">Rate = distance the bubble</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(63.657068 56.918152)">moves ÷ time taken</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #64748b" transform="translate(63.657068 64.710647)">Change one factor — light,</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #64748b" transform="translate(63.657068 74.312834)">wind, humidity, temperature —</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #64748b" transform="translate(63.657068 83.915022)">and the rate tells you its effect.</text>
   </g>
