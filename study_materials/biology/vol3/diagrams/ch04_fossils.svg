<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" width="760" height="344">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="344" fill="#FFFFFF"/>
<text x="380" y="26" font-family="DejaVu Sans" font-size="12.8" fill="#0E1F40" text-anchor="middle" font-weight="bold">THE FOSSIL RECORD — OLDER ROCKS, SIMPLER FORMS</text>
<text x="380" y="46" font-family="DejaVu Sans" font-size="8.8" fill="#64748B" text-anchor="middle" font-weight="normal">a rock face, read from the top down: youngest at the top, oldest at the bottom</text>
<rect x="60" y="62" width="380" height="50" rx="3" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.0"/>
<text x="76" y="91" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="bold">Youngest rock — horses and modern mammals</text>
<circle cx="408" cy="87" r="9.360000000000001" fill="#FFFFFF" stroke="#334155" stroke-width="1.3"/>
<rect x="60" y="116" width="380" height="50" rx="3" fill="#EAE4DC" stroke="#CBD5E1" stroke-width="1.0"/>
<text x="76" y="145" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">large mammals and birds</text>
<circle cx="408" cy="141" r="7.74" fill="#FFFFFF" stroke="#334155" stroke-width="1.3"/>
<rect x="60" y="170" width="380" height="50" rx="3" fill="#DFD8CE" stroke="#CBD5E1" stroke-width="1.0"/>
<text x="76" y="199" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">dinosaurs and ferns</text>
<circle cx="408" cy="195" r="6.3" fill="#FFFFFF" stroke="#334155" stroke-width="1.3"/>
<rect x="60" y="224" width="380" height="50" rx="3" fill="#D6CEC5" stroke="#CBD5E1" stroke-width="1.0"/>
<text x="76" y="253" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">early reptiles and fish</text>
<circle cx="408" cy="249" r="5.04" fill="#FFFFFF" stroke="#334155" stroke-width="1.3"/>
<rect x="60" y="278" width="380" height="50" rx="3" fill="#CCC4BA" stroke="#CBD5E1" stroke-width="1.0"/>
<text x="76" y="307" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="bold">Oldest rock — single-celled organisms only</text>
<circle cx="408" cy="303" r="3.42" fill="#FFFFFF" stroke="#334155" stroke-width="1.3"/>
<text x="408" y="336" font-family="DejaVu Sans" font-size="7.4" fill="#64748B" text-anchor="middle" font-weight="normal">fossil size decreases downwards</text>
<rect x="470" y="62" width="232" height="246" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.2"/>
<text x="586" y="84" font-family="DejaVu Sans" font-size="9.8" fill="#008751" text-anchor="middle" font-weight="bold">What fossils prove</text>
<text x="586" y="108.0" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">The species of the past are</text>
<text x="586" y="122.5" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">not the species alive today.</text>
<text x="586" y="137.0" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal"></text>
<text x="586" y="151.5" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">Simpler forms lie in older rock,</text>
<text x="586" y="166.0" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">so life has changed over time.</text>
<text x="586" y="180.5" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal"></text>
<text x="586" y="195.0" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">Transitional fossils such as</text>
<text x="586" y="209.5" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">Archaeopteryx carry the features</text>
<text x="586" y="224.0" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">of two groups at once: one group</text>
<text x="586" y="238.5" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">can be ancestral to another.</text>
<text x="586" y="253.0" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal"></text>
<text x="586" y="267.5" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">Radiometric dating dates the rock,</text>
<text x="586" y="282.0" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">so the order in the strata is an</text>
<text x="586" y="296.5" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">order in time, not an opinion.</text>
</svg>
