<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="24" font-family="DejaVu Sans" font-size="13.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">MULTIPLE ALLELES — THE ABO BLOOD GROUPS</text>
<text x="380" y="46" font-family="DejaVu Sans" font-size="9.2" fill="#64748B" text-anchor="middle" font-weight="normal">one gene, three alleles (A, B and i), six genotypes, four phenotypes</text>
<rect x="60" y="66" width="640" height="30" rx="6" fill="#0E1F40" stroke="#0E1F40" stroke-width="1.0"/>
<text x="96" y="86" font-family="DejaVu Sans" font-size="9.2" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Blood group</text>
<text x="210" y="86" font-family="DejaVu Sans" font-size="9.2" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Genotype(s)</text>
<text x="510.0" y="86" font-family="DejaVu Sans" font-size="9.2" fill="#FFFFFF" text-anchor="middle" font-weight="bold">What is on the red cell</text>
<rect x="60" y="96" width="640" height="40" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8"/>
<text x="96" y="121" font-family="DejaVu Sans" font-size="13" fill="#008751" text-anchor="middle" font-weight="bold">A</text>
<text x="179.96432" y="121" font-family="DejaVu Sans" font-size="10.4" fill="#0E1F40" text-anchor="start" font-weight="bold">I</text><text x="185.09632" y="116.8" font-family="DejaVu Sans" font-size="7.4879999999999995" fill="#0E1F40" text-anchor="start" font-weight="bold">A</text><text x="192.33744" y="121" font-family="DejaVu Sans" font-size="10.4" fill="#0E1F40" text-anchor="start" font-weight="bold">I</text><text x="197.46944" y="116.8" font-family="DejaVu Sans" font-size="7.4879999999999995" fill="#0E1F40" text-anchor="start" font-weight="bold">A</text><text x="204.71056" y="121" font-family="DejaVu Sans" font-size="10.4" fill="#0E1F40" text-anchor="start" font-weight="bold"> or </text><text x="222.84256" y="121" font-family="DejaVu Sans" font-size="10.4" fill="#0E1F40" text-anchor="start" font-weight="bold">I</text><text x="227.97456" y="116.8" font-family="DejaVu Sans" font-size="7.4879999999999995" fill="#0E1F40" text-anchor="start" font-weight="bold">A</text><text x="235.21568" y="121" font-family="DejaVu Sans" font-size="10.4" fill="#0E1F40" text-anchor="start" font-weight="bold">i</text>
<text x="510.0" y="121" font-family="DejaVu Sans" font-size="9.4" fill="#334155" text-anchor="middle" font-weight="normal">A antigen on the red cell</text>
<rect x="60" y="136" width="640" height="40" rx="0" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
<text x="96" y="161" font-family="DejaVu Sans" font-size="13" fill="#008751" text-anchor="middle" font-weight="bold">B</text>
<text x="180.18896" y="161" font-family="DejaVu Sans" font-size="10.4" fill="#0E1F40" text-anchor="start" font-weight="bold">I</text><text x="185.32096" y="156.8" font-family="DejaVu Sans" font-size="7.4879999999999995" fill="#0E1F40" text-anchor="start" font-weight="bold">B</text><text x="192.41232000000002" y="161" font-family="DejaVu Sans" font-size="10.4" fill="#0E1F40" text-anchor="start" font-weight="bold">I</text><text x="197.54432000000003" y="156.8" font-family="DejaVu Sans" font-size="7.4879999999999995" fill="#0E1F40" text-anchor="start" font-weight="bold">B</text><text x="204.63568000000004" y="161" font-family="DejaVu Sans" font-size="10.4" fill="#0E1F40" text-anchor="start" font-weight="bold"> or </text><text x="222.76768000000004" y="161" font-family="DejaVu Sans" font-size="10.4" fill="#0E1F40" text-anchor="start" font-weight="bold">I</text><text x="227.89968000000005" y="156.8" font-family="DejaVu Sans" font-size="7.4879999999999995" fill="#0E1F40" text-anchor="start" font-weight="bold">B</text><text x="234.99104000000005" y="161" font-family="DejaVu Sans" font-size="10.4" fill="#0E1F40" text-anchor="start" font-weight="bold">i</text>
<text x="510.0" y="161" font-family="DejaVu Sans" font-size="9.4" fill="#334155" text-anchor="middle" font-weight="normal">B antigen on the red cell</text>
<rect x="60" y="176" width="640" height="40" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8"/>
<text x="96" y="201" font-family="DejaVu Sans" font-size="13" fill="#008751" text-anchor="middle" font-weight="bold">AB</text>
<text x="197.70176" y="201" font-family="DejaVu Sans" font-size="10.4" fill="#0E1F40" text-anchor="start" font-weight="bold">I</text><text x="202.83376" y="196.8" font-family="DejaVu Sans" font-size="7.4879999999999995" fill="#0E1F40" text-anchor="start" font-weight="bold">A</text><text x="210.07488" y="201" font-family="DejaVu Sans" font-size="10.4" fill="#0E1F40" text-anchor="start" font-weight="bold">I</text><text x="215.20688" y="196.8" font-family="DejaVu Sans" font-size="7.4879999999999995" fill="#0E1F40" text-anchor="start" font-weight="bold">B</text>
<text x="510.0" y="201" font-family="DejaVu Sans" font-size="9.4" fill="#334155" text-anchor="middle" font-weight="normal">both antigens — codominance</text>
<rect x="60" y="216" width="640" height="40" rx="0" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
<text x="96" y="241" font-family="DejaVu Sans" font-size="13" fill="#008751" text-anchor="middle" font-weight="bold">O</text>
<text x="205.18" y="241" font-family="DejaVu Sans" font-size="10.4" fill="#0E1F40" text-anchor="start" font-weight="bold">i</text><text x="210.0" y="241" font-family="DejaVu Sans" font-size="10.4" fill="#0E1F40" text-anchor="start" font-weight="bold">i</text>
<text x="510.0" y="241" font-family="DejaVu Sans" font-size="9.4" fill="#334155" text-anchor="middle" font-weight="normal">neither antigen</text>
<rect x="60" y="262" width="640" height="54" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.2"/>
<text x="380" y="284" font-family="DejaVu Sans" font-size="9.4" fill="#008751" text-anchor="middle" font-weight="bold">The A and B alleles are codominant with each other, and both are dominant to i.</text>
<text x="380" y="302" font-family="DejaVu Sans" font-size="9.4" fill="#334155" text-anchor="middle" font-weight="normal">That is why a group AB parent × a group O parent gives only A and B children.</text>
</svg>
