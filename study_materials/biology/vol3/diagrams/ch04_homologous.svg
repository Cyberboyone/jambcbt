<text x="582" y="210" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="middle" font-weight="bold">What each kind proves</text>
<text x="582" y="230" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">Homologous: common ancestry,</text>
<text x="582" y="246" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">even when the jobs differ.</text>
<text x="582" y="264" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">Analogous: the same job solved</text>
<text x="582" y="280" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">twice by different ancestors —</text>
<text x="582" y="294" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">no common ancestry implied.</text>
