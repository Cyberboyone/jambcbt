<text x="329.0" y="132" font-family="DejaVu Sans" font-size="8.6" fill="#7C3AED" text-anchor="middle" font-weight="bold">birds</text>
<rect x="200" y="50" width="118" height="30" rx="5" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.3"/>
<text x="259.0" y="70" font-family="DejaVu Sans" font-size="8.6" fill="#DC2626" text-anchor="middle" font-weight="bold">snake / hawk</text>
<rect x="480" y="250" width="150" height="30" rx="5" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
