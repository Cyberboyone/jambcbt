<rect x="480" y="40" width="250" height="126" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.1"/>
<text x="605" y="58" font-family="DejaVu Sans" font-size="9.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">How to read a food web</text>
<text x="605" y="74" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">Every arrow points from the food</text>
<text x="605" y="86" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">to the feeder — the direction the</text>
<text x="605" y="98" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">energy travels.</text>
<text x="605" y="110" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">Decomposers sit outside the grazing</text>
<text x="605" y="122" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">chains: dead bodies and waste feed</text>
<text x="605" y="134" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">bacteria and fungi, which release</text>
<text x="605" y="146" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">minerals back to the soil.</text>
<text x="380" y="300" font-family="DejaVu Sans" font-size="8.0" fill="#64748B" text-anchor="middle" font-weight="normal">Remove one node and every arrow through it is lost — which is why food webs are more stable than single chains.</text>
</svg>
