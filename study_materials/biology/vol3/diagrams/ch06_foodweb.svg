<text x="399.0" y="198" font-family="DejaVu Sans" font-size="8.6" fill="#2563EB" text-anchor="middle" font-weight="bold">mice &amp; rats</text>
<rect x="130" y="112" width="118" height="30" rx="5" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.3"/>
<text x="189.0" y="132" font-family="DejaVu Sans" font-size="8.6" fill="#7C3AED" text-anchor="middle" font-weight="bold">lizards</text>
