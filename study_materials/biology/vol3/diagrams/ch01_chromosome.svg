  <rect x="0" y="0" width="760" height="350" fill="#FFFFFF"/>
<text x="380" y="26" font-family="DejaVu Sans" font-size="13.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">FROM DNA TO A CHROMOSOME — AND A HOMOLOGOUS PAIR</text>
<text x="120" y="56" font-family="DejaVu Sans" font-size="10.4" fill="#008751" text-anchor="middle" font-weight="bold">DNA double helix</text>
<line x1="80" y1="76" x2="160" y2="76" stroke="#CBD5E1" stroke-width="1.4"/>
<circle cx="80" cy="76" r="2.8" fill="#2563EB"/>
<circle cx="160" cy="76" r="2.8" fill="#DC2626"/>
