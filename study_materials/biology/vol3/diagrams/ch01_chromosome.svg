<line x1="160" y1="76" x2="160" y2="188" stroke="#DC2626" stroke-width="3.0"/>
<text x="120" y="210" font-family="DejaVu Sans" font-size="8.8" fill="#64748B" text-anchor="middle" font-weight="normal">two strands, four bases</text>
<text x="120" y="224" font-family="DejaVu Sans" font-size="8.8" fill="#64748B" text-anchor="middle" font-weight="normal">A pairs with T, G with C</text>
<line x1="190" y1="132" x2="223.6" y2="132.0" stroke="#008751" stroke-width="2.0"/><polygon points="236.0,132.0 223.6,136.6 223.6,127.4" fill="#008751"/>
<text x="340" y="56" font-family="DejaVu Sans" font-size="10.4" fill="#008751" text-anchor="middle" font-weight="bold">A gene is a length of that DNA</text>
<rect x="262" y="108" width="156" height="40" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<rect x="267.0" y="113" width="26" height="30" rx="3" fill="#DBEAFE" stroke="#CBD5E1" stroke-width="1.0"/>
<rect x="296.5" y="113" width="26" height="30" rx="3" fill="#FEE2E2" stroke="#CBD5E1" stroke-width="1.0"/>
<rect x="326.0" y="113" width="26" height="30" rx="3" fill="#ECFDF5" stroke="#CBD5E1" stroke-width="1.0"/>
<rect x="355.5" y="113" width="26" height="30" rx="3" fill="#FEF3C7" stroke="#CBD5E1" stroke-width="1.0"/>
<rect x="385.0" y="113" width="26" height="30" rx="3" fill="#EDE9FE" stroke="#CBD5E1" stroke-width="1.0"/>
<text x="340" y="168" font-family="DejaVu Sans" font-size="8.8" fill="#64748B" text-anchor="middle" font-weight="normal">each block is one gene — one protein</text>
<text x="340" y="182" font-family="DejaVu Sans" font-size="8.8" fill="#64748B" text-anchor="middle" font-weight="normal">its position is called the locus</text>
<line x1="436" y1="132" x2="467.6" y2="132.0" stroke="#008751" stroke-width="2.0"/><polygon points="480.0,132.0 467.6,136.6 467.6,127.4" fill="#008751"/>
<text x="610" y="56" font-family="DejaVu Sans" font-size="10.4" fill="#008751" text-anchor="middle" font-weight="bold">Condensed chromosome</text>
<rect x="596" y="76" width="20" height="92" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/>
<rect x="624" y="76" width="20" height="92" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/>
<circle cx="620" cy="122" r="7" fill="#2563EB"/>
<line x1="648" y1="96" x2="672" y2="96" stroke="#64748B" stroke-width="0.9" stroke-dasharray="3 3"/>
<text x="676" y="99" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">sister chromatids</text>
<line x1="648" y1="122" x2="672" y2="122" stroke="#64748B" stroke-width="0.9" stroke-dasharray="3 3"/>
<text x="676" y="125" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">centromere</text>
<rect x="60" y="250" width="640" height="78" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.1"/>
<text x="84" y="276" font-family="DejaVu Sans" font-size="9.8" fill="#0E1F40" text-anchor="start" font-weight="bold">Homologous pair</text>
<rect x="196" y="262" width="15" height="46" rx="7" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/>
<rect x="217" y="262" width="15" height="46" rx="7" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/>
<rect x="258" y="262" width="15" height="46" rx="7" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/>
<rect x="279" y="262" width="15" height="46" rx="7" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/>
<text x="318" y="278" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">one chromosome from the mother (blue) and one from the father (red),</text>
<text x="318" y="296" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">carrying the same genes in the same order at the same loci.</text>
</svg>
