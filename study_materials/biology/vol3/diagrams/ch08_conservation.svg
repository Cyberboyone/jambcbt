<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="300" fill="#FFFFFF"/>
<text x="380" y="24" font-family="DejaVu Sans" font-size="12.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">CONSERVATION — KEEPING THE RESOURCE, NOT LOCKING IT AWAY</text>
<rect x="40" y="54" width="216" height="74" rx="7" fill="#ECFDF5" stroke="#008751" stroke-width="1.4"/><rect x="40" y="54" width="216" height="4.5" rx="2.2" fill="#008751"/><text x="148.0" y="73" font-family="DejaVu Sans" font-size="9.4" fill="#008751" text-anchor="middle" font-weight="bold">WHY CONSERVE</text><text x="148.0" y="88" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">food, medicine and timber;</text><text x="148.0" y="100" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">gene pools; water catchments;</text><text x="148.0" y="112" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">tourism and future generations</text>
<rect x="272" y="54" width="216" height="74" rx="7" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.4"/><rect x="272" y="54" width="216" height="4.5" rx="2.2" fill="#2563EB"/><text x="380.0" y="73" font-family="DejaVu Sans" font-size="9.4" fill="#2563EB" text-anchor="middle" font-weight="bold">IN SITU</text><text x="380.0" y="88" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">protect the organism where</text><text x="380.0" y="100" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">it lives: national parks,</text><text x="380.0" y="112" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">reserves, forest guards</text>
<rect x="504" y="54" width="216" height="74" rx="7" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.4"/><rect x="504" y="54" width="216" height="4.5" rx="2.2" fill="#7C3AED"/><text x="612.0" y="73" font-family="DejaVu Sans" font-size="9.4" fill="#7C3AED" text-anchor="middle" font-weight="bold">EX SITU</text><text x="612.0" y="88" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">protect it away from its</text><text x="612.0" y="100" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">habitat: zoos, seed banks,</text><text x="612.0" y="112" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">botanical gardens</text>
<rect x="40" y="148" width="216" height="74" rx="7" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/><rect x="40" y="148" width="216" height="4.5" rx="2.2" fill="#D97706"/><text x="148.0" y="167" font-family="DejaVu Sans" font-size="9.4" fill="#D97706" text-anchor="middle" font-weight="bold">LAW AND POLICY</text><text x="148.0" y="182" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">bans on hunting and logging,</text><text x="148.0" y="194" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">quota and permits,</text><text x="148.0" y="206" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">protected-area status</text>
<rect x="272" y="148" width="216" height="74" rx="7" fill="#ECFDF5" stroke="#008751" stroke-width="1.4"/><rect x="272" y="148" width="216" height="4.5" rx="2.2" fill="#008751"/><text x="380.0" y="167" font-family="DejaVu Sans" font-size="9.4" fill="#008751" text-anchor="middle" font-weight="bold">EDUCATION</text><text x="380.0" y="182" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">teach the value of the</text><text x="380.0" y="194" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">resource so that people</text><text x="380.0" y="206" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">protect it themselves</text>
<rect x="504" y="148" width="216" height="74" rx="7" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.4"/><rect x="504" y="148" width="216" height="4.5" rx="2.2" fill="#2563EB"/><text x="612.0" y="167" font-family="DejaVu Sans" font-size="9.4" fill="#2563EB" text-anchor="middle" font-weight="bold">SUSTAINABLE USE</text><text x="612.0" y="182" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">harvest no faster than the</text><text x="612.0" y="194" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">resource renews: agroforestry,</text><text x="612.0" y="206" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">controlled logging and fishing</text>
<rect x="40" y="240" width="680" height="44" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.1"/>
<text x="380" y="260" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">Nigeria's own examples: Cross River and Yankari reserves, the Lekki and Oban conservation areas,</text>
<text x="380" y="276" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">the Hadejia–Nguru wetlands, and the fight against desertification by shelter-belt planting in the north.</text>
</svg>
