<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="300" fill="#FFFFFF"/>
<text x="380" y="24" font-family="DejaVu Sans" font-size="13.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">SUCCESSION — FROM BARE ROCK TO A CLIMAX FOREST</text>
<rect x="40" y="56" width="108" height="120" rx="8" fill="#EDE9E4" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="94" cy="80" r="11" fill="#FFFFFF" stroke="#0E1F40" stroke-width="1.2"/>
<text x="94" y="84" font-family="DejaVu Sans" font-size="9" fill="#0E1F40" text-anchor="middle" font-weight="bold">1</text>
<text x="94" y="112" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">Bare rock</text>
<text x="94" y="136" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="middle" font-weight="normal">no soil;</text>
<text x="94" y="150" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="middle" font-weight="normal">nothing grows</text>
<line x1="149" y1="116" x2="149.7" y2="116.0" stroke="#008751" stroke-width="1.6"/><polygon points="159.0,116.0 149.7,119.5 149.7,112.5" fill="#008751"/>
<rect x="160" y="56" width="108" height="120" rx="8" fill="#DDE5DA" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="214" cy="80" r="11" fill="#FFFFFF" stroke="#0E1F40" stroke-width="1.2"/>
<text x="214" y="84" font-family="DejaVu Sans" font-size="9" fill="#0E1F40" text-anchor="middle" font-weight="bold">2</text>
<text x="214" y="112" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">Lichens</text>
<text x="214" y="136" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="middle" font-weight="normal">pioneers that</text>
<text x="214" y="150" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="middle" font-weight="normal">break down rock</text>
<line x1="269" y1="116" x2="269.7" y2="116.0" stroke="#008751" stroke-width="1.6"/><polygon points="279.0,116.0 269.7,119.5 269.7,112.5" fill="#008751"/>
<rect x="280" y="56" width="108" height="120" rx="8" fill="#CFE0C9" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="334" cy="80" r="11" fill="#FFFFFF" stroke="#0E1F40" stroke-width="1.2"/>
<text x="334" y="84" font-family="DejaVu Sans" font-size="9" fill="#0E1F40" text-anchor="middle" font-weight="bold">3</text>
<text x="334" y="112" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">Mosses</text>
<text x="334" y="136" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="middle" font-weight="normal">hold a thin</text>
<text x="334" y="150" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="middle" font-weight="normal">layer of soil</text>
<line x1="389" y1="116" x2="389.7" y2="116.0" stroke="#008751" stroke-width="1.6"/><polygon points="399.0,116.0 389.7,119.5 389.7,112.5" fill="#008751"/>
<rect x="400" y="56" width="108" height="120" rx="8" fill="#BFD8B5" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="454" cy="80" r="11" fill="#FFFFFF" stroke="#0E1F40" stroke-width="1.2"/>
<text x="454" y="84" font-family="DejaVu Sans" font-size="9" fill="#0E1F40" text-anchor="middle" font-weight="bold">4</text>
<text x="454" y="112" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">Grasses</text>
<text x="454" y="136" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="middle" font-weight="normal">roots deepen</text>
<text x="454" y="150" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="middle" font-weight="normal">the soil</text>
<line x1="509" y1="116" x2="509.7" y2="116.0" stroke="#008751" stroke-width="1.6"/><polygon points="519.0,116.0 509.7,119.5 509.7,112.5" fill="#008751"/>
<rect x="520" y="56" width="108" height="120" rx="8" fill="#A8CE9E" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="574" cy="80" r="11" fill="#FFFFFF" stroke="#0E1F40" stroke-width="1.2"/>
<text x="574" y="84" font-family="DejaVu Sans" font-size="9" fill="#0E1F40" text-anchor="middle" font-weight="bold">5</text>
<text x="574" y="112" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">Shrubs</text>
<text x="574" y="136" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="middle" font-weight="normal">shade out</text>
<text x="574" y="150" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="middle" font-weight="normal">the grasses</text>
<line x1="629" y1="116" x2="629.7" y2="116.0" stroke="#008751" stroke-width="1.6"/><polygon points="639.0,116.0 629.7,119.5 629.7,112.5" fill="#008751"/>
<rect x="640" y="56" width="108" height="120" rx="8" fill="#7FBF7B" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="694" cy="80" r="11" fill="#FFFFFF" stroke="#0E1F40" stroke-width="1.2"/>
<text x="694" y="84" font-family="DejaVu Sans" font-size="9" fill="#0E1F40" text-anchor="middle" font-weight="bold">6</text>
<text x="694" y="112" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">Climax forest</text>
<text x="694" y="136" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="middle" font-weight="normal">stable and</text>
<text x="694" y="150" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="middle" font-weight="normal">self-renewing</text>
<rect x="40" y="200" width="680" height="44" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.2"/>
<text x="380" y="220" font-family="DejaVu Sans" font-size="8.8" fill="#008751" text-anchor="middle" font-weight="bold">Each stage changes the habitat so that the next stage can grow —</text>
<text x="380" y="236" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">and the stable end point, where the community stops changing, is the climax community.</text>
<text x="380" y="268" font-family="DejaVu Sans" font-size="8.0" fill="#64748B" text-anchor="middle" font-weight="normal">Primary succession starts on bare rock with no soil. Secondary succession starts where soil survives — after a fire or a clearing.</text>
</svg>
