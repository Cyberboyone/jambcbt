  <rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="26" font-family="DejaVu Sans" font-size="13.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">THREE WAYS TO MEASURE A POPULATION</text>
<text x="128" y="54" font-family="DejaVu Sans" font-size="9.4" fill="#008751" text-anchor="middle" font-weight="bold">1 · Quadrat — plants</text>
<rect x="52" y="66" width="152" height="112" rx="6" fill="#ECFDF5" stroke="#008751" stroke-width="1.2"/>
<rect x="62" y="78" width="30" height="28" rx="2" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="0.9"/>
<rect x="62" y="112" width="30" height="28" rx="2" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="0.9"/>
<circle cx="70" cy="124" r="2.6" fill="#008751"/>
<rect x="62" y="146" width="30" height="28" rx="2" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="0.9"/>
