<circle cx="149" cy="90" r="2.6" fill="#008751"/>
<rect x="134" y="112" width="30" height="28" rx="2" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="0.9"/>
<rect x="134" y="146" width="30" height="28" rx="2" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="0.9"/>
<circle cx="142" cy="158" r="2.6" fill="#008751"/>
<rect x="170" y="78" width="30" height="28" rx="2" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="0.9"/>
<rect x="170" y="112" width="30" height="28" rx="2" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="0.9"/>
<circle cx="178" cy="124" r="2.6" fill="#008751"/>
<rect x="170" y="146" width="30" height="28" rx="2" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="0.9"/>
<circle cx="178" cy="158" r="2.6" fill="#008751"/>
<circle cx="185" cy="158" r="2.6" fill="#008751"/>
<text x="128" y="192" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">count inside a 0.5 m × 0.5 m square,</text>
<text x="128" y="204" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">then multiply up to the whole area</text>
<text x="380" y="54" font-family="DejaVu Sans" font-size="9.4" fill="#2563EB" text-anchor="middle" font-weight="bold">2 · Transect — how a habitat changes</text>
<rect x="300" y="66" width="160" height="112" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
<line x1="310" y1="122" x2="450" y2="122" stroke="#2563EB" stroke-width="2.0"/>
<rect x="314" y="108" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="0.9"/>
<rect x="342" y="108" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="0.9"/>
<rect x="370" y="108" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="0.9"/>
<rect x="398" y="108" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="0.9"/>
<rect x="426" y="108" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="0.9"/>
<text x="316" y="100" font-family="DejaVu Sans" font-size="7.4" fill="#64748B" text-anchor="middle" font-weight="normal">sea</text>
<text x="430" y="100" font-family="DejaVu Sans" font-size="7.4" fill="#64748B" text-anchor="middle" font-weight="normal">land</text>
<text x="380" y="192" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">lay a tape across the habitat and record</text>
<text x="380" y="204" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">what is in each quadrat along it</text>
<text x="632" y="54" font-family="DejaVu Sans" font-size="9.4" fill="#D97706" text-anchor="middle" font-weight="bold">3 · Capture–recapture — animals</text>
<rect x="552" y="66" width="160" height="112" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/>
<circle cx="572" cy="92" r="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
<circle cx="606" cy="92" r="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
<circle cx="640" cy="92" r="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
<circle cx="572" cy="126" r="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
<circle cx="606" cy="126" r="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
<circle cx="640" cy="126" r="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
<circle cx="572" cy="92" r="3" fill="#D97706"/>
<circle cx="606" cy="126" r="3" fill="#D97706"/>
<text x="632" y="192" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">mark and release a sample, then count</text>
<text x="632" y="204" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">the marked ones in a second sample</text>
<rect x="52" y="224" width="660" height="84" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.3"/>
<text x="382" y="246" font-family="DejaVu Sans" font-size="11.6" fill="#008751" text-anchor="middle" font-weight="bold">Estimated population  N = (M × C) ÷ R</text>
<text x="382" y="266" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">M = number caught and marked first,  C = number caught second,  R = marked ones in the second sample</text>
<text x="382" y="284" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">A quadrat estimates plants and slow animals; capture–recapture estimates animals that move.</text>
<text x="382" y="300" font-family="DejaVu Sans" font-size="8.0" fill="#64748B" text-anchor="middle" font-weight="normal">Both assume the population is not changing between samples and that marks do not affect survival.</text>
</svg>
