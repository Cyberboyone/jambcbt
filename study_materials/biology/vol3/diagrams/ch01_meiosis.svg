  <rect x="0" y="0" width="760" height="372" fill="#FFFFFF"/>
<text x="380" y="26" font-family="DejaVu Sans" font-size="13.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">MEIOSIS — ONE DIPLOID CELL BECOMES FOUR HAPLOID CELLS</text>
<circle cx="92" cy="120" r="44" fill="#FFFFFF" stroke="#334155" stroke-width="1.6"/>
<rect x="66" y="103.0" width="10" height="34" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5" transform="rotate(0 71 120)"/>
<rect x="80" y="103.0" width="10" height="34" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5" transform="rotate(0 85 120)"/>
<rect x="94" y="103.0" width="10" height="34" rx="5" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" transform="rotate(0 99 120)"/>
<rect x="108" y="103.0" width="10" height="34" rx="5" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" transform="rotate(0 113 120)"/>
<text x="92" y="186" font-family="DejaVu Sans" font-size="9.8" fill="#0E1F40" text-anchor="middle" font-weight="bold">Diploid cell</text>
<text x="92" y="202" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="middle" font-weight="normal">2n = 4, two pairs</text>
<line x1="146" y1="120" x2="169.6" y2="120.0" stroke="#008751" stroke-width="2.0"/><polygon points="182.0,120.0 169.6,124.6 169.6,115.4" fill="#008751"/>
<text x="164" y="104" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="middle" font-weight="normal">interphase</text>
<text x="164" y="140" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="middle" font-weight="normal">DNA copied</text>
<circle cx="252" cy="120" r="44" fill="#FFFFFF" stroke="#334155" stroke-width="1.6"/>
<rect x="235" y="88.0" width="10" height="40" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5" transform="rotate(0 240 108)"/>
<rect x="249" y="88.0" width="10" height="40" rx="5" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" transform="rotate(0 254 108)"/>
<rect x="235" y="136.0" width="10" height="24" rx="5" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" transform="rotate(0 240 148)"/>
<rect x="249" y="136.0" width="10" height="24" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5" transform="rotate(0 254 148)"/>
<text x="252" y="186" font-family="DejaVu Sans" font-size="9.8" fill="#0E1F40" text-anchor="middle" font-weight="bold">Prophase I</text>
<text x="252" y="202" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="middle" font-weight="normal">homologues pair and cross over</text>
<line x1="306" y1="120" x2="329.6" y2="120.0" stroke="#008751" stroke-width="2.0"/><polygon points="342.0,120.0 329.6,124.6 329.6,115.4" fill="#008751"/>
<circle cx="404" cy="78" r="34" fill="#FFFFFF" stroke="#334155" stroke-width="1.6"/>
<rect x="391" y="64.0" width="10" height="28" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5" transform="rotate(0 396 78)"/>
<rect x="407" y="64.0" width="10" height="28" rx="5" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" transform="rotate(0 412 78)"/>
<circle cx="404" cy="166" r="34" fill="#FFFFFF" stroke="#334155" stroke-width="1.6"/>
<rect x="391" y="152.0" width="10" height="28" rx="5" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" transform="rotate(0 396 166)"/>
<rect x="407" y="152.0" width="10" height="28" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5" transform="rotate(0 412 166)"/>
<text x="404" y="216" font-family="DejaVu Sans" font-size="9.8" fill="#0E1F40" text-anchor="middle" font-weight="bold">Meiosis I — homologues separate</text>
<text x="404" y="232" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="middle" font-weight="normal">two haploid cells, 2n → n</text>
<line x1="448" y1="120" x2="471.6" y2="120.0" stroke="#008751" stroke-width="2.0"/><polygon points="484.0,120.0 471.6,124.6 471.6,115.4" fill="#008751"/>
<circle cx="548" cy="54" r="22" fill="#FFFFFF" stroke="#334155" stroke-width="1.6"/>
<rect x="543" y="42.0" width="10" height="24" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5" transform="rotate(0 548 54)"/>
<circle cx="548" cy="106" r="22" fill="#FFFFFF" stroke="#334155" stroke-width="1.6"/>
<rect x="543" y="94.0" width="10" height="24" rx="5" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" transform="rotate(0 548 106)"/>
<circle cx="548" cy="166" r="22" fill="#FFFFFF" stroke="#334155" stroke-width="1.6"/>
<rect x="543" y="154.0" width="10" height="24" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5" transform="rotate(0 548 166)"/>
<circle cx="548" cy="218" r="22" fill="#FFFFFF" stroke="#334155" stroke-width="1.6"/>
<rect x="543" y="206.0" width="10" height="24" rx="5" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" transform="rotate(0 548 218)"/>
<text x="548" y="258" font-family="DejaVu Sans" font-size="9.8" fill="#0E1F40" text-anchor="middle" font-weight="bold">Meiosis II — chromatids separate</text>
<text x="548" y="274" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="middle" font-weight="normal">four different haploid gametes</text>
<rect x="60" y="292" width="640" height="66" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.2"/>
<text x="84" y="314" font-family="DejaVu Sans" font-size="9.6" fill="#008751" text-anchor="start" font-weight="bold">Why the examiner keeps asking:</text>
<text x="84" y="334" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="start" font-weight="normal">meiosis halves the chromosome number (so fertilisation restores it) and shuffles the alleles</text>
<text x="84" y="350" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="start" font-weight="normal">by crossing over and independent assortment — which is where all heritable variation comes from.</text>
</svg>
