<text x="620" y="197" font-family="DejaVu Sans" font-size="8.8" fill="#DC2626" text-anchor="middle" font-weight="bold">sons get their X from the mother only</text>
<rect x="60" y="252" width="640" height="62" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.2"/>
<text x="380" y="274" font-family="DejaVu Sans" font-size="9.4" fill="#008751" text-anchor="middle" font-weight="bold">A sex-linked recessive shows up in sons whenever the mother carries it,</text>
<text x="380" y="294" font-family="DejaVu Sans" font-size="9.4" fill="#008751" text-anchor="middle" font-weight="bold">because a son has only one X — there is no second copy to hide the allele.</text>
