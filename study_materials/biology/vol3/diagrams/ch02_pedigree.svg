<line x1="266" y1="96" x2="320" y2="96" stroke="#334155" stroke-width="2.0"/>
<rect x="321" y="81" width="30" height="30" rx="2" fill="#FFFFFF" stroke="#0E1F40" stroke-width="2.0"/>
<text x="336" y="128" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="middle" font-weight="normal">normal father</text>
<text x="323.658" y="70" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="start" font-weight="bold">X</text><text x="332.75800000000004" y="65.8" font-family="DejaVu Sans" font-size="7.199999999999999" fill="#0E1F40" text-anchor="start" font-weight="bold">B</text><text x="339.64200000000005" y="70" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="start" font-weight="bold">Y</text>
<line x1="293" y1="112" x2="293" y2="150" stroke="#334155" stroke-width="1.6"/>
<line x1="150" y1="150" x2="450" y2="150" stroke="#334155" stroke-width="1.6"/>
