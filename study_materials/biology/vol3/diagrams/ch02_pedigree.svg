<text x="380" y="24" font-family="DejaVu Sans" font-size="13.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">SEX LINKAGE — COLOUR BLINDNESS IN ONE FAMILY</text>
<text x="380" y="46" font-family="DejaVu Sans" font-size="9.2" fill="#64748B" text-anchor="middle" font-weight="normal">carrier mother × normal father: half the sons are colour blind, no daughter is</text>
