<circle cx="250" cy="190" r="16" fill="#FFFFFF" stroke="#0E1F40" stroke-width="2.0"/>
<text x="250" y="224" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="middle" font-weight="normal">normal daughter</text>
