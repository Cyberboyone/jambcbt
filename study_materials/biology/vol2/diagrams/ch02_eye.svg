<text x="380" y="368" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="middle" font-weight="normal">Light path: cornea → aqueous humour → pupil → lens → vitreous humour → retina → optic nerve → brain.</text>
<text x="380" y="382" font-family="DejaVu Sans" font-size="8.8" fill="#64748B" text-anchor="middle" font-weight="normal">The cornea does most of the bending; the lens adjusts the focus (accommodation).</text>
