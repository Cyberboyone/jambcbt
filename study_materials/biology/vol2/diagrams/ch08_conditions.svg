<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="300" fill="#FFFFFF"/>
<text x="380" y="26" font-family="DejaVu Sans" font-size="12.2" fill="#0E1F40" text-anchor="middle" font-weight="bold">WHAT DECOMPOSERS NEED — AND HOW FOOD PRESERVATION SWITCHES IT OFF</text>
<rect x="24" y="52" width="712" height="46" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.0"/>
<rect x="24" y="52" width="6" height="46" rx="0" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="46" y="72" font-family="DejaVu Sans" font-size="10.0" fill="#008751" text-anchor="start" font-weight="bold">MOISTURE</text>
<text x="46" y="88" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="start" font-weight="normal">no water, no growth</text>
<text x="300" y="81" font-family="DejaVu Sans" font-size="15" fill="#64748B" text-anchor="middle" font-weight="normal">→</text>
<text x="330" y="74" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="start" font-weight="normal">switch it off by</text>
<text x="330" y="88" font-family="DejaVu Sans" font-size="9.0" fill="#0E1F40" text-anchor="start" font-weight="bold">drying, salting, smoking</text>
<rect x="24" y="106" width="712" height="46" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.0"/>
<rect x="24" y="106" width="6" height="46" rx="0" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="46" y="126" font-family="DejaVu Sans" font-size="10.0" fill="#008751" text-anchor="start" font-weight="bold">WARMTH</text>
<text x="46" y="142" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="start" font-weight="normal">fastest near 37 °C</text>
<text x="300" y="135" font-family="DejaVu Sans" font-size="15" fill="#64748B" text-anchor="middle" font-weight="normal">→</text>
<text x="330" y="128" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="start" font-weight="normal">switch it off by</text>
<text x="330" y="142" font-family="DejaVu Sans" font-size="9.0" fill="#0E1F40" text-anchor="start" font-weight="bold">refrigeration, freezing</text>
<rect x="24" y="160" width="712" height="46" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.0"/>
<rect x="24" y="160" width="6" height="46" rx="0" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="46" y="180" font-family="DejaVu Sans" font-size="10.0" fill="#008751" text-anchor="start" font-weight="bold">FOOD</text>
<text x="46" y="196" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="start" font-weight="normal">sugar and protein</text>
<text x="300" y="189" font-family="DejaVu Sans" font-size="15" fill="#64748B" text-anchor="middle" font-weight="normal">→</text>
<text x="330" y="182" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="start" font-weight="normal">switch it off by</text>
<text x="330" y="196" font-family="DejaVu Sans" font-size="9.0" fill="#0E1F40" text-anchor="start" font-weight="bold">adding sugar to jam, or salt to meat</text>
<rect x="24" y="214" width="712" height="46" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.0"/>
<rect x="24" y="214" width="6" height="46" rx="0" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="46" y="234" font-family="DejaVu Sans" font-size="10.0" fill="#008751" text-anchor="start" font-weight="bold">OXYGEN</text>
<text x="46" y="250" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="start" font-weight="normal">aerobic species need air</text>
<text x="300" y="243" font-family="DejaVu Sans" font-size="15" fill="#64748B" text-anchor="middle" font-weight="normal">→</text>
<text x="330" y="236" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="start" font-weight="normal">switch it off by</text>
<text x="330" y="250" font-family="DejaVu Sans" font-size="9.0" fill="#0E1F40" text-anchor="start" font-weight="bold">vacuum packing, canning</text>
<rect x="24" y="272" width="712" height="20" rx="6" fill="#ECFDF5" stroke="#008751" stroke-width="1.0"/>
<text x="380" y="286" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">High salt or sugar draws water out of the cells by osmosis, so the micro-organisms cannot grow.</text>
</svg>
