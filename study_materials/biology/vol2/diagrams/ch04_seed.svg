      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="340" fill="#FFFFFF"/>
<text x="380" y="26" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">A BEAN SEED IN LONGITUDINAL SECTION — AND WHAT EACH PART BECOMES</text>
<path d="M 250 120 q 90 -46 168 6 q 62 44 28 116 q -34 70 -122 52 q -80 -18 -84 -92 q -2 -56 10 -82 Z" fill="#FEF3C7" stroke="#D97706" stroke-width="2.4" stroke-linecap="round"/>
<path d="M 286 148 q 74 -24 122 26 q 34 38 4 80 q -34 44 -96 22 q -56 -22 -50 -70 q 2 -36 20 -58 Z" fill="#ECFDF5" stroke="#008751" stroke-width="1.8" stroke-linecap="round"/>
<path d="M 306 164 q 56 -14 92 20 q 26 30 2 56 q -28 30 -70 14 q -40 -16 -36 -50 q 2 -26 12 -40 Z" fill="#FFFFFF" stroke="#008751" stroke-width="1.2" stroke-linecap="round"/>
<path d="M 330 236 q 14 16 34 8 q 16 -8 10 -26" fill="none" stroke="#DC2626" stroke-width="4.4" stroke-linecap="round"/>
<circle cx="332" cy="240" r="6.4" fill="#DC2626"/>
<text x="300" y="268" font-family="DejaVu Sans" font-size="8.4" fill="#DC2626" text-anchor="end" font-weight="normal">plumule</text>
<line x1="302" y1="264" x2="322" y2="250" stroke="#DC2626" stroke-width="0.9"/>
<path d="M 330 240 q -3 22 16 26" fill="none" stroke="#2563EB" stroke-width="4.0" stroke-linecap="round"/>
<circle cx="346" cy="268" r="6.0" fill="#2563EB"/>
<text x="360" y="282" font-family="DejaVu Sans" font-size="8.4" fill="#2563EB" text-anchor="start" font-weight="normal">radicle</text>
<line x1="358" y1="278" x2="350" y2="270" stroke="#2563EB" stroke-width="0.9"/>
<circle cx="262" cy="214" r="6.0" fill="#D97706"/>
<text x="226" y="96" font-family="DejaVu Sans" font-size="10.4" fill="#D97706" text-anchor="end" font-weight="bold">Testa (seed coat)</text>
<line x1="230" y1="100" x2="286" y2="124" stroke="#D97706" stroke-width="1.0"/>
<text x="226" y="216" font-family="DejaVu Sans" font-size="10.4" fill="#D97706" text-anchor="end" font-weight="bold">Micropyle</text>
<text x="226" y="230" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="end" font-weight="normal">(water enters here)</text>
<line x1="230" y1="212" x2="254" y2="214" stroke="#D97706" stroke-width="1.0"/>
<text x="520" y="150" font-family="DejaVu Sans" font-size="10.4" fill="#008751" text-anchor="start" font-weight="bold">Cotyledon</text>
<text x="520" y="164" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="start" font-weight="normal">(food store; becomes the</text>
<text x="520" y="176" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="start" font-weight="normal">first leaves)</text>
<line x1="514" y1="146" x2="404" y2="168" stroke="#008751" stroke-width="1.0"/>
<text x="520" y="210" font-family="DejaVu Sans" font-size="10.2" fill="#DC2626" text-anchor="start" font-weight="bold">Plumule — the young shoot</text>
<line x1="514" y1="206" x2="350" y2="234" stroke="#DC2626" stroke-width="1.0"/>
<text x="520" y="286" font-family="DejaVu Sans" font-size="10.2" fill="#2563EB" text-anchor="start" font-weight="bold">Radicle — the young root</text>
<line x1="514" y1="282" x2="356" y2="270" stroke="#2563EB" stroke-width="1.0"/>
<text x="380" y="316" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">Germination: water is absorbed through the micropyle → the testa splits → the radicle emerges first → the plumule turns green.</text>
<text x="380" y="330" font-family="DejaVu Sans" font-size="8.8" fill="#64748B" text-anchor="middle" font-weight="normal">The cotyledons shrivel as their stored food is used up; in a maize grain the store is the endosperm instead.</text>
</svg>
