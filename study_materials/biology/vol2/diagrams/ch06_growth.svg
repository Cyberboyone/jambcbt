<text x="578" y="226" font-family="DejaVu Sans" font-size="7.8" fill="#DC2626" text-anchor="middle" font-weight="normal">moult</text>
<text x="640" y="190" font-family="DejaVu Sans" font-size="7.8" fill="#DC2626" text-anchor="middle" font-weight="normal">moult</text>
<text x="560" y="336" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">The exoskeleton cannot stretch, so the insect grows in stages,</text>
<text x="560" y="350" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">each ending in a moult (ecdysis).</text>
<text x="200" y="336" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">Growth is fast in infancy, steady in childhood, very fast at</text>
<text x="200" y="350" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">puberty, then slow until the growth plates close.</text>
