<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="300" fill="#FFFFFF"/>
<text x="380" y="26" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">POLLINATION — FOUR WAYS THE POLLEN GETS FROM ANTHER TO STIGMA</text>
<rect x="20" y="60" width="170" height="180" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.8"/>
<rect x="20" y="60" width="170" height="6" rx="3" fill="#D97706"/>
<text x="105" y="92" font-family="DejaVu Sans" font-size="12" fill="#D97706" text-anchor="middle" font-weight="bold">WIND</text>
<text x="105" y="112" font-family="DejaVu Sans" font-size="8.8" fill="#64748B" text-anchor="middle" font-weight="normal" font-style="italic">Maize, grass</text>
<text x="105" y="140" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="middle" font-weight="normal">Light dusty pollen,</text>
<text x="105" y="156" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="middle" font-weight="normal">large feathery stigmas,</text>
<text x="105" y="172" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="middle" font-weight="normal">no scent, no nectar</text>
<rect x="202" y="60" width="170" height="180" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.8"/>
<rect x="202" y="60" width="170" height="6" rx="3" fill="#7C3AED"/>
<text x="287" y="92" font-family="DejaVu Sans" font-size="12" fill="#7C3AED" text-anchor="middle" font-weight="bold">INSECT</text>
<text x="287" y="112" font-family="DejaVu Sans" font-size="8.8" fill="#64748B" text-anchor="middle" font-weight="normal" font-style="italic">Hibiscus, mango</text>
<text x="287" y="140" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="middle" font-weight="normal">Sticky pollen, bright</text>
<text x="287" y="156" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="middle" font-weight="normal">petals, scent, nectar,</text>
<text x="287" y="172" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="middle" font-weight="normal">sticky stigma</text>
<rect x="384" y="60" width="170" height="180" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8"/>
<rect x="384" y="60" width="170" height="6" rx="3" fill="#2563EB"/>
<text x="469" y="92" font-family="DejaVu Sans" font-size="12" fill="#2563EB" text-anchor="middle" font-weight="bold">WATER</text>
<text x="469" y="112" font-family="DejaVu Sans" font-size="8.8" fill="#64748B" text-anchor="middle" font-weight="normal" font-style="italic">Water lily</text>
<text x="469" y="140" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="middle" font-weight="normal">Pollen floats on the</text>
<text x="469" y="156" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="middle" font-weight="normal">surface to a floating</text>
<text x="469" y="172" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="middle" font-weight="normal">stigma</text>
<rect x="566" y="60" width="170" height="180" rx="8" fill="#FFFFFF" stroke="#008751" stroke-width="1.8"/>
<rect x="566" y="60" width="170" height="6" rx="3" fill="#008751"/>
<text x="651" y="92" font-family="DejaVu Sans" font-size="12" fill="#008751" text-anchor="middle" font-weight="bold">ANIMAL</text>
<text x="651" y="112" font-family="DejaVu Sans" font-size="8.8" fill="#64748B" text-anchor="middle" font-weight="normal" font-style="italic">Some tropical trees</text>
<text x="651" y="140" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="middle" font-weight="normal">Birds and bats carry</text>
<text x="651" y="156" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="middle" font-weight="normal">pollen on feathers</text>
<text x="651" y="172" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="middle" font-weight="normal">or fur</text>
<text x="380" y="264" font-family="DejaVu Sans" font-size="9.2" fill="#64748B" text-anchor="middle" font-weight="normal">Self-pollination transfers pollen within one flower or plant; cross-pollination transfers it between two plants.</text>
<text x="380" y="282" font-family="DejaVu Sans" font-size="9.2" fill="#64748B" text-anchor="middle" font-weight="normal">Cross-pollination is the more important source of genetic variation.</text>
</svg>
