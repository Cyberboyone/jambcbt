<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" width="720" height="392">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="392" fill="#FFFFFF"/>
<text x="360" y="26" font-family="DejaVu Sans" font-size="12.2" fill="#0E1F40" text-anchor="middle" font-weight="bold">FIRST AID — THE ORDER OF PRIORITY, AND WHAT BELONGS IN THE BOX</text>
<text x="180" y="54" font-family="DejaVu Sans" font-size="10.0" fill="#008751" text-anchor="middle" font-weight="bold">THE ORDER OF PRIORITY</text>
<rect x="24" y="68" width="316" height="44" rx="7" fill="#ECFDF5" stroke="#008751" stroke-width="1.1"/>
<circle cx="50" cy="90" r="15" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="50" y="95" font-family="DejaVu Sans" font-size="12.4" fill="#FFFFFF" text-anchor="middle" font-weight="bold">D</text>
<text x="76" y="86" font-family="DejaVu Sans" font-size="9.8" fill="#008751" text-anchor="start" font-weight="bold">DANGER</text>
<text x="76" y="102" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="start" font-weight="normal">protect yourself first</text>
<rect x="24" y="120" width="316" height="44" rx="7" fill="#ECFDF5" stroke="#008751" stroke-width="1.1"/>
<circle cx="50" cy="142" r="15" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="50" y="147" font-family="DejaVu Sans" font-size="12.4" fill="#FFFFFF" text-anchor="middle" font-weight="bold">R</text>
<text x="76" y="138" font-family="DejaVu Sans" font-size="9.8" fill="#008751" text-anchor="start" font-weight="bold">RESPONSE</text>
<text x="76" y="154" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="start" font-weight="normal">speak, shake the shoulders</text>
<rect x="24" y="172" width="316" height="44" rx="7" fill="#ECFDF5" stroke="#008751" stroke-width="1.1"/>
<circle cx="50" cy="194" r="15" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="50" y="199" font-family="DejaVu Sans" font-size="12.4" fill="#FFFFFF" text-anchor="middle" font-weight="bold">A</text>
<text x="76" y="190" font-family="DejaVu Sans" font-size="9.8" fill="#008751" text-anchor="start" font-weight="bold">AIRWAY</text>
<text x="76" y="206" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="start" font-weight="normal">tilt the head, clear the mouth</text>
<rect x="24" y="224" width="316" height="44" rx="7" fill="#ECFDF5" stroke="#008751" stroke-width="1.1"/>
<circle cx="50" cy="246" r="15" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="50" y="251" font-family="DejaVu Sans" font-size="12.4" fill="#FFFFFF" text-anchor="middle" font-weight="bold">B</text>
<text x="76" y="242" font-family="DejaVu Sans" font-size="9.8" fill="#008751" text-anchor="start" font-weight="bold">BREATHING</text>
<text x="76" y="258" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="start" font-weight="normal">look, listen, feel</text>
<rect x="24" y="276" width="316" height="44" rx="7" fill="#ECFDF5" stroke="#008751" stroke-width="1.1"/>
<circle cx="50" cy="298" r="15" fill="#008751" stroke="#008751" stroke-width="0"/>
<text x="50" y="303" font-family="DejaVu Sans" font-size="12.4" fill="#FFFFFF" text-anchor="middle" font-weight="bold">C</text>
<text x="76" y="294" font-family="DejaVu Sans" font-size="9.8" fill="#008751" text-anchor="start" font-weight="bold">CIRCULATION</text>
<text x="76" y="310" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="start" font-weight="normal">stop bleeding, start CPR if needed</text>
<rect x="360" y="60" width="336" height="268" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.8"/>
<rect x="360" y="60" width="336" height="30" rx="8" fill="#DC2626" stroke="#DC2626" stroke-width="1.8"/>
<rect x="360" y="76" width="336" height="14" rx="0" fill="#DC2626" stroke="#DC2626" stroke-width="0"/>
<text x="528" y="81" font-family="DejaVu Sans" font-size="10.4" fill="#FFFFFF" text-anchor="middle" font-weight="bold">THE FIRST-AID BOX</text>
<circle cx="378" cy="112" r="3.2" fill="#DC2626" stroke="#DC2626" stroke-width="0"/>
<text x="390" y="110" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">sterile gauze and bandages</text>
<text x="390" y="124" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="start" font-weight="normal">to cover wounds and stop bleeding</text>
<circle cx="378" cy="149" r="3.2" fill="#DC2626" stroke="#DC2626" stroke-width="0"/>
<text x="390" y="147" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">cotton wool and adhesive plaster</text>
<text x="390" y="161" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="start" font-weight="normal">to clean and cover small cuts</text>
<circle cx="378" cy="186" r="3.2" fill="#DC2626" stroke="#DC2626" stroke-width="0"/>
<text x="390" y="184" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">antiseptic (dettol, iodine)</text>
<text x="390" y="198" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="start" font-weight="normal">to kill germs in a wound</text>
<circle cx="378" cy="223" r="3.2" fill="#DC2626" stroke="#DC2626" stroke-width="0"/>
<text x="390" y="221" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">scissors and forceps</text>
<text x="390" y="235" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="start" font-weight="normal">to cut bandages, remove splinters</text>
<circle cx="378" cy="260" r="3.2" fill="#DC2626" stroke="#DC2626" stroke-width="0"/>
<text x="390" y="258" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">oral rehydration salts</text>
<text x="390" y="272" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="start" font-weight="normal">for diarrhoea and dehydration</text>
<circle cx="378" cy="297" r="3.2" fill="#DC2626" stroke="#DC2626" stroke-width="0"/>
<text x="390" y="295" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">gloves, torch, safety pins</text>
<text x="390" y="309" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="start" font-weight="normal">protection and improvisation</text>
<rect x="24" y="336" width="672" height="44" rx="7" fill="#ECFDF5" stroke="#008751" stroke-width="1.1"/>
<text x="360" y="354" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="middle" font-weight="normal">Never move a casualty with a suspected back or neck injury, and never give an unconscious person anything by mouth.</text>
<text x="360" y="370" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="middle" font-weight="normal">Always send for help and stay with the casualty until it arrives.</text>
</svg>
