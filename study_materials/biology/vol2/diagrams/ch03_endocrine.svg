<text x="598" y="190" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="start" font-weight="normal">(behind the sternum)</text>
<circle cx="404" cy="236" r="11" fill="#FFFFFF" stroke="#DC2626" stroke-width="2.2"/>
