<text x="598" y="366" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="start" font-weight="normal">(in the scrotum)</text>
<rect x="24" y="436" width="712" height="24" rx="6" fill="#ECFDF5" stroke="#008751" stroke-width="1.0"/>
<text x="380" y="452" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">All these glands are ductless: they pour their hormones straight into the blood, which carries them to every cell.</text>
