<text x="196" y="146" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="end" font-weight="normal">(neck, over the trachea)</text>
<circle cx="380" cy="178" r="11" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.2"/>
