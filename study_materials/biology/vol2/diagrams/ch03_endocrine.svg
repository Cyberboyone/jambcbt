<text x="598" y="114" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="start" font-weight="normal">(master gland)</text>
<circle cx="380" cy="138" r="11" fill="#FFFFFF" stroke="#D97706" stroke-width="2.2"/>
<circle cx="380" cy="138" r="5" fill="#D97706"/>
