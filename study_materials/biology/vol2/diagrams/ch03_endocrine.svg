<text x="196" y="268" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="end" font-weight="normal">(islets of Langerhans)</text>
<circle cx="356" cy="306" r="11" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.2"/>
<circle cx="356" cy="306" r="5" fill="#2563EB"/>
