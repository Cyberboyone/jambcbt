  <rect x="0" y="0" width="760" height="340" fill="#FFFFFF"/>
<text x="380" y="26" font-family="DejaVu Sans" font-size="12.8" fill="#0E1F40" text-anchor="middle" font-weight="bold">AUXIN AND PHOTOTROPISM — WHY A SHOOT BENDS TO THE LIGHT</text>
