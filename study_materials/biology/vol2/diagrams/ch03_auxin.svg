<line x1="690" y1="100" x2="646" y2="100" stroke="#D97706" stroke-width="1.6" marker-end="url(#aa)"/>
<line x1="690" y1="150" x2="646" y2="150" stroke="#D97706" stroke-width="1.6" marker-end="url(#aa)"/>
<line x1="690" y1="200" x2="646" y2="200" stroke="#D97706" stroke-width="1.6" marker-end="url(#aa)"/>
<circle cx="510" cy="210" r="3.4" fill="#D97706"/>
<circle cx="516" cy="190" r="3.4" fill="#D97706"/>
