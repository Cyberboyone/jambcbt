<circle cx="534" cy="150" r="3.4" fill="#D97706"/>
<circle cx="546" cy="134" r="3.4" fill="#D97706"/>
<text x="560" y="86" font-family="DejaVu Sans" font-size="8.8" fill="#D97706" text-anchor="middle" font-weight="normal">auxin collects on the shaded side</text>
<line x1="560" y1="90" x2="528" y2="152" stroke="#D97706" stroke-width="0.9"/>
<text x="560" y="290" font-family="DejaVu Sans" font-size="9.4" fill="#334155" text-anchor="middle" font-weight="normal">Cells on the shaded side elongate more,</text>
<text x="560" y="304" font-family="DejaVu Sans" font-size="9.4" fill="#334155" text-anchor="middle" font-weight="normal">so the shoot bends towards the light.</text>
<text x="380" y="326" font-family="DejaVu Sans" font-size="8.8" fill="#64748B" text-anchor="middle" font-weight="normal">Auxin (indole acetic acid) is made in the shoot tip, moves away from light, and makes the shaded cells elongate.</text>
