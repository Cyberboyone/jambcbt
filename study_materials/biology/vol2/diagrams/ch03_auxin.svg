<line x1="330" y1="210" x2="290" y2="210" stroke="#D97706" stroke-width="1.6" marker-end="url(#aa)"/>
<text x="200" y="78" font-family="DejaVu Sans" font-size="9.4" fill="#64748B" text-anchor="middle" font-weight="normal">Light from all sides</text>
<text x="200" y="290" font-family="DejaVu Sans" font-size="9.4" fill="#334155" text-anchor="middle" font-weight="normal">Auxin spreads evenly, so every side</text>
<text x="200" y="304" font-family="DejaVu Sans" font-size="9.4" fill="#334155" text-anchor="middle" font-weight="normal">grows at the same rate: straight shoot.</text>
<rect x="410" y="54" width="300" height="220" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/>
<path d="M 500 272 q 4 -74 22 -112 q 16 -32 54 -40" fill="none" stroke="#008751" stroke-width="8" stroke-linecap="round"/>
