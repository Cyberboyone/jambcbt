<text x="380" y="311" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="middle" font-weight="normal">Sound: pinna → canal → eardrum (vibrates) → ossicles (amplify) → oval window → cochlea (receptors) → auditory nerve → brain.</text>
<text x="380" y="323" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="middle" font-weight="normal">The semicircular canals do not hear: they detect the position and movement of the head (balance).</text>
