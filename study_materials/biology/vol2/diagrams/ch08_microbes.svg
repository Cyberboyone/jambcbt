  <rect x="0" y="0" width="720" height="352" fill="#FFFFFF"/>
<text x="360" y="26" font-family="DejaVu Sans" font-size="12.8" fill="#0E1F40" text-anchor="middle" font-weight="bold">THREE KINDS OF MICRO-ORGANISM</text>
<rect x="14" y="44" width="224" height="252" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="126" y="66" font-family="DejaVu Sans" font-size="10.8" fill="#008751" text-anchor="middle" font-weight="bold">BACTERIUM</text>
<text x="126" y="82" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">capsule outside, cell wall inside</text>
<rect x="42" y="96" width="168" height="68" rx="34" fill="#ECFDF5" stroke="#008751" stroke-width="2.2"/>
<rect x="52" y="101" width="148" height="58" rx="29" fill="#FFFFFF" stroke="#008751" stroke-width="1.4"/>
<path d="M 74 130 q 13 -13 26 0 q 13 13 26 0 q 13 -13 26 0" fill="none" stroke="#0E1F40" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="178" cy="118" r="6" fill="#D97706" stroke="#D97706" stroke-width="0.8"/>
<path d="M 208 130 q 16 8 6 22 q -10 14 6 22" fill="none" stroke="#008751" stroke-width="1.8" stroke-linecap="round"/>
<line x1="96" y1="174" x2="108" y2="148" stroke="#CBD5E1" stroke-width="0.9"/>
<text x="26" y="192" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">DNA — one loop, no nucleus</text>
<line x1="150" y1="210" x2="210" y2="178" stroke="#CBD5E1" stroke-width="0.9"/>
<text x="148" y="222" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="start" font-weight="normal">flagellum — for movement</text>
<text x="126" y="250" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">one cell, about 1–5 µm,</text>
<text x="126" y="264" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">divides by binary fission</text>
<rect x="248" y="44" width="224" height="252" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="360" y="66" font-family="DejaVu Sans" font-size="10.8" fill="#DC2626" text-anchor="middle" font-weight="bold">VIRUS</text>
<text x="360" y="82" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">protein coat, no cytoplasm</text>
<polygon points="360,96 404,120 404,168 360,192 316,168 316,120" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.0"/>
<line x1="398.1051177665153" y1="120.0" x2="407.63139720814416" y2="114.5" stroke="#DC2626" stroke-width="2.2"/>
<line x1="398.1051177665153" y1="168.0" x2="407.63139720814416" y2="173.5" stroke="#DC2626" stroke-width="2.2"/>
<line x1="360.0" y1="192.0" x2="360.0" y2="203.0" stroke="#DC2626" stroke-width="2.2"/>
<line x1="321.8948822334847" y1="168.0" x2="312.36860279185584" y2="173.5" stroke="#DC2626" stroke-width="2.2"/>
<line x1="321.8948822334847" y1="120.0" x2="312.36860279185584" y2="114.5" stroke="#DC2626" stroke-width="2.2"/>
<line x1="360.0" y1="96.0" x2="360.0" y2="85.0" stroke="#DC2626" stroke-width="2.2"/>
<path d="M 340 132 q 10 -10 20 0 q 10 10 20 0 q 10 -10 20 0" fill="none" stroke="#0E1F40" stroke-width="2.2" stroke-linecap="round"/>
<text x="360" y="226" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="middle" font-weight="normal">nucleic acid inside</text>
<text x="360" y="242" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">about 20–300 nm —</text>
<text x="360" y="256" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">smaller than any cell</text>
<text x="360" y="274" font-family="DejaVu Sans" font-size="8.6" fill="#DC2626" text-anchor="middle" font-weight="normal">must enter a host cell to multiply</text>
<rect x="482" y="44" width="224" height="252" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="594" y="66" font-family="DejaVu Sans" font-size="10.8" fill="#7C3AED" text-anchor="middle" font-weight="bold">FUNGUS</text>
<text x="594" y="82" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">hyphae make a mycelium</text>
<path d="M 594 198 q -16 -22 -34 -38 q -14 -12 -22 -26" fill="none" stroke="#7C3AED" stroke-width="2.4" stroke-linecap="round"/>
<path d="M 594 198 q 16 -22 34 -38 q 14 -12 22 -26" fill="none" stroke="#7C3AED" stroke-width="2.4" stroke-linecap="round"/>
<path d="M 594 198 q 4 -34 0 -62" fill="none" stroke="#7C3AED" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="536" cy="130" r="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/>
<circle cx="652" cy="130" r="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/>
<circle cx="594" cy="134" r="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/>
<circle cx="518" cy="118" r="3.2" fill="#7C3AED" stroke="#7C3AED" stroke-width="0.6"/>
<circle cx="670" cy="118" r="3.2" fill="#7C3AED" stroke="#7C3AED" stroke-width="0.6"/>
<circle cx="594" cy="112" r="3.2" fill="#7C3AED" stroke="#7C3AED" stroke-width="0.6"/>
<circle cx="566" cy="112" r="3.2" fill="#7C3AED" stroke="#7C3AED" stroke-width="0.6"/>
<circle cx="622" cy="112" r="3.2" fill="#7C3AED" stroke="#7C3AED" stroke-width="0.6"/>
<text x="594" y="216" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="middle" font-weight="normal">spores are released from the tips</text>
<text x="594" y="238" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">yeast is the single-celled exception —</text>
<text x="594" y="252" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">it buds instead of making hyphae</text>
<text x="594" y="274" font-family="DejaVu Sans" font-size="8.6" fill="#7C3AED" text-anchor="middle" font-weight="normal">ringworm, athlete's foot, moulds</text>
<rect x="14" y="308" width="692" height="32" rx="6" fill="#ECFDF5" stroke="#008751" stroke-width="1.0"/>
<text x="360" y="322" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">Bacteria and fungi are cells and can be killed by antibiotics;</text>
<text x="360" y="335" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">a virus is not a cell, so antibiotics do not touch it.</text>
</svg>
