<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 292" width="760" height="292">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="292" fill="#FFFFFF"/>
<text x="380" y="26" font-family="DejaVu Sans" font-size="13.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">THE REFLEX ARC — THE FIVE COMPONENTS, IN ORDER</text>
<rect x="20" y="62" width="128" height="108" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.8"/>
<rect x="20" y="62" width="128" height="6" rx="3" fill="#D97706"/>
<text x="84" y="96" font-family="DejaVu Sans" font-size="11.0" fill="#D97706" text-anchor="middle" font-weight="bold">RECEPTOR</text>
<text x="84" y="138" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">skin, retina,</text>
<text x="84" y="150" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">ear</text>
<line x1="149" y1="116" x2="167" y2="116" stroke="#64748B" stroke-width="2.6" marker-end="url(#an)"/>
<rect x="168" y="62" width="128" height="108" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8"/>
<rect x="168" y="62" width="128" height="6" rx="3" fill="#2563EB"/>
<text x="232" y="96" font-family="DejaVu Sans" font-size="11.0" fill="#2563EB" text-anchor="middle" font-weight="bold">SENSORY</text>
<text x="232" y="111" font-family="DejaVu Sans" font-size="11.0" fill="#2563EB" text-anchor="middle" font-weight="bold">NEURONE</text>
<text x="232" y="138" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">dorsal root</text>
<text x="232" y="150" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">into the cord</text>
<line x1="297" y1="116" x2="315" y2="116" stroke="#64748B" stroke-width="2.6" marker-end="url(#an)"/>
<rect x="316" y="62" width="128" height="108" rx="8" fill="#FFFFFF" stroke="#008751" stroke-width="1.8"/>
<rect x="316" y="62" width="128" height="6" rx="3" fill="#008751"/>
<text x="380" y="96" font-family="DejaVu Sans" font-size="11.0" fill="#008751" text-anchor="middle" font-weight="bold">RELAY</text>
<text x="380" y="111" font-family="DejaVu Sans" font-size="11.0" fill="#008751" text-anchor="middle" font-weight="bold">NEURONE</text>
<text x="380" y="138" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">inside the</text>
<text x="380" y="150" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">spinal cord</text>
<line x1="445" y1="116" x2="463" y2="116" stroke="#64748B" stroke-width="2.6" marker-end="url(#an)"/>
<rect x="464" y="62" width="128" height="108" rx="8" fill="#FFFFFF" stroke="#00A859" stroke-width="1.8"/>
<rect x="464" y="62" width="128" height="6" rx="3" fill="#00A859"/>
<text x="528" y="96" font-family="DejaVu Sans" font-size="11.0" fill="#00A859" text-anchor="middle" font-weight="bold">MOTOR</text>
<text x="528" y="111" font-family="DejaVu Sans" font-size="11.0" fill="#00A859" text-anchor="middle" font-weight="bold">NEURONE</text>
<text x="528" y="138" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">ventral root</text>
<text x="528" y="150" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">out of the cord</text>
<line x1="593" y1="116" x2="611" y2="116" stroke="#64748B" stroke-width="2.6" marker-end="url(#an)"/>
<rect x="612" y="62" width="128" height="108" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.8"/>
<rect x="612" y="62" width="128" height="6" rx="3" fill="#DC2626"/>
<text x="676" y="96" font-family="DejaVu Sans" font-size="11.0" fill="#DC2626" text-anchor="middle" font-weight="bold">EFFECTOR</text>
<text x="676" y="138" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">muscle or</text>
<text x="676" y="150" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">gland</text>
<rect x="20" y="190" width="720" height="44" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.2"/>
<text x="380" y="210" font-family="DejaVu Sans" font-size="9.4" fill="#334155" text-anchor="middle" font-weight="normal">Impulse in: receptor → sensory neurone → spinal cord.   Impulse out: relay neurone → motor neurone → effector.</text>
<text x="380" y="226" font-family="DejaVu Sans" font-size="9.4" fill="#334155" text-anchor="middle" font-weight="normal">No decision by the brain is needed, which is why the response is faster than a voluntary action.</text>
<text x="380" y="258" font-family="DejaVu Sans" font-size="9.2" fill="#64748B" text-anchor="middle" font-weight="normal">Examples: withdrawal from a hot object · knee jerk · pupil constriction · blinking · coughing and sneezing.</text>
</svg>
