  <rect x="0" y="0" width="760" height="320" fill="#FFFFFF"/>
<text x="380" y="28" font-family="DejaVu Sans" font-size="13.2" fill="#0E1F40" text-anchor="middle" font-weight="bold">The structure of a local government council</text>
<rect x="280" y="46" width="200" height="46" rx="8" fill="#008751" stroke="#008751" stroke-width="1.4"/>
<text x="380" y="68" font-family="DejaVu Sans" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">THE CHAIRMAN</text>
<text x="380" y="83" font-family="DejaVu Sans" font-size="7.8" fill="#FFFFFF" text-anchor="middle" font-weight="normal">elected executive head</text>
<line x1="380" y1="92" x2="380.0" y2="99.6" stroke="#334155" stroke-width="1.4"/><polygon points="380.0,112.0 375.4,99.6 384.6,99.6" fill="#334155"/>
<rect x="230" y="112" width="300" height="44" rx="8" fill="#FFFFFF" stroke="#008751" stroke-width="1.4"/>
<text x="380" y="131" font-family="DejaVu Sans" font-size="9.6" fill="#008751" text-anchor="middle" font-weight="bold">THE COUNCIL</text>
<text x="380" y="147" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">councillors, one per ward — the legislature</text>
<line x1="380" y1="156" x2="132.22616297968034" y2="197.93095703420795" stroke="#334155" stroke-width="1.2"/><polygon points="120.0,200.0 131.5,193.4 133.0,202.5" fill="#334155"/>
