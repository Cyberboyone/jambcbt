<text x="120" y="233" font-family="DejaVu Sans" font-size="8.4" fill="#2563EB" text-anchor="middle" font-weight="bold">COUNCILLORS</text>
<text x="120" y="246" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">political heads</text>
<text x="120" y="258" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">of departments</text>
<line x1="380" y1="156" x2="320.49829321021645" y2="193.4010728392925" stroke="#334155" stroke-width="1.2"/><polygon points="310.0,200.0 318.0,189.5 323.0,197.3" fill="#334155"/>
<rect x="230" y="200" width="160" height="70" rx="7" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/>
<text x="310" y="220" font-family="DejaVu Sans" font-size="8.4" fill="#7C3AED" text-anchor="middle" font-weight="bold">SECRETARY</text>
<text x="310" y="246" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">head of the</text>
<text x="310" y="258" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">administration</text>
<line x1="380" y1="156" x2="488.3579336830061" y2="195.73124235043556" stroke="#334155" stroke-width="1.2"/><polygon points="500.0,200.0 486.8,200.1 490.0,191.4" fill="#334155"/>
<rect x="420" y="200" width="160" height="70" rx="7" fill="#FFFFFF" stroke="#D97706" stroke-width="1.3"/>
