<text x="500" y="246" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">collects and</text>
<text x="500" y="258" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">keeps the money</text>
<line x1="380" y1="156" x2="617.7877016017314" y2="197.85063548190473" stroke="#334155" stroke-width="1.2"/><polygon points="630.0,200.0 617.0,202.4 618.6,193.3" fill="#334155"/>
<rect x="550" y="200" width="160" height="70" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.3"/>
<text x="630" y="220" font-family="DejaVu Sans" font-size="8.4" fill="#DC2626" text-anchor="middle" font-weight="bold">AUDITOR</text>
<text x="630" y="246" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">checks the</text>
<text x="630" y="258" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">accounts</text>
<rect x="40" y="284" width="680" height="26" rx="6" fill="#ECFDF5" stroke="#008751" stroke-width="1.0"/>
<text x="380" y="301" font-family="DejaVu Sans" font-size="8.4" fill="#0E1F40" text-anchor="middle" font-weight="normal">Nigeria has 774 local government areas, created by the 1976 reform and protected by section 7 of the Constitution.</text>
