<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="340" fill="#FFFFFF"/>
<text x="380" y="28" font-family="DejaVu Sans" font-size="13.2" fill="#0E1F40" text-anchor="middle" font-weight="bold">Two executives: where the head of government sits</text>
<rect x="40" y="50" width="320" height="250" rx="9" fill="#FFFFFF" stroke="#008751" stroke-width="1.6"/>
<rect x="40" y="50" width="320" height="40" rx="8" fill="#008751" stroke="#008751" stroke-width="1.0"/>
<text x="200" y="76" font-family="DejaVu Sans" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">PARLIAMENTARY</text>
<text x="54" y="112" font-family="DejaVu Sans" font-size="8.6" fill="#008751" text-anchor="start" font-weight="bold">Head of state</text>
<text x="54" y="125" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">ceremonial monarch or president</text>
<text x="54" y="150" font-family="DejaVu Sans" font-size="8.6" fill="#008751" text-anchor="start" font-weight="bold">Head of government</text>
<text x="54" y="163" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">Prime Minister, from the majority party</text>
<text x="54" y="188" font-family="DejaVu Sans" font-size="8.6" fill="#008751" text-anchor="start" font-weight="bold">Source of power</text>
<text x="54" y="201" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">the legislature — ministers are MPs</text>
<text x="54" y="226" font-family="DejaVu Sans" font-size="8.6" fill="#008751" text-anchor="start" font-weight="bold">Removal</text>
<text x="54" y="239" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">a vote of no confidence</text>
<text x="54" y="264" font-family="DejaVu Sans" font-size="8.6" fill="#008751" text-anchor="start" font-weight="bold">Example</text>
<text x="54" y="277" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">Britain, India, Canada</text>
<rect x="400" y="50" width="320" height="250" rx="9" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
<rect x="400" y="50" width="320" height="40" rx="8" fill="#2563EB" stroke="#2563EB" stroke-width="1.0"/>
<text x="560" y="76" font-family="DejaVu Sans" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">PRESIDENTIAL</text>
<text x="414" y="112" font-family="DejaVu Sans" font-size="8.6" fill="#2563EB" text-anchor="start" font-weight="bold">Head of state</text>
<text x="414" y="125" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">the President — one person, both roles</text>
<text x="414" y="150" font-family="DejaVu Sans" font-size="8.6" fill="#2563EB" text-anchor="start" font-weight="bold">Head of government</text>
<text x="414" y="163" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">the President</text>
<text x="414" y="188" font-family="DejaVu Sans" font-size="8.6" fill="#2563EB" text-anchor="start" font-weight="bold">Source of power</text>
<text x="414" y="201" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">direct election, separate from the legislature</text>
<text x="414" y="226" font-family="DejaVu Sans" font-size="8.6" fill="#2563EB" text-anchor="start" font-weight="bold">Removal</text>
<text x="414" y="239" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">impeachment for misconduct</text>
<text x="414" y="264" font-family="DejaVu Sans" font-size="8.6" fill="#2563EB" text-anchor="start" font-weight="bold">Example</text>
<text x="414" y="277" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">Nigeria, USA, Brazil</text>
<rect x="40" y="308" width="680" height="24" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.0"/>
<text x="380" y="324" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="normal">The presidential system separates the executive from the legislature; the parliamentary system fuses them.</text>
</svg>
