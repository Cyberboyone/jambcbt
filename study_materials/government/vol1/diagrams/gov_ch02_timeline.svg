<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" font-family="DejaVu Sans" font-size="13.2" fill="#0E1F40" text-anchor="middle" font-weight="bold">The Nigerian constitutional chain: six constitutions, three republics</text>
<line x1="50" y1="180" x2="716" y2="180" stroke="#0E1F40" stroke-width="2.2"/>
<circle cx="70" cy="180" r="7" fill="#008751"/>
<line x1="70" y1="180" x2="70" y2="146" stroke="#008751" stroke-width="1.4"/>
<rect x="14" y="112" width="112" height="66" rx="6" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<text x="70" y="129" font-family="DejaVu Sans" font-size="10" fill="#008751" text-anchor="middle" font-weight="bold">1922</text>
<text x="70" y="145" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="bold">Clifford</text>
<text x="70" y="159" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">Elective principle</text>
<text x="70" y="170" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">for Lagos and Calabar</text>
<circle cx="178" cy="180" r="7" fill="#008751"/>
<line x1="178" y1="180" x2="178" y2="214" stroke="#008751" stroke-width="1.4"/>
<rect x="122" y="214" width="112" height="66" rx="6" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<text x="178" y="231" font-family="DejaVu Sans" font-size="10" fill="#008751" text-anchor="middle" font-weight="bold">1946</text>
<text x="178" y="247" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="bold">Richards</text>
<text x="178" y="261" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">Three regions;</text>
<text x="178" y="272" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">regionalism begins</text>
<circle cx="288" cy="180" r="7" fill="#008751"/>
<line x1="288" y1="180" x2="288" y2="146" stroke="#008751" stroke-width="1.4"/>
<rect x="232" y="112" width="112" height="66" rx="6" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<text x="288" y="129" font-family="DejaVu Sans" font-size="10" fill="#008751" text-anchor="middle" font-weight="bold">1951</text>
<text x="288" y="145" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="bold">Macpherson</text>
<text x="288" y="159" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">Ministers from</text>
<text x="288" y="170" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">the legislature</text>
<circle cx="398" cy="180" r="7" fill="#008751"/>
<line x1="398" y1="180" x2="398" y2="214" stroke="#008751" stroke-width="1.4"/>
<rect x="342" y="214" width="112" height="66" rx="6" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<text x="398" y="231" font-family="DejaVu Sans" font-size="10" fill="#008751" text-anchor="middle" font-weight="bold">1954</text>
<text x="398" y="247" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="bold">Lyttleton</text>
<text x="398" y="261" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">Federalism;</text>
<text x="398" y="272" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">Lagos a federal territory</text>
<circle cx="500" cy="180" r="7" fill="#008751"/>
<line x1="500" y1="180" x2="500" y2="146" stroke="#008751" stroke-width="1.4"/>
<rect x="444" y="112" width="112" height="66" rx="6" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<text x="500" y="129" font-family="DejaVu Sans" font-size="10" fill="#008751" text-anchor="middle" font-weight="bold">1960</text>
<text x="500" y="145" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="bold">Independence</text>
<text x="500" y="159" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">Westminster model;</text>
<text x="500" y="170" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">Prime Minister</text>
<circle cx="592" cy="180" r="7" fill="#008751"/>
<line x1="592" y1="180" x2="592" y2="214" stroke="#008751" stroke-width="1.4"/>
<rect x="536" y="214" width="112" height="66" rx="6" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<text x="592" y="231" font-family="DejaVu Sans" font-size="10" fill="#008751" text-anchor="middle" font-weight="bold">1963</text>
<text x="592" y="247" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="bold">Republican</text>
<text x="592" y="261" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">President replaces</text>
<text x="592" y="272" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">the Queen</text>
<circle cx="668" cy="180" r="7" fill="#008751"/>
<line x1="668" y1="180" x2="668" y2="146" stroke="#008751" stroke-width="1.4"/>
<rect x="612" y="112" width="112" height="66" rx="6" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<text x="668" y="129" font-family="DejaVu Sans" font-size="10" fill="#008751" text-anchor="middle" font-weight="bold">1979</text>
<text x="668" y="145" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="bold">Presidential</text>
<text x="668" y="159" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">Executive President;</text>
<text x="668" y="170" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">FCT created</text>
<rect x="50" y="300" width="660" height="48" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.2"/>
<text x="380" y="320" font-family="DejaVu Sans" font-size="9.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">1999 — the constitution now in force: 36 states and the FCT, 774 local government areas, a bicameral National Assembly.</text>
<text x="380" y="338" font-family="DejaVu Sans" font-size="9" fill="#334155" text-anchor="middle" font-weight="normal">Every one of these constitutions widened the franchise or shifted power from the Governor to elected Nigerians.</text>
</svg>
