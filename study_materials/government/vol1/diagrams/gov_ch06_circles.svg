<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" font-family="DejaVu Sans" font-size="13.2" fill="#0E1F40" text-anchor="middle" font-weight="bold">The concentric circles: where Nigeria's foreign policy begins</text>
<circle cx="380" cy="222" r="172" fill="#ECFDF5" stroke="#008751" stroke-width="1.6"/>
<circle cx="380" cy="222" r="132" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/>
<circle cx="380" cy="222" r="92" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.6"/>
<circle cx="380" cy="222" r="52" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/>
<text x="380" y="226" font-family="DejaVu Sans" font-size="11" fill="#D97706" text-anchor="middle" font-weight="bold">NIGERIA</text>
<text x="380" y="128" font-family="DejaVu Sans" font-size="9" fill="#7C3AED" text-anchor="middle" font-weight="bold">WEST AFRICA  •  ECOWAS</text>
<text x="380" y="88" font-family="DejaVu Sans" font-size="9" fill="#2563EB" text-anchor="middle" font-weight="bold">AFRICA  •  AU</text>
<text x="380" y="50" font-family="DejaVu Sans" font-size="9" fill="#008751" text-anchor="middle" font-weight="bold">THE WORLD  •  UN</text>
<rect x="40" y="356" width="680" height="36" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.0"/>
<text x="380" y="374" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="normal">Africa is the centre-piece: Nigeria acts in the world through Africa, and in Africa through West Africa.</text>
<text x="380" y="388" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">Each ring is a commitment, not a boundary — the inner ring always wins.</text>
</svg>
