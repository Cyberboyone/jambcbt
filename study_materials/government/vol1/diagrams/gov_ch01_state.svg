<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="340" fill="#FFFFFF"/>
<text x="380" y="30" font-family="DejaVu Sans" font-size="13.5" fill="#0E1F40" text-anchor="middle" font-weight="bold">The four elements of the state — remove one and it is no longer a state</text>
<polygon points="90,78 670,78 640,52 120,52" fill="#0E1F40"/>
<text x="380" y="70" font-family="DejaVu Sans" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">T H E   S T A T E</text>
<rect x="92" y="90" width="138" height="150" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.6"/>
<rect x="92" y="90" width="138" height="6" rx="3" fill="#008751" stroke="#008751" stroke-width="1.0"/>
<text x="161" y="118" font-family="DejaVu Sans" font-size="10.6" fill="#008751" text-anchor="middle" font-weight="bold">POPULATION</text>
<text x="161" y="142" font-family="DejaVu Sans" font-size="9.4" fill="#334155" text-anchor="middle" font-weight="normal">People, without</text>
<text x="161" y="158" font-family="DejaVu Sans" font-size="9.4" fill="#334155" text-anchor="middle" font-weight="normal">whom there is</text>
<text x="161" y="174" font-family="DejaVu Sans" font-size="9.4" fill="#334155" text-anchor="middle" font-weight="normal">nothing to rule</text>
<rect x="114" y="246" width="94" height="30" rx="5" fill="#FFFFFF" stroke="#008751" stroke-width="1.2"/>
<text x="161" y="266" font-family="DejaVu Sans" font-size="9" fill="#008751" text-anchor="middle" font-weight="bold">required</text>
<rect x="238" y="90" width="138" height="150" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/>
<rect x="238" y="90" width="138" height="6" rx="3" fill="#2563EB" stroke="#2563EB" stroke-width="1.0"/>
<text x="307" y="118" font-family="DejaVu Sans" font-size="10.6" fill="#2563EB" text-anchor="middle" font-weight="bold">TERRITORY</text>
<text x="307" y="142" font-family="DejaVu Sans" font-size="9.4" fill="#334155" text-anchor="middle" font-weight="normal">A defined land</text>
<text x="307" y="158" font-family="DejaVu Sans" font-size="9.4" fill="#334155" text-anchor="middle" font-weight="normal">area with</text>
<text x="307" y="174" font-family="DejaVu Sans" font-size="9.4" fill="#334155" text-anchor="middle" font-weight="normal">recognised borders</text>
<rect x="260" y="246" width="94" height="30" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
<text x="307" y="266" font-family="DejaVu Sans" font-size="9" fill="#2563EB" text-anchor="middle" font-weight="bold">required</text>
<rect x="384" y="90" width="138" height="150" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.6"/>
<rect x="384" y="90" width="138" height="6" rx="3" fill="#7C3AED" stroke="#7C3AED" stroke-width="1.0"/>
<text x="453" y="118" font-family="DejaVu Sans" font-size="10.6" fill="#7C3AED" text-anchor="middle" font-weight="bold">SOVEREIGNTY</text>
<text x="453" y="142" font-family="DejaVu Sans" font-size="9.4" fill="#334155" text-anchor="middle" font-weight="normal">Supreme power,</text>
<text x="453" y="158" font-family="DejaVu Sans" font-size="9.4" fill="#334155" text-anchor="middle" font-weight="normal">answerable to</text>
<text x="453" y="174" font-family="DejaVu Sans" font-size="9.4" fill="#334155" text-anchor="middle" font-weight="normal">no other state</text>
<rect x="406" y="246" width="94" height="30" rx="5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.2"/>
<text x="453" y="266" font-family="DejaVu Sans" font-size="9" fill="#7C3AED" text-anchor="middle" font-weight="bold">required</text>
<rect x="530" y="90" width="138" height="150" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/>
<rect x="530" y="90" width="138" height="6" rx="3" fill="#D97706" stroke="#D97706" stroke-width="1.0"/>
<text x="599" y="118" font-family="DejaVu Sans" font-size="10.6" fill="#D97706" text-anchor="middle" font-weight="bold">GOVERNMENT</text>
<text x="599" y="142" font-family="DejaVu Sans" font-size="9.4" fill="#334155" text-anchor="middle" font-weight="normal">The machinery</text>
<text x="599" y="158" font-family="DejaVu Sans" font-size="9.4" fill="#334155" text-anchor="middle" font-weight="normal">that exercises</text>
<text x="599" y="174" font-family="DejaVu Sans" font-size="9.4" fill="#334155" text-anchor="middle" font-weight="normal">the power</text>
<rect x="552" y="246" width="94" height="30" rx="5" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/>
<text x="599" y="266" font-family="DejaVu Sans" font-size="9" fill="#D97706" text-anchor="middle" font-weight="bold">required</text>
<rect x="92" y="292" width="576" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="380" y="314" font-family="DejaVu Sans" font-size="9.4" fill="#64748B" text-anchor="middle" font-weight="normal">A state is a community of people occupying a defined territory, under a government, and independent of external control.</text>
</svg>
