<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="300" fill="#FFFFFF"/>
<text x="380" y="28" font-family="DejaVu Sans" font-size="13.5" fill="#0E1F40" text-anchor="middle" font-weight="bold">Forms of government — the axis runs from many rulers to one</text>
<rect x="60" y="62" width="640" height="8" rx="4" fill="#E2E8F0" stroke="#E2E8F0" stroke-width="0"/>
<polygon points="700,66 716,66 708,58" fill="#334155"/>
<text x="60" y="56" font-family="DejaVu Sans" font-size="9" fill="#64748B" text-anchor="start" font-weight="normal">Power widely shared</text>
<text x="716" y="56" font-family="DejaVu Sans" font-size="9" fill="#64748B" text-anchor="end" font-weight="normal">Power concentrated</text>
<circle cx="78" cy="66" r="9" fill="#008751"/>
<line x1="78" y1="90" x2="78" y2="112" stroke="#008751" stroke-width="1.6"/>
<rect x="12" y="112" width="132" height="96" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.5"/>
<rect x="12" y="112" width="132" height="5" rx="2.5" fill="#008751" stroke="#008751" stroke-width="1.0"/>
<text x="78" y="134" font-family="DejaVu Sans" font-size="9.4" fill="#008751" text-anchor="middle" font-weight="bold">DEMOCRACY</text>
<text x="78" y="152" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="middle" font-weight="normal">Rule by the</text>
<text x="78" y="166" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="middle" font-weight="normal">people; free</text>
<text x="78" y="180" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="middle" font-weight="normal">elections</text>
<circle cx="226" cy="66" r="9" fill="#00A859"/>
<line x1="226" y1="90" x2="226" y2="112" stroke="#00A859" stroke-width="1.6"/>
<rect x="160" y="112" width="132" height="96" rx="7" fill="#FFFFFF" stroke="#00A859" stroke-width="1.5"/>
<rect x="160" y="112" width="132" height="5" rx="2.5" fill="#00A859" stroke="#00A859" stroke-width="1.0"/>
<text x="226" y="134" font-family="DejaVu Sans" font-size="9.4" fill="#00A859" text-anchor="middle" font-weight="bold">REPUBLIC</text>
<text x="226" y="152" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="middle" font-weight="normal">Elected head,</text>
<text x="226" y="166" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="middle" font-weight="normal">no monarch</text>
<circle cx="374" cy="66" r="9" fill="#D97706"/>
<line x1="374" y1="90" x2="374" y2="112" stroke="#D97706" stroke-width="1.6"/>
<rect x="308" y="112" width="132" height="96" rx="7" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
<rect x="308" y="112" width="132" height="5" rx="2.5" fill="#D97706" stroke="#D97706" stroke-width="1.0"/>
<text x="374" y="134" font-family="DejaVu Sans" font-size="9.4" fill="#D97706" text-anchor="middle" font-weight="bold">MONARCHY</text>
<text x="374" y="152" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="middle" font-weight="normal">One hereditary</text>
<text x="374" y="166" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="middle" font-weight="normal">ruler</text>
<circle cx="522" cy="66" r="9" fill="#7C3AED"/>
<line x1="522" y1="90" x2="522" y2="112" stroke="#7C3AED" stroke-width="1.6"/>
<rect x="456" y="112" width="132" height="96" rx="7" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
<rect x="456" y="112" width="132" height="5" rx="2.5" fill="#7C3AED" stroke="#7C3AED" stroke-width="1.0"/>
<text x="522" y="134" font-family="DejaVu Sans" font-size="9.4" fill="#7C3AED" text-anchor="middle" font-weight="bold">OLIGARCHY</text>
<text x="522" y="152" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="middle" font-weight="normal">Rule by a</text>
<text x="522" y="166" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="middle" font-weight="normal">few</text>
<circle cx="654" cy="66" r="9" fill="#DC2626"/>
<line x1="654" y1="90" x2="654" y2="112" stroke="#DC2626" stroke-width="1.6"/>
<rect x="588" y="112" width="132" height="96" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
<rect x="588" y="112" width="132" height="5" rx="2.5" fill="#DC2626" stroke="#DC2626" stroke-width="1.0"/>
<text x="654" y="134" font-family="DejaVu Sans" font-size="9.4" fill="#DC2626" text-anchor="middle" font-weight="bold">DICTATORSHIP</text>
<text x="654" y="152" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="middle" font-weight="normal">One ruler,</text>
<text x="654" y="166" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="middle" font-weight="normal">no limits</text>
<rect x="60" y="224" width="640" height="58" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.3"/>
<text x="380" y="246" font-family="DejaVu Sans" font-size="10" fill="#0E1F40" text-anchor="middle" font-weight="bold">Every form answers two questions: WHO rules, and WHAT LIMITS the ruler.</text>
<text x="380" y="266" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">A monarchy can be constitutional and democratic; a republic can be a dictatorship. The label alone never settles it.</text>
</svg>
