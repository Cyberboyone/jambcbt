<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 382" width="760" height="382">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="382" fill="#FFFFFF"/>
<rect x="0" y="0" width="760" height="382" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="380.0" y="28" font-family="DejaVu Sans" font-size="13.5" fill="#0E1F40" text-anchor="middle" font-weight="bold">The three legislative lists</text>
<text x="380.0" y="46" font-family="DejaVu Sans" font-size="9.8" fill="#64748B" text-anchor="middle" font-weight="normal">Who may legislate on what: the test that decides every federalism question in the paper</text>
<rect x="18" y="66" width="228" height="214" rx="9" fill="#ECFDF5" stroke="#008751" stroke-width="1.6"/>
<rect x="18" y="66" width="228" height="6" rx="3" fill="#008751" stroke="#008751" stroke-width="1.0"/>
<text x="132" y="92" font-family="DejaVu Sans" font-size="10.6" fill="#008751" text-anchor="middle" font-weight="bold">EXCLUSIVE</text>
<text x="132" y="110" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="middle" font-weight="normal" font-style="italic">Federal only</text>
<text x="132" y="136" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">defence and the armed forces</text>
<text x="132" y="156" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">foreign affairs and treaties</text>
<text x="132" y="176" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">currency and the central bank</text>
<text x="132" y="196" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">citizenship and immigration</text>
<text x="132" y="216" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">police (the Nigeria Police Force)</text>
<text x="132" y="236" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">weights, measures and patents</text>
<rect x="266" y="66" width="228" height="214" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/>
<rect x="266" y="66" width="228" height="6" rx="3" fill="#2563EB" stroke="#2563EB" stroke-width="1.0"/>
<text x="380" y="92" font-family="DejaVu Sans" font-size="10.6" fill="#2563EB" text-anchor="middle" font-weight="bold">CONCURRENT</text>
<text x="380" y="110" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="middle" font-weight="normal" font-style="italic">Federal and state</text>
<text x="380" y="136" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">education</text>
<text x="380" y="156" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">health</text>
<text x="380" y="176" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">agriculture</text>
<text x="380" y="196" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">electricity</text>
<text x="380" y="216" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">industrial development</text>
<text x="380" y="236" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">water supply</text>
<rect x="514" y="66" width="228" height="214" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.6"/>
<rect x="514" y="66" width="228" height="6" rx="3" fill="#7C3AED" stroke="#7C3AED" stroke-width="1.0"/>
<text x="628" y="92" font-family="DejaVu Sans" font-size="10.6" fill="#7C3AED" text-anchor="middle" font-weight="bold">RESIDUAL</text>
<text x="628" y="110" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="middle" font-weight="normal" font-style="italic">State only</text>
<text x="628" y="136" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">chieftaincy and traditional</text>
<text x="526" y="156" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="start" font-weight="normal">institutions</text>
<text x="628" y="176" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">local government</text>
<text x="628" y="196" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">land in the state</text>
<text x="628" y="216" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">markets and motor parks</text>
<text x="628" y="236" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">state roads and transport</text>
<rect x="18" y="292" width="724" height="78" rx="9" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3"/>
<text x="380" y="314" font-family="DejaVu Sans" font-size="10.2" fill="#0E1F40" text-anchor="middle" font-weight="bold">The rule the paper tests</text>
<text x="380" y="334" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="middle" font-weight="normal">Where a federal law and a state law conflict on a concurrent matter, the federal law prevails — but only to the extent of the inconsistency.</text>
<text x="380" y="352" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="middle" font-weight="normal">A state may legislate on a residual matter even if the federal government has said nothing, because the power is its own.</text>
</svg>
