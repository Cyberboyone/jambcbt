      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="392" fill="#FFFFFF"/>
<rect x="0" y="0" width="760" height="392" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="380.0" y="28" font-family="DejaVu Sans" font-size="13.5" fill="#0E1F40" text-anchor="middle" font-weight="bold">The concentric circles</text>
<text x="380.0" y="46" font-family="DejaVu Sans" font-size="9.8" fill="#64748B" text-anchor="middle" font-weight="normal">Nigeria's foreign policy begins at home, widens to West Africa, to Africa, and only then to the world</text>
<circle cx="208" cy="214" r="166" fill="#ECFDF5" stroke="#008751" stroke-width="1.7"/>
<circle cx="208" cy="214" r="124" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.7"/>
<circle cx="208" cy="214" r="82" fill="#FEF3C7" stroke="#D97706" stroke-width="1.7"/>
<circle cx="208" cy="214" r="40" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.7"/>
<text x="208" y="69" font-family="DejaVu Sans" font-size="9.6" fill="#008751" text-anchor="middle" font-weight="bold">THE WORLD</text>
<text x="208" y="111" font-family="DejaVu Sans" font-size="9.6" fill="#2563EB" text-anchor="middle" font-weight="bold">AFRICA</text>
<text x="208" y="153" font-family="DejaVu Sans" font-size="9.6" fill="#D97706" text-anchor="middle" font-weight="bold">WEST AFRICA</text>
<text x="208" y="218" font-family="DejaVu Sans" font-size="9.4" fill="#DC2626" text-anchor="middle" font-weight="bold">NIGERIA</text>
<rect x="392" y="78" width="350" height="42" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.3"/>
<rect x="392" y="78" width="5" height="42" rx="2" fill="#DC2626" stroke="#DC2626" stroke-width="1.0"/>
<text x="406" y="96" font-family="DejaVu Sans" font-size="9.2" fill="#DC2626" text-anchor="start" font-weight="bold">1. THE NATIONAL INTEREST</text>
<text x="406" y="111" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">security, prosperity and the survival of the state</text>
<rect x="392" y="130" width="350" height="42" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.3"/>
<rect x="392" y="130" width="5" height="42" rx="2" fill="#D97706" stroke="#D97706" stroke-width="1.0"/>
<text x="406" y="148" font-family="DejaVu Sans" font-size="9.2" fill="#D97706" text-anchor="start" font-weight="bold">2. WEST AFRICA</text>
<text x="406" y="163" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">the neighbourhood: ECOWAS, ECOMOG, the border</text>
<rect x="392" y="182" width="350" height="42" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
<rect x="392" y="182" width="5" height="42" rx="2" fill="#2563EB" stroke="#2563EB" stroke-width="1.0"/>
<text x="406" y="200" font-family="DejaVu Sans" font-size="9.2" fill="#2563EB" text-anchor="start" font-weight="bold">3. AFRICA</text>
<text x="406" y="215" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">decolonisation, apartheid, the AU and the centre-piece</text>
<rect x="392" y="234" width="350" height="42" rx="6" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="392" y="234" width="5" height="42" rx="2" fill="#008751" stroke="#008751" stroke-width="1.0"/>
<text x="406" y="252" font-family="DejaVu Sans" font-size="9.2" fill="#008751" text-anchor="start" font-weight="bold">4. THE WORLD</text>
<text x="406" y="267" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">the UN, the Commonwealth, OPEC, the great powers</text>
<text x="567" y="300" font-family="DejaVu Sans" font-size="8.8" fill="#64748B" text-anchor="middle" font-weight="normal" font-style="italic">in that order, and never the other way round</text>
<text x="567" y="318" font-family="DejaVu Sans" font-size="8.8" fill="#64748B" text-anchor="middle" font-weight="normal" font-style="italic">the circle is a statement of priority, not of geography</text>
</svg>
