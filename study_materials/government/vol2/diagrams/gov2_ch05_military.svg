<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" width="760" height="336">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="336" fill="#FFFFFF"/>
<rect x="0" y="0" width="760" height="336" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="380.0" y="28" font-family="DejaVu Sans" font-size="13.5" fill="#0E1F40" text-anchor="middle" font-weight="bold">Thirty-three years of soldiers, in one line</text>
<text x="380.0" y="46" font-family="DejaVu Sans" font-size="9.8" fill="#64748B" text-anchor="middle" font-weight="normal">Every military regime in Nigeria, how it began, and what it promised before it left</text>
<line x1="40" y1="78" x2="720" y2="78" stroke="#CBD5E1" stroke-width="2.0"/>
<circle cx="46.0" cy="78" r="5.5" fill="#D97706"/>
<text x="46.0" y="62" font-family="DejaVu Sans" font-size="8.6" fill="#D97706" text-anchor="middle" font-weight="bold">1966</text>
<text x="46.0" y="98" font-family="DejaVu Sans" font-size="8.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">Aguiyi-Ironsi</text>
<text x="46.0" y="112" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">January coup</text>
<circle cx="141.42857142857144" cy="78" r="5.5" fill="#DC2626"/>
<text x="141.42857142857144" y="62" font-family="DejaVu Sans" font-size="8.6" fill="#DC2626" text-anchor="middle" font-weight="bold">1966–75</text>
<text x="141.42857142857144" y="98" font-family="DejaVu Sans" font-size="8.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">Gowon</text>
<text x="141.42857142857144" y="112" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">counter-coup</text>
<circle cx="236.85714285714286" cy="78" r="5.5" fill="#2563EB"/>
<text x="236.85714285714286" y="62" font-family="DejaVu Sans" font-size="8.6" fill="#2563EB" text-anchor="middle" font-weight="bold">1975–79</text>
<text x="236.85714285714286" y="98" font-family="DejaVu Sans" font-size="8.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">Murtala / Obasanjo</text>
<text x="236.85714285714286" y="112" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">assassination</text>
<circle cx="332.2857142857143" cy="78" r="5.5" fill="#D97706"/>
<text x="332.2857142857143" y="62" font-family="DejaVu Sans" font-size="8.6" fill="#D97706" text-anchor="middle" font-weight="bold">1983–85</text>
<text x="332.2857142857143" y="98" font-family="DejaVu Sans" font-size="8.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">Buhari</text>
<text x="332.2857142857143" y="112" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">coup against Shagari</text>
<circle cx="427.7142857142857" cy="78" r="5.5" fill="#DC2626"/>
<text x="427.7142857142857" y="62" font-family="DejaVu Sans" font-size="8.6" fill="#DC2626" text-anchor="middle" font-weight="bold">1985–93</text>
<text x="427.7142857142857" y="98" font-family="DejaVu Sans" font-size="8.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">Babangida</text>
<text x="427.7142857142857" y="112" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">palace coup</text>
<circle cx="523.1428571428571" cy="78" r="5.5" fill="#7C3AED"/>
<text x="523.1428571428571" y="62" font-family="DejaVu Sans" font-size="8.6" fill="#7C3AED" text-anchor="middle" font-weight="bold">1993</text>
<text x="523.1428571428571" y="98" font-family="DejaVu Sans" font-size="8.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">Shonekan</text>
<text x="523.1428571428571" y="112" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">interim, three months</text>
<circle cx="618.5714285714286" cy="78" r="5.5" fill="#DC2626"/>
<text x="618.5714285714286" y="62" font-family="DejaVu Sans" font-size="8.6" fill="#DC2626" text-anchor="middle" font-weight="bold">1993–98</text>
<text x="618.5714285714286" y="98" font-family="DejaVu Sans" font-size="8.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">Abacha</text>
<text x="618.5714285714286" y="112" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">palace coup</text>
<circle cx="714.0" cy="78" r="5.5" fill="#008751"/>
<text x="714.0" y="62" font-family="DejaVu Sans" font-size="8.6" fill="#008751" text-anchor="middle" font-weight="bold">1998–99</text>
<text x="714.0" y="98" font-family="DejaVu Sans" font-size="8.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">Abubakar</text>
<text x="706" y="112" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">handover, 1999</text>
<rect x="18" y="136" width="228" height="132" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.4"/>
<rect x="18" y="136" width="228" height="5" rx="2.5" fill="#DC2626" stroke="#DC2626" stroke-width="1.0"/>
<text x="132" y="160" font-family="DejaVu Sans" font-size="9.4" fill="#DC2626" text-anchor="middle" font-weight="bold">WHY THEY CAME</text>
<text x="132" y="184" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="middle" font-weight="normal">Corruption and the collapse of order</text>
<text x="132" y="210" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="middle" font-weight="normal">A civilian government that lost legitimacy</text>
<text x="132" y="236" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="middle" font-weight="normal">The army as the only organised institution</text>
<rect x="266" y="136" width="228" height="132" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/>
<rect x="266" y="136" width="228" height="5" rx="2.5" fill="#D97706" stroke="#D97706" stroke-width="1.0"/>
<text x="380" y="160" font-family="DejaVu Sans" font-size="9.4" fill="#D97706" text-anchor="middle" font-weight="bold">HOW THEY RULED</text>
<text x="380" y="184" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="middle" font-weight="normal">Decrees instead of Acts, ouster clauses</text>
<text x="380" y="210" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="middle" font-weight="normal">Special military tribunals</text>
<text x="380" y="236" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="middle" font-weight="normal">No legislature, no independent judiciary</text>
<rect x="514" y="136" width="228" height="132" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
<rect x="514" y="136" width="228" height="5" rx="2.5" fill="#7C3AED" stroke="#7C3AED" stroke-width="1.0"/>
<text x="628" y="160" font-family="DejaVu Sans" font-size="9.4" fill="#7C3AED" text-anchor="middle" font-weight="bold">WHAT THEY LEFT</text>
<text x="628" y="184" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="middle" font-weight="normal">A centralised federation and a strong centre</text>
<text x="628" y="210" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="middle" font-weight="normal">A politicised army</text>
<text x="628" y="236" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="middle" font-weight="normal">The habit of annulment and of the coup</text>
<rect x="18" y="280" width="724" height="44" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.4"/>
<text x="380" y="306" font-family="DejaVu Sans" font-size="9.3" fill="#334155" text-anchor="middle" font-weight="normal">1999: the Fourth Republic begins — and the question the paper still asks is why the army went back to barracks.</text>
</svg>
