  <rect x="0" y="0" width="760" height="384" fill="#FFFFFF"/>
<rect x="0" y="0" width="760" height="384" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="380.0" y="28" font-family="DejaVu Sans" font-size="13.5" fill="#0E1F40" text-anchor="middle" font-weight="bold">The civil service and the four controls upon it</text>
<text x="380.0" y="46" font-family="DejaVu Sans" font-size="9.8" fill="#64748B" text-anchor="middle" font-weight="normal">A permanent, anonymous bureaucracy, answerable to the minister and to the law</text>
<rect x="145.0" y="70" width="470" height="42" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<text x="380" y="88" font-family="DejaVu Sans" font-size="9.4" fill="#008751" text-anchor="middle" font-weight="bold">ADMINISTRATIVE CLASS</text>
<text x="380" y="103" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">permanent secretaries, directors</text>
<rect x="100.0" y="122" width="560" height="42" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
<text x="380" y="140" font-family="DejaVu Sans" font-size="9.4" fill="#2563EB" text-anchor="middle" font-weight="bold">PROFESSIONAL CLASS</text>
<text x="380" y="155" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">engineers, doctors, accountants</text>
<line x1="380" y1="114" x2="380.0" y2="111.7" stroke="#CBD5E1" stroke-width="1.4"/><polygon points="380.0,121.0 376.5,111.7 383.5,111.7" fill="#CBD5E1"/>
<rect x="55.0" y="174" width="650" height="42" rx="7" fill="#FFFFFF" stroke="#D97706" stroke-width="1.3"/>
<text x="380" y="192" font-family="DejaVu Sans" font-size="9.4" fill="#D97706" text-anchor="middle" font-weight="bold">EXECUTIVE / CLERICAL</text>
<text x="380" y="207" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">records, accounts, correspondence</text>
<line x1="380" y1="166" x2="380.0" y2="163.7" stroke="#CBD5E1" stroke-width="1.4"/><polygon points="380.0,173.0 376.5,163.7 383.5,163.7" fill="#CBD5E1"/>
<rect x="20.0" y="226" width="720" height="42" rx="7" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/>
<text x="380" y="244" font-family="DejaVu Sans" font-size="9.4" fill="#7C3AED" text-anchor="middle" font-weight="bold">MESSENGERS AND SUPPORT</text>
<text x="380" y="259" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">cleaning, dispatch, security</text>
<line x1="380" y1="218" x2="380.0" y2="215.7" stroke="#CBD5E1" stroke-width="1.4"/><polygon points="380.0,225.0 376.5,215.7 383.5,215.7" fill="#CBD5E1"/>
<rect x="18" y="286" width="724" height="84" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3"/>
<text x="380" y="308" font-family="DejaVu Sans" font-size="9.8" fill="#0E1F40" text-anchor="middle" font-weight="bold">The controls</text>
<text x="112" y="330" font-family="DejaVu Sans" font-size="9.0" fill="#008751" text-anchor="middle" font-weight="bold">Legislature</text>
<text x="112" y="346" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">questions, committees, the power of the purse</text>
<text x="292" y="330" font-family="DejaVu Sans" font-size="9.0" fill="#008751" text-anchor="middle" font-weight="bold">Executive</text>
<text x="292" y="346" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">ministerial direction, the establishment office</text>
<text x="472" y="330" font-family="DejaVu Sans" font-size="9.0" fill="#008751" text-anchor="middle" font-weight="bold">Judiciary</text>
<text x="472" y="346" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">judicial review of administrative acts</text>
<text x="652" y="330" font-family="DejaVu Sans" font-size="9.0" fill="#008751" text-anchor="middle" font-weight="bold">Ombudsman</text>
<text x="652" y="346" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">the Public Complaints Commission's inquiry</text>
</svg>
