<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="300" fill="#FFFFFF"/>
<text x="340" y="20" font-family="DejaVu Sans" font-size="10.2" fill="#0E1F40" text-anchor="middle" font-weight="bold">HOW ONE ₦100,000 DEPOSIT BECOMES ₦500,000 OF MONEY</text>
<rect x="18" y="38" width="400" height="232" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
<text x="40" y="58" font-family="DejaVu Sans" font-size="7.8" fill="#0E1F40" text-anchor="start" font-weight="bold">Round</text>
<text x="130" y="58" font-family="DejaVu Sans" font-size="7.8" fill="#0E1F40" text-anchor="start" font-weight="bold">New deposit</text>
<text x="250" y="58" font-family="DejaVu Sans" font-size="7.8" fill="#0E1F40" text-anchor="start" font-weight="bold">Cash reserve (20%)</text>
<text x="340" y="58" font-family="DejaVu Sans" font-size="7.8" fill="#0E1F40" text-anchor="start" font-weight="bold">New loan</text>
<line x1="30" y1="90" x2="406" y2="90" stroke="#E2E8F0" stroke-width="0.7"/>
<text x="40" y="82" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="start" font-weight="normal">1</text>
<text x="130" y="82" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="start" font-weight="normal">100,000</text>
<text x="250" y="82" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="start" font-weight="normal">20,000</text>
<text x="340" y="82" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="start" font-weight="normal">80,000</text>
<line x1="30" y1="120" x2="406" y2="120" stroke="#E2E8F0" stroke-width="0.7"/>
<text x="40" y="112" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="start" font-weight="normal">2</text>
<text x="130" y="112" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="start" font-weight="normal">80,000</text>
<text x="250" y="112" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="start" font-weight="normal">16,000</text>
<text x="340" y="112" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="start" font-weight="normal">64,000</text>
<line x1="30" y1="150" x2="406" y2="150" stroke="#E2E8F0" stroke-width="0.7"/>
<text x="40" y="142" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="start" font-weight="normal">3</text>
<text x="130" y="142" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="start" font-weight="normal">64,000</text>
<text x="250" y="142" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="start" font-weight="normal">12,800</text>
<text x="340" y="142" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="start" font-weight="normal">51,200</text>
<line x1="30" y1="180" x2="406" y2="180" stroke="#E2E8F0" stroke-width="0.7"/>
<text x="40" y="172" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="start" font-weight="normal">4</text>
<text x="130" y="172" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="start" font-weight="normal">51,200</text>
<text x="250" y="172" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="start" font-weight="normal">10,240</text>
<text x="340" y="172" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="start" font-weight="normal">40,960</text>
<line x1="30" y1="210" x2="406" y2="210" stroke="#E2E8F0" stroke-width="0.7"/>
<text x="40" y="202" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="start" font-weight="normal">5</text>
<text x="130" y="202" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="start" font-weight="normal">40,960</text>
<text x="250" y="202" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="start" font-weight="normal">8,192</text>
<text x="340" y="202" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="start" font-weight="normal">32,768</text>
<text x="40" y="250" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="start" font-weight="normal">…and so on, each round 80 per cent of the one before</text>
<text x="40" y="264" font-family="DejaVu Sans" font-size="8.4" fill="#008751" text-anchor="start" font-weight="bold">Total deposits = 100,000 × 5 = ₦500,000</text>
<rect x="432" y="38" width="230" height="232" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.3"/>
<text x="547" y="62" font-family="DejaVu Sans" font-size="8.6" fill="#008751" text-anchor="middle" font-weight="bold">THE TWO MULTIPLIERS</text>
<text x="547" y="88" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">credit multiplier</text>
<text x="547" y="106" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">= 1 ÷ reserve ratio</text>
<text x="547" y="124" font-family="DejaVu Sans" font-size="8.6" fill="#008751" text-anchor="middle" font-weight="bold">= 1 ÷ 0.20 = 5</text>
<line x1="452" y1="140" x2="642" y2="140" stroke="#008751" stroke-width="0.8"/>
<text x="547" y="162" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">money multiplier</text>
<text x="547" y="180" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">= 1 ÷ (reserve + cash</text>
<text x="547" y="196" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">+ excess reserve ratios)</text>
<text x="547" y="222" font-family="DejaVu Sans" font-size="7.9" fill="#334155" text-anchor="middle" font-weight="normal">Banks create deposits,</text>
<text x="547" y="238" font-family="DejaVu Sans" font-size="7.9" fill="#334155" text-anchor="middle" font-weight="normal">not wealth: every loan is</text>
<text x="547" y="254" font-family="DejaVu Sans" font-size="7.9" fill="#334155" text-anchor="middle" font-weight="normal">also somebody's debt.</text>
</svg>
