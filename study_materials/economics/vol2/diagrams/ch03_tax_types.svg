<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 268" width="680" height="268">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="268" fill="#FFFFFF"/>
<text x="340" y="20" font-family="DejaVu Sans" font-size="10.2" fill="#0E1F40" text-anchor="middle" font-weight="bold">DIRECT AND INDIRECT — AND WHAT EACH ONE CAN DO</text>
<rect x="18" y="40" width="314" height="176" rx="8" fill="#FFFFFF" stroke="#008751" stroke-width="1.4"/>
<rect x="18" y="40" width="314" height="26" rx="5" fill="#008751" stroke="#008751" stroke-width="1.0"/>
<text x="175" y="58" font-family="DejaVu Sans" font-size="9.4" fill="#FFFFFF" text-anchor="middle" font-weight="bold">DIRECT TAX</text>
<text x="175" y="86" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">paid on income or profit by the person who bears it</text>
<text x="34" y="112" font-family="DejaVu Sans" font-size="7.9" fill="#334155" text-anchor="start" font-weight="normal">•  PIT, company income tax, capital gains</text>
<text x="34" y="142" font-family="DejaVu Sans" font-size="7.9" fill="#334155" text-anchor="start" font-weight="normal">•  progressive: the rich pay a higher rate</text>
<text x="34" y="172" font-family="DejaVu Sans" font-size="7.9" fill="#334155" text-anchor="start" font-weight="normal">•  cannot be shifted; the burden stays put</text>
<rect x="348" y="40" width="314" height="176" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/>
<rect x="348" y="40" width="314" height="26" rx="5" fill="#D97706" stroke="#D97706" stroke-width="1.0"/>
<text x="505" y="58" font-family="DejaVu Sans" font-size="9.4" fill="#FFFFFF" text-anchor="middle" font-weight="bold">INDIRECT TAX</text>
<text x="505" y="86" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">paid on a good, collected by a seller, borne by whoever buys it</text>
<text x="364" y="112" font-family="DejaVu Sans" font-size="7.9" fill="#334155" text-anchor="start" font-weight="normal">•  VAT, customs duty, excise</text>
<text x="364" y="142" font-family="DejaVu Sans" font-size="7.9" fill="#334155" text-anchor="start" font-weight="normal">•  regressive unless essentials are exempt</text>
<text x="364" y="172" font-family="DejaVu Sans" font-size="7.9" fill="#334155" text-anchor="start" font-weight="normal">•  can be shifted forward onto the consumer</text>
<text x="340" y="240" font-family="DejaVu Sans" font-size="7.9" fill="#64748B" text-anchor="middle" font-weight="normal">The paper asks which tax is which far more often than it asks you to compute either.</text>
<text x="340" y="256" font-family="DejaVu Sans" font-size="7.9" fill="#0E1F40" text-anchor="middle" font-weight="bold">If the taxpayer can pass it on, it is indirect — that single test settles almost every question.</text>
</svg>
