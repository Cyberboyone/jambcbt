<text x="242" y="291" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">saving (S)</text>
<rect x="330" y="274" width="148" height="26" rx="5" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.0"/>
<text x="404" y="291" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">taxes (T)</text>
<rect x="492" y="274" width="148" height="26" rx="5" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.0"/>
<text x="566" y="291" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">imports (M)</text>
<text x="350" y="330" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="middle" font-weight="normal">When injections exceed withdrawals the flow grows and national income rises; when withdrawals exceed injections it falls.</text>
