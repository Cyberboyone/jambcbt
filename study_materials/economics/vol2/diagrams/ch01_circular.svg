<line x1="202" y1="208" x2="489.15" y2="208.0" stroke="#D97706" stroke-width="1.5"/><polygon points="500.0,208.0 489.1,212.1 489.1,203.9" fill="#D97706"/>
<text x="350" y="200" font-family="DejaVu Sans" font-size="7.8" fill="#D97706" text-anchor="middle" font-weight="normal">consumer spending on goods and services</text>
<line x1="500" y1="236" x2="212.85" y2="236.0" stroke="#334155" stroke-width="1.5"/><polygon points="202.0,236.0 212.8,231.9 212.8,240.1" fill="#334155"/>
<text x="350" y="254" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">goods and services delivered</text>
<rect x="18" y="264" width="664" height="46" rx="7" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/>
<text x="60" y="292" font-family="DejaVu Sans" font-size="8.2" fill="#DC2626" text-anchor="start" font-weight="bold">WITHDRAWALS</text>
