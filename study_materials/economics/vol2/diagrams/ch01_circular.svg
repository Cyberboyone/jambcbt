<text x="350" y="20" font-family="DejaVu Sans" font-size="9.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">THE CIRCULAR FLOW: TWO BOXES, FOUR FLOWS, THREE LEAKS AND THREE INJECTIONS</text>
