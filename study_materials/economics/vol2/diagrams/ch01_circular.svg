<rect x="30" y="128" width="168" height="6" rx="3" fill="#008751" stroke="#008751" stroke-width="1.0"/>
<text x="114" y="158" font-family="DejaVu Sans" font-size="10.0" fill="#008751" text-anchor="middle" font-weight="bold">HOUSEHOLDS</text>
<text x="114" y="178" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">own the factors</text>
<text x="114" y="194" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">buy the output</text>
<rect x="502" y="128" width="168" height="80" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
<rect x="502" y="128" width="168" height="6" rx="3" fill="#2563EB" stroke="#2563EB" stroke-width="1.0"/>
<text x="586" y="158" font-family="DejaVu Sans" font-size="10.0" fill="#2563EB" text-anchor="middle" font-weight="bold">FIRMS</text>
<text x="586" y="178" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">hire the factors</text>
<text x="586" y="194" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">produce the output</text>
<line x1="202" y1="120" x2="489.15" y2="120.0" stroke="#334155" stroke-width="1.5"/><polygon points="500.0,120.0 489.1,124.1 489.1,115.9" fill="#334155"/>
<text x="350" y="110" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">factor services: land · labour · capital · enterprise</text>
<line x1="500" y1="148" x2="212.85" y2="148.0" stroke="#008751" stroke-width="1.5"/><polygon points="202.0,148.0 212.8,143.9 212.8,152.1" fill="#008751"/>
