<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 288" width="680" height="288">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="288" fill="#FFFFFF"/>
<text x="340" y="20" font-family="DejaVu Sans" font-size="10.2" fill="#0E1F40" text-anchor="middle" font-weight="bold">FOUR KINDS OF UNEMPLOYMENT, FOUR DIFFERENT CURES</text>
<rect x="18" y="42" width="314" height="78" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.4"/>
<rect x="18" y="42" width="314" height="5" rx="2.5" fill="#008751" stroke="#008751" stroke-width="1.0"/>
<text x="32" y="68" font-family="DejaVu Sans" font-size="8.2" fill="#008751" text-anchor="start" font-weight="bold">FRICTIONAL</text>
<text x="32" y="86" font-family="DejaVu Sans" font-size="7.9" fill="#334155" text-anchor="start" font-weight="normal">between jobs, or just out of school; short and</text>
<text x="32" y="99" font-family="DejaVu Sans" font-size="7.9" fill="#334155" text-anchor="start" font-weight="normal">unavoidable</text>
<rect x="348" y="42" width="314" height="78" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
<rect x="348" y="42" width="314" height="5" rx="2.5" fill="#2563EB" stroke="#2563EB" stroke-width="1.0"/>
<text x="362" y="68" font-family="DejaVu Sans" font-size="8.2" fill="#2563EB" text-anchor="start" font-weight="bold">STRUCTURAL</text>
<text x="362" y="86" font-family="DejaVu Sans" font-size="7.9" fill="#334155" text-anchor="start" font-weight="normal">the skill or the industry no longer exists</text>
<text x="362" y="99" font-family="DejaVu Sans" font-size="7.9" fill="#334155" text-anchor="start" font-weight="normal">where it is needed</text>
<rect x="18" y="134" width="314" height="78" rx="7" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/>
<rect x="18" y="134" width="314" height="5" rx="2.5" fill="#D97706" stroke="#D97706" stroke-width="1.0"/>
<text x="32" y="160" font-family="DejaVu Sans" font-size="8.2" fill="#D97706" text-anchor="start" font-weight="bold">CYCLICAL</text>
<text x="32" y="178" font-family="DejaVu Sans" font-size="7.9" fill="#334155" text-anchor="start" font-weight="normal">demand has fallen in a slump; the jobs return</text>
<text x="32" y="191" font-family="DejaVu Sans" font-size="7.9" fill="#334155" text-anchor="start" font-weight="normal">when demand does</text>
<rect x="348" y="134" width="314" height="78" rx="7" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
<rect x="348" y="134" width="314" height="5" rx="2.5" fill="#7C3AED" stroke="#7C3AED" stroke-width="1.0"/>
<text x="362" y="160" font-family="DejaVu Sans" font-size="8.2" fill="#7C3AED" text-anchor="start" font-weight="bold">SEASONAL</text>
<text x="362" y="178" font-family="DejaVu Sans" font-size="7.9" fill="#334155" text-anchor="start" font-weight="normal">harvest, harmattan, the school year — it</text>
<text x="362" y="191" font-family="DejaVu Sans" font-size="7.9" fill="#334155" text-anchor="start" font-weight="normal">recurs on a calendar</text>
<rect x="18" y="232" width="644" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.0"/>
<text x="340" y="250" font-family="DejaVu Sans" font-size="7.9" fill="#0E1F40" text-anchor="middle" font-weight="bold">The cure follows the name: retrain the structural, spend against the cyclical,</text>
<text x="340" y="265" font-family="DejaVu Sans" font-size="7.9" fill="#334155" text-anchor="middle" font-weight="normal">plan around the seasonal — and accept the frictional, because a labour market with none is frozen.</text>
</svg>
