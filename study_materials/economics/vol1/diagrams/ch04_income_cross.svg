<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 268" width="660" height="268">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="660" height="268" fill="#FFFFFF"/>
<text x="330" y="20" font-family="DejaVu Sans" font-size="10.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">INCOME AND CROSS ELASTICITY: THE SIGN IS THE ANSWER</text>
<rect x="14" y="36" width="312" height="150" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<text x="170" y="54" font-family="DejaVu Sans" font-size="9.0" fill="#008751" text-anchor="middle" font-weight="bold">INCOME ELASTICITY (Ey)</text>
<text x="28" y="78" font-family="DejaVu Sans" font-size="8.2" fill="#0E1F40" text-anchor="start" font-weight="bold">positive, &gt; 1</text>
<text x="28" y="92" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="start" font-weight="normal">normal luxury — travel, cars</text>
<text x="28" y="110" font-family="DejaVu Sans" font-size="8.2" fill="#0E1F40" text-anchor="start" font-weight="bold">positive, 0 to 1</text>
<text x="28" y="124" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="start" font-weight="normal">normal necessity — salt, bread</text>
<text x="28" y="142" font-family="DejaVu Sans" font-size="8.2" fill="#0E1F40" text-anchor="start" font-weight="bold">negative</text>
<text x="28" y="156" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="start" font-weight="normal">inferior good — garri when income rises</text>
<rect x="340" y="36" width="306" height="150" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
<text x="493" y="54" font-family="DejaVu Sans" font-size="9.0" fill="#2563EB" text-anchor="middle" font-weight="bold">CROSS ELASTICITY (Exy)</text>
<text x="354" y="78" font-family="DejaVu Sans" font-size="8.2" fill="#0E1F40" text-anchor="start" font-weight="bold">positive</text>
<text x="354" y="92" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="start" font-weight="normal">substitutes — tea and coffee</text>
<text x="354" y="110" font-family="DejaVu Sans" font-size="8.2" fill="#0E1F40" text-anchor="start" font-weight="bold">negative</text>
<text x="354" y="124" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="start" font-weight="normal">complements — car and petrol</text>
<text x="354" y="142" font-family="DejaVu Sans" font-size="8.2" fill="#0E1F40" text-anchor="start" font-weight="bold">zero</text>
<text x="354" y="156" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="start" font-weight="normal">unrelated — salt and tyres</text>
<rect x="14" y="198" width="632" height="52" rx="7" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
<text x="330" y="218" font-family="DejaVu Sans" font-size="8.5" fill="#0E1F40" text-anchor="middle" font-weight="normal">Exam move: the question gives you two goods and a price change; you are being asked for the sign,</text>
<text x="330" y="236" font-family="DejaVu Sans" font-size="8.5" fill="#D97706" text-anchor="middle" font-weight="bold">and the sign names the relationship. Positive: substitutes. Negative: complements.</text>
</svg>
