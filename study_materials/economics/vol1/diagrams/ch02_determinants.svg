<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="300" fill="#FFFFFF"/>
<text x="340" y="20" font-family="DejaVu Sans" font-size="10.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">WHAT SHIFTS THE DEMAND CURVE</text>
<rect x="14" y="38" width="210" height="66" rx="6" fill="#FFFFFF" stroke="#008751" stroke-width="1.2"/>
<text x="24" y="55" font-family="DejaVu Sans" font-size="8.8" fill="#008751" text-anchor="start" font-weight="bold">Income</text>
<text x="24" y="71" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="start" font-weight="normal">normal good: up → right</text>
<text x="24" y="85" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="start" font-weight="normal">inferior good: up → left</text>
<text x="24" y="98" font-family="DejaVu Sans" font-size="6" fill="#0E1F40" text-anchor="middle" font-weight="normal"></text>
<rect x="236" y="38" width="210" height="66" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
<text x="246" y="55" font-family="DejaVu Sans" font-size="8.8" fill="#2563EB" text-anchor="start" font-weight="bold">Taste</text>
<text x="246" y="71" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="start" font-weight="normal">advertising, fashion</text>
<text x="246" y="85" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="start" font-weight="normal">right when the taste improves</text>
<text x="246" y="98" font-family="DejaVu Sans" font-size="6" fill="#0E1F40" text-anchor="middle" font-weight="normal"></text>
<rect x="458" y="38" width="210" height="66" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/>
<text x="468" y="55" font-family="DejaVu Sans" font-size="8.8" fill="#D97706" text-anchor="start" font-weight="bold">Price of related goods</text>
<text x="468" y="71" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="start" font-weight="normal">substitute dearer → right</text>
<text x="468" y="85" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="start" font-weight="normal">complement dearer → left</text>
<text x="468" y="98" font-family="DejaVu Sans" font-size="6" fill="#0E1F40" text-anchor="middle" font-weight="normal"></text>
<rect x="14" y="114" width="210" height="66" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.2"/>
<text x="24" y="131" font-family="DejaVu Sans" font-size="8.8" fill="#7C3AED" text-anchor="start" font-weight="bold">Population</text>
<text x="24" y="147" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="start" font-weight="normal">more buyers</text>
<text x="24" y="161" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="start" font-weight="normal">right</text>
<text x="24" y="174" font-family="DejaVu Sans" font-size="6" fill="#0E1F40" text-anchor="middle" font-weight="normal"></text>
<rect x="236" y="114" width="210" height="66" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.2"/>
<text x="246" y="131" font-family="DejaVu Sans" font-size="8.8" fill="#DC2626" text-anchor="start" font-weight="bold">Expectation</text>
<text x="246" y="147" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="start" font-weight="normal">fear of a price rise</text>
<text x="246" y="161" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="start" font-weight="normal">right, today</text>
<text x="246" y="174" font-family="DejaVu Sans" font-size="6" fill="#0E1F40" text-anchor="middle" font-weight="normal"></text>
<rect x="458" y="114" width="210" height="66" rx="6" fill="#FFFFFF" stroke="#334155" stroke-width="1.2"/>
<text x="468" y="131" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="start" font-weight="bold">Distribution of income</text>
<text x="468" y="147" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="start" font-weight="normal">the poor gain</text>
<text x="468" y="161" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="start" font-weight="normal">right, for basics</text>
<text x="468" y="174" font-family="DejaVu Sans" font-size="6" fill="#0E1F40" text-anchor="middle" font-weight="normal"></text>
<rect x="14" y="200" width="652" height="78" rx="7" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/>
<text x="340" y="220" font-family="DejaVu Sans" font-size="9.2" fill="#DC2626" text-anchor="middle" font-weight="bold">THE TEST</text>
<text x="340" y="238" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">Is the price of the good itself changing? If yes, the curve does not move — you slide along it.</text>
<text x="340" y="254" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">If any other item on this page is changing, the whole curve shifts left or right.</text>
<text x="340" y="270" font-family="DejaVu Sans" font-size="8.6" fill="#DC2626" text-anchor="middle" font-weight="bold">A question that says “the price of a substitute falls” is a shift question wearing a price question's clothes.</text>
</svg>
