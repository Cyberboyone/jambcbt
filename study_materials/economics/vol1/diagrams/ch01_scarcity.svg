<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="250" fill="#FFFFFF"/>
<text x="340" y="20" font-family="DejaVu Sans" font-size="10.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">THE CHAIN EVERY ECONOMICS QUESTION IS BUILT ON</text>
<rect x="14" y="44" width="118" height="62" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.5"/>
<text x="73.0" y="66" font-family="DejaVu Sans" font-size="9.0" fill="#008751" text-anchor="middle" font-weight="bold">WANTS</text>
<text x="73.0" y="84" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">unlimited</text>
<line x1="134" y1="75" x2="135.15" y2="75.0" stroke="#334155" stroke-width="1.5"/><polygon points="146.0,75.0 135.2,79.1 135.2,70.9" fill="#334155"/>
<rect x="148" y="44" width="118" height="62" rx="7" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
<text x="207.0" y="66" font-family="DejaVu Sans" font-size="9.0" fill="#D97706" text-anchor="middle" font-weight="bold">RESOURCES</text>
<text x="207.0" y="84" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">limited</text>
<line x1="268" y1="75" x2="269.15" y2="75.0" stroke="#334155" stroke-width="1.5"/><polygon points="280.0,75.0 269.1,79.1 269.1,70.9" fill="#334155"/>
<rect x="282" y="44" width="118" height="62" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
<text x="341.0" y="66" font-family="DejaVu Sans" font-size="9.0" fill="#DC2626" text-anchor="middle" font-weight="bold">SCARCITY</text>
<text x="341.0" y="84" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">the gap</text>
<line x1="402" y1="75" x2="403.15" y2="75.0" stroke="#334155" stroke-width="1.5"/><polygon points="414.0,75.0 403.1,79.1 403.1,70.9" fill="#334155"/>
<rect x="416" y="44" width="118" height="62" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<text x="475.0" y="66" font-family="DejaVu Sans" font-size="9.0" fill="#2563EB" text-anchor="middle" font-weight="bold">CHOICE</text>
<text x="475.0" y="84" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">what to give up</text>
<line x1="536" y1="75" x2="537.15" y2="75.0" stroke="#334155" stroke-width="1.5"/><polygon points="548.0,75.0 537.1,79.1 537.1,70.9" fill="#334155"/>
<rect x="550" y="44" width="118" height="62" rx="7" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="609.0" y="66" font-family="DejaVu Sans" font-size="9.0" fill="#7C3AED" text-anchor="middle" font-weight="bold">OPPORTUNITY COST</text>
<text x="609.0" y="84" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">the next best</text>
<rect x="14" y="126" width="652" height="54" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.1"/>
<text x="340" y="146" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="normal">No scarcity → no price → no economics. A question that opens “because resources are limited”</text>
<text x="340" y="162" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="normal">is asking which of the four consequences follows, not whether scarcity is a bad thing.</text>
<rect x="14" y="192" width="316" height="46" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
<text x="172" y="210" font-family="DejaVu Sans" font-size="9.0" fill="#D97706" text-anchor="middle" font-weight="bold">FREE GOODS</text>
<text x="172" y="226" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">air, sunlight — no price, no cost of choice</text>
<rect x="350" y="192" width="316" height="46" rx="6" fill="#ECFDF5" stroke="#008751" stroke-width="1.2"/>
<text x="508" y="210" font-family="DejaVu Sans" font-size="9.0" fill="#008751" text-anchor="middle" font-weight="bold">ECONOMIC GOODS</text>
<text x="508" y="226" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">everything scarce enough to command a price</text>
</svg>
