<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="250" fill="#FFFFFF"/>
<text x="340" y="20" font-family="DejaVu Sans" font-size="10.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">THE SPECTRUM FROM MANY SELLERS TO ONE</text>
<rect x="30" y="48" width="620" height="26" rx="13" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.0"/>
<circle cx="60" cy="61" r="9" fill="#008751"/>
<text x="60" y="92" font-family="DejaVu Sans" font-size="8.4" fill="#008751" text-anchor="middle" font-weight="bold">PERFECT
COMPETITION</text>
<circle cx="232" cy="61" r="9" fill="#2563EB"/>
<text x="232" y="92" font-family="DejaVu Sans" font-size="8.4" fill="#2563EB" text-anchor="middle" font-weight="bold">MONOPOLISTIC
COMPETITION</text>
<circle cx="404" cy="61" r="9" fill="#D97706"/>
<text x="404" y="92" font-family="DejaVu Sans" font-size="8.4" fill="#D97706" text-anchor="middle" font-weight="bold">OLIGOPOLY</text>
<circle cx="576" cy="61" r="9" fill="#DC2626"/>
<text x="576" y="92" font-family="DejaVu Sans" font-size="8.4" fill="#DC2626" text-anchor="middle" font-weight="bold">MONOPOLY</text>
<text x="146" y="122" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">many · identical</text>
<text x="318" y="122" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">many · differentiated</text>
<text x="470" y="122" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">few · interdependent</text>
<text x="600" y="122" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">one · blocked entry</text>
<rect x="14" y="146" width="652" height="88" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.1"/>
<text x="340" y="166" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="bold">POWER GROWS TO THE RIGHT; OUTPUT FALLS AND PRICE RISES</text>
<text x="340" y="186" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">Perfect competition: price = marginal cost, and the firm is a price taker.</text>
<text x="340" y="202" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">Monopoly: price above marginal cost, output below the competitive level, and entry blocked.</text>
<text x="340" y="220" font-family="DejaVu Sans" font-size="8.4" fill="#008751" text-anchor="middle" font-weight="bold">Oligopoly and monopolistic competition sit between, and the exam asks which assumption has been relaxed.</text>
</svg>
