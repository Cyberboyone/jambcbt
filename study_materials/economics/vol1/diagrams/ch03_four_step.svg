<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 246" width="680" height="246">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="246" fill="#FFFFFF"/>
<text x="340" y="20" font-family="DejaVu Sans" font-size="10.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">THE FOUR-STEP ANSWER TO EVERY SHIFT QUESTION</text>
<rect x="14" y="40" width="156" height="130" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<circle cx="36" cy="60" r="12" fill="#008751"/>
<text x="36" y="64" font-family="DejaVu Sans" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text>
<text x="24" y="90" font-family="DejaVu Sans" font-size="8.8" fill="#008751" text-anchor="start" font-weight="bold">Which curve?</text>
<text x="24" y="108" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="start" font-weight="normal">Demand or supply — never both</text>
<text x="24" y="121" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="start" font-weight="normal">unless the question says so.</text>
<rect x="180" y="40" width="156" height="130" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
<circle cx="202" cy="60" r="12" fill="#2563EB"/>
<text x="202" y="64" font-family="DejaVu Sans" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text>
<text x="190" y="90" font-family="DejaVu Sans" font-size="8.8" fill="#2563EB" text-anchor="start" font-weight="bold">Which way?</text>
<text x="190" y="108" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="start" font-weight="normal">Right (increase) or left (decrease),</text>
<text x="190" y="121" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="start" font-weight="normal">and say why.</text>
<rect x="346" y="40" width="156" height="130" rx="7" fill="#FFFFFF" stroke="#D97706" stroke-width="1.3"/>
<circle cx="368" cy="60" r="12" fill="#D97706"/>
<text x="368" y="64" font-family="DejaVu Sans" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text>
<text x="356" y="90" font-family="DejaVu Sans" font-size="8.8" fill="#D97706" text-anchor="start" font-weight="bold">New crossing</text>
<text x="356" y="108" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="start" font-weight="normal">The new equilibrium price and</text>
<text x="356" y="121" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="start" font-weight="normal">quantity, relative to the old.</text>
<rect x="512" y="40" width="156" height="130" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.3"/>
<circle cx="534" cy="60" r="12" fill="#DC2626"/>
<text x="534" y="64" font-family="DejaVu Sans" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text>
<text x="522" y="90" font-family="DejaVu Sans" font-size="8.8" fill="#DC2626" text-anchor="start" font-weight="bold">Check the trap</text>
<text x="522" y="108" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="start" font-weight="normal">A price change alone never shifts</text>
<text x="522" y="121" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="start" font-weight="normal">either curve.</text>
<rect x="14" y="182" width="652" height="52" rx="7" fill="#ECFDF5" stroke="#008751" stroke-width="1.2"/>
<text x="340" y="202" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">The exam almost always asks one of two things: the direction of the price, or the direction of the quantity.</text>
<text x="340" y="220" font-family="DejaVu Sans" font-size="8.6" fill="#008751" text-anchor="middle" font-weight="bold">Answer in that order and the explanation writes itself.</text>
</svg>
