<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 388" width="760" height="388">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="388" fill="#FFFFFF"/>
<text x="380" y="22" font-family="DejaVu Sans" font-size="12.2" fill="#0E1F40" text-anchor="middle" font-weight="bold">Public funds and computerised books: two systems with different questions</text>
<rect x="10" y="40" width="362" height="200" rx="8" fill="#FFFFFF" stroke="#008751" stroke-width="1.5"/>
<rect x="10" y="40" width="362" height="6" rx="3" fill="#008751"/>
<text x="191" y="66" font-family="DejaVu Sans" font-size="9.8" fill="#008751" text-anchor="middle" font-weight="bold">PUBLIC-SECTOR ACCOUNTING</text>
<text x="191" y="94" font-family="DejaVu Sans" font-size="8.7" fill="#0E1F40" text-anchor="middle" font-weight="normal">cash is voted by the legislature, and spent within the vote</text>
<text x="191" y="124" font-family="DejaVu Sans" font-size="8.7" fill="#0E1F40" text-anchor="middle" font-weight="normal">a vote account compares the approved estimate with the actual</text>
<text x="191" y="154" font-family="DejaVu Sans" font-size="8.7" fill="#0E1F40" text-anchor="middle" font-weight="normal">fund accounting: each fund is a separate set of books</text>
<text x="191" y="184" font-family="DejaVu Sans" font-size="8.7" fill="#0E1F40" text-anchor="middle" font-weight="normal">the statement of assets and liabilities stands in for the balance sheet</text>
<text x="191" y="214" font-family="DejaVu Sans" font-size="8.7" fill="#0E1F40" text-anchor="middle" font-weight="normal">the audit is by the Auditor-General, reporting to the legislature</text>
<rect x="388" y="40" width="362" height="200" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<rect x="388" y="40" width="362" height="6" rx="3" fill="#2563EB"/>
<text x="569" y="66" font-family="DejaVu Sans" font-size="9.8" fill="#2563EB" text-anchor="middle" font-weight="bold">COMPUTERISED ACCOUNTING</text>
<text x="569" y="94" font-family="DejaVu Sans" font-size="8.7" fill="#0E1F40" text-anchor="middle" font-weight="normal">documents are captured once, and posted by the software</text>
<text x="569" y="124" font-family="DejaVu Sans" font-size="8.7" fill="#0E1F40" text-anchor="middle" font-weight="normal">validation checks reject an entry with no double</text>
<text x="569" y="154" font-family="DejaVu Sans" font-size="8.7" fill="#0E1F40" text-anchor="middle" font-weight="normal">the audit trail records who entered what, and when</text>
<text x="569" y="184" font-family="DejaVu Sans" font-size="8.7" fill="#0E1F40" text-anchor="middle" font-weight="normal">back-ups and passwords are controls, not conveniences</text>
<text x="569" y="214" font-family="DejaVu Sans" font-size="8.7" fill="#0E1F40" text-anchor="middle" font-weight="normal">the trial balance is instant; the judgement is still human</text>
<rect x="10" y="256" width="740" height="118" rx="8" fill="#FFFFFF" stroke="#0E1F40" stroke-width="1.4"/>
<rect x="10" y="256" width="740" height="5" rx="2.5" fill="#0E1F40"/>
<text x="380" y="280" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">THE CYCLE, WHICHEVER THE SYSTEM</text>
<rect x="40" y="296" width="104" height="34" rx="6" fill="#ECFDF5" stroke="#008751" stroke-width="1.1"/>
<text x="92" y="317" font-family="DejaVu Sans" font-size="8.2" fill="#008751" text-anchor="middle" font-weight="bold">document</text>
<line x1="144" y1="313" x2="146.00" y2="313.00" stroke="#008751" stroke-width="1.2"/>
<polygon points="154.00,313.00 146.00,316.40 146.00,309.60" fill="#008751"/>
<rect x="156" y="296" width="104" height="34" rx="6" fill="#ECFDF5" stroke="#008751" stroke-width="1.1"/>
<text x="208" y="317" font-family="DejaVu Sans" font-size="8.2" fill="#008751" text-anchor="middle" font-weight="bold">book of original entry</text>
<line x1="260" y1="313" x2="262.00" y2="313.00" stroke="#008751" stroke-width="1.2"/>
<polygon points="270.00,313.00 262.00,316.40 262.00,309.60" fill="#008751"/>
<rect x="272" y="296" width="104" height="34" rx="6" fill="#ECFDF5" stroke="#008751" stroke-width="1.1"/>
<text x="324" y="317" font-family="DejaVu Sans" font-size="8.2" fill="#008751" text-anchor="middle" font-weight="bold">ledger</text>
<line x1="376" y1="313" x2="378.00" y2="313.00" stroke="#008751" stroke-width="1.2"/>
<polygon points="386.00,313.00 378.00,316.40 378.00,309.60" fill="#008751"/>
<rect x="388" y="296" width="104" height="34" rx="6" fill="#ECFDF5" stroke="#008751" stroke-width="1.1"/>
<text x="440" y="317" font-family="DejaVu Sans" font-size="8.2" fill="#008751" text-anchor="middle" font-weight="bold">trial balance</text>
<line x1="492" y1="313" x2="494.00" y2="313.00" stroke="#008751" stroke-width="1.2"/>
<polygon points="502.00,313.00 494.00,316.40 494.00,309.60" fill="#008751"/>
<rect x="504" y="296" width="104" height="34" rx="6" fill="#ECFDF5" stroke="#008751" stroke-width="1.1"/>
<text x="556" y="317" font-family="DejaVu Sans" font-size="8.2" fill="#008751" text-anchor="middle" font-weight="bold">adjustments</text>
<line x1="608" y1="313" x2="610.00" y2="313.00" stroke="#008751" stroke-width="1.2"/>
<polygon points="618.00,313.00 610.00,316.40 610.00,309.60" fill="#008751"/>
<rect x="620" y="296" width="104" height="34" rx="6" fill="#ECFDF5" stroke="#008751" stroke-width="1.1"/>
<text x="672" y="317" font-family="DejaVu Sans" font-size="8.2" fill="#008751" text-anchor="middle" font-weight="bold">statements</text>
<text x="380" y="352" font-family="DejaVu Sans" font-size="8.7" fill="#64748B" text-anchor="middle" font-weight="normal">a computer does the first four faster and the last two not at all</text>
</svg>
