<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" width="760" height="412">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="412" fill="#FFFFFF"/>
<text x="380" y="22" font-family="DejaVu Sans" font-size="12.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">Incomplete records: two routes to the same profit</text>
<text x="380" y="44" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">When the ledger is lost or never kept, the figures come from the cash book, the bank statement and a list of what is owed.</text>
<rect x="10" y="62" width="362" height="210" rx="8" fill="#FFFFFF" stroke="#008751" stroke-width="1.5"/>
<rect x="10" y="62" width="362" height="6" rx="3" fill="#008751"/>
<text x="191" y="88" font-family="DejaVu Sans" font-size="9.6" fill="#008751" text-anchor="middle" font-weight="bold">ROUTE 1 — THE STATEMENT OF AFFAIRS</text>
<text x="191" y="114" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="normal">list the assets at the start and at the end</text>
<text x="191" y="144" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="normal">list the liabilities at the start and at the end</text>
<text x="191" y="174" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="normal">opening capital = assets − liabilities</text>
<text x="191" y="204" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="normal">closing capital = assets − liabilities</text>
<text x="191" y="234" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="normal">profit = closing capital + drawings − capital introduced − opening capital</text>
<rect x="388" y="62" width="362" height="210" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<rect x="388" y="62" width="362" height="6" rx="3" fill="#2563EB"/>
<text x="569" y="88" font-family="DejaVu Sans" font-size="9.6" fill="#2563EB" text-anchor="middle" font-weight="bold">ROUTE 2 — THE MARGIN METHOD</text>
<text x="569" y="114" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="normal">take the opening capital and the year's cash takings</text>
<text x="569" y="144" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="normal">add the mark-up, or apply the margin, to find sales</text>
<text x="569" y="174" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="normal">gross profit = sales × margin (or cost × mark-up)</text>
<text x="569" y="204" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="normal">deduct the expenses actually paid and owing</text>
<text x="569" y="234" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="normal">net profit = gross profit − expenses</text>
<rect x="10" y="284" width="740" height="78" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.4"/>
<text x="380" y="306" font-family="DejaVu Sans" font-size="9.4" fill="#008751" text-anchor="middle" font-weight="bold">THE THREE FIGURES THAT ARE ALWAYS RECONSTRUCTED</text>
<text x="380" y="326" font-family="DejaVu Sans" font-size="8.9" fill="#0E1F40" text-anchor="middle" font-weight="normal">SALES: from the cash book, the bank statement and the debtors' opening and closing balances</text>
<text x="380" y="342" font-family="DejaVu Sans" font-size="8.9" fill="#0E1F40" text-anchor="middle" font-weight="normal">PURCHASES: from payments, creditors and stock, adjusted by carriage and returns</text>
<text x="380" y="358" font-family="DejaVu Sans" font-size="8.9" fill="#0E1F40" text-anchor="middle" font-weight="normal">STOCK: from a physical count, and from the cost of sales the profit margin implies</text>
<text x="380" y="382" font-family="DejaVu Sans" font-size="8.7" fill="#64748B" text-anchor="middle" font-weight="normal">Check one route against the other: a statement-of-affairs profit and a margin profit that disagree</text>
<text x="380" y="396" font-family="DejaVu Sans" font-size="8.7" fill="#64748B" text-anchor="middle" font-weight="normal">are a missing drawing, a misread stock figure, or a sale that never reached the cash book.</text>
</svg>
