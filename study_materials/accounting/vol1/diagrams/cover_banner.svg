<text x="105.0" y="99.0" font-family="DejaVu Sans" font-size="9" fill="#0E1F40" text-anchor="middle" font-weight="bold">concepts, users</text>
<text x="105.0" y="112.0" font-family="DejaVu Sans" font-size="9" fill="#0E1F40" text-anchor="middle" font-weight="bold">and the equation</text>
<rect x="200.0" y="62.0" width="170.0" height="128.0" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
<rect x="200.0" y="62.0" width="170.0" height="5" rx="2.5" fill="#2563EB"/>
<text x="285.0" y="86.0" font-family="DejaVu Sans" font-size="9" fill="#0E1F40" text-anchor="middle" font-weight="bold">THE BOOKS</text>
<text x="285.0" y="99.0" font-family="DejaVu Sans" font-size="9" fill="#0E1F40" text-anchor="middle" font-weight="bold">documents, journals,</text>
<text x="285.0" y="112.0" font-family="DejaVu Sans" font-size="9" fill="#0E1F40" text-anchor="middle" font-weight="bold">ledger, trial balance</text>
<rect x="380.0" y="62.0" width="170.0" height="128.0" rx="7" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/>
<rect x="380.0" y="62.0" width="170.0" height="5" rx="2.5" fill="#7C3AED"/>
<text x="465.0" y="86.0" font-family="DejaVu Sans" font-size="9" fill="#0E1F40" text-anchor="middle" font-weight="bold">THE CONTROLS</text>
<text x="465.0" y="99.0" font-family="DejaVu Sans" font-size="9" fill="#0E1F40" text-anchor="middle" font-weight="bold">bank reconciliation,</text>
<text x="465.0" y="112.0" font-family="DejaVu Sans" font-size="9" fill="#0E1F40" text-anchor="middle" font-weight="bold">errors, suspense</text>
<rect x="560.0" y="62.0" width="170.0" height="128.0" rx="7" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6"/>
<rect x="560.0" y="62.0" width="170.0" height="5" rx="2.5" fill="#D97706"/>
