<text x="380" y="28" font-family="DejaVu Sans" font-size="13.5" fill="#0E1F40" text-anchor="middle" font-weight="bold">FINANCIAL ACCOUNTING — The Books, the Balances and the Statements</text>
<text x="380" y="46" font-family="DejaVu Sans" font-size="9.6" fill="#64748B" text-anchor="middle" font-weight="normal">Eight chapters, one language: every transaction has two sides, and every statement is built from them.</text>
<rect x="20.0" y="62.0" width="170.0" height="128.0" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.6"/>
