<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="350" fill="#FFFFFF"/>
<text x="380" y="22" font-family="DejaVu Sans" font-size="12.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">Partnership: profit is shared by agreement, not by ownership</text>
<rect x="10" y="40" width="470" height="120" rx="8" fill="#FFFFFF" stroke="#008751" stroke-width="1.4"/>
<rect x="10" y="40" width="470" height="5" rx="2.5" fill="#008751"/>
<text x="245" y="64" font-family="DejaVu Sans" font-size="10.0" fill="#008751" text-anchor="middle" font-weight="bold">THE APPROPRIATION ACCOUNT</text>
<text x="30" y="88" font-family="DejaVu Sans" font-size="8.9" fill="#0E1F40" text-anchor="start" font-weight="normal">Net profit for the year</text>
<text x="466" y="88" font-family="DejaVu Sans" font-size="8.9" fill="#0E1F40" text-anchor="end" font-weight="normal">xx</text>
<text x="30" y="108" font-family="DejaVu Sans" font-size="8.9" fill="#0E1F40" text-anchor="start" font-weight="normal">less: interest on capital</text>
<text x="30" y="126" font-family="DejaVu Sans" font-size="8.9" fill="#0E1F40" text-anchor="start" font-weight="normal">less: partners' salaries</text>
<text x="30" y="144" font-family="DejaVu Sans" font-size="8.9" fill="#0E1F40" text-anchor="start" font-weight="normal">less: share of residual profit  (the agreed ratio)</text>
<text x="466" y="144" font-family="DejaVu Sans" font-size="8.9" fill="#0E1F40" text-anchor="end" font-weight="normal">xx</text>
<rect x="492" y="40" width="258" height="120" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
<rect x="492" y="40" width="258" height="5" rx="2.5" fill="#2563EB"/>
<text x="621" y="64" font-family="DejaVu Sans" font-size="9.6" fill="#2563EB" text-anchor="middle" font-weight="bold">NO DEED? THE DEFAULT</text>
<text x="621" y="88" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">profits and losses equally</text>
<text x="621" y="106" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">no interest on capital</text>
<text x="621" y="124" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">no salaries</text>
<text x="621" y="142" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">no interest on drawings</text>
<text x="380" y="186" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">EACH PARTNER HAS TWO ACCOUNTS</text>
<rect x="10" y="198" width="366" height="108" rx="7" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.2"/>
<text x="193" y="220" font-family="DejaVu Sans" font-size="9.2" fill="#7C3AED" text-anchor="middle" font-weight="bold">CAPITAL ACCOUNT</text>
<text x="193" y="240" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">the long-term stake: opening balance,</text>
<text x="193" y="256" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">capital introduced, share of profit,</text>
<text x="193" y="272" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">less drawings and losses</text>
<text x="193" y="294" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="middle" font-weight="normal">rarely moved; it is the owner's investment</text>
<rect x="384" y="198" width="366" height="108" rx="7" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/>
<text x="567" y="220" font-family="DejaVu Sans" font-size="9.2" fill="#D97706" text-anchor="middle" font-weight="bold">CURRENT ACCOUNT</text>
<text x="567" y="240" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">the running account: salary, interest</text>
<text x="567" y="256" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">on capital, share of profit, less</text>
<text x="567" y="272" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">drawings and interest on drawings</text>
<text x="567" y="294" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="middle" font-weight="normal">it may be in debit — that is an overdrawn partner</text>
<text x="380" y="336" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">On admission: revalue the assets, admit goodwill, and never let the new partner share in profits earned before he arrived.</text>
</svg>
