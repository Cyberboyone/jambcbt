<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 386" width="760" height="386">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="386" fill="#FFFFFF"/>
<text x="380" y="22" font-family="DejaVu Sans" font-size="12.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">Accounting: the record, and the people who read it</text>
<rect x="10" y="40" width="740" height="78" rx="8" fill="#FFFFFF" stroke="#008751" stroke-width="1.4"/>
<rect x="10" y="40" width="740" height="5" rx="2.5" fill="#008751"/>
<text x="380" y="64" font-family="DejaVu Sans" font-size="9.2" fill="#008751" text-anchor="middle" font-weight="bold">ACCOUNTING IS THE PROCESS OF IDENTIFYING, RECORDING, CLASSIFYING, SUMMARISING AND COMMUNICATING</text>
<text x="380" y="82" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="middle" font-weight="normal">the financial effects of transactions, so that the users of the information can make decisions</text>
<text x="380" y="102" font-family="DejaVu Sans" font-size="9.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">record  →  classify  →  summarise  →  report  →  interpret</text>
<text x="380" y="138" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">THE USERS, AND WHAT EACH ONE WANTS</text>
<rect x="10" y="150" width="180" height="86" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.4"/>
<rect x="10" y="150" width="180" height="5" rx="2.5" fill="#008751"/>
<text x="100" y="174" font-family="DejaVu Sans" font-size="9.6" fill="#008751" text-anchor="middle" font-weight="bold">OWNERS</text>
<text x="100" y="194" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="normal">profit, and the</text>
<text x="100" y="208" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="normal">value of their stake</text>
<rect x="197" y="150" width="180" height="86" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
<rect x="197" y="150" width="180" height="5" rx="2.5" fill="#2563EB"/>
<text x="287" y="174" font-family="DejaVu Sans" font-size="9.6" fill="#2563EB" text-anchor="middle" font-weight="bold">LENDERS</text>
<text x="287" y="194" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="normal">will the loan and</text>
<text x="287" y="208" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="normal">interest be repaid?</text>
<rect x="384" y="150" width="180" height="86" rx="7" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
<rect x="384" y="150" width="180" height="5" rx="2.5" fill="#7C3AED"/>
<text x="474" y="174" font-family="DejaVu Sans" font-size="9.6" fill="#7C3AED" text-anchor="middle" font-weight="bold">GOVERNMENT</text>
<text x="474" y="194" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="normal">tax due, and</text>
<text x="474" y="208" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="normal">compliance</text>
<rect x="571" y="150" width="180" height="86" rx="7" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/>
<rect x="571" y="150" width="180" height="5" rx="2.5" fill="#D97706"/>
<text x="661" y="174" font-family="DejaVu Sans" font-size="9.6" fill="#D97706" text-anchor="middle" font-weight="bold">EMPLOYEES</text>
<text x="661" y="194" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="normal">pay, security</text>
<text x="661" y="208" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="normal">and continuity</text>
<rect x="10" y="250" width="740" height="96" rx="8" fill="#FFFFFF" stroke="#0E1F40" stroke-width="1.4"/>
<rect x="10" y="250" width="740" height="5" rx="2.5" fill="#0E1F40"/>
<text x="380" y="274" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">THE BRANCHES</text>
<text x="130" y="300" font-family="DejaVu Sans" font-size="9.2" fill="#008751" text-anchor="middle" font-weight="bold">FINANCIAL</text>
<text x="130" y="316" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="normal">reports to outsiders</text>
<text x="300" y="300" font-family="DejaVu Sans" font-size="9.2" fill="#2563EB" text-anchor="middle" font-weight="bold">COST</text>
<text x="300" y="316" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="normal">what each unit costs</text>
<text x="455" y="300" font-family="DejaVu Sans" font-size="9.2" fill="#7C3AED" text-anchor="middle" font-weight="bold">MANAGEMENT</text>
<text x="455" y="316" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="normal">for decisions inside</text>
<text x="610" y="300" font-family="DejaVu Sans" font-size="9.2" fill="#D97706" text-anchor="middle" font-weight="bold">AUDIT / TAX</text>
<text x="610" y="316" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="normal">checking and computing</text>
<text x="380" y="372" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">Financial accounting looks backwards and reports to outsiders; management accounting looks forward and reports to the manager.</text>
</svg>
