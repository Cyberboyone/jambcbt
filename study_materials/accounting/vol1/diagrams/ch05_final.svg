<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" width="760" height="404">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="404" fill="#FFFFFF"/>
<text x="380" y="22" font-family="DejaVu Sans" font-size="12.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">Three statements, and where every adjustment lands</text>
<rect x="10" y="40" width="236" height="92" rx="8" fill="#FFFFFF" stroke="#008751" stroke-width="1.4"/>
<rect x="10" y="40" width="236" height="5" rx="2.5" fill="#008751"/>
<text x="128" y="64" font-family="DejaVu Sans" font-size="9.8" fill="#008751" text-anchor="middle" font-weight="bold">TRADING ACCOUNT</text>
<text x="128" y="84" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="normal">sales − cost of sales</text>
<text x="128" y="102" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="bold">= GROSS PROFIT</text>
<text x="128" y="120" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="middle" font-weight="normal">opening stock + purchases − closing stock</text>
<rect x="262" y="40" width="236" height="92" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
<rect x="262" y="40" width="236" height="5" rx="2.5" fill="#2563EB"/>
<text x="380" y="64" font-family="DejaVu Sans" font-size="9.8" fill="#2563EB" text-anchor="middle" font-weight="bold">PROFIT AND LOSS</text>
<text x="380" y="84" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="normal">gross profit + other income − expenses</text>
<text x="380" y="102" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="bold">= NET PROFIT</text>
<text x="380" y="120" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="middle" font-weight="normal">depreciation, bad debts, rent, wages, interest</text>
<rect x="514" y="40" width="236" height="92" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
<rect x="514" y="40" width="236" height="5" rx="2.5" fill="#7C3AED"/>
<text x="632" y="64" font-family="DejaVu Sans" font-size="9.8" fill="#7C3AED" text-anchor="middle" font-weight="bold">BALANCE SHEET</text>
<text x="632" y="84" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="normal">assets  =  capital + liabilities</text>
<text x="632" y="102" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="bold">a position at one date</text>
<text x="632" y="120" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="middle" font-weight="normal">fixed and current assets, capital, current liabilities</text>
<text x="380" y="158" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">THE ADJUSTMENTS, AND THE STATEMENT EACH ONE TOUCHES</text>
<rect x="10" y="170" width="200" height="21" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8"/>
<text x="18" y="185" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="bold">Accrued expense</text>
<text x="220" y="185" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="normal">add to the expense in P&amp;L; a current liability</text>
<rect x="10" y="195" width="200" height="21" rx="4" fill="#ECFDF5" stroke="#CBD5E1" stroke-width="0.8"/>
<text x="18" y="210" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="bold">Prepaid expense</text>
<text x="220" y="210" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="normal">deduct from the expense in P&amp;L; a current asset</text>
<rect x="10" y="220" width="200" height="21" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8"/>
<text x="18" y="235" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="bold">Accrued income</text>
<text x="220" y="235" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="normal">add to income in P&amp;L; a current asset</text>
<rect x="10" y="245" width="200" height="21" rx="4" fill="#ECFDF5" stroke="#CBD5E1" stroke-width="0.8"/>
<text x="18" y="260" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="bold">Income received in advance</text>
<text x="220" y="260" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="normal">deduct from income; a current liability</text>
<rect x="10" y="270" width="200" height="21" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8"/>
<text x="18" y="285" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="bold">Depreciation</text>
<text x="220" y="285" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="normal">an expense in P&amp;L; deducted from the asset</text>
<rect x="10" y="295" width="200" height="21" rx="4" fill="#ECFDF5" stroke="#CBD5E1" stroke-width="0.8"/>
<text x="18" y="310" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="bold">Bad debt written off</text>
<text x="220" y="310" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="normal">an expense in P&amp;L; deducted from debtors</text>
<rect x="10" y="320" width="200" height="21" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8"/>
<text x="18" y="335" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="bold">Provision for doubtful debts</text>
<text x="220" y="335" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="normal">an expense in P&amp;L; deducted from debtors</text>
<rect x="10" y="345" width="200" height="21" rx="4" fill="#ECFDF5" stroke="#CBD5E1" stroke-width="0.8"/>
<text x="18" y="360" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="bold">Closing stock</text>
<text x="220" y="360" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="normal">credited in trading account; a current asset</text>
<text x="380" y="390" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">The rule behind every adjustment: match the cost to the period that earned it, and put the unpaid or unused part on the balance sheet.</text>
</svg>
