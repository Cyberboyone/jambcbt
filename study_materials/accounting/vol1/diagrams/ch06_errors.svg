<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" width="760" height="404">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="404" fill="#FFFFFF"/>
<text x="380" y="22" font-family="DejaVu Sans" font-size="12.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">Six errors, and whether the trial balance catches them</text>
<rect x="10" y="44" width="250" height="34" rx="6" fill="#FFFFFF" stroke="#0E1F40" stroke-width="1.1"/>
<text x="135" y="65" font-family="DejaVu Sans" font-size="9.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">Error of omission</text>
<text x="272" y="65" font-family="DejaVu Sans" font-size="8.7" fill="#0E1F40" text-anchor="start" font-weight="normal">a transaction left out altogether</text>
<rect x="586" y="44" width="164" height="34" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.1"/>
<text x="668" y="65" font-family="DejaVu Sans" font-size="8.5" fill="#DC2626" text-anchor="middle" font-weight="bold">NOT caught</text>
<rect x="10" y="86" width="250" height="34" rx="6" fill="#FFFFFF" stroke="#0E1F40" stroke-width="1.1"/>
<text x="135" y="107" font-family="DejaVu Sans" font-size="9.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">Error of commission</text>
<text x="272" y="107" font-family="DejaVu Sans" font-size="8.7" fill="#0E1F40" text-anchor="start" font-weight="normal">posted to the wrong account of the same class</text>
<rect x="586" y="86" width="164" height="34" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.1"/>
<text x="668" y="107" font-family="DejaVu Sans" font-size="8.5" fill="#DC2626" text-anchor="middle" font-weight="bold">NOT caught</text>
<rect x="10" y="128" width="250" height="34" rx="6" fill="#FFFFFF" stroke="#0E1F40" stroke-width="1.1"/>
<text x="135" y="149" font-family="DejaVu Sans" font-size="9.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">Error of principle</text>
<text x="272" y="149" font-family="DejaVu Sans" font-size="8.7" fill="#0E1F40" text-anchor="start" font-weight="normal">a capital item in a revenue account, or the reverse</text>
<rect x="586" y="128" width="164" height="34" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.1"/>
<text x="668" y="149" font-family="DejaVu Sans" font-size="8.5" fill="#DC2626" text-anchor="middle" font-weight="bold">NOT caught</text>
<rect x="10" y="170" width="250" height="34" rx="6" fill="#FFFFFF" stroke="#0E1F40" stroke-width="1.1"/>
<text x="135" y="191" font-family="DejaVu Sans" font-size="9.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">Error of original entry</text>
<text x="272" y="191" font-family="DejaVu Sans" font-size="8.7" fill="#0E1F40" text-anchor="start" font-weight="normal">the wrong amount entered in the books first</text>
<rect x="586" y="170" width="164" height="34" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.1"/>
<text x="668" y="191" font-family="DejaVu Sans" font-size="8.5" fill="#DC2626" text-anchor="middle" font-weight="bold">NOT caught</text>
<rect x="10" y="212" width="250" height="34" rx="6" fill="#FFFFFF" stroke="#0E1F40" stroke-width="1.1"/>
<text x="135" y="233" font-family="DejaVu Sans" font-size="9.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">Compensating errors</text>
<text x="272" y="233" font-family="DejaVu Sans" font-size="8.7" fill="#0E1F40" text-anchor="start" font-weight="normal">two errors that cancel each other</text>
<rect x="586" y="212" width="164" height="34" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.1"/>
<text x="668" y="233" font-family="DejaVu Sans" font-size="8.5" fill="#DC2626" text-anchor="middle" font-weight="bold">NOT caught</text>
<rect x="10" y="254" width="250" height="34" rx="6" fill="#FFFFFF" stroke="#0E1F40" stroke-width="1.1"/>
<text x="135" y="275" font-family="DejaVu Sans" font-size="9.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">Error of transposition</text>
<text x="272" y="275" font-family="DejaVu Sans" font-size="8.7" fill="#0E1F40" text-anchor="start" font-weight="normal">₦4,500 written as ₦5,400</text>
<rect x="586" y="254" width="164" height="34" rx="6" fill="#ECFDF5" stroke="#008751" stroke-width="1.1"/>
<text x="668" y="275" font-family="DejaVu Sans" font-size="8.5" fill="#008751" text-anchor="middle" font-weight="bold">caught, if one side only</text>
<rect x="10" y="308" width="740" height="62" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/>
<text x="380" y="332" font-family="DejaVu Sans" font-size="9.4" fill="#7C3AED" text-anchor="middle" font-weight="bold">THE SUSPENSE ACCOUNT IS THE PLACE WHERE A ONE-SIDED ERROR WAITS</text>
<text x="380" y="352" font-family="DejaVu Sans" font-size="8.7" fill="#0E1F40" text-anchor="middle" font-weight="normal">open it with the difference, post every correction through it, and it must close to nil when the last error is found</text>
<text x="380" y="392" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">A trial balance that agrees is a trial balance with equal debits and credits — not a set of books that is free of error.</text>
</svg>
