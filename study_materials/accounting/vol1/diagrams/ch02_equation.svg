<text x="380" y="22" font-family="DejaVu Sans" font-size="12.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">One equation, two sides, and the rules that follow</text>
<rect x="10" y="40" width="740" height="64" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.4"/>
<text x="380" y="68" font-family="DejaVu Sans" font-size="15.0" fill="#008751" text-anchor="middle" font-weight="bold">ASSETS  =  LIABILITIES  +  CAPITAL</text>
<text x="380" y="90" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="middle" font-weight="normal">what the business owns  =  what it owes to outsiders  +  what it owes to its owner</text>
<rect x="10" y="116" width="740" height="58" rx="8" fill="#FFFFFF" stroke="#0E1F40" stroke-width="1.3"/>
<text x="380" y="140" font-family="DejaVu Sans" font-size="10.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">EXPANDED:  ASSETS  =  LIABILITIES  +  CAPITAL  +  PROFIT  −  DRAWINGS</text>
<text x="380" y="160" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">and profit itself is income less expenses</text>
