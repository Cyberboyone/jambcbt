<text x="380" y="372" font-family="DejaVu Sans" font-size="9.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">DEAD CLIC: Debits increase Expenses, Assets and Drawings; Credits increase Liabilities, Income and Capital.</text>
<text x="380" y="390" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="normal">Every transaction touches at least two accounts, and the debits must equal the credits — always, without exception.</text>
