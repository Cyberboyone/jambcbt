<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="230" fill="#FFFFFF"/>
<rect x="0" y="0" width="760" height="230" rx="10" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="18" y="40" width="168" height="150" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
<rect x="18" y="40" width="168" height="5" rx="2.5" fill="#DC2626"/>
<text x="102" y="68" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">1. SUBSTITUTE</text>
<text x="102" y="94" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">Put x = a</text>
<text x="102" y="109" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">into the expression</text>
<line x1="188" y1="115" x2="204" y2="115" stroke="#64748B" stroke-width="1.4" marker-end="url(#an)"/>
<rect x="204" y="40" width="168" height="150" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
<rect x="204" y="40" width="168" height="5" rx="2.5" fill="#D97706"/>
<text x="288" y="68" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">2. IF YOU GET A NUMBER</text>
<text x="288" y="94" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">That is the limit</text>
<text x="288" y="109" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">(direct substitution)</text>
<line x1="374" y1="115" x2="390" y2="115" stroke="#64748B" stroke-width="1.4" marker-end="url(#an)"/>
<rect x="390" y="40" width="168" height="150" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<rect x="390" y="40" width="168" height="5" rx="2.5" fill="#2563EB"/>
<text x="474" y="68" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">3. IF YOU GET 0/0</text>
<text x="474" y="94" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">Factorise, cancel</text>
<text x="474" y="109" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">the common factor</text>
<line x1="560" y1="115" x2="576" y2="115" stroke="#64748B" stroke-width="1.4" marker-end="url(#an)"/>
<rect x="576" y="40" width="168" height="150" rx="8" fill="#FFFFFF" stroke="#008751" stroke-width="1.5"/>
<rect x="576" y="40" width="168" height="5" rx="2.5" fill="#008751"/>
<text x="660" y="68" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">4. SUBSTITUTE AGAIN</text>
<text x="660" y="94" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">The cancelled form</text>
<text x="660" y="109" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">gives the limit</text>
</svg>
