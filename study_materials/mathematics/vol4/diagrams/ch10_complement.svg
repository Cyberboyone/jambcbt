<rect x="0" y="0" width="760" height="150" rx="10" fill="#FFFFFF" stroke="#0E1F40" stroke-width="1.3"/>
<text x="380" y="30" font-family="DejaVu Sans" font-size="14" fill="#008751" text-anchor="middle" font-weight="bold">P(not A) = 1 − P(A)</text>
<text x="380" y="62" font-family="DejaVu Sans" font-size="10" fill="#334155" text-anchor="middle" font-weight="normal">The probabilities of an event and its complement always add to 1.</text>
<text x="380" y="92" font-family="DejaVu Sans" font-size="10" fill="#334155" text-anchor="middle" font-weight="normal">Questions that say “at least one”, “none”, or “not” are usually one subtraction.</text>
<text x="380" y="120" font-family="DejaVu Sans" font-size="11" fill="#0E1F40" text-anchor="middle" font-weight="normal">P(at least one) = 1 − P(none)</text>
</svg>
