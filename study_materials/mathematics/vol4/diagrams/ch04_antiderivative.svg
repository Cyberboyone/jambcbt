<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="760" height="200">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="200" fill="#FFFFFF"/>
<rect x="0" y="0" width="760" height="200" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/>
<text x="380" y="30" font-family="DejaVu Sans" font-size="11" fill="#0E1F40" text-anchor="middle" font-weight="bold">Integration reverses differentiation — one power up, divide by the new power</text>
<rect x="40" y="62" width="680" height="34" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.0"/>
<text x="210" y="85" font-family="DejaVu Sans" font-size="10" fill="#0E1F40" text-anchor="middle" font-weight="normal">$integral x^n dif x = x^(n+1)/(n+1) + c$</text>
<text x="560" y="85" font-family="DejaVu Sans" font-size="9" fill="#334155" text-anchor="middle" font-weight="normal">power rule for $n != -1$</text>
<rect x="40" y="106" width="680" height="34" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.0"/>
<text x="210" y="129" font-family="DejaVu Sans" font-size="10" fill="#0E1F40" text-anchor="middle" font-weight="normal">$integral k dif x = k x + c$</text>
<text x="560" y="129" font-family="DejaVu Sans" font-size="9" fill="#334155" text-anchor="middle" font-weight="normal">a constant integrates to a linear term</text>
<rect x="40" y="150" width="680" height="34" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.0"/>
<text x="210" y="173" font-family="DejaVu Sans" font-size="10" fill="#0E1F40" text-anchor="middle" font-weight="normal">$integral (f + g) dif x = integral f dif x + integral g dif x$</text>
<text x="560" y="173" font-family="DejaVu Sans" font-size="9" fill="#334155" text-anchor="middle" font-weight="normal">integrate term by term</text>
</svg>
