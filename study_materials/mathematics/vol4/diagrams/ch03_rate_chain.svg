<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" width="760" height="190">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="190" fill="#FFFFFF"/>
<rect x="0" y="0" width="760" height="190" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
<text x="380" y="30" font-family="DejaVu Sans" font-size="12" fill="#0E1F40" text-anchor="middle" font-weight="bold">Rate of Change: the Chain of Three Quantities</text>
<rect x="60" y="56" width="180" height="76" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.3"/>
<text x="150" y="84" font-family="DejaVu Sans" font-size="10.5" fill="#0E1F40" text-anchor="middle" font-weight="bold">Volume</text>
<text x="150" y="108" font-family="DejaVu Sans" font-size="10" fill="#334155" text-anchor="middle" font-weight="normal">$V = 4/3 pi r^3$</text>
<line x1="242" y1="94" x2="260" y2="94" stroke="#2563EB" stroke-width="1.5" marker-end="url(#an)"/>
<rect x="280" y="56" width="180" height="76" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.3"/>
<text x="370" y="84" font-family="DejaVu Sans" font-size="10.5" fill="#0E1F40" text-anchor="middle" font-weight="bold">Radius</text>
<text x="370" y="108" font-family="DejaVu Sans" font-size="10" fill="#334155" text-anchor="middle" font-weight="normal">$r$ changes with $t$</text>
<line x1="462" y1="94" x2="480" y2="94" stroke="#2563EB" stroke-width="1.5" marker-end="url(#an)"/>
<rect x="500" y="56" width="180" height="76" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.3"/>
<text x="590" y="84" font-family="DejaVu Sans" font-size="10.5" fill="#0E1F40" text-anchor="middle" font-weight="bold">Time</text>
<text x="590" y="108" font-family="DejaVu Sans" font-size="10" fill="#334155" text-anchor="middle" font-weight="normal">$dV/dt$</text>
<text x="380" y="160" font-family="DejaVu Sans" font-size="10" fill="#008751" text-anchor="middle" font-weight="normal">$dV/dt = (dV/dr)(dr/dt)$ — multiply the rates along the chain</text>
</svg>
