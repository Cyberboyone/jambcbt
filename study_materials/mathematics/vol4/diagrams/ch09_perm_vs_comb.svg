<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="760" height="200">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="200" fill="#FFFFFF"/>
<rect x="0" y="0" width="760" height="200" rx="10" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<text x="380" y="26" font-family="DejaVu Sans" font-size="12" fill="#0E1F40" text-anchor="middle" font-weight="bold">Order matters, or it does not?</text>
<rect x="22" y="48" width="350" height="122" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.4"/>
<text x="197" y="76" font-family="DejaVu Sans" font-size="10.5" fill="#008751" text-anchor="middle" font-weight="bold">PERMUTATION — order matters</text>
<text x="197" y="102" font-family="DejaVu Sans" font-size="9.4" fill="#334155" text-anchor="middle" font-weight="normal">AB and BA are different</text>
<text x="197" y="126" font-family="DejaVu Sans" font-size="10.2" fill="#0E1F40" text-anchor="middle" font-weight="normal">$^n P_r = n! / (n-r)!$</text>
<text x="197" y="152" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">arrangements, queues, passwords,</text>
<text x="197" y="166" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">podium finishes, ranks</text>
<rect x="388" y="48" width="350" height="122" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.4"/>
<text x="563" y="76" font-family="DejaVu Sans" font-size="10.5" fill="#2563EB" text-anchor="middle" font-weight="bold">COMBINATION — order does not matter</text>
<text x="563" y="102" font-family="DejaVu Sans" font-size="9.4" fill="#334155" text-anchor="middle" font-weight="normal">AB and BA are the same choice</text>
<text x="563" y="126" font-family="DejaVu Sans" font-size="10.2" fill="#0E1F40" text-anchor="middle" font-weight="normal">$^n C_r = n! / (r!(n-r)!)$</text>
<text x="563" y="152" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">committees, teams, selections,</text>
<text x="563" y="166" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">cards from a pack</text>
</svg>
