<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="760" height="200">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="200" fill="#FFFFFF"/>
<rect x="0" y="0" width="760" height="200" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
<text x="380" y="26" font-family="DejaVu Sans" font-size="12" fill="#0E1F40" text-anchor="middle" font-weight="bold">Variance in Four Moves</text>
<rect x="20" y="58" width="164" height="74" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.3"/>
<text x="102" y="84" font-family="DejaVu Sans" font-size="10" fill="#0E1F40" text-anchor="middle" font-weight="bold">mean</text>
<text x="102" y="110" font-family="DejaVu Sans" font-size="9.6" fill="#334155" text-anchor="middle" font-weight="normal">x̄ = Σx / n</text>
<line x1="188" y1="95" x2="204" y2="95" stroke="#2563EB" stroke-width="1.3" marker-end="url(#an)"/>
<rect x="204" y="58" width="164" height="74" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.3"/>
<text x="286" y="84" font-family="DejaVu Sans" font-size="10" fill="#0E1F40" text-anchor="middle" font-weight="bold">deviations</text>
<text x="286" y="110" font-family="DejaVu Sans" font-size="9.6" fill="#334155" text-anchor="middle" font-weight="normal">x − x̄</text>
<line x1="372" y1="95" x2="388" y2="95" stroke="#2563EB" stroke-width="1.3" marker-end="url(#an)"/>
<rect x="388" y="58" width="164" height="74" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.3"/>
<text x="470" y="84" font-family="DejaVu Sans" font-size="10" fill="#0E1F40" text-anchor="middle" font-weight="bold">squares</text>
<text x="470" y="110" font-family="DejaVu Sans" font-size="9.6" fill="#334155" text-anchor="middle" font-weight="normal">(x − x̄)²</text>
<line x1="556" y1="95" x2="572" y2="95" stroke="#2563EB" stroke-width="1.3" marker-end="url(#an)"/>
<rect x="572" y="58" width="164" height="74" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.3"/>
<text x="654" y="84" font-family="DejaVu Sans" font-size="10" fill="#0E1F40" text-anchor="middle" font-weight="bold">variance</text>
<text x="654" y="110" font-family="DejaVu Sans" font-size="9.6" fill="#334155" text-anchor="middle" font-weight="normal">σ² = Σ(x − x̄)² / n</text>
<text x="380" y="168" font-family="DejaVu Sans" font-size="9.5" fill="#008751" text-anchor="middle" font-weight="normal">standard deviation σ = √variance — same units as the data</text>
</svg>
