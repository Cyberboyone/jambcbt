<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="250" fill="#FFFFFF"/>
<rect x="0" y="0" width="760" height="250" rx="10" fill="#FFFFFF" stroke="#0E1F40" stroke-width="1.3"/>
<text x="380" y="28" font-family="DejaVu Sans" font-size="12.5" fill="#0E1F40" text-anchor="middle" font-weight="bold">The Six Differentiation Rules You Need</text>
<rect x="18" y="52" width="226" height="80" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.4"/>
<rect x="18" y="52" width="226" height="4" rx="2" fill="#008751"/>
<text x="131" y="73" font-family="DejaVu Sans" font-size="9.4" fill="#008751" text-anchor="middle" font-weight="bold">Power</text>
<text x="131" y="95" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">$y = x^n$</text>
<text x="131" y="115" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">$dy/dx = n x^(n-1)$</text>
<rect x="262" y="52" width="226" height="80" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.4"/>
<rect x="262" y="52" width="226" height="4" rx="2" fill="#008751"/>
<text x="375" y="73" font-family="DejaVu Sans" font-size="9.4" fill="#008751" text-anchor="middle" font-weight="bold">Constant multiple</text>
<text x="375" y="95" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">$y = k f(x)$</text>
<text x="375" y="115" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">$dy/dx = k f'(x)$</text>
<rect x="506" y="52" width="226" height="80" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
<rect x="506" y="52" width="226" height="4" rx="2" fill="#2563EB"/>
<text x="619" y="73" font-family="DejaVu Sans" font-size="9.4" fill="#2563EB" text-anchor="middle" font-weight="bold">Sum / difference</text>
<text x="619" y="95" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">$y = f + g$</text>
<text x="619" y="115" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">$dy/dx = f' + g'$</text>
<rect x="18" y="146" width="226" height="80" rx="7" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/>
<rect x="18" y="146" width="226" height="4" rx="2" fill="#D97706"/>
<text x="131" y="167" font-family="DejaVu Sans" font-size="9.4" fill="#D97706" text-anchor="middle" font-weight="bold">Product</text>
<text x="131" y="189" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">$y = u v$</text>
<text x="131" y="209" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">$dy/dx = u'v + uv'$</text>
<rect x="262" y="146" width="226" height="80" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.4"/>
<rect x="262" y="146" width="226" height="4" rx="2" fill="#DC2626"/>
<text x="375" y="167" font-family="DejaVu Sans" font-size="9.4" fill="#DC2626" text-anchor="middle" font-weight="bold">Quotient</text>
<text x="375" y="189" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">$y = u/v$</text>
<text x="375" y="209" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">$dy/dx = (u'v - uv')/v^2$</text>
<rect x="506" y="146" width="226" height="80" rx="7" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
<rect x="506" y="146" width="226" height="4" rx="2" fill="#7C3AED"/>
<text x="619" y="167" font-family="DejaVu Sans" font-size="9.4" fill="#7C3AED" text-anchor="middle" font-weight="bold">Function of a function</text>
<text x="619" y="189" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">$y = (a x + b)^n$</text>
<text x="619" y="209" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">$dy/dx = n a (a x + b)^(n-1)$</text>
</svg>
