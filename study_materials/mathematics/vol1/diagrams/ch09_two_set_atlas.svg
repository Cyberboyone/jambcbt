      <text x="370" y="25" fill="#0E1F40" font-family="DejaVu Sans" font-size="13.5" font-weight="bold" text-anchor="middle">Two-Set Venn Diagram Shading Atlas (High-Frequency JAMB Operations)</text><rect x="20" y="62" width="224" height="110" rx="6" fill="#FFFFFF" stroke="#0E1F40" stroke-width="1.5"/><text x="132.0" y="55" fill="#0E1F40" font-family="DejaVu Sans" font-size="10.5" font-weight="bold" text-anchor="middle">1. Union: A ∪ B</text><circle cx="106" cy="116" r="38" fill="#34D399" fill-opacity="0.65"/><circle cx="158" cy="116" r="38" fill="#34D399" fill-opacity="0.65"/><circle cx="106" cy="116" r="38" fill="none" stroke="#0E1F40" stroke-width="1.7"/><circle cx="158" cy="116" r="38" fill="none" stroke="#0E1F40" stroke-width="1.7"/><text x="32" y="78" fill="#334155" font-family="DejaVu Sans" font-size="10" font-weight="bold">ℰ</text><text x="84" y="88" fill="#0E1F40" font-family="DejaVu Sans" font-size="10.5" font-weight="bold">A</text><text x="172" y="88" fill="#0E1F40" font-family="DejaVu Sans" font-size="10.5" font-weight="bold">B</text><rect x="258" y="62" width="224" height="110" rx="6" fill="#FFFFFF" stroke="#0E1F40" stroke-width="1.5"/><text x="370.0" y="55" fill="#0E1F40" font-family="DejaVu Sans" font-size="10.5" font-weight="bold" text-anchor="middle">2. Intersection: A ∩ B</text><circle cx="396" cy="116" r="38" fill="#34D399" fill-opacity="0.75" clip-path="url(#clipA1)"/><circle cx="344" cy="116" r="38" fill="none" stroke="#0E1F40" stroke-width="1.7"/><circle cx="396" cy="116" r="38" fill="none" stroke="#0E1F40" stroke-width="1.7"/><text x="270" y="78" fill="#334155" font-family="DejaVu Sans" font-size="10" font-weight="bold">ℰ</text><text x="322" y="88" fill="#0E1F40" font-family="DejaVu Sans" font-size="10.5" font-weight="bold">A</text><text x="410" y="88" fill="#0E1F40" font-family="DejaVu Sans" font-size="10.5" font-weight="bold">B</text><rect x="496" y="62" width="224" height="110" rx="6" fill="#FFFFFF" stroke="#0E1F40" stroke-width="1.5"/><tex