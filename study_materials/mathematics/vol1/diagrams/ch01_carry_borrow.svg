<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 210" width="740" height="210">
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="740" height="210" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="370" y="25" fill="#0E1F40" font-family="DejaVu Sans" font-size="13.5" font-weight="bold" text-anchor="middle">Column Carry &amp; Borrow Mechanics in Non-Decimal Bases</text>
<rect x="24" y="42" width="335" height="152" rx="8" fill="#ECFDF5" fill-opacity="0.45" stroke="#008751" stroke-width="1.5"/>
<text x="191" y="62" fill="#008751" font-family="DejaVu Sans" font-size="11.5" font-weight="bold" text-anchor="middle">Addition in Base 5:  342₅ + 234₅</text>
<text x="165" y="84" fill="#DC2626" font-family="DejaVu Sans Mono" font-size="11" font-weight="bold">Carry:  1   1   1</text>
<text x="195" y="106" fill="#0E1F40" font-family="DejaVu Sans Mono" font-size="15" font-weight="bold">    3   4   2₅</text>
<text x="195" y="128" fill="#0E1F40" font-family="DejaVu Sans Mono" font-size="15" font-weight="bold">+   2   3   4₅</text>
<line x1="150" y1="136" x2="315" y2="136" stroke="#0E1F40" stroke-width="2"/>
<text x="195" y="158" fill="#008751" font-family="DejaVu Sans Mono" font-size="16" font-weight="bold">  1   1   3   1₅</text>
<text x="191" y="182" fill="#334155" font-family="DejaVu Sans" font-size="9.5" text-anchor="middle">2+4=6 = 1×5 + 1 | 4+3+1=8 = 1×5 + 3 | 3+2+1=6 = 1×5 + 1</text>
<rect x="381" y="42" width="335" height="152" rx="8" fill="#FEF3C7" fill-opacity="0.45" stroke="#D97706" stroke-width="1.5"/>
<text x="548" y="62" fill="#D97706" font-family="DejaVu Sans" font-size="11.5" font-weight="bold" text-anchor="middle">Subtraction in Base 5:  412₅ − 134₅</text>
<text x="455" y="84" fill="#DC2626" font-family="DejaVu Sans Mono" font-size="10.5" font-weight="bold">Borrow 1 group of 5 → (+5 to next col!)</text>
<text x="530" y="106" fill="#0E1F40" font-family="DejaVu Sans Mono" font-size="15" font-weight="bold">  4   1   2₅</text>
<text x="530" y="128" fill="#0E1F40" font-family="DejaVu Sans Mono" font-size="15" font-weight="bold">− 1   3   4₅</text>
<line x1="505" y1="136" x2="660" y2="136" stroke="#0E1F40" stroke-width="2"/>
<text x="530" y="158" fill="#D97706" font-family="DejaVu Sans Mono" font-size="16" font-weight="bold">  2   2   3₅</text>
<text x="548" y="182" fill="#334155" font-family="DejaVu Sans" font-size="9.5" text-anchor="middle">Units: (2+5)−4 = 3 | Fives: (0+5)−3 = 2 | 25s: 3−1 = 2</text>
</svg>
