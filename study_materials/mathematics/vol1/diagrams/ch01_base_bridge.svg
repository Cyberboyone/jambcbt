<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 200" width="740" height="200">
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="740" height="200" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="370" y="26" fill="#0E1F40" font-family="DejaVu Sans" font-size="13.5" font-weight="bold" text-anchor="middle">Universal Base-10 Bridge vs. Direct Power-of-2 Bit Grouping</text>
<rect x="36" y="58" width="130" height="54" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/>
<text x="101" y="82" fill="#0E1F40" font-family="DejaVu Sans" font-size="12" font-weight="bold" text-anchor="middle">Source Base p</text>
<text x="101" y="100" fill="#334155" font-family="DejaVu Sans" font-size="10.5" text-anchor="middle">e.g. 234₅</text>
<line x1="166" y1="85" x2="278" y2="85" stroke="#008751" stroke-width="2.2" marker-end="url(#arrow-green)"/>
<text x="222" y="76" fill="#008751" font-family="DejaVu Sans" font-size="10" font-weight="bold" text-anchor="middle">Expand ∑ dᵢ pⁱ</text>
<rect x="282" y="52" width="176" height="66" rx="10" fill="#ECFDF5" stroke="#008751" stroke-width="2.2"/>
<text x="370" y="78" fill="#008751" font-family="DejaVu Sans" font-size="13" font-weight="bold" text-anchor="middle">BASE 10 HUB</text>
<text x="370" y="96" fill="#0E1F40" font-family="DejaVu Sans" font-size="11" font-weight="bold" text-anchor="middle">50 + 15 + 4 = 69₁₀</text>
<text x="370" y="111" fill="#64748B" font-family="DejaVu Sans" font-size="9.5" text-anchor="middle">(Universal Pivot)</text>
<line x1="458" y1="85" x2="570" y2="85" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
<text x="514" y="76" fill="#2563EB" font-family="DejaVu Sans" font-size="10" font-weight="bold" text-anchor="middle">Divide by q</text>
<rect x="574" y="58" width="130" height="54" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/>
<text x="639" y="82" fill="#0E1F40" font-family="DejaVu Sans" font-size="12" font-weight="bold" text-anchor="middle">Target Base q</text>
<text x="639" y="100" fill="#334155" font-family="DejaVu Sans" font-size="10.5" text-anchor="middle">e.g. 105₈</text>
<rect x="36" y="134" width="668" height="48" rx="8" fill="#F1F5F9" stroke="#0E1F40" stroke-width="1.2"/>
<text x="370" y="153" fill="#0E1F40" font-family="DejaVu Sans" font-size="11" font-weight="bold" text-anchor="middle">FAST CBT SHORTCUT FOR BASES 2, 4, 8, 16 (No Base-10 Needed!):</text>
<text x="370" y="172" fill="#008751" font-family="DejaVu Sans Mono" font-size="11" font-weight="bold" text-anchor="middle">Base 4 = 2-bit groups (2²)   |   Base 8 = 3-bit groups (2³): 105₈ = 001 000 101₂   |   Base 16 = 4-bit groups (2⁴)</text>
</svg>
