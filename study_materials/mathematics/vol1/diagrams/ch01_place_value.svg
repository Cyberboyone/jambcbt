  <rect x="0" y="0" width="740" height="255" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="370" y="28" fill="#0E1F40" font-family="DejaVu Sans" font-size="14" font-weight="bold" text-anchor="middle">Positional Place-Value Anatomy of the Bicimal 1101.101₂</text>
<rect x="34" y="42" width="320" height="24" rx="5" fill="#ECFDF5" stroke="#008751" stroke-width="1"/>
<text x="194" y="58" fill="#008751" font-family="DejaVu Sans" font-size="11" font-weight="bold" text-anchor="middle">INTEGER PART (Positive Powers of Base 2)</text>
<rect x="412" y="42" width="294" height="24" rx="5" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
<text x="559" y="58" fill="#D97706" font-family="DejaVu Sans" font-size="11" font-weight="bold" text-anchor="middle">BICIMAL PART (Negative Powers of Base 2)</text>
<rect x="32" y="78" width="56" height="48" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.8"/>
<text x="60" y="110" fill="#0E1F40" font-family="DejaVu Sans Mono" font-size="22" font-weight="bold" text-anchor="middle">1</text>
<line x1="60" y1="126" x2="60" y2="156" stroke="#008751" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text x="60" y="175" fill="#0E1F40" font-family="DejaVu Sans" font-size="12" font-weight="bold" text-anchor="middle">1 × 2³</text>
<rect x="18" y="186" width="84" height="24" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
<text x="60" y="202" fill="#334155" font-family="DejaVu Sans" font-size="10.5" font-weight="bold" text-anchor="middle">= 8</text>
<rect x="117" y="78" width="56" height="48" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.8"/>
<text x="145" y="110" fill="#0E1F40" font-family="DejaVu Sans Mono" font-size="22" font-weight="bold" text-anchor="middle">1</text>
<line x1="145" y1="126" x2="145" y2="156" stroke="#008751" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text x="145" y="175" fill="#0E1F40" font-family="DejaVu Sans" font-size="12" font-weight="bold" text-anchor="middle">1 × 2²</text>
<rect x="103" y="186" width="84" height="24" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
<text x="145" y="202" fill="#334155" font-family="DejaVu Sans" font-size="10.5" font-weight="bold" text-anchor="middle">= 4</text>
<rect x="202" y="78" width="56" height="48" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.8"/>
<text x="230" y="110" fill="#0E1F40" font-family="DejaVu Sans Mono" font-size="22" font-weight="bold" text-anchor="middle">0</text>
<line x1="230" y1="126" x2="230" y2="156" stroke="#008751" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text x="230" y="175" fill="#0E1F40" font-family="DejaVu Sans" font-size="12" font-weight="bold" text-anchor="middle">0 × 2¹</text>
<rect x="188" y="186" width="84" height="24" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
<text x="230" y="202" fill="#334155" font-family="DejaVu Sans" font-size="10.5" font-weight="bold" text-anchor="middle">= 0</text>
<rect x="287" y="78" width="56" height="48" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.8"/>
<text x="315" y="110" fill="#0E1F40" font-family="DejaVu Sans Mono" font-size="22" font-weight="bold" text-anchor="middle">1</text>
<line x1="315" y1="126" x2="315" y2="156" stroke="#008751" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text x="315" y="175" fill="#0E1F40" font-family="DejaVu Sans" font-size="12" font-weight="bold" text-anchor="middle">1 × 2⁰</text>
<rect x="273" y="186" width="84" height="24" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
<text x="315" y="202" fill="#334155" font-family="DejaVu Sans" font-size="10.5" font-weight="bold" text-anchor="middle">= 1</text>
<circle cx="378" cy="112" r="7" fill="#DC2626"/>
<text x="378" y="148" fill="#DC2626" font-family="DejaVu Sans" font-size="10" font-weight="bold" text-anchor="middle">Radix</text>
<text x="378" y="162" fill="#DC2626" font-family="DejaVu Sans" font-size="10" font-weight="bold" text-anchor="middle">Point</text>
<rect x="417" y="78" width="56" height="48" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/>
<text x="445" y="110" fill="#0E1F40" font-family="DejaVu Sans Mono" font-size="22" font-weight="bold" text-anchor="middle">1</text>
<line x1="445" y1="126" x2="445" y2="156" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
<text x="445" y="175" fill="#0E1F40" font-family="DejaVu Sans" font-size="12" font-weight="bold" text-anchor="middle">1 × 2⁻¹</text>
<rect x="403" y="186" width="84" height="24" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
<text x="445" y="202" fill="#334155" font-family="DejaVu Sans" font-size="10.5" font-weight="bold" text-anchor="middle">= 1/2 = 0.5</text>
<rect x="522" y="78" width="56" height="48" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/>
<text x="550" y="110" fill="#0E1F40" font-family="DejaVu Sans Mono" font-size="22" font-weight="bold" text-anchor="middle">0</text>
<line x1="550" y1="126" x2="550" y2="156" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
<text x="550" y="175" fill="#0E1F40" font-family="DejaVu Sans" font-size="12" font-weight="bold" text-anchor="middle">0 × 2⁻²</text>
<rect x="508" y="186" width="84" height="24" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
<text x="550" y="202" fill="#334155" font-family="DejaVu Sans" font-size="10.5" font-weight="bold" text-anchor="middle">= 0</text>
<rect x="627" y="78" width="56" height="48" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/>
<text x="655" y="110" fill="#0E1F40" font-family="DejaVu Sans Mono" font-size="22" font-weight="bold" text-anchor="middle">1</text>
<line x1="655" y1="126" x2="655" y2="156" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
<text x="655" y="175" fill="#0E1F40" font-family="DejaVu Sans" font-size="12" font-weight="bold" text-anchor="middle">1 × 2⁻³</text>
<rect x="613" y="186" width="84" height="24" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
<text x="655" y="202" fill="#334155" font-family="DejaVu Sans" font-size="10.5" font-weight="bold" text-anchor="middle">= 1/8 = 0.125</text>
<rect x="90" y="220" width="560" height="26" rx="6" fill="#0E1F40"/>
<text x="370" y="237" fill="#FFFFFF" font-family="DejaVu Sans" font-size="11.5" font-weight="bold" text-anchor="middle">Total in Base 10 = (8 + 4 + 0 + 1) + (0.5 + 0 + 0.125) = 13.625₁₀</text>
</svg>
