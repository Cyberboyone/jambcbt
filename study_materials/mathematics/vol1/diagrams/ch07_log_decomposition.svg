<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 200" width="740" height="200">
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="740" height="200" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="370" y="25" fill="#0E1F40" font-family="DejaVu Sans" font-size="13.5" font-weight="bold" text-anchor="middle">Non-Calculator Logarithm Evaluation Blueprint (Using log₁₀ 2, log₁₀ 3, and log₁₀ 10 = 1)</text>
<rect x="28" y="46" width="210" height="132" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/>
<text x="133" y="68" fill="#0E1F40" font-family="DejaVu Sans" font-size="11" font-weight="bold" text-anchor="middle">THE HIDDEN log₁₀ 5 TRICK!</text>
<text x="133" y="92" fill="#DC2626" font-family="DejaVu Sans" font-size="10.5" font-weight="bold" text-anchor="middle">JAMB rarely gives log₁₀ 5!</text>
<text x="133" y="114" fill="#0E1F40" font-family="DejaVu Sans Mono" font-size="11" font-weight="bold" text-anchor="middle">log₁₀ 5 = log₁₀(10 / 2)</text>
<text x="133" y="136" fill="#008751" font-family="DejaVu Sans Mono" font-size="11.5" font-weight="bold" text-anchor="middle">= 1 − log₁₀ 2</text>
<text x="133" y="158" fill="#334155" font-family="DejaVu Sans Mono" font-size="10.5" text-anchor="middle">1 − 0.3010 = 0.6990</text>
<rect x="262" y="46" width="450" height="132" rx="8" fill="#ECFDF5" fill-opacity="0.45" stroke="#008751" stroke-width="1.6"/>
<text x="487" y="68" fill="#008751" font-family="DejaVu Sans" font-size="11" font-weight="bold" text-anchor="middle">Worked Decomposition: Evaluate log₁₀(0.075) given log 2 &amp; log 3</text>
<text x="282" y="94" fill="#0E1F40" font-family="DejaVu Sans Mono" font-size="11" font-weight="bold">Step 1 (Fraction):  0.075 = 75 / 1000 = 3 / 40 = 3 / (2³ × 5)</text>
<text x="282" y="118" fill="#0E1F40" font-family="DejaVu Sans Mono" font-size="11" font-weight="bold">Step 2 (Or keep 10s!): 75 / 1000 = (3 × 100) / (4 × 1000) = 3 / (4 × 10)</text>
<text x="282" y="142" fill="#2563EB" font-family="DejaVu Sans Mono" font-size="11" font-weight="bold">Step 3 (Expand):   log 3 − 2 log 2 − log 10 = 0.4771 − 0.6020 − 1</text>
<text x="282" y="164" fill="#008751" font-family="DejaVu Sans Mono" font-size="11.5" font-weight="bold">Step 4 (Result):   = −1.1249  (or in bar notation: 2̄.8751)</text>
</svg>
