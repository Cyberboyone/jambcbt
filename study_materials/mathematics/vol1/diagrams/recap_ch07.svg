<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 210" width="740" height="210">
          <rect x="0" y="0" width="740" height="210" rx="10" fill="#ECFDF5" stroke="#008751" stroke-width="1.2"/>
          <text x="370" y="26" fill="#0E1F40" font-family="DejaVu Sans" font-size="13.5" font-weight="bold" text-anchor="middle">CHAPTER 7 RECAP - Logarithms</text><text x="370" y="44" fill="#64748B" font-family="DejaVu Sans" font-size="9.6" text-anchor="middle">Always state the domain N > 0, a > 0, a - 1 before solving.</text><rect x="20.0" y="58.0" width="165.0" height="130.0" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.6"/><rect x="20.0" y="58.0" width="165.0" height="5" rx="2.5" fill="#008751"/><text x="102.5" y="80.0" fill="#0E1F40" font-family="DejaVu Sans" font-size="9" font-weight="bold" text-anchor="middle">log_a N = x</text><text x="102.5" y="93.0" fill="#0E1F40" font-family="DejaVu Sans" font-size="9" font-weight="bold" text-anchor="middle">- a- = N</text><rect x="195.0" y="58.0" width="165.0" height="130.0" rx="7" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6"/><rect x="195.0" y="58.0" width="165.0" height="5" rx="2.5" fill="#D97706"/><text x="277.5" y="80.0" fill="#0E1F40" font-family="DejaVu Sans" font-size="9" font-weight="bold" text-anchor="middle">Product = sum,</text><text x="277.5" y="93.0" fill="#0E1F40" font-family="DejaVu Sans" font-size="9" font-weight="bold" text-anchor="middle">quotient = difference</text><rect x="370.0" y="58.0" width="165.0" height="130.0" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/><rect x="370.0" y="58.0" width="165.0" height="5" rx="2.5" fill="#2563EB"/><text x="452.5" y="80.0" fill="#0E1F40" font-family="DejaVu Sans" font-size="9" font-weight="bold" text-anchor="middle">Change of base:</text><text x="452.5" y="93.0" fill="#0E1F40" font-family="DejaVu Sans" font-size="9" font-weight="bold" text-anchor="middle">log b / log a</text><rect x="545.0" y="58.0" width="165.0" height="130.0" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6"/><rect x="545.0" y="58.0" width="165.0" height="5" rx="2.5" fill="#DC2626"/><text x="627.5" y="80.0" fill="#0E1F40" font-family="DejaVu Sans" font-size="9" font-weight="bold" text-anchor="middle">No tables:</text><text x="627.5" y="93.0" fill="#0E1F40" font-family="DejaVu Sans" font-size="9" font-weight="bold" text-anchor="middle">log 5 = 1 - log 2</text>
        </svg>
