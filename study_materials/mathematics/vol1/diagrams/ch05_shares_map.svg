<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 200" width="740" height="200">
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="740" height="200" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="370" y="25" fill="#0E1F40" font-family="DejaVu Sans" font-size="13.5" font-weight="bold" text-anchor="middle">Shares, Nominal (Par) Value, Market Price &amp; Dividend Flow</text>
<rect x="28" y="48" width="205" height="90" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/>
<text x="130" y="70" fill="#0E1F40" font-family="DejaVu Sans" font-size="11" font-weight="bold" text-anchor="middle">1. Nominal (Face) Value</text>
<text x="130" y="90" fill="#334155" font-family="DejaVu Sans" font-size="10" text-anchor="middle">Printed face value per share</text>
<text x="130" y="108" fill="#D97706" font-family="DejaVu Sans Mono" font-size="11" font-weight="bold" text-anchor="middle">e.g. ₦0.50 (50k) share</text>
<text x="130" y="126" fill="#008751" font-family="DejaVu Sans" font-size="9.5" font-weight="bold" text-anchor="middle">Determines DIVIDEND!</text>
<rect x="268" y="48" width="205" height="90" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/>
<text x="370" y="70" fill="#0E1F40" font-family="DejaVu Sans" font-size="11" font-weight="bold" text-anchor="middle">2. Market Value (Price)</text>
<text x="370" y="90" fill="#334155" font-family="DejaVu Sans" font-size="10" text-anchor="middle">Stock-exchange trading price</text>
<text x="370" y="108" fill="#2563EB" font-family="DejaVu Sans Mono" font-size="11" font-weight="bold" text-anchor="middle">e.g. Quoted at ₦1.20</text>
<text x="370" y="126" fill="#2563EB" font-family="DejaVu Sans" font-size="9.5" font-weight="bold" text-anchor="middle">Determines COST OF BUYING!</text>
<rect x="508" y="48" width="205" height="90" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.8"/>
<text x="610" y="70" fill="#0E1F40" font-family="DejaVu Sans" font-size="11" font-weight="bold" text-anchor="middle">3. Key UTME Formulas</text>
<text x="610" y="92" fill="#0E1F40" font-family="DejaVu Sans" font-size="9.8" font-weight="bold" text-anchor="middle">Shares N = Cash / Market Price</text>
<text x="610" y="110" fill="#008751" font-family="DejaVu Sans" font-size="9.8" font-weight="bold" text-anchor="middle">Div = N × Par × (d% / 100)</text>
<text x="610" y="128" fill="#DC2626" font-family="DejaVu Sans" font-size="9.8" font-weight="bold" text-anchor="middle">Yield % = (Div / Cash) × 100%</text>
<rect x="28" y="150" width="685" height="34" rx="6" fill="#F1F5F9" stroke="#0E1F40"/>
<text x="370" y="171" fill="#0E1F40" font-family="DejaVu Sans" font-size="10.5" font-weight="bold" text-anchor="middle">Status: Market = Par → At Par   |   Market &gt; Par → At a Premium   |   Market &lt; Par → At a Discount</text>
</svg>
