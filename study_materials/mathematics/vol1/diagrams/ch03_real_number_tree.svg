<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 225" width="740" height="225">
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="740" height="225" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="370" y="24" fill="#0E1F40" font-family="DejaVu Sans" font-size="13.5" font-weight="bold" text-anchor="middle">The Real Number System (ℝ) &amp; Decimal Classification</text>
<rect x="275" y="38" width="190" height="34" rx="7" fill="#0E1F40"/>
<text x="370" y="59" fill="#FFFFFF" font-family="DejaVu Sans" font-size="11.5" font-weight="bold" text-anchor="middle">Real Numbers (ℝ)</text>
<line x1="320" y1="72" x2="195" y2="96" stroke="#0E1F40" stroke-width="1.8" marker-end="url(#arrow-navy)"/>
<line x1="420" y1="72" x2="555" y2="96" stroke="#0E1F40" stroke-width="1.8" marker-end="url(#arrow-navy)"/>
<rect x="65" y="98" width="260" height="42" rx="7" fill="#ECFDF5" stroke="#008751" stroke-width="1.8"/>
<text x="195" y="116" fill="#008751" font-family="DejaVu Sans" font-size="11" font-weight="bold" text-anchor="middle">Rational Numbers (ℚ = p/q, q ≠ 0)</text>
<text x="195" y="132" fill="#334155" font-family="DejaVu Sans" font-size="9.5" text-anchor="middle">Terminating OR Recurring Decimals</text>
<rect x="425" y="98" width="265" height="42" rx="7" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/>
<text x="557" y="116" fill="#DC2626" font-family="DejaVu Sans" font-size="11" font-weight="bold" text-anchor="middle">Irrational Numbers (ℚ')</text>
<text x="557" y="132" fill="#334155" font-family="DejaVu Sans" font-size="9.5" text-anchor="middle">Non-terminating, Non-recurring: √2, √3, π</text>
<line x1="130" y1="140" x2="105" y2="164" stroke="#008751" stroke-width="1.6" marker-end="url(#arrow-green)"/>
<line x1="255" y1="140" x2="295" y2="164" stroke="#008751" stroke-width="1.6" marker-end="url(#arrow-green)"/>
<rect x="24" y="166" width="175" height="44" rx="6" fill="#FFFFFF" stroke="#008751" stroke-width="1.4"/>
<text x="111" y="184" fill="#0E1F40" font-family="DejaVu Sans" font-size="10.5" font-weight="bold" text-anchor="middle">Integers ℤ ⊃ 𝕎 ⊃ ℕ</text>
<text x="111" y="200" fill="#334155" font-family="DejaVu Sans" font-size="9.2" text-anchor="middle">..., −2, −1, 0, 1, 2, 3, ...</text>
<rect x="212" y="166" width="215" height="44" rx="6" fill="#FFFFFF" stroke="#008751" stroke-width="1.4"/>
<text x="319" y="184" fill="#0E1F40" font-family="DejaVu Sans" font-size="10.5" font-weight="bold" text-anchor="middle">Non-Integer Fractions</text>
<text x="319" y="200" fill="#334155" font-family="DejaVu Sans" font-size="9.2" text-anchor="middle">3/8 = 0.375  |  4/11 = 0.3636...</text>
<rect x="442" y="166" width="274" height="44" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
<text x="579" y="184" fill="#0E1F40" font-family="DejaVu Sans" font-size="10" font-weight="bold" text-anchor="middle">Terminating Decimal Test (Lowest Terms p/q):</text>
<text x="579" y="200" fill="#D97706" font-family="DejaVu Sans" font-size="9.5" font-weight="bold" text-anchor="middle">Terminates iff prime factors of q are ONLY 2 and/or 5!</text>
</svg>
