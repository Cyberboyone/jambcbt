<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 210" width="740" height="210">
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="740" height="210" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="370" y="26" fill="#0E1F40" font-family="DejaVu Sans" font-size="13.5" font-weight="bold" text-anchor="middle">Index–Logarithm Duality &amp; Change-of-Base Master Identities</text>
<rect x="28" y="46" width="330" height="146" rx="9" fill="#ECFDF5" stroke="#008751" stroke-width="1.8"/>
<text x="193" y="68" fill="#008751" font-family="DejaVu Sans" font-size="11.5" font-weight="bold" text-anchor="middle">THE FUNDAMENTAL EQUIVALENCE</text>
<text x="193" y="104" fill="#0E1F40" font-family="DejaVu Sans" font-size="19" font-weight="bold" text-anchor="middle">bˣ = N   ⟺   log_b(N) = x</text>
<text x="193" y="132" fill="#334155" font-family="DejaVu Sans" font-size="10.5" font-weight="bold" text-anchor="middle">Restrictions:  b &gt; 0,  b ≠ 1,  and  N &gt; 0</text>
<rect x="48" y="146" width="290" height="32" rx="5" fill="#FFFFFF" stroke="#008751"/>
<text x="193" y="166" fill="#0E1F40" font-family="DejaVu Sans" font-size="10.5" font-weight="bold" text-anchor="middle">"Base stays Base; the Logarithm IS the Power!"</text>
<rect x="382" y="46" width="330" height="146" rx="9" fill="#DBEAFE" fill-opacity="0.5" stroke="#2563EB" stroke-width="1.8"/>
<text x="547" y="68" fill="#2563EB" font-family="DejaVu Sans" font-size="11.5" font-weight="bold" text-anchor="middle">4 HIGH-SPEED CHANGE-OF-BASE WEAPONS</text>
<text x="402" y="95" fill="#0E1F40" font-family="DejaVu Sans" font-size="11" font-weight="bold">1. New Base c:    log_a(b) = log_c(b) / log_c(a)</text>
<text x="402" y="119" fill="#0E1F40" font-family="DejaVu Sans" font-size="11" font-weight="bold">2. Reciprocal:    log_a(b) = 1 / log_b(a)</text>
<text x="402" y="143" fill="#0E1F40" font-family="DejaVu Sans" font-size="11" font-weight="bold">3. Chain Rule:    log_a(b) × log_b(c) = log_a(c)</text>
<text x="402" y="169" fill="#DC2626" font-family="DejaVu Sans" font-size="11" font-weight="bold">4. Power Base:   log_(aᵏ)(bᵐ) = (m / k) log_a(b)</text>
</svg>
