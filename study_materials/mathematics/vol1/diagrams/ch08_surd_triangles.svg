  <rect x="0" y="0" width="740" height="245" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="370" y="26" fill="#0E1F40" font-family="DejaVu Sans" font-size="13.5" font-weight="bold" text-anchor="middle">Geometric Construction of Exact Surds &amp; Special UTME Triangles</text>
<rect x="24" y="42" width="250" height="186" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="149" y="61" fill="#008751" font-family="DejaVu Sans" font-size="11" font-weight="bold" text-anchor="middle">Spiral of Theodorus (Unit Legs)</text>
<polygon points="135,165 179.0,165.0 179.0,121.0" fill="#ECFDF5" stroke="#008751" stroke-width="1.6"/>
<text x="186.0" y="114.0" fill="#0E1F40" font-family="DejaVu Sans" font-size="9.5" font-weight="bold" text-anchor="middle">√2</text>
<polygon points="135,165 179.0,121.0 147.9,89.9" fill="#ECFDF5" stroke="#008751" stroke-width="1.6"/>
<text x="149.9" y="77.9" fill="#0E1F40" font-family="DejaVu Sans" font-size="9.5" font-weight="bold" text-anchor="middle">√3</text>
<polygon points="135,165 147.9,89.9 104.5,82.4" fill="#ECFDF5" stroke="#008751" stroke-width="1.6"/>
<text x="99.6" y="69.2" fill="#0E1F40" font-family="DejaVu Sans" font-size="9.5" font-weight="bold" text-anchor="middle">√4=2</text>
<polygon points="135,165 104.5,82.4 63.2,97.7" fill="#ECFDF5" stroke="#008751" stroke-width="1.6"/>
<text x="51.8" y="86.9" fill="#0E1F40" font-family="DejaVu Sans" font-size="9.5" font-weight="bold" text-anchor="middle">√5</text>
<polygon points="135,165 63.2,97.7 33.1,129.8" fill="#ECFDF5" stroke="#008751" stroke-width="1.6"/>
<text x="16.8" y="124.1" fill="#0E1F40" font-family="DejaVu Sans" font-size="9.5" font-weight="bold" text-anchor="middle">√6</text>
<text x="149" y="216" fill="#334155" font-family="DejaVu Sans" font-size="9.5" text-anchor="middle">(√n)² + 1² = (√(n+1))²</text>
<rect x="290" y="42" width="205" height="186" rx="8" fill="#FEF3C7" fill-opacity="0.35" stroke="#D97706"/>
<text x="392" y="61" fill="#D97706" font-family="DejaVu Sans" font-size="11" font-weight="bold" text-anchor="middle">45°–45°–90° Triangle</text>
<polygon points="330,185 450,185 330,75" fill="#FFFFFF" stroke="#0E1F40" stroke-width="2.2"/>
<rect x="330" y="171" width="14" height="14" fill="none" stroke="#0E1F40" stroke-width="1.4"/>
<text x="390" y="203" fill="#0E1F40" font-family="DejaVu Sans" font-size="12" font-weight="bold" text-anchor="middle">1</text>
<text x="315" y="135" fill="#0E1F40" font-family="DejaVu Sans" font-size="12" font-weight="bold" text-anchor="middle">1</text>
<text x="405" y="122" fill="#DC2626" font-family="DejaVu Sans" font-size="13" font-weight="bold" text-anchor="middle">√2</text>
<text x="424" y="180" fill="#D97706" font-family="DejaVu Sans" font-size="10.5" font-weight="bold">45°</text>
<text x="336" y="102" fill="#D97706" font-family="DejaVu Sans" font-size="10.5" font-weight="bold">45°</text>
<text x="392" y="220" fill="#0E1F40" font-family="DejaVu Sans" font-size="9.8" font-weight="bold" text-anchor="middle">sin 45° = cos 45° = √2 / 2</text>
<rect x="511" y="42" width="205" height="186" rx="8" fill="#DBEAFE" fill-opacity="0.35" stroke="#2563EB"/>
<text x="613" y="61" fill="#2563EB" font-family="DejaVu Sans" font-size="11" font-weight="bold" text-anchor="middle">30°–60°–90° Triangle</text>
<polygon points="555,185 645,185 555,72" fill="#FFFFFF" stroke="#0E1F40" stroke-width="2.2"/>
<rect x="555" y="171" width="14" height="14" fill="none" stroke="#0E1F40" stroke-width="1.4"/>
<text x="600" y="203" fill="#0E1F40" font-family="DejaVu Sans" font-size="12" font-weight="bold" text-anchor="middle">1</text>
<text x="537" y="135" fill="#008751" font-family="DejaVu Sans" font-size="12.5" font-weight="bold" text-anchor="middle">√3</text>
<text x="615" y="122" fill="#0E1F40" font-family="DejaVu Sans" font-size="12.5" font-weight="bold" text-anchor="middle">2</text>
<text x="616" y="180" fill="#2563EB" font-family="DejaVu Sans" font-size="10.5" font-weight="bold">60°</text>
<text x="560" y="102" fill="#2563EB" font-family="DejaVu Sans" font-size="10.5" font-weight="bold">30°</text>
<text x="613" y="220" fill="#0E1F40" font-family="DejaVu Sans" font-size="9.8" font-weight="bold" text-anchor="middle">sin 60° = √3/2, tan 30° = √3/3</text>
</svg>
