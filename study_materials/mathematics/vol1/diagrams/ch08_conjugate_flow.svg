<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 195" width="740" height="195">
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="740" height="195" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="370" y="25" fill="#0E1F40" font-family="DejaVu Sans" font-size="13.5" font-weight="bold" text-anchor="middle">Rationalizing Binomial Surd Denominators via Difference of Two Squares</text>
<rect x="30" y="52" width="185" height="72" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/>
<text x="122" y="76" fill="#DC2626" font-family="DejaVu Sans" font-size="10.5" font-weight="bold" text-anchor="middle">Irrational Denominator</text>
<text x="122" y="104" fill="#0E1F40" font-family="DejaVu Sans" font-size="14" font-weight="bold" text-anchor="middle">N / (p + q√m)</text>
<line x1="215" y1="88" x2="268" y2="88" stroke="#0E1F40" stroke-width="2" marker-end="url(#arrow-navy)"/>
<rect x="272" y="52" width="205" height="72" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/>
<text x="374" y="76" fill="#D97706" font-family="DejaVu Sans" font-size="10.5" font-weight="bold" text-anchor="middle">Multiply Top &amp; Bottom by</text>
<text x="374" y="104" fill="#0E1F40" font-family="DejaVu Sans" font-size="13.5" font-weight="bold" text-anchor="middle">Conjugate: (p − q√m)</text>
<line x1="477" y1="88" x2="528" y2="88" stroke="#008751" stroke-width="2" marker-end="url(#arrow-green)"/>
<rect x="532" y="52" width="180" height="72" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.8"/>
<text x="622" y="76" fill="#008751" font-family="DejaVu Sans" font-size="10.5" font-weight="bold" text-anchor="middle">Rational Denominator!</text>
<text x="622" y="104" fill="#0E1F40" font-family="DejaVu Sans" font-size="13.5" font-weight="bold" text-anchor="middle">p² − q²m  ∈  ℚ</text>
<rect x="30" y="140" width="682" height="38" rx="6" fill="#0E1F40"/>
<text x="371" y="164" fill="#FFFFFF" font-family="DejaVu Sans" font-size="11" font-weight="bold" text-anchor="middle">CRITICAL SIGN WARNING: Conjugate of (2√3 − √7) is (2√3 + √7) — Flip ONLY the middle sign; check p² − q²m sign!</text>
</svg>
