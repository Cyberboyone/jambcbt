<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 205" width="740" height="205">
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="740" height="205" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="370" y="25" fill="#0E1F40" font-family="DejaVu Sans" font-size="13.5" font-weight="bold" text-anchor="middle">Linking Compound Ratios &amp; The Mixture Alligation Cross Shortcut</text>
<rect x="22" y="42" width="335" height="146" rx="8" fill="#ECFDF5" fill-opacity="0.4" stroke="#008751" stroke-width="1.5"/>
<text x="189" y="61" fill="#008751" font-family="DejaVu Sans" font-size="11" font-weight="bold" text-anchor="middle">Compound Ratio Bridge (A:B = 2:3, B:C = 4:5)</text>
<text x="189" y="88" fill="#0E1F40" font-family="DejaVu Sans Mono" font-size="12" font-weight="bold" text-anchor="middle">A  :  B  :  C</text>
<text x="189" y="110" fill="#334155" font-family="DejaVu Sans Mono" font-size="11.5" font-weight="bold" text-anchor="middle">2  :  3        (×4)</text>
<text x="189" y="130" fill="#334155" font-family="DejaVu Sans Mono" font-size="11.5" font-weight="bold" text-anchor="middle">      4  :  5  (×3)</text>
<line x1="70" y1="140" x2="310" y2="140" stroke="#008751" stroke-width="1.8"/>
<text x="189" y="160" fill="#008751" font-family="DejaVu Sans Mono" font-size="13" font-weight="bold" text-anchor="middle">8  : 12  : 15  (Total = 35 parts)</text>
<text x="189" y="178" fill="#64748B" font-family="DejaVu Sans" font-size="9.5" text-anchor="middle">Match common term B to LCM(3, 4) = 12</text>
<rect x="381" y="42" width="335" height="146" rx="8" fill="#DBEAFE" fill-opacity="0.35" stroke="#2563EB" stroke-width="1.5"/>
<text x="548" y="61" fill="#2563EB" font-family="DejaVu Sans" font-size="11" font-weight="bold" text-anchor="middle">Mixture Alligation Cross (Cheaper C₁ vs Dearer C₂)</text>
<text x="435" y="92" fill="#0E1F40" font-family="DejaVu Sans" font-size="11" font-weight="bold" text-anchor="middle">Cheaper C₁</text>
<text x="660" y="92" fill="#0E1F40" font-family="DejaVu Sans" font-size="11" font-weight="bold" text-anchor="middle">Dearer C₂</text>
<rect x="508" y="108" width="80" height="28" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8"/>
<text x="548" y="126" fill="#2563EB" font-family="DejaVu Sans" font-size="11" font-weight="bold" text-anchor="middle">Mean M</text>
<line x1="455" y1="98" x2="625" y2="152" stroke="#0E1F40" stroke-width="1.5" marker-end="url(#arrow-navy)"/>
<line x1="640" y1="98" x2="470" y2="152" stroke="#0E1F40" stroke-width="1.5" marker-end="url(#arrow-navy)"/>
<text x="438" y="168" fill="#008751" font-family="DejaVu Sans" font-size="10.5" font-weight="bold" text-anchor="middle">Qty₁ = C₂ − M</text>
<text x="658" y="168" fill="#008751" font-family="DejaVu Sans" font-size="10.5" font-weight="bold" text-anchor="middle">Qty₂ = M − C₁</text>
<text x="548" y="180" fill="#DC2626" font-family="DejaVu Sans" font-size="10" font-weight="bold" text-anchor="middle">Ratio Qty₁ : Qty₂ = (C₂ − M) : (M − C₁)</text>
</svg>
