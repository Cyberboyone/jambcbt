          <text x="370" y="26" fill="#0E1F40" font-family="DejaVu Sans" font-size="13.5" font-weight="bold" text-anchor="middle">CHAPTER 4 RECAP - Ratio, Proportion &amp; Rates</text><text x="370" y="44" fill="#64748B" font-family="DejaVu Sans" font-size="9.6" text-anchor="middle">Direct proportion: quotient constant. Inverse proportion: product constant.</text><rect x="20.0" y="58.0" width="165.0" height="130.0" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.6"/><rect x="20.0" y="58.0" width="165.0" height="5" rx="2.5" fill="#008751"/><text x="102.5" y="80.0" fill="#0E1F40" font-family="DejaVu Sans" font-size="9" font-weight="bold" text-anchor="middle">Percentage error over</text><text x="102.5" y="93.0" fill="#0E1F40" font-family="DejaVu Sans" font-size="9" font-weight="bold" text-anchor="middle">ACTUAL value</text><rect x="195.0" y="58.0" width="165.0" height="130.0" rx="7" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6"/><rect x="195.0" y="58.0" width="165.0" height="5" rx="2.5" fill="#D97706"/><text x="277.5" y="80.0" fill="#0E1F40" font-family="DejaVu Sans" font-size="9" font-weight="bold" text-anchor="middle">Chained ratios:</text><text x="277.5" y="93.0" fill="#0E1F40" font-family="DejaVu Sans" font-size="9" font-weight="bold" text-anchor="middle">match middle via LCM</text><rect x="370.0" y="58.0" width="165.0" height="130.0" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/><rect x="370.0" y="58.0" width="165.0" height="5" rx="2.5" fill="#2563EB"/><text x="452.5" y="80.0" fill="#0E1F40" font-family="DejaVu Sans" font-size="9" font-weight="bold" text-anchor="middle">Combined rates:</text><text x="452.5" y="93.0" fill="#0E1F40" font-family="DejaVu Sans" font-size="9" font-weight="bold" text-anchor="middle">add reciprocals</text><rect x="545.0" y="58.0" width="165.0" height="130.0" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6"/><rect x="545.0" y="58.0" width="165.0" height="5" rx="2.5" fill="#DC2626"/><text x="627.5" y="80.0" fill="#0E1F40" font-family="DejaVu Sans" font-size="9" font-weight="bold" text-anchor="middle">Equal distances:</text><text x="627.5" y="93.0" fill="#0E1F40" font-family="DejaVu Sans" font-size="9" font-weight="bold" text-anchor="middle">2v-v-/(v-+v-)</text>
