<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="220" fill="#ECFDF5"/>
<rect x="0" y="0" width="760" height="220" rx="10" fill="#ECFDF5" stroke="#008751" stroke-width="1.2"/>
<text x="380" y="28" font-family="DejaVu Sans" font-size="13.5" fill="#0E1F40" text-anchor="middle" font-weight="bold">CHAPTER 3 RECAP — Quadratic Equations</text>
<text x="380" y="46" font-family="DejaVu Sans" font-size="9.6" fill="#64748B" text-anchor="middle" font-weight="normal">Never lose a root: factorise, or apply the full formula with ±.</text>
<rect x="20.0" y="62.0" width="170.0" height="128.0" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.6"/>
<rect x="20.0" y="62.0" width="170.0" height="5" rx="2.5" fill="#008751"/>
<text x="105.0" y="86.0" font-family="DejaVu Sans" font-size="9" fill="#0E1F40" text-anchor="middle" font-weight="bold">Δ = b² − 4ac</text>
<text x="105.0" y="99.0" font-family="DejaVu Sans" font-size="9" fill="#0E1F40" text-anchor="middle" font-weight="bold">decides the roots</text>
<rect x="200.0" y="62.0" width="170.0" height="128.0" rx="7" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6"/>
<rect x="200.0" y="62.0" width="170.0" height="5" rx="2.5" fill="#D97706"/>
<text x="285.0" y="86.0" font-family="DejaVu Sans" font-size="9" fill="#0E1F40" text-anchor="middle" font-weight="bold">Sum = −b/a,</text>
<text x="285.0" y="99.0" font-family="DejaVu Sans" font-size="9" fill="#0E1F40" text-anchor="middle" font-weight="bold">product = c/a</text>
<rect x="380.0" y="62.0" width="170.0" height="128.0" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
<rect x="380.0" y="62.0" width="170.0" height="5" rx="2.5" fill="#2563EB"/>
<text x="465.0" y="86.0" font-family="DejaVu Sans" font-size="9" fill="#0E1F40" text-anchor="middle" font-weight="bold">Complete the square</text>
<text x="465.0" y="99.0" font-family="DejaVu Sans" font-size="9" fill="#0E1F40" text-anchor="middle" font-weight="bold">for the vertex</text>
<rect x="560.0" y="62.0" width="170.0" height="128.0" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6"/>
<rect x="560.0" y="62.0" width="170.0" height="5" rx="2.5" fill="#DC2626"/>
<text x="645.0" y="86.0" font-family="DejaVu Sans" font-size="9" fill="#0E1F40" text-anchor="middle" font-weight="bold">a &gt; 0: minimum;</text>
<text x="645.0" y="99.0" font-family="DejaVu Sans" font-size="9" fill="#0E1F40" text-anchor="middle" font-weight="bold">a &lt; 0: maximum</text>
</svg>
