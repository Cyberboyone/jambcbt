<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="300" fill="#FFFFFF"/>
<text x="450" y="24" font-family="DejaVu Sans" font-size="12" fill="#0E1F40" text-anchor="middle" font-weight="bold">SYNTHETIC DIVISION:  (2x³ − 5x² − 4x + 3) ÷ (x − 3)</text>
<text x="74" y="96" font-family="DejaVu Sans" font-size="14" fill="#DC2626" text-anchor="middle" font-weight="bold">3</text>
<rect x="120" y="70" width="62" height="44" rx="4" fill="#0E1F40" stroke="#0E1F40" stroke-width="1"/>
<text x="151.0" y="97" font-family="DejaVu Sans" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text>
<rect x="182" y="70" width="62" height="44" rx="4" fill="#0E1F40" stroke="#0E1F40" stroke-width="1"/>
<text x="213.0" y="97" font-family="DejaVu Sans" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">−5</text>
<rect x="244" y="70" width="62" height="44" rx="4" fill="#0E1F40" stroke="#0E1F40" stroke-width="1"/>
<text x="275.0" y="97" font-family="DejaVu Sans" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">−4</text>
<rect x="306" y="70" width="62" height="44" rx="4" fill="#0E1F40" stroke="#0E1F40" stroke-width="1"/>
<text x="337.0" y="97" font-family="DejaVu Sans" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text>
<line x1="151.0" y1="118" x2="151.0" y2="144" stroke="#008751" stroke-width="1.8" marker-end="url(#ag)"/>
<rect x="120" y="148" width="62" height="44" rx="4" fill="#ECFDF5" stroke="#008751" stroke-width="1.3"/>
<text x="151.0" y="175" font-family="DejaVu Sans" font-size="13" fill="#008751" text-anchor="middle" font-weight="bold">2</text>
<rect x="182" y="196" width="62" height="44" rx="4" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="213.0" y="223" font-family="DejaVu Sans" font-size="13" fill="#DC2626" text-anchor="middle" font-weight="bold">6</text>
<rect x="244" y="196" width="62" height="44" rx="4" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="275.0" y="223" font-family="DejaVu Sans" font-size="13" fill="#DC2626" text-anchor="middle" font-weight="bold">3</text>
<rect x="306" y="196" width="62" height="44" rx="4" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="337.0" y="223" font-family="DejaVu Sans" font-size="13" fill="#DC2626" text-anchor="middle" font-weight="bold">−3</text>
<rect x="182" y="244" width="62" height="44" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/>
<text x="213.0" y="271" font-family="DejaVu Sans" font-size="13" fill="#2563EB" text-anchor="middle" font-weight="bold">1</text>
<rect x="244" y="244" width="62" height="44" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/>
<text x="275.0" y="271" font-family="DejaVu Sans" font-size="13" fill="#2563EB" text-anchor="middle" font-weight="bold">−1</text>
<rect x="306" y="244" width="62" height="44" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/>
<text x="337.0" y="271" font-family="DejaVu Sans" font-size="13" fill="#2563EB" text-anchor="middle" font-weight="bold">0</text>
<text x="60" y="271" font-family="DejaVu Sans" font-size="14" fill="#0E1F40" text-anchor="end" font-weight="normal">=</text>
<text x="394" y="97" font-family="DejaVu Sans" font-size="9.4" fill="#64748B" text-anchor="start" font-weight="normal">coefficients of f(x), in descending order</text>
<text x="394" y="168" font-family="DejaVu Sans" font-size="9.4" fill="#008751" text-anchor="start" font-weight="normal">bring down the leading coefficient</text>
<text x="394" y="216" font-family="DejaVu Sans" font-size="9.4" fill="#DC2626" text-anchor="start" font-weight="normal">multiply by 3, write the product</text>
<text x="394" y="264" font-family="DejaVu Sans" font-size="9.4" fill="#2563EB" text-anchor="start" font-weight="normal">add: quotient 2x² + x − 1,</text>
<text x="394" y="280" font-family="DejaVu Sans" font-size="9.4" fill="#2563EB" text-anchor="start" font-weight="normal">remainder 0  ⇒  (x − 3) is a factor</text>
</svg>
