<text x="430" y="218" font-family="DejaVu Sans" font-size="14" fill="#008751" text-anchor="middle" font-weight="bold">S₁₀ = 10/2 × (3 + 21) = 5 × 24 = 120</text>
<text x="430" y="262" font-family="DejaVu Sans" font-size="9" fill="#64748B" text-anchor="middle" font-weight="normal">Check: Sₙ = n/2 [2a + (n − 1)d] = 5[6 + 18] = 120 ✓</text>
