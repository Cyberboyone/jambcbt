      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="296" fill="#FFFFFF"/>
<text x="430" y="22" font-family="DejaVu Sans" font-size="11.5" fill="#0E1F40" text-anchor="middle" font-weight="bold">SIGN CHART (WAVY CURVE) FOR (x + 2)(x − 1)(x − 3)</text>
<line x1="70" y1="150" x2="800" y2="150" stroke="#334155" stroke-width="1.4"/>
<line x1="170" y1="136" x2="170" y2="164" stroke="#0E1F40" stroke-width="1.6"/>
<text x="170" y="184" font-family="DejaVu Sans" font-size="10" fill="#0E1F40" text-anchor="middle" font-weight="bold">x = -2</text>
<circle cx="170" cy="150" r="5" fill="#0E1F40"/>
<line x1="390" y1="136" x2="390" y2="164" stroke="#0E1F40" stroke-width="1.6"/>
<text x="390" y="184" font-family="DejaVu Sans" font-size="10" fill="#0E1F40" text-anchor="middle" font-weight="bold">x = 1</text>
<circle cx="390" cy="150" r="5" fill="#0E1F40"/>
<line x1="610" y1="136" x2="610" y2="164" stroke="#0E1F40" stroke-width="1.6"/>
<text x="610" y="184" font-family="DejaVu Sans" font-size="10" fill="#0E1F40" text-anchor="middle" font-weight="bold">x = 3</text>
<circle cx="610" cy="150" r="5" fill="#0E1F40"/>
<path d="M 70 120 Q 160 116 170 150 Q 180 184 390 150 Q 500 116 610 150 Q 700 184 800 124" fill="none" stroke="#008751" stroke-width="2.6"/>
<text x="110" y="104" font-family="DejaVu Sans" font-size="22" fill="#008751" text-anchor="middle" font-weight="bold">+</text>
<text x="280" y="104" font-family="DejaVu Sans" font-size="22" fill="#DC2626" text-anchor="middle" font-weight="bold">−</text>
<text x="500" y="104" font-family="DejaVu Sans" font-size="22" fill="#DC2626" text-anchor="middle" font-weight="bold">−</text>
<text x="720" y="104" font-family="DejaVu Sans" font-size="22" fill="#008751" text-anchor="middle" font-weight="bold">+</text>
<text x="430" y="232" font-family="DejaVu Sans" font-size="9.6" fill="#64748B" text-anchor="middle" font-weight="normal">Signs alternate at every simple (odd-multiplicity) root:</text>
<text x="430" y="252" font-family="DejaVu Sans" font-size="9.6" fill="#64748B" text-anchor="middle" font-weight="normal">positive / negative / negative / positive, read left to right.</text>
<text x="430" y="278" font-family="DejaVu Sans" font-size="10.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">Solution of (x + 2)(x − 1)(x − 3) ≥ 0:   −2 ≤ x ≤ 1  or  x ≥ 3</text>
</svg>
