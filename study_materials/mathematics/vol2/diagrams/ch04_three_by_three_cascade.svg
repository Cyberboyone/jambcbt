<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 268" width="900" height="268">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="268" fill="#FFFFFF"/>
<text x="450" y="22" font-family="DejaVu Sans" font-size="12" fill="#0E1F40" text-anchor="middle" font-weight="bold">THREE UNKNOWNS BY CASCADE</text>
<rect x="30" y="44" width="250" height="108" rx="8" fill="#FFFFFF" stroke="#0E1F40" stroke-width="1.4"/>
<text x="155" y="66" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="middle" font-weight="bold">THE SYSTEM</text>
<text x="155" y="88" font-family="DejaVu Sans" font-size="9" fill="#334155" text-anchor="middle" font-weight="normal">(1)  x + y + z = 6</text>
<text x="155" y="105" font-family="DejaVu Sans" font-size="9" fill="#334155" text-anchor="middle" font-weight="normal">(2)  2x − y + z = 3</text>
<text x="155" y="122" font-family="DejaVu Sans" font-size="9" fill="#334155" text-anchor="middle" font-weight="normal">(3)  x + 2y − z = 2</text>
<line x1="284" y1="98" x2="318" y2="98" stroke="#008751" stroke-width="1.8" marker-end="url(#ag)"/>
<rect x="322" y="44" width="250" height="108" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.4"/>
<text x="447" y="66" font-family="DejaVu Sans" font-size="9.2" fill="#2563EB" text-anchor="middle" font-weight="bold">ELIMINATE x</text>
<text x="447" y="88" font-family="DejaVu Sans" font-size="9" fill="#334155" text-anchor="middle" font-weight="normal">(2) − 2(1)  ⇒  −3y − z = −9</text>
<text x="447" y="105" font-family="DejaVu Sans" font-size="9" fill="#334155" text-anchor="middle" font-weight="normal">(3) − (1)   ⇒   y − 2z = −4</text>
<line x1="576" y1="98" x2="610" y2="98" stroke="#2563EB" stroke-width="1.6" marker-end="url(#an)"/>
<rect x="614" y="44" width="256" height="108" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
<text x="742" y="66" font-family="DejaVu Sans" font-size="9.2" fill="#D97706" text-anchor="middle" font-weight="bold">SOLVE THE PAIR</text>
<text x="742" y="88" font-family="DejaVu Sans" font-size="9" fill="#334155" text-anchor="middle" font-weight="normal">y = 2z − 4</text>
<text x="742" y="105" font-family="DejaVu Sans" font-size="9" fill="#334155" text-anchor="middle" font-weight="normal">−3(2z − 4) − z = −9</text>
<text x="742" y="122" font-family="DejaVu Sans" font-size="9" fill="#334155" text-anchor="middle" font-weight="normal">⇒ z = 3, y = 2</text>
<line x1="742" y1="154" x2="742" y2="184" stroke="#D97706" stroke-width="1.6" marker-end="url(#aa)"/>
<rect x="500" y="188" width="380" height="62" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.4"/>
<text x="690" y="212" font-family="DejaVu Sans" font-size="11" fill="#008751" text-anchor="middle" font-weight="bold">Back-substitute:  x + 2 + 3 = 6  ⇒  x = 1</text>
<text x="690" y="236" font-family="DejaVu Sans" font-size="8.8" fill="#64748B" text-anchor="middle" font-weight="normal">Solution (1, 2, 3); check all three original equations.</text>
<text x="190" y="216" font-family="DejaVu Sans" font-size="9" fill="#64748B" text-anchor="middle" font-weight="normal">Always eliminate the same</text>
<text x="190" y="232" font-family="DejaVu Sans" font-size="9" fill="#64748B" text-anchor="middle" font-weight="normal">variable from both pairs.</text>
</svg>
