  <rect x="0" y="0" width="760" height="220" fill="#ECFDF5"/>
<rect x="0" y="0" width="760" height="220" rx="10" fill="#ECFDF5" stroke="#008751" stroke-width="1.2"/>
<text x="380" y="28" font-family="DejaVu Sans" font-size="13.5" fill="#0E1F40" text-anchor="middle" font-weight="bold">CHAPTER 8 RECAP — Binary Operations</text>
<text x="380" y="46" font-family="DejaVu Sans" font-size="9.6" fill="#64748B" text-anchor="middle" font-weight="normal">If the operation is not commutative, check the order in which a and b enter.</text>
<rect x="20.0" y="62.0" width="170.0" height="128.0" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.6"/>
<rect x="20.0" y="62.0" width="170.0" height="5" rx="2.5" fill="#008751"/>
<text x="105.0" y="86.0" font-family="DejaVu Sans" font-size="9" fill="#0E1F40" text-anchor="middle" font-weight="bold">Substitute literally,</text>
<text x="105.0" y="99.0" font-family="DejaVu Sans" font-size="9" fill="#0E1F40" text-anchor="middle" font-weight="bold">then compute</text>
<rect x="200.0" y="62.0" width="170.0" height="128.0" rx="7" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6"/>
<rect x="200.0" y="62.0" width="170.0" height="5" rx="2.5" fill="#D97706"/>
<text x="285.0" y="86.0" font-family="DejaVu Sans" font-size="9" fill="#0E1F40" text-anchor="middle" font-weight="bold">Identity: solve</text>
<text x="285.0" y="99.0" font-family="DejaVu Sans" font-size="9" fill="#0E1F40" text-anchor="middle" font-weight="bold">a * e = a</text>
<rect x="380.0" y="62.0" width="170.0" height="128.0" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
<rect x="380.0" y="62.0" width="170.0" height="5" rx="2.5" fill="#2563EB"/>
<text x="465.0" y="86.0" font-family="DejaVu Sans" font-size="9" fill="#0E1F40" text-anchor="middle" font-weight="bold">Inverse: solve</text>
<text x="465.0" y="99.0" font-family="DejaVu Sans" font-size="9" fill="#0E1F40" text-anchor="middle" font-weight="bold">a * b = e</text>
<rect x="560.0" y="62.0" width="170.0" height="128.0" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6"/>
<rect x="560.0" y="62.0" width="170.0" height="5" rx="2.5" fill="#DC2626"/>
<text x="645.0" y="86.0" font-family="DejaVu Sans" font-size="9" fill="#0E1F40" text-anchor="middle" font-weight="bold">Commutative: table</text>
<text x="645.0" y="99.0" font-family="DejaVu Sans" font-size="9" fill="#0E1F40" text-anchor="middle" font-weight="bold">is symmetric</text>
