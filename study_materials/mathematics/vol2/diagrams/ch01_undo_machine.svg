<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="290" fill="#FFFFFF"/>
<text x="450" y="26" font-family="DejaVu Sans" font-size="12" fill="#0E1F40" text-anchor="middle" font-weight="bold">FORWARD: the formula builds y from x</text>
<rect x="24" y="46" width="54" height="48" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.6"/>
<text x="51" y="76" font-family="DejaVu Sans" font-size="16" fill="#008751" text-anchor="middle" font-weight="bold">x</text>
<line x1="78" y1="70" x2="106" y2="70" stroke="#008751" stroke-width="1.8" marker-end="url(#ag)"/>
<rect x="110" y="46" width="84" height="48" rx="8" fill="#FFFFFF" stroke="#0E1F40" stroke-width="1.4"/>
<text x="152" y="76" font-family="DejaVu Sans" font-size="14" fill="#0E1F40" text-anchor="middle" font-weight="bold">× 3</text>
<line x1="198" y1="70" x2="251" y2="70" stroke="#008751" stroke-width="1.8" marker-end="url(#ag)"/>
<rect x="255" y="46" width="84" height="48" rx="8" fill="#FFFFFF" stroke="#0E1F40" stroke-width="1.4"/>
<text x="297" y="76" font-family="DejaVu Sans" font-size="14" fill="#0E1F40" text-anchor="middle" font-weight="bold">+ 2</text>
<line x1="343" y1="70" x2="396" y2="70" stroke="#008751" stroke-width="1.8" marker-end="url(#ag)"/>
<rect x="400" y="46" width="84" height="48" rx="8" fill="#FFFFFF" stroke="#0E1F40" stroke-width="1.4"/>
<text x="442" y="76" font-family="DejaVu Sans" font-size="14" fill="#0E1F40" text-anchor="middle" font-weight="bold">(  )²</text>
<line x1="488" y1="70" x2="540" y2="70" stroke="#008751" stroke-width="1.8" marker-end="url(#ag)"/>
<rect x="544" y="46" width="54" height="48" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.6"/>
<text x="571" y="76" font-family="DejaVu Sans" font-size="16" fill="#008751" text-anchor="middle" font-weight="bold">y</text>
<text x="450" y="150" font-family="DejaVu Sans" font-size="12" fill="#008751" text-anchor="middle" font-weight="bold">REVERSE: undo the operations, last first</text>
<rect x="544" y="176" width="54" height="48" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.6"/>
<text x="571" y="206" font-family="DejaVu Sans" font-size="16" fill="#008751" text-anchor="middle" font-weight="bold">y</text>
<line x1="544" y1="200" x2="488" y2="200" stroke="#008751" stroke-width="1.8" marker-end="url(#ag)"/>
<rect x="400" y="176" width="84" height="48" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.4"/>
<text x="442" y="206" font-family="DejaVu Sans" font-size="14" fill="#008751" text-anchor="middle" font-weight="bold">√</text>
<line x1="400" y1="200" x2="343" y2="200" stroke="#008751" stroke-width="1.8" marker-end="url(#ag)"/>
<rect x="255" y="176" width="84" height="48" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.4"/>
<text x="297" y="206" font-family="DejaVu Sans" font-size="14" fill="#008751" text-anchor="middle" font-weight="bold">− 2</text>
<line x1="255" y1="200" x2="198" y2="200" stroke="#008751" stroke-width="1.8" marker-end="url(#ag)"/>
<rect x="110" y="176" width="84" height="48" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.4"/>
<text x="152" y="206" font-family="DejaVu Sans" font-size="14" fill="#008751" text-anchor="middle" font-weight="bold">÷ 3</text>
<line x1="110" y1="200" x2="80" y2="200" stroke="#008751" stroke-width="1.8" marker-end="url(#ag)"/>
<text x="51" y="206" font-family="DejaVu Sans" font-size="16" fill="#008751" text-anchor="middle" font-weight="bold">x</text>
<text x="300" y="250" font-family="DejaVu Sans" font-size="10.5" fill="#64748B" text-anchor="middle" font-weight="normal">x  →  ×3  →  +2  →  square  →  y = (3x + 2)²</text>
<text x="300" y="272" font-family="DejaVu Sans" font-size="10.5" fill="#64748B" text-anchor="middle" font-weight="normal">x  ←  ÷3  ←  −2  ←  √    ←  x = (√y − 2)/3</text>
</svg>
