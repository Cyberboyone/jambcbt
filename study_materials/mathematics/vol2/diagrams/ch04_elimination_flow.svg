<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 216" width="900" height="216">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="216" fill="#FFFFFF"/>
<text x="450" y="24" font-family="DejaVu Sans" font-size="12" fill="#0E1F40" text-anchor="middle" font-weight="bold">THE ELIMINATION ENGINE</text>
<rect x="14" y="54" width="160" height="118" rx="8" fill="#FFFFFF" stroke="#008751" stroke-width="1.4"/>
<circle cx="36" cy="72" r="12" fill="#0E1F40"/>
<text x="36" y="77" font-family="DejaVu Sans" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text>
<text x="106" y="76" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">Match coefficients</text>
<text x="94" y="100" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">multiply each equation by</text>
<text x="94" y="115" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">the LCM of the coefficients</text>
<line x1="176" y1="112" x2="188" y2="112" stroke="#D97706" stroke-width="1.4" marker-end="url(#aa)"/>
<rect x="190" y="54" width="160" height="118" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
<circle cx="212" cy="72" r="12" fill="#0E1F40"/>
<text x="212" y="77" font-family="DejaVu Sans" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text>
<text x="282" y="76" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">Add or subtract</text>
<text x="270" y="100" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">the matched variable</text>
<text x="270" y="115" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">vanishes (watch the signs)</text>
<line x1="352" y1="112" x2="364" y2="112" stroke="#D97706" stroke-width="1.4" marker-end="url(#aa)"/>
<rect x="366" y="54" width="160" height="118" rx="8" fill="#FFFFFF" stroke="#008751" stroke-width="1.4"/>
<circle cx="388" cy="72" r="12" fill="#0E1F40"/>
<text x="388" y="77" font-family="DejaVu Sans" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text>
<text x="458" y="76" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">Solve the survivor</text>
<text x="446" y="100" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">one equation,</text>
<text x="446" y="115" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">one unknown</text>
<line x1="528" y1="112" x2="540" y2="112" stroke="#D97706" stroke-width="1.4" marker-end="url(#aa)"/>
<rect x="542" y="54" width="160" height="118" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
<circle cx="564" cy="72" r="12" fill="#0E1F40"/>
<text x="564" y="77" font-family="DejaVu Sans" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text>
<text x="634" y="76" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">Back-substitute</text>
<text x="622" y="100" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">put the value into the</text>
<text x="622" y="115" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">simpler original equation</text>
<line x1="704" y1="112" x2="716" y2="112" stroke="#D97706" stroke-width="1.4" marker-end="url(#aa)"/>
<rect x="718" y="54" width="160" height="118" rx="8" fill="#FFFFFF" stroke="#008751" stroke-width="1.4"/>
<circle cx="740" cy="72" r="12" fill="#0E1F40"/>
<text x="740" y="77" font-family="DejaVu Sans" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text>
<text x="810" y="76" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">Check both</text>
<text x="798" y="100" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">the pair must satisfy</text>
<text x="798" y="115" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">BOTH equations</text>
<text x="450" y="200" font-family="DejaVu Sans" font-size="9.4" fill="#64748B" text-anchor="middle" font-weight="normal">Word problems: define the two unknowns in words FIRST, then translate each sentence into one equation.</text>
</svg>
