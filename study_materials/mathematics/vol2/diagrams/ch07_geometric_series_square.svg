<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="820" height="320">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="320" fill="#FFFFFF"/>
<text x="400" y="22" font-family="DejaVu Sans" font-size="12" fill="#0E1F40" text-anchor="middle" font-weight="bold">WHY  ½ + ¼ + ⅛ + ... = 1</text>
<rect x="90" y="46" width="240" height="240" rx="3" fill="#FFFFFF" stroke="#0E1F40" stroke-width="1.6"/>
<rect x="90" y="46" width="120.0" height="240" rx="0" fill="#A7F3D0" stroke="#008751" stroke-width="1.2"/>
<text x="150.0" y="166.0" font-family="DejaVu Sans" font-size="18" fill="#008751" text-anchor="middle" font-weight="bold">½</text>
<rect x="210.0" y="46" width="120.0" height="120.0" rx="0" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/>
<text x="270.0" y="106.0" font-family="DejaVu Sans" font-size="15" fill="#2563EB" text-anchor="middle" font-weight="bold">¼</text>
<rect x="210.0" y="166.0" width="60.0" height="120.0" rx="0" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
<text x="240.0" y="226.0" font-family="DejaVu Sans" font-size="12" fill="#D97706" text-anchor="middle" font-weight="bold">⅛</text>
<rect x="270.0" y="166.0" width="60.0" height="60.0" rx="0" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/>
<text x="300.0" y="196.0" font-family="DejaVu Sans" font-size="9" fill="#DC2626" text-anchor="middle" font-weight="bold">¹⁄₁₆</text>
<text x="210.0" y="312" font-family="DejaVu Sans" font-size="10" fill="#0E1F40" text-anchor="middle" font-weight="normal">area of the unit square = 1</text>
<rect x="380" y="60" width="420" height="190" rx="8" fill="#FFFFFF" stroke="#008751" stroke-width="1.4"/>
<text x="590" y="88" font-family="DejaVu Sans" font-size="20" fill="#008751" text-anchor="middle" font-weight="bold">S∞ = a / (1 − r)</text>
<text x="590" y="120" font-family="DejaVu Sans" font-size="11" fill="#334155" text-anchor="middle" font-weight="normal">a = ½,  r = ½</text>
<text x="590" y="140" font-family="DejaVu Sans" font-size="11" fill="#334155" text-anchor="middle" font-weight="normal">S∞ = ½ ÷ (1 − ½) = ½ ÷ ½ = 1</text>
<text x="590" y="178" font-family="DejaVu Sans" font-size="9.2" fill="#64748B" text-anchor="middle" font-weight="normal">The square is never over-filled and never</text>
<text x="590" y="194" font-family="DejaVu Sans" font-size="9.2" fill="#64748B" text-anchor="middle" font-weight="normal">under-filled: the sum is exactly 1.</text>
<text x="590" y="226" font-family="DejaVu Sans" font-size="9.6" fill="#DC2626" text-anchor="middle" font-weight="bold">|r| &lt; 1 is the condition, not r &lt; 1.</text>
</svg>
