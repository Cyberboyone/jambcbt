<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="290" fill="#FFFFFF"/>
<text x="450" y="24" font-family="DejaVu Sans" font-size="12" fill="#0E1F40" text-anchor="middle" font-weight="bold">REMAINDER &amp; FACTOR THEOREM IN ONE PICTURE</text>
<rect x="30" y="62" width="150" height="62" rx="8" fill="#0E1F40" stroke="#0E1F40" stroke-width="1"/>
<text x="105" y="88" font-family="DejaVu Sans" font-size="9.2" fill="#FFFFFF" text-anchor="middle" font-weight="normal">polynomial f(x)</text>
<text x="105" y="103" font-family="DejaVu Sans" font-size="9.2" fill="#FFFFFF" text-anchor="middle" font-weight="normal">and divisor (x − a)</text>
<line x1="184" y1="93" x2="236" y2="93" stroke="#008751" stroke-width="1.8" marker-end="url(#ag)"/>
<rect x="240" y="62" width="150" height="62" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.3"/>
<text x="315" y="88" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="middle" font-weight="normal">substitute x = a</text>
<text x="315" y="103" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="middle" font-weight="normal">compute f(a)</text>
<line x1="394" y1="93" x2="446" y2="93" stroke="#008751" stroke-width="1.8" marker-end="url(#ag)"/>
<rect x="450" y="62" width="130" height="62" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
<text x="515" y="88" font-family="DejaVu Sans" font-size="14" fill="#D97706" text-anchor="middle" font-weight="bold">f(a) = ?</text>
<line x1="515" y1="128" x2="380" y2="176" stroke="#008751" stroke-width="1.8" marker-end="url(#ag)"/>
<line x1="515" y1="128" x2="640" y2="176" stroke="#DC2626" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="230" y="180" width="300" height="66" rx="8" fill="#ECFDF5" stroke="#008751" stroke-width="1.4"/>
<text x="380" y="204" font-family="DejaVu Sans" font-size="9.4" fill="#008751" text-anchor="middle" font-weight="normal">f(a) = 0  ⇒  (x − a) IS a factor</text>
<text x="380" y="219" font-family="DejaVu Sans" font-size="9.4" fill="#008751" text-anchor="middle" font-weight="normal">and the quotient is exact</text>
<rect x="560" y="180" width="300" height="66" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.4"/>
<text x="710" y="204" font-family="DejaVu Sans" font-size="9.4" fill="#DC2626" text-anchor="middle" font-weight="normal">f(a) ≠ 0  ⇒  not a factor, and</text>
<text x="710" y="219" font-family="DejaVu Sans" font-size="9.4" fill="#DC2626" text-anchor="middle" font-weight="normal">the remainder equals f(a)</text>
<text x="450" y="272" font-family="DejaVu Sans" font-size="9.2" fill="#64748B" text-anchor="middle" font-weight="normal">Degree 3 divisor (ax + b): substitute x = −b/a.   Degree 2 divisor: divide, then check the remainder is zero.</text>
</svg>
