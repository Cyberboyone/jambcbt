<text x="690" y="96" font-family="DejaVu Sans" font-size="10" fill="#DC2626" text-anchor="middle" font-weight="bold">identity element e = 0</text>
<text x="690" y="116" font-family="DejaVu Sans" font-size="8.8" fill="#64748B" text-anchor="middle" font-weight="normal">because a * 0 = a for every a.</text>
<text x="690" y="148" font-family="DejaVu Sans" font-size="9.4" fill="#D97706" text-anchor="middle" font-weight="normal">inverse of 1 is 4, of 2 is 3,</text>
<text x="690" y="164" font-family="DejaVu Sans" font-size="9.4" fill="#D97706" text-anchor="middle" font-weight="normal">of 0 is 0 (self-inverse),</text>
<text x="690" y="180" font-family="DejaVu Sans" font-size="9.4" fill="#D97706" text-anchor="middle" font-weight="normal">of 3 is 2, of 4 is 1.</text>
<text x="690" y="212" font-family="DejaVu Sans" font-size="8.8" fill="#64748B" text-anchor="middle" font-weight="normal">The table is symmetric about the</text>
<text x="690" y="228" font-family="DejaVu Sans" font-size="8.8" fill="#64748B" text-anchor="middle" font-weight="normal">leading diagonal ⇒ commutative.</text>
<text x="690" y="258" font-family="DejaVu Sans" font-size="8.8" fill="#64748B" text-anchor="middle" font-weight="normal">Closure: every entry is in the set.</text>
