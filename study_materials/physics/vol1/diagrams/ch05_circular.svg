<text x="188.98224616644012" y="102.40418015789125" font-family="DejaVu Sans" font-size="11" fill="#DC2626" text-anchor="middle" font-weight="bold">F</text>
<circle cx="216.02159507540134" cy="90.53516121867568" r="7" fill="#A7F3D0" stroke="#008751" stroke-width="1.4"/>
<rect x="316" y="58" width="236" height="30" rx="6" fill="#ECFDF5" stroke="#008751" stroke-width="1.0"/>
<text x="324" y="77" font-family="DejaVu Sans" font-size="8.0" fill="#0E1F40" text-anchor="start" font-weight="normal">v is a tangent: it turns as the body turns</text>
<rect x="316" y="98" width="236" height="30" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.0"/>
<text x="324" y="117" font-family="DejaVu Sans" font-size="8.0" fill="#0E1F40" text-anchor="start" font-weight="normal">F points along the radius, to the centre</text>
<rect x="316" y="138" width="236" height="46" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.0"/>
<text x="324" y="156" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="normal">v = ω r   ·   a = v²/r = ω² r</text>
<text x="324" y="172" font-family="DejaVu Sans" font-size="8.0" fill="#64748B" text-anchor="start" font-weight="normal">F = m v² / r, always towards C</text>
<text x="280" y="248" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="middle" font-weight="normal">remove the force and the body flies off along the tangent — that is the cut string</text>
