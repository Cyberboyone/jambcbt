  <rect x="0" y="0" width="560" height="262" fill="#FFFFFF"/>
<text x="280" y="20" font-family="DejaVu Sans" font-size="10.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">CIRCULAR MOTION — THE SPEED STAYS CONSTANT, THE VELOCITY NEVER DOES</text>
<circle cx="168.0" cy="152.0" r="78.0" fill="none" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="5 4"/>
<circle cx="168.0" cy="152.0" r="3.4" fill="#0E1F40"/>
<text x="156.0" y="170.0" font-family="DejaVu Sans" font-size="9.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">C</text>
<line x1="168.0" y1="152.0" x2="216.02159507540134" y2="90.53516121867568" stroke="#334155" stroke-width="1.4" stroke-dasharray="4 3"/>
