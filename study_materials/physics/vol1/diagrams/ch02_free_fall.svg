<text x="280" y="274" font-family="DejaVu Sans" font-size="9.0" fill="#0E1F40" text-anchor="middle" font-weight="normal">same g = 10 m s⁻² downward; only the sign you give it changes</text>
<text x="280" y="288" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">at the top of the flight v = 0 but a is still g — the ball is never weightless</text>
