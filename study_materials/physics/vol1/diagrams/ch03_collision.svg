<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="560" height="250">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="560" height="250" fill="#FFFFFF"/>
<text x="280" y="20" font-family="DejaVu Sans" font-size="10.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">A PERFECTLY INELASTIC COLLISION — MOMENTUM IS CONSERVED, ENERGY IS NOT</text>
<text x="60" y="52" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="start" font-weight="bold">before</text>
<rect x="80" y="66" width="70" height="40" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.3"/>
<text x="115" y="91" font-family="DejaVu Sans" font-size="9.6" fill="#2563EB" text-anchor="middle" font-weight="bold">m₁</text>
<line x1="158" y1="86" x2="197.6" y2="86.0" stroke="#2563EB" stroke-width="2.0"/><polygon points="210.0,86.0 197.6,90.6 197.6,81.4" fill="#2563EB"/>
<text x="184" y="76" font-family="DejaVu Sans" font-size="8.6" fill="#2563EB" text-anchor="middle" font-weight="normal">u₁</text>
<rect x="290" y="66" width="70" height="40" rx="5" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.3"/>
<text x="325" y="91" font-family="DejaVu Sans" font-size="9.6" fill="#7C3AED" text-anchor="middle" font-weight="bold">m₂</text>
<text x="325" y="122" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="middle" font-weight="normal">at rest</text>
<line x1="30" y1="140" x2="530" y2="140" stroke="#CBD5E1" stroke-width="1.0" stroke-dasharray="4 3"/>
<text x="60" y="168" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="start" font-weight="bold">after</text>
<rect x="170" y="182" width="150" height="40" rx="5" fill="#ECFDF5" stroke="#008751" stroke-width="1.3"/>
<text x="245" y="207" font-family="DejaVu Sans" font-size="9.6" fill="#008751" text-anchor="middle" font-weight="bold">m₁ + m₂</text>
<line x1="324" y1="202" x2="387.6" y2="202.0" stroke="#008751" stroke-width="2.0"/><polygon points="400.0,202.0 387.6,206.6 387.6,197.4" fill="#008751"/>
<text x="362" y="192" font-family="DejaVu Sans" font-size="8.6" fill="#008751" text-anchor="middle" font-weight="normal">v</text>
<rect x="8" y="228" width="544" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8"/>
<text x="280" y="240" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">m₁u₁ = (m₁ + m₂)v   ·   lost kinetic energy becomes heat and sound</text>
</svg>
