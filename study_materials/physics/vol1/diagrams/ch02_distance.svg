<circle cx="500" cy="150" r="4" fill="#2563EB"/>
<text x="160" y="56" font-family="DejaVu Sans" font-size="8.4" fill="#2563EB" text-anchor="middle" font-weight="normal">start</text>
<text x="500" y="136" font-family="DejaVu Sans" font-size="8.4" fill="#2563EB" text-anchor="middle" font-weight="normal">finish</text>
<line x1="60" y1="170" x2="487.6127901013923" y2="150.56305499539127" stroke="#DC2626" stroke-width="2.2"/><polygon points="500.0,150.0 487.8,155.2 487.4,145.9" fill="#DC2626"/>
<text x="250" y="190" font-family="DejaVu Sans" font-size="8.8" fill="#DC2626" text-anchor="middle" font-weight="normal">displacement — a straight line from start to finish</text>
<text x="250" y="214" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="middle" font-weight="normal">distance — the length of the dotted path; it can never be less than the displacement</text>
</svg>
