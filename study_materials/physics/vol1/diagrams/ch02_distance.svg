<text x="280" y="20" font-family="DejaVu Sans" font-size="11" fill="#0E1F40" text-anchor="middle" font-weight="bold">DISTANCE IS A PATH; DISPLACEMENT IS AN ARROW</text>
<path d="M 60 170 L 160 70 L 300 130 L 420 60 L 500 150" fill="none" stroke="#2563EB" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="6 4"/>
<circle cx="60" cy="170" r="4" fill="#2563EB"/>
<circle cx="160" cy="70" r="4" fill="#2563EB"/>
