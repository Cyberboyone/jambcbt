<text x="425" y="214" font-family="DejaVu Sans" font-size="8.6" fill="#008751" text-anchor="middle" font-weight="bold">area A₂</text>
<text x="280" y="232" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">p = F₁/A₁ = F₂/A₂, so F₂ = F₁ × A₂/A₁ — the force is multiplied, the work is not</text>
