      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="560" height="176" fill="#FFFFFF"/>
<text x="280" y="20" font-family="DejaVu Sans" font-size="11" fill="#0E1F40" text-anchor="middle" font-weight="bold">ONE QUANTITY IN FIVE FORMS — THE CONSERVATION OF ENERGY</text>
<rect x="20" y="44" width="90" height="58" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<rect x="20" y="44" width="90" height="6" rx="2" fill="#008751" stroke="#008751" stroke-width="0.8"/>
<text x="65.0" y="74" font-family="DejaVu Sans" font-size="9.0" fill="#008751" text-anchor="middle" font-weight="bold">chemical</text>
<text x="65.0" y="90" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">fuel, food</text>
<line x1="112" y1="73" x2="115.6" y2="73.0" stroke="#64748B" stroke-width="1.3"/><polygon points="128.0,73.0 115.6,77.6 115.6,68.4" fill="#64748B"/>
<rect x="130" y="44" width="90" height="58" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
<rect x="130" y="44" width="90" height="6" rx="2" fill="#2563EB" stroke="#2563EB" stroke-width="0.8"/>
<text x="175.0" y="74" font-family="DejaVu Sans" font-size="9.0" fill="#2563EB" text-anchor="middle" font-weight="bold">kinetic</text>
<text x="175.0" y="90" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">1/2 m v²</text>
<line x1="222" y1="73" x2="225.6" y2="73.0" stroke="#64748B" stroke-width="1.3"/><polygon points="238.0,73.0 225.6,77.6 225.6,68.4" fill="#64748B"/>
<rect x="240" y="44" width="90" height="58" rx="7" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/>
<rect x="240" y="44" width="90" height="6" rx="2" fill="#7C3AED" stroke="#7C3AED" stroke-width="0.8"/>
<text x="285.0" y="74" font-family="DejaVu Sans" font-size="9.0" fill="#7C3AED" text-anchor="middle" font-weight="bold">potential</text>
<text x="285.0" y="90" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">m g h</text>
<line x1="332" y1="73" x2="335.6" y2="73.0" stroke="#64748B" stroke-width="1.3"/><polygon points="348.0,73.0 335.6,77.6 335.6,68.4" fill="#64748B"/>
<rect x="350" y="44" width="90" height="58" rx="7" fill="#FFFFFF" stroke="#D97706" stroke-width="1.3"/>
<rect x="350" y="44" width="90" height="6" rx="2" fill="#D97706" stroke="#D97706" stroke-width="0.8"/>
<text x="395.0" y="74" font-family="DejaVu Sans" font-size="9.0" fill="#D97706" text-anchor="middle" font-weight="bold">electrical</text>
<text x="395.0" y="90" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">current</text>
<line x1="442" y1="73" x2="445.6" y2="73.0" stroke="#64748B" stroke-width="1.3"/><polygon points="458.0,73.0 445.6,77.6 445.6,68.4" fill="#64748B"/>
<rect x="460" y="44" width="90" height="58" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.3"/>
<rect x="460" y="44" width="90" height="6" rx="2" fill="#DC2626" stroke="#DC2626" stroke-width="0.8"/>
<text x="505.0" y="74" font-family="DejaVu Sans" font-size="9.0" fill="#DC2626" text-anchor="middle" font-weight="bold">heat</text>
<text x="505.0" y="90" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">always</text>
<text x="280" y="128" font-family="DejaVu Sans" font-size="8.8" fill="#334155" text-anchor="middle" font-weight="normal">energy moves from form to form, and the total never changes</text>
<text x="280" y="150" font-family="DejaVu Sans" font-size="8.8" fill="#64748B" text-anchor="middle" font-weight="normal">every conversion ends in heat, which is why no machine is 100 % efficient</text>
</svg>
