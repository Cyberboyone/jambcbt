<text x="434" y="108" font-family="DejaVu Sans" font-size="13" fill="#2563EB" text-anchor="middle" font-weight="bold">47</text>
<text x="147" y="186" font-family="DejaVu Sans" font-size="7.4" fill="#64748B" text-anchor="middle" font-weight="normal">anvil</text>
<text x="172" y="186" font-family="DejaVu Sans" font-size="7.4" fill="#008751" text-anchor="middle" font-weight="normal">object</text>
<text x="236" y="186" font-family="DejaVu Sans" font-size="7.4" fill="#64748B" text-anchor="middle" font-weight="normal">spindle</text>
<text x="352" y="186" font-family="DejaVu Sans" font-size="7.4" fill="#64748B" text-anchor="middle" font-weight="normal">sleeve</text>
<text x="434" y="186" font-family="DejaVu Sans" font-size="7.4" fill="#2563EB" text-anchor="middle" font-weight="normal">thimble</text>
<text x="496" y="186" font-family="DejaVu Sans" font-size="7.4" fill="#64748B" text-anchor="middle" font-weight="normal">ratchet</text>
<rect x="8" y="198" width="300" height="62" rx="6" fill="#FFFFFF" stroke="#334155" stroke-width="1.0"/>
<text x="18" y="216" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="start" font-weight="normal">sleeve: 3.0 mm + 0.5 mm  =  3.50 mm</text>
<text x="18" y="232" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="start" font-weight="normal">thimble: 47 × 0.01 mm  =  0.47 mm</text>
<text x="18" y="250" font-family="DejaVu Sans" font-size="9.4" fill="#008751" text-anchor="start" font-weight="bold">reading  =  3.97 mm</text>
<rect x="318" y="198" width="234" height="62" rx="6" fill="#ECFDF5" stroke="#008751" stroke-width="1.0"/>
<text x="328" y="216" font-family="DejaVu Sans" font-size="8.4" fill="#0E1F40" text-anchor="start" font-weight="normal">one full turn of the thimble moves</text>
<text x="328" y="232" font-family="DejaVu Sans" font-size="8.4" fill="#0E1F40" text-anchor="start" font-weight="normal">the spindle 0.50 mm, and it carries</text>
<text x="328" y="248" font-family="DejaVu Sans" font-size="8.4" fill="#0E1F40" text-anchor="start" font-weight="normal">50 divisions — so 1 division = 0.01 mm</text>
<text x="280" y="278" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">read the sleeve first, then add the thimble — and subtract any zero error</text>
<text x="280" y="296" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">the least count is 0.5 mm / 50 = 0.01 mm, ten times finer than a vernier calliper</text>
</svg>
