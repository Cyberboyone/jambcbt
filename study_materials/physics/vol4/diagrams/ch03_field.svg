<text x="343.0" y="248" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">Concentric circles; right-hand grip:</text>
<text x="343.0" y="262" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">thumb along current, fingers curl</text>
<text x="343.0" y="276" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">with the field.</text>
