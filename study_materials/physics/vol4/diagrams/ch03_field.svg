<text x="623.0" y="202" font-family="DejaVu Sans" font-size="8.6" fill="#2563EB" text-anchor="middle" font-weight="bold">S</text>
<text x="565.0" y="248" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">A coil behaves like a bar magnet;</text>
