<text x="121.0" y="248" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">Lines leave N and enter S;</text>
<text x="121.0" y="262" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">they never cross.</text>
<text x="121.0" y="282" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">Like poles repel.</text>
<rect x="236" y="34" width="214" height="262" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
<text x="343.0" y="50" font-family="DejaVu Sans" font-size="8.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">(b) A STRAIGHT WIRE</text>
