      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="296" fill="#FFFFFF"/>
<text x="340" y="20" font-family="DejaVu Sans" font-size="10.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">RESISTANCE DEPENDS ON WHAT THE WIRE IS AND HOW IT IS CUT</text>
<rect x="14" y="34" width="310" height="244" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="169" y="52" font-family="DejaVu Sans" font-size="9.0" fill="#008751" text-anchor="middle" font-weight="bold">A WIRE OF LENGTH l AND AREA A</text>
<rect x="50" y="104" width="212" height="46" rx="3" fill="#CBD5E1" stroke="#334155" stroke-width="1.3"/>
<line x1="54" y1="108" x2="54" y2="146" stroke="#94A3B8" stroke-width="1.0" stroke-dasharray="2 3"/>
<line x1="258" y1="108" x2="258" y2="146" stroke="#94A3B8" stroke-width="1.0" stroke-dasharray="2 3"/>
<line x1="68" y1="127.0" x2="234.7" y2="127.0" stroke="#2563EB" stroke-width="1.4"/><polygon points="244.0,127.0 234.7,130.5 234.7,123.5" fill="#2563EB"/>
<text x="169" y="119.0" font-family="DejaVu Sans" font-size="8.2" fill="#2563EB" text-anchor="middle" font-weight="normal">current</text>
<line x1="50" y1="166" x2="262" y2="166" stroke="#334155" stroke-width="1.0" stroke-dasharray="3 3"/>
<line x1="169" y1="176" x2="56.975" y2="176.0" stroke="#334155" stroke-width="1.0"/><polygon points="50.0,176.0 57.0,173.4 57.0,178.6" fill="#334155"/>
<line x1="169" y1="176" x2="255.025" y2="176.0" stroke="#334155" stroke-width="1.0"/><polygon points="262.0,176.0 255.0,178.6 255.0,173.4" fill="#334155"/>
<text x="169" y="192" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">length l (m)</text>
<line x1="278" y1="104" x2="278" y2="150" stroke="#334155" stroke-width="1.0" stroke-dasharray="3 3"/>
<line x1="288" y1="127.0" x2="288.0" y2="110.975" stroke="#334155" stroke-width="1.0"/><polygon points="288.0,104.0 290.6,111.0 285.4,111.0" fill="#334155"/>
<line x1="288" y1="127.0" x2="288.0" y2="143.025" stroke="#334155" stroke-width="1.0"/><polygon points="288.0,150.0 285.4,143.0 290.6,143.0" fill="#334155"/>
<text x="302" y="131.0" font-family="DejaVu Sans" font-size="9.0" fill="#334155" text-anchor="start" font-weight="bold">A</text>
<text x="169" y="218" font-family="DejaVu Sans" font-size="11.2" fill="#0E1F40" text-anchor="middle" font-weight="bold">R = ρ l / A</text>
<text x="169" y="238" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="middle" font-weight="normal">ρ is the resistivity of the material, in Ω m.</text>
<text x="169" y="256" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="middle" font-weight="normal">It is a property of copper, not of the wire.</text>
<rect x="336" y="34" width="330" height="240" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="501" y="52" font-family="DejaVu Sans" font-size="9.0" fill="#008751" text-anchor="middle" font-weight="bold">CHANGE ONE THING AT A TIME</text>
<rect x="350" y="70" width="302" height="46" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.9"/>
<text x="362" y="88" font-family="DejaVu Sans" font-size="8.4" fill="#0E1F40" text-anchor="start" font-weight="bold">double the length</text>
<text x="638" y="88" font-family="DejaVu Sans" font-size="8.8" fill="#008751" text-anchor="end" font-weight="bold">R doubles</text>
<text x="362" y="104" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="start" font-weight="normal">longer path, more collisions</text>
<rect x="350" y="120" width="302" height="46" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.9"/>
<text x="362" y="138" font-family="DejaVu Sans" font-size="8.4" fill="#0E1F40" text-anchor="start" font-weight="bold">double the area</text>
<text x="638" y="138" font-family="DejaVu Sans" font-size="8.8" fill="#008751" text-anchor="end" font-weight="bold">R halves</text>
<text x="362" y="154" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="start" font-weight="normal">wider road, more room to pass</text>
<rect x="350" y="170" width="302" height="46" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.9"/>
<text x="362" y="188" font-family="DejaVu Sans" font-size="8.4" fill="#0E1F40" text-anchor="start" font-weight="bold">double the temperature</text>
<text x="638" y="188" font-family="DejaVu Sans" font-size="8.8" fill="#008751" text-anchor="end" font-weight="bold">R rises</text>
<text x="362" y="204" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="start" font-weight="normal">lattice vibrates harder (metal)</text>
<rect x="350" y="220" width="302" height="46" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.9"/>
<text x="362" y="238" font-family="DejaVu Sans" font-size="8.4" fill="#0E1F40" text-anchor="start" font-weight="bold">swap copper for nichrome</text>
<text x="638" y="238" font-family="DejaVu Sans" font-size="8.8" fill="#008751" text-anchor="end" font-weight="bold">R rises</text>
<text x="362" y="254" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="start" font-weight="normal">different ρ, same size</text>
</svg>
