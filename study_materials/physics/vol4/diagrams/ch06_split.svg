  <rect x="0" y="0" width="680" height="306" fill="#FFFFFF"/>
<text x="340" y="20" font-family="DejaVu Sans" font-size="10.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">SPLITTING HEAVY NUCLEI, JOINING LIGHT ONES</text>
