  <rect x="0" y="0" width="680" height="330" fill="#FFFFFF"/>
<text x="340" y="20" font-family="DejaVu Sans" font-size="10.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">SERIES AND PARALLEL, WITH THE METERS WHERE THEY BELONG</text>
<rect x="14" y="34" width="320" height="280" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="174" y="52" font-family="DejaVu Sans" font-size="9.2" fill="#008751" text-anchor="middle" font-weight="bold">SERIES: ONE PATH</text>
<line x1="52" y1="106" x2="300" y2="106" stroke="#334155" stroke-width="1.6"/>
<line x1="52" y1="230" x2="300" y2="230" stroke="#334155" stroke-width="1.6"/>
<line x1="52" y1="106" x2="52" y2="230" stroke="#334155" stroke-width="1.6"/>
<line x1="300" y1="106" x2="300" y2="230" stroke="#334155" stroke-width="1.6"/>
<line x1="52" y1="154" x2="52" y2="164" stroke="#334155" stroke-width="2.0"/>
<line x1="45" y1="164" x2="59" y2="164" stroke="#334155" stroke-width="2.0"/>
<line x1="48" y1="170" x2="56" y2="170" stroke="#334155" stroke-width="2.0"/>
