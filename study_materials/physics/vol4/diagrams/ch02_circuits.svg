<text x="113.0" y="132" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">R₁ = 4 Ω</text>
<rect x="196" y="98" width="34" height="16" rx="2" fill="#FFFFFF" stroke="#334155" stroke-width="1.4"/>
<text x="213.0" y="132" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">R₂ = 2 Ω</text>
<circle cx="268" cy="106" r="11" fill="#FFFFFF" stroke="#008751" stroke-width="1.4"/>
<text x="268" y="110" font-family="DejaVu Sans" font-size="9.2" fill="#008751" text-anchor="middle" font-weight="bold">A</text>
<circle cx="213" cy="72" r="11" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
<text x="213" y="76" font-family="DejaVu Sans" font-size="9.2" fill="#2563EB" text-anchor="middle" font-weight="bold">V</text>
<line x1="196" y1="106" x2="196" y2="72" stroke="#2563EB" stroke-width="1.2"/>
<line x1="230" y1="72" x2="230" y2="106" stroke="#2563EB" stroke-width="1.2"/>
<line x1="70" y1="90" x2="92.25" y2="90.0" stroke="#008751" stroke-width="1.2"/><polygon points="100.0,90.0 92.2,92.9 92.2,87.1" fill="#008751"/>
<text x="174" y="268" font-family="DejaVu Sans" font-size="7.9" fill="#0E1F40" text-anchor="middle" font-weight="normal">Same current everywhere: I = 12 V / 6 Ω = 2 A</text>
<text x="174" y="284" font-family="DejaVu Sans" font-size="7.9" fill="#0E1F40" text-anchor="middle" font-weight="normal">R = R₁ + R₂ = 6 Ω; the p.d.s add to the supply.</text>
<text x="174" y="300" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">The ammeter is in series; the voltmeter is across.</text>
<rect x="346" y="34" width="320" height="280" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="506" y="52" font-family="DejaVu Sans" font-size="9.2" fill="#008751" text-anchor="middle" font-weight="bold">PARALLEL: TWO BRANCHES</text>
<line x1="384" y1="100" x2="626" y2="100" stroke="#334155" stroke-width="1.6"/>
<line x1="384" y1="198" x2="626" y2="198" stroke="#334155" stroke-width="1.6"/>
<line x1="384" y1="100" x2="384" y2="198" stroke="#334155" stroke-width="1.6"/>
<line x1="626" y1="100" x2="626" y2="198" stroke="#334155" stroke-width="1.6"/>
<line x1="384" y1="154" x2="384" y2="164" stroke="#334155" stroke-width="2.0"/>
<line x1="377" y1="164" x2="391" y2="164" stroke="#334155" stroke-width="2.0"/>
<line x1="380" y1="170" x2="388" y2="170" stroke="#334155" stroke-width="2.0"/>
<line x1="384" y1="138" x2="470" y2="138" stroke="#334155" stroke-width="1.6"/>
<rect x="470" y="130" width="34" height="16" rx="2" fill="#FFFFFF" stroke="#334155" stroke-width="1.4"/>
<text x="487.0" y="164" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">R₁ = 4 Ω</text>
<line x1="504" y1="138" x2="626" y2="138" stroke="#334155" stroke-width="1.6"/>
<line x1="384" y1="160" x2="470" y2="160" stroke="#334155" stroke-width="1.6"/>
<rect x="470" y="152" width="34" height="16" rx="2" fill="#FFFFFF" stroke="#334155" stroke-width="1.4"/>
<text x="487.0" y="186" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">R₂ = 4 Ω</text>
<line x1="504" y1="160" x2="626" y2="160" stroke="#334155" stroke-width="1.6"/>
<circle cx="505" cy="226" r="11" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
<text x="505" y="230" font-family="DejaVu Sans" font-size="9.2" fill="#2563EB" text-anchor="middle" font-weight="bold">V</text>
<line x1="384" y1="198" x2="384" y2="226" stroke="#2563EB" stroke-width="1.2"/>
<line x1="384" y1="226" x2="494" y2="226" stroke="#2563EB" stroke-width="1.2"/>
<line x1="516" y1="226" x2="626" y2="226" stroke="#2563EB" stroke-width="1.2"/>
<line x1="626" y1="226" x2="626" y2="198" stroke="#2563EB" stroke-width="1.2"/>
<text x="506" y="268" font-family="DejaVu Sans" font-size="7.9" fill="#0E1F40" text-anchor="middle" font-weight="normal">Same p.d. across each branch: 12 V</text>
<text x="506" y="286" font-family="DejaVu Sans" font-size="7.9" fill="#0E1F40" text-anchor="middle" font-weight="normal">1/R = 1/4 + 1/4, so R = 2 Ω and I = 6 A total.</text>
<text x="506" y="304" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">Each branch carries 3 A; the currents add.</text>
</svg>
