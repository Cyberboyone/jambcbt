<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="300" fill="#FFFFFF"/>
<text x="340" y="20" font-family="DejaVu Sans" font-size="10.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">A CURRENT IN A MAGNETIC FIELD FEELS A FORCE: F = B I l</text>
<rect x="14" y="34" width="320" height="252" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="174" y="52" font-family="DejaVu Sans" font-size="9.0" fill="#008751" text-anchor="middle" font-weight="bold">THE MOTOR EFFECT</text>
<rect x="34" y="96" width="56" height="110" rx="4" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.3"/>
<text x="62" y="156" font-family="DejaVu Sans" font-size="17" fill="#DC2626" text-anchor="middle" font-weight="bold">N</text>
<rect x="254" y="96" width="56" height="110" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.3"/>
<text x="282" y="156" font-family="DejaVu Sans" font-size="17" fill="#2563EB" text-anchor="middle" font-weight="bold">S</text>
<line x1="94" y1="116" x2="242.56" y2="116.0" stroke="#94A3B8" stroke-width="1.0"/><polygon points="250.0,116.0 242.6,118.8 242.6,113.2" fill="#94A3B8"/>
<line x1="94" y1="140" x2="242.56" y2="140.0" stroke="#94A3B8" stroke-width="1.0"/><polygon points="250.0,140.0 242.6,142.8 242.6,137.2" fill="#94A3B8"/>
<line x1="94" y1="164" x2="242.56" y2="164.0" stroke="#94A3B8" stroke-width="1.0"/><polygon points="250.0,164.0 242.6,166.8 242.6,161.2" fill="#94A3B8"/>
<line x1="94" y1="188" x2="242.56" y2="188.0" stroke="#94A3B8" stroke-width="1.0"/><polygon points="250.0,188.0 242.6,190.8 242.6,185.2" fill="#94A3B8"/>
<text x="174" y="208" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="middle" font-weight="normal">field B, N to S</text>
<circle cx="174" cy="151" r="13" fill="#FFFFFF" stroke="#0E1F40" stroke-width="1.6"/>
<line x1="168" y1="145" x2="180" y2="157" stroke="#0E1F40" stroke-width="1.6"/>
<line x1="168" y1="157" x2="180" y2="145" stroke="#0E1F40" stroke-width="1.6"/>
<text x="194" y="177" font-family="DejaVu Sans" font-size="7.6" fill="#0E1F40" text-anchor="start" font-weight="normal">current into the page</text>
<line x1="174" y1="133" x2="174.0" y2="102.95" stroke="#008751" stroke-width="2.4"/><polygon points="174.0,89.0 179.2,103.0 168.8,103.0" fill="#008751"/>
<text x="174" y="79" font-family="DejaVu Sans" font-size="8.4" fill="#008751" text-anchor="middle" font-weight="bold">force</text>
<text x="174" y="236" font-family="DejaVu Sans" font-size="7.9" fill="#0E1F40" text-anchor="middle" font-weight="normal">Cross the two arrows and the third is the force;</text>
<text x="174" y="250" font-family="DejaVu Sans" font-size="7.9" fill="#0E1F40" text-anchor="middle" font-weight="normal">that is Fleming's left-hand rule, and it is</text>
<text x="174" y="264" font-family="DejaVu Sans" font-size="7.9" fill="#0E1F40" text-anchor="middle" font-weight="normal">what turns every electric motor.</text>
<rect x="346" y="34" width="320" height="252" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="506" y="52" font-family="DejaVu Sans" font-size="9.0" fill="#008751" text-anchor="middle" font-weight="bold">THE RULE AND THE FORMULA</text>
<rect x="360" y="70" width="292" height="46" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.9"/>
<text x="372" y="88" font-family="DejaVu Sans" font-size="8.2" fill="#0E1F40" text-anchor="start" font-weight="bold">The formula</text>
<text x="372" y="104" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="start" font-weight="normal">F = B I l sinθ, with θ between B and I</text>
<rect x="360" y="124" width="292" height="46" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.9"/>
<text x="372" y="142" font-family="DejaVu Sans" font-size="8.2" fill="#0E1F40" text-anchor="start" font-weight="bold">The unit of B</text>
<text x="372" y="158" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="start" font-weight="normal">the tesla: 1 T = 1 N per ampere per metre</text>
<rect x="360" y="178" width="292" height="46" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.9"/>
<text x="372" y="196" font-family="DejaVu Sans" font-size="8.2" fill="#0E1F40" text-anchor="start" font-weight="bold">Largest force</text>
<text x="372" y="212" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="start" font-weight="normal">when the wire is at right angles to B</text>
<text x="506" y="246" font-family="DejaVu Sans" font-size="8.0" fill="#64748B" text-anchor="middle" font-weight="normal">Reverse the current: the force reverses.</text>
<text x="506" y="262" font-family="DejaVu Sans" font-size="8.0" fill="#64748B" text-anchor="middle" font-weight="normal">Reverse the field: the force reverses too.</text>
</svg>
