<text x="222.5" y="198" font-family="DejaVu Sans" font-size="8.4" fill="#7C3AED" text-anchor="middle" font-weight="normal">one cycle takes the period T, so f = 1 / T</text>
<rect x="14" y="214" width="532" height="88" rx="7" fill="#ECFDF5" stroke="#008751" stroke-width="1.3"/>
<text x="280" y="236" font-family="DejaVu Sans" font-size="11.4" fill="#008751" text-anchor="middle" font-weight="bold">v = f λ      ·      f = 1 / T      ·      v = λ / T</text>
<text x="280" y="256" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">The speed is set by the medium; the frequency is set by the source.</text>
<text x="280" y="270" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">When a wave enters a new medium, f does not change — λ does.</text>
<text x="280" y="284" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">So a 500 Hz note is still 500 Hz in water, where it travels faster and is therefore longer.</text>
