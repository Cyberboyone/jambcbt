<text x="372" y="182.8" font-family="DejaVu Sans" font-size="7.6" fill="#EA580C" text-anchor="start" font-weight="normal">orange</text>
<line x1="268" y1="172" x2="350.86564469380966" y2="187.8525581153375" stroke="#16A34A" stroke-width="1.6"/><polygon points="360.0,189.6 350.2,191.3 351.5,184.4" fill="#16A34A"/>
