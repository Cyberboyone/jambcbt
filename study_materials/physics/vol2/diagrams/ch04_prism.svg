<text x="372" y="218.8" font-family="DejaVu Sans" font-size="7.6" fill="#7C3AED" text-anchor="start" font-weight="normal">violet</text>
<rect x="400" y="44" width="146" height="128" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.1"/>
<text x="473" y="62" font-family="DejaVu Sans" font-size="9" fill="#0E1F40" text-anchor="middle" font-weight="bold">Why it splits</text>
<text x="473" y="80" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">Violet slows most, so it</text>
<text x="473" y="94" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">bends most — the glass</text>
<text x="473" y="108" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">has a larger n for it.</text>
<text x="473" y="130" font-family="DejaVu Sans" font-size="8.2" fill="#008751" text-anchor="middle" font-weight="normal">Deviation d = i₁ + i₂ − A</text>
<text x="473" y="152" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">Dispersion needs a second</text>
<text x="473" y="166" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">prism to recombine.</text>
<rect x="14" y="228" width="532" height="32" rx="7" fill="#ECFDF5" stroke="#008751" stroke-width="1.1"/>
<text x="280" y="248" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="middle" font-weight="normal">A prism is not a lens: it deviates a ray without bringing it to a focus, and the deviation depends on the colour.</text>
