<text x="280" y="20" font-family="DejaVu Sans" font-size="10.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">THE PRISM: DEVIATION AT TWO SURFACES, AND THE SPLIT OF WHITE LIGHT</text>
<polygon points="150,200 300,200 218,74" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="225" y="216" font-family="DejaVu Sans" font-size="8.4" fill="#2563EB" text-anchor="middle" font-weight="normal">glass prism</text>
<line x1="70" y1="150" x2="166.04680662960754" y2="108.31931033054767" stroke="#008751" stroke-width="1.8"/><polygon points="176.0,104.0 167.7,112.0 164.4,104.6" fill="#008751"/>
<text x="96" y="116" font-family="DejaVu Sans" font-size="8.2" fill="#008751" text-anchor="middle" font-weight="normal">white light</text>
