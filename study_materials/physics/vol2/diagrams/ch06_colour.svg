  <rect x="0" y="0" width="560" height="264" fill="#FFFFFF"/>
<text x="280" y="20" font-family="DejaVu Sans" font-size="10.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">COLOUR: ADD LIGHT, SUBTRACT PIGMENT</text>
<text x="120" y="44" font-family="DejaVu Sans" font-size="9.2" fill="#008751" text-anchor="middle" font-weight="bold">Additive — light</text>
<circle cx="94" cy="112" r="42" fill="#DC2626" opacity="0.62"/>
<circle cx="146" cy="112" r="42" fill="#16A34A" opacity="0.62"/>
<circle cx="120" cy="152" r="42" fill="#2563EB" opacity="0.62"/>
<text x="120" y="214" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">R + G + B = white</text>
<text x="420" y="44" font-family="DejaVu Sans" font-size="9.2" fill="#D97706" text-anchor="middle" font-weight="bold">Subtractive — pigment</text>
<circle cx="394" cy="112" r="42" fill="#F59E0B" opacity="0.62"/>
<circle cx="446" cy="112" r="42" fill="#0891B2" opacity="0.62"/>
<circle cx="420" cy="152" r="42" fill="#DB2777" opacity="0.62"/>
<text x="420" y="214" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">C + M + Y = black</text>
<rect x="14" y="228" width="532" height="30" rx="7" fill="#ECFDF5" stroke="#008751" stroke-width="1.1"/>
<text x="280" y="247" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">A red object reflects red and absorbs the rest, so under green light it looks black. A filter transmits only its own colour.</text>
</svg>
