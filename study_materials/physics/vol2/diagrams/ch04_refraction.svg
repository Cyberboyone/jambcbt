<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 286" width="560" height="286">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="560" height="286" fill="#FFFFFF"/>
<text x="280" y="20" font-family="DejaVu Sans" font-size="10.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">REFRACTION: THE RAY BENDS BECAUSE THE SPEED CHANGES</text>
<rect x="14" y="32" width="258" height="116" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.0"/>
<rect x="14" y="148" width="258" height="86" rx="7" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/>
<text x="143" y="46" font-family="DejaVu Sans" font-size="8.6" fill="#64748B" text-anchor="middle" font-weight="normal">air</text>
<text x="143" y="228" font-family="DejaVu Sans" font-size="8.6" fill="#2563EB" text-anchor="middle" font-weight="normal">glass (denser, slower)</text>
<line x1="14" y1="148" x2="272" y2="148" stroke="#334155" stroke-width="1.6"/>
<line x1="130" y1="52" x2="130" y2="216" stroke="#64748B" stroke-width="1.0" stroke-dasharray="4 3"/>
<text x="136" y="60" font-family="DejaVu Sans" font-size="8" fill="#64748B" text-anchor="start" font-weight="normal">normal</text>
<line x1="70" y1="62" x2="123.79182968313872" y2="139.10162254583216" stroke="#008751" stroke-width="1.8"/><polygon points="130.0,148.0 120.5,141.4 127.1,136.8" fill="#008751"/>
<line x1="130" y1="148" x2="169.39851775132007" y2="199.38937097998271" stroke="#2563EB" stroke-width="1.8"/><polygon points="176.0,208.0 166.2,201.9 172.6,196.9" fill="#2563EB"/>
<text x="90" y="96" font-family="DejaVu Sans" font-size="9.4" fill="#008751" text-anchor="middle" font-weight="bold">i</text>
<text x="150" y="186" font-family="DejaVu Sans" font-size="9.4" fill="#2563EB" text-anchor="middle" font-weight="bold">r</text>
<rect x="286" y="32" width="258" height="236" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="415" y="52" font-family="DejaVu Sans" font-size="9.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">The two laws</text>
<text x="415" y="74" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="middle" font-weight="normal">1. The incident ray, the normal and the</text>
<text x="415" y="88" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="middle" font-weight="normal">refracted ray lie in one plane.</text>
<text x="415" y="112" font-family="DejaVu Sans" font-size="9.4" fill="#008751" text-anchor="middle" font-weight="bold">2. sin i / sin r = constant = n</text>
<text x="415" y="138" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">Snell's law. The constant is the</text>
<text x="415" y="152" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">refractive index of the second medium</text>
<text x="415" y="166" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">relative to the first.</text>
<line x1="300" y1="184" x2="530" y2="184" stroke="#CBD5E1" stroke-width="0.9"/>
<text x="415" y="202" font-family="DejaVu Sans" font-size="9.0" fill="#2563EB" text-anchor="middle" font-weight="bold">n = sin i / sin r = v₁ / v₂ = λ₁ / λ₂</text>
<text x="415" y="226" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">Into a denser medium: r &lt; i, the ray</text>
<text x="415" y="240" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">bends towards the normal and slows.</text>
<text x="415" y="260" font-family="DejaVu Sans" font-size="8.4" fill="#D97706" text-anchor="middle" font-weight="normal">Frequency is unchanged throughout.</text>
</svg>
