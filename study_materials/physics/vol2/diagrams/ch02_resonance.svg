<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="560" height="300" fill="#FFFFFF"/>
<text x="280" y="20" font-family="DejaVu Sans" font-size="10.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">THE RESONANCE TUBE — FINDING THE SPEED OF SOUND</text>
<rect x="96" y="52" width="44" height="196" rx="3" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
<rect x="96" y="168" width="44" height="80" rx="0" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.0"/>
<line x1="96" y1="168" x2="140" y2="168" stroke="#2563EB" stroke-width="1.6"/>
<text x="118.0" y="264" font-family="DejaVu Sans" font-size="8.2" fill="#2563EB" text-anchor="middle" font-weight="normal">water</text>
<path d="M 104 40 L 104 52 M 132 40 L 132 52" stroke="#334155" stroke-width="2"/>
<text x="118.0" y="34" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">tuning fork</text>
<line x1="140" y1="112" x2="168" y2="112" stroke="#008751" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="140" cy="112" r="2.6" fill="#008751"/>
<text x="174" y="116" font-family="DejaVu Sans" font-size="9.6" fill="#008751" text-anchor="start" font-weight="bold">l₁</text>
<line x1="140" y1="74" x2="168" y2="74" stroke="#D97706" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="140" cy="74" r="2.6" fill="#D97706"/>
<text x="174" y="78" font-family="DejaVu Sans" font-size="9.6" fill="#D97706" text-anchor="start" font-weight="bold">l₂</text>
<line x1="140" y1="74" x2="140" y2="112" stroke="#64748B" stroke-width="1.0"/>
<text x="144" y="96" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="start" font-weight="normal">λ/2</text>
<rect x="214" y="50" width="332" height="92" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<text x="380" y="70" font-family="DejaVu Sans" font-size="12.4" fill="#008751" text-anchor="middle" font-weight="bold">λ = 2 (l₂ − l₁)</text>
<text x="380" y="90" font-family="DejaVu Sans" font-size="10" fill="#334155" text-anchor="middle" font-weight="normal">v = f λ</text>
<text x="380" y="110" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="middle" font-weight="normal">The half-wavelength difference cancels</text>
<text x="380" y="124" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="middle" font-weight="normal">the unknown end correction.</text>
<rect x="214" y="152" width="332" height="96" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.1"/>
<text x="380" y="170" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">Resonance happens when the air column is exactly</text>
<text x="380" y="184" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">the right length to fit a node at the water and an</text>
<text x="380" y="198" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">antinode at the open end — that is why the note</text>
<text x="380" y="212" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">suddenly becomes loud as the tube is raised.</text>
<text x="380" y="232" font-family="DejaVu Sans" font-size="8.6" fill="#008751" text-anchor="middle" font-weight="normal">f₁ = v / 4L, and only odd harmonics sound.</text>
</svg>
