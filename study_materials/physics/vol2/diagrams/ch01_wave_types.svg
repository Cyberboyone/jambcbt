<text x="280" y="175" font-family="DejaVu Sans" font-size="9" fill="#0E1F40" text-anchor="middle" font-weight="bold">WHAT THE UTME ASKS YOU TO NAME</text>
<text x="150" y="194" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">Transverse</text>
<text x="150" y="208" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">light, water waves,</text>
<text x="150" y="222" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">waves on a string,</text>
<text x="150" y="236" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">all electromagnetic waves</text>
<text x="300" y="194" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">Longitudinal</text>
<text x="300" y="208" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">sound in air,</text>
<text x="300" y="222" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">compressions in a spring,</text>
<text x="300" y="236" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">seismic P waves</text>
<text x="445" y="194" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">Both</text>
<text x="445" y="208" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">surface water waves are</text>
<text x="445" y="222" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">a mixture: the particles</text>
<text x="445" y="236" font-family="DejaVu Sans" font-size="9.2" fill="#334155" text-anchor="middle" font-weight="normal">move in circles</text>
