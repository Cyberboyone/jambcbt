<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 310" width="660" height="310">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="660" height="310" fill="#FFFFFF"/>
<text x="330" y="20" font-family="DejaVu Sans" font-size="10.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">THE TWO SCALES AND THE TWO FIXED POINTS</text>
<rect x="108" y="44" width="24" height="214" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
<rect x="114" y="58" width="12" height="192" rx="6" fill="#FEE2E2" stroke="none" stroke-width="0"/>
<rect x="114" y="140" width="12" height="104" rx="6" fill="#DC2626" stroke="none" stroke-width="0"/>
<circle cx="120" cy="266" r="13" fill="#DC2626"/>
<line x1="94" y1="140" x2="160" y2="140" stroke="#0E1F40" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="168" y="139" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">100 °C  /  373 K</text>
<text x="168" y="153" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="start" font-weight="normal">upper fixed point — steam</text>
<line x1="94" y1="244" x2="160" y2="244" stroke="#0E1F40" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="168" y="243" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="start" font-weight="bold">0 °C  /  273 K</text>
<text x="168" y="257" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="start" font-weight="normal">lower fixed point — melting ice</text>
<line x1="74" y1="144" x2="74.0" y2="225.6" stroke="#008751" stroke-width="1.6"/><polygon points="74.0,238.0 69.4,225.6 78.6,225.6" fill="#008751"/>
<text x="34" y="147.0" font-family="DejaVu Sans" font-size="8.4" fill="#008751" text-anchor="middle" font-weight="bold">100 equal</text>
<text x="34" y="161.0" font-family="DejaVu Sans" font-size="8.4" fill="#008751" text-anchor="middle" font-weight="bold">divisions</text>
<text x="34" y="175.0" font-family="DejaVu Sans" font-size="8.4" fill="#008751" text-anchor="middle" font-weight="bold">= 100 kelvin</text>
<rect x="306" y="44" width="340" height="104" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<text x="476" y="64" font-family="DejaVu Sans" font-size="9.2" fill="#008751" text-anchor="middle" font-weight="bold">ONE INTERVAL, TWO SCALES</text>
<text x="476" y="86" font-family="DejaVu Sans" font-size="13" fill="#0E1F40" text-anchor="middle" font-weight="bold">θ / °C  +  273  =  T / K</text>
<text x="476" y="106" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="middle" font-weight="normal">A change of 1 °C is a change of 1 K.</text>
<text x="476" y="122" font-family="DejaVu Sans" font-size="8.6" fill="#334155" text-anchor="middle" font-weight="normal">20 °C = 293 K    ·    −40 °C = 233 K</text>
<text x="476" y="140" font-family="DejaVu Sans" font-size="8.6" fill="#DC2626" text-anchor="middle" font-weight="bold">Absolute zero: −273 °C = 0 K</text>
<rect x="306" y="160" width="340" height="128" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="476" y="180" font-family="DejaVu Sans" font-size="9.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">A SCALE NEEDS THREE THINGS</text>
<circle cx="328" cy="198" r="2.6" fill="#008751"/>
<text x="338" y="202" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">a thermometric property that changes steadily</text>
<circle cx="328" cy="222" r="2.6" fill="#008751"/>
<text x="338" y="226" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">two fixed points, and</text>
<circle cx="328" cy="246" r="2.6" fill="#008751"/>
<text x="338" y="250" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">a rule for dividing the interval</text>
<text x="476" y="274" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="middle" font-weight="normal">Celsius divides ice-to-steam into 100.</text>
<text x="120" y="296" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">liquid-in-glass thermometer</text>
</svg>
