    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="286" fill="#FFFFFF"/>
<text x="320" y="20" font-family="DejaVu Sans" font-size="10.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">THE BIMETALLIC STRIP: TWO METALS, ONE BEND</text>
<rect x="20" y="34" width="290" height="108" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<text x="165" y="54" font-family="DejaVu Sans" font-size="9.0" fill="#64748B" text-anchor="middle" font-weight="bold">cold — straight</text>
<rect x="45" y="72" width="240" height="15" rx="3" fill="#FCA5A5" stroke="#DC2626" stroke-width="1.1"/>
<rect x="45" y="87" width="240" height="15" rx="3" fill="#BFDBFE" stroke="#2563EB" stroke-width="1.1"/>
<text x="165" y="122" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">brass on top, iron below</text>
<rect x="330" y="34" width="290" height="108" rx="7" fill="#FFFFFF" stroke="#D97706" stroke-width="1.3"/>
<text x="475" y="54" font-family="DejaVu Sans" font-size="9.0" fill="#D97706" text-anchor="middle" font-weight="bold">hot — it bends</text>
<path d="M 360,118.0 L 364,118.0 L 368,117.9 L 372,117.8 L 376,117.7 L 380,117.6 L 384,117.4 L 388,117.2 L 392,116.9 L 396,116.6 L 400,116.3 L 404,116.0 L 408,115.6 L 412,115.2 L 416,114.7 L 420,114.2 L 424,113.7 L 428,113.1 L 432,112.6 L 436,111.9 L 440,111.3 L 444,110.6 L 448,109.9 L 452,109.1 L 456,108.3 L 460,107.5 L 464,106.6 L 468,105.8 L 472,104.8 L 476,103.9 L 480,102.9 L 484,101.9 L 488,100.8 L 492,99.7 L 496,98.6 L 500,97.4 L 504,96.2 L 508,95.0 L 512,93.7 L 516,92.4 L 520,91.1 L 524,89.8 L 528,88.4 L 532,86.9 L 536,85.5 L 540,84.0 L 544,82.5 L 548,80.9 L 552,79.3 L 556,77.7 L 560,76.0 L 564,74.3 L 568,72.6 L 572,70.8 L 576,69.0 L 580,67.2" fill="none" stroke="#DC2626" stroke-width="6.5" stroke-linecap="round"/>
<path d="M 360,131.0 L 364,131.0 L 368,130.9 L 372,130.8 L 376,130.7 L 380,130.6 L 384,130.4 L 388,130.2 L 392,129.9 L 396,129.6 L 400,129.3 L 404,129.0 L 408,128.6 L 412,128.2 L 416,127.7 L 420,127.2 L 424,126.7 L 428,126.1 L 432,125.6 L 436,124.9 L 440,124.3 L 444,123.6 L 448,122.9 L 452,122.1 L 456,121.3 L 460,120.5 L 464,119.6 L 468,118.8 L 472,117.8 L 476,116.9 L 480,115.9 L 484,114.9 L 488,113.8 L 492,112.7 L 496,111.6 L 500,110.4 L 504,109.2 L 508,108.0 L 512,106.7 L 516,105.4 L 520,104.1 L 524,102.8 L 528,101.4 L 532,99.9 L 536,98.5 L 540,97.0 L 544,95.5 L 548,93.9 L 552,92.3 L 556,90.7 L 560,89.0 L 564,87.3 L 568,85.6 L 572,83.8 L 576,82.0 L 580,80.2" fill="none" stroke="#2563EB" stroke-width="6.5" stroke-linecap="round"/>
<line x1="596" y1="96" x2="596.0" y2="74.85" stroke="#0E1F40" stroke-width="1.3"/><polygon points="596.0,64.0 600.1,74.8 591.9,74.8" fill="#0E1F40"/>
<text x="475" y="134" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">towards the metal that expands less (iron)</text>
<rect x="20" y="154" width="290" height="118" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="165" y="174" font-family="DejaVu Sans" font-size="9.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">WHY IT BENDS</text>
<text x="34" y="194" font-family="DejaVu Sans" font-size="8.3" fill="#334155" text-anchor="start" font-weight="normal">brass expands about twice as much as iron</text>
<text x="34" y="212" font-family="DejaVu Sans" font-size="8.3" fill="#334155" text-anchor="start" font-weight="normal">for the same rise in temperature, so the</text>
<text x="34" y="230" font-family="DejaVu Sans" font-size="8.3" fill="#334155" text-anchor="start" font-weight="normal">brass side becomes longer — and the only</text>
<text x="34" y="248" font-family="DejaVu Sans" font-size="8.3" fill="#334155" text-anchor="start" font-weight="normal">way to be longer is to curve round the iron</text>
<rect x="330" y="154" width="290" height="118" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="475" y="174" font-family="DejaVu Sans" font-size="9.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">WHAT IT IS FOR</text>
<text x="344" y="194" font-family="DejaVu Sans" font-size="8.3" fill="#334155" text-anchor="start" font-weight="normal">• a thermostat that switches a heater</text>
<text x="344" y="212" font-family="DejaVu Sans" font-size="8.3" fill="#334155" text-anchor="start" font-weight="normal">• a fire alarm that rings itself</text>
<text x="344" y="230" font-family="DejaVu Sans" font-size="8.3" fill="#334155" text-anchor="start" font-weight="normal">• a strip that compensates a watch</text>
<text x="344" y="248" font-family="DejaVu Sans" font-size="8.3" fill="#334155" text-anchor="start" font-weight="normal">• a thermometer with a pointer arm</text>
</svg>
