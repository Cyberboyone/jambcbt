<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="660" height="300" fill="#FFFFFF"/>
<text x="330" y="20" font-family="DejaVu Sans" font-size="10.2" fill="#0E1F40" text-anchor="middle" font-weight="bold">ONE RULE, THREE SHAPES — AND THE COEFFICIENTS THAT GO WITH THEM</text>
<rect x="16" y="34" width="200" height="250" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<text x="116" y="54" font-family="DejaVu Sans" font-size="9.6" fill="#008751" text-anchor="middle" font-weight="bold">Linear   α</text>
<rect x="36" y="92" width="160" height="14" rx="3" fill="#FDE68A" stroke="#D97706" stroke-width="1.1"/>
<rect x="36" y="112" width="176" height="14" rx="3" fill="#FDE68A" stroke="#D97706" stroke-width="1.1"/>
<line x1="36" y1="86" x2="36" y2="132" stroke="#64748B" stroke-width="1.0" stroke-dasharray="3 2"/>
<line x1="212" y1="86" x2="212" y2="132" stroke="#64748B" stroke-width="1.0" stroke-dasharray="3 2"/>
<text x="116" y="190" font-family="DejaVu Sans" font-size="9.4" fill="#0E1F40" text-anchor="middle" font-weight="normal">L = L₀(1 + αΔθ)</text>
<text x="116" y="208" font-family="DejaVu Sans" font-size="8.3" fill="#334155" text-anchor="middle" font-weight="normal">a rod grows in length</text>
<text x="116" y="234" font-family="DejaVu Sans" font-size="8.1" fill="#64748B" text-anchor="middle" font-weight="normal">steel: 1.2 × 10⁻⁵ K⁻¹</text>
<text x="116" y="250" font-family="DejaVu Sans" font-size="8.1" fill="#64748B" text-anchor="middle" font-weight="normal">rails, bridges, a sagging wire</text>
<rect x="230" y="34" width="200" height="250" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
<text x="330" y="54" font-family="DejaVu Sans" font-size="9.6" fill="#2563EB" text-anchor="middle" font-weight="bold">Area   2α</text>
<rect x="276" y="96" width="96" height="74" rx="3" fill="#BFDBFE" stroke="#2563EB" stroke-width="1.1"/>
<rect x="268" y="88" width="112" height="90" rx="3" fill="none" stroke="#2563EB" stroke-width="1.1" stroke-dasharray="4 3"/>
<text x="330" y="190" font-family="DejaVu Sans" font-size="9.4" fill="#0E1F40" text-anchor="middle" font-weight="normal">A = A₀(1 + 2αΔθ)</text>
<text x="330" y="208" font-family="DejaVu Sans" font-size="8.3" fill="#334155" text-anchor="middle" font-weight="normal">a plate grows both ways</text>
<text x="330" y="234" font-family="DejaVu Sans" font-size="8.1" fill="#64748B" text-anchor="middle" font-weight="normal">the coefficient is twice α</text>
<text x="330" y="250" font-family="DejaVu Sans" font-size="8.1" fill="#64748B" text-anchor="middle" font-weight="normal">a hole in the plate grows too</text>
<rect x="444" y="34" width="200" height="250" rx="7" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/>
<text x="544" y="54" font-family="DejaVu Sans" font-size="9.6" fill="#7C3AED" text-anchor="middle" font-weight="bold">Volume   3α</text>
<rect x="500" y="94" width="78" height="74" rx="3" fill="#DDD6FE" stroke="#7C3AED" stroke-width="1.1"/>
<rect x="494" y="88" width="90" height="86" rx="3" fill="none" stroke="#7C3AED" stroke-width="1.1" stroke-dasharray="4 3"/>
<text x="544" y="190" font-family="DejaVu Sans" font-size="9.4" fill="#0E1F40" text-anchor="middle" font-weight="normal">V = V₀(1 + 3αΔθ)</text>
<text x="544" y="208" font-family="DejaVu Sans" font-size="8.3" fill="#334155" text-anchor="middle" font-weight="normal">a cube grows all three ways</text>
<text x="544" y="234" font-family="DejaVu Sans" font-size="8.1" fill="#64748B" text-anchor="middle" font-weight="normal">liquids and gases use γ, not 3α</text>
<text x="544" y="250" font-family="DejaVu Sans" font-size="8.1" fill="#64748B" text-anchor="middle" font-weight="normal">a flask can hold less when hot</text>
</svg>
