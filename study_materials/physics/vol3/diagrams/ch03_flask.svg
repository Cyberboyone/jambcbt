<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="320" fill="#FFFFFF"/>
<text x="320" y="20" font-family="DejaVu Sans" font-size="10.4" fill="#0E1F40" text-anchor="middle" font-weight="bold">THE VACUUM FLASK BLOCKS ALL THREE ROUTES AT ONCE</text>
<path d="M 190 44 L 190 100 L 170 132 L 170 230 Q 170 240 180 240 L 300 240 Q 310 240 310 230 L 310 132 L 290 100 L 290 44 Z" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
<path d="M 202 52 L 202 104 L 184 134 L 184 224 L 296 224 L 296 134 L 278 104 L 278 52 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<rect x="198" y="40" width="84" height="10" rx="3" fill="#94A3B8" stroke="#334155" stroke-width="1.0"/>
<text x="240" y="32" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">stopper</text>
<text x="240" y="130" font-family="DejaVu Sans" font-size="8.6" fill="#DC2626" text-anchor="middle" font-weight="bold">hot or cold drink</text>
<text x="240" y="170" font-family="DejaVu Sans" font-size="9.4" fill="#64748B" text-anchor="middle" font-weight="bold">vacuum</text>
<text x="240" y="186" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="middle" font-weight="normal">nothing to conduct</text>
<text x="240" y="199" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="middle" font-weight="normal">or carry a current</text>
<text x="240" y="218" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">silvered walls</text>
<rect x="348" y="44" width="276" height="62" rx="6" fill="#FFFFFF" stroke="#008751" stroke-width="1.2"/>
<text x="486" y="64" font-family="DejaVu Sans" font-size="9.0" fill="#008751" text-anchor="middle" font-weight="bold">1  CONDUCTION</text>
<text x="486" y="82" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">glass is a poor conductor, and the</text>
<text x="486" y="96" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">stopper is cork or plastic</text>
<rect x="348" y="118" width="276" height="62" rx="6" fill="#FFFFFF" stroke="#008751" stroke-width="1.2"/>
<text x="486" y="138" font-family="DejaVu Sans" font-size="9.0" fill="#008751" text-anchor="middle" font-weight="bold">2  CONVECTION</text>
<text x="486" y="156" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">the vacuum has nothing to</text>
<text x="486" y="170" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">carry a convection current</text>
<rect x="348" y="192" width="276" height="62" rx="6" fill="#FFFFFF" stroke="#008751" stroke-width="1.2"/>
<text x="486" y="212" font-family="DejaVu Sans" font-size="9.0" fill="#008751" text-anchor="middle" font-weight="bold">3  RADIATION</text>
<text x="486" y="230" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">the silvered walls reflect heat</text>
<text x="486" y="244" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">straight back where it came from</text>
<text x="320" y="268" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">The same vacuum keeps a hot drink hot and an ice cube solid — it slows the flow of heat in whichever direction that flow is going.</text>
<text x="320" y="292" font-family="DejaVu Sans" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="normal">Only the stopper and the neck still leak heat, which is why a full flask holds its temperature longer than an almost empty one.</text>
</svg>
