<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="660" height="300" fill="#FFFFFF"/>
<text x="330" y="20" font-family="DejaVu Sans" font-size="10.2" fill="#0E1F40" text-anchor="middle" font-weight="bold">CONVECTION NEEDS A FLUID THAT CAN MOVE — AND GRAVITY TO MOVE IT</text>
<rect x="16" y="34" width="300" height="254" rx="7" fill="#FFFFFF" stroke="#008751" stroke-width="1.3"/>
<text x="166" y="52" font-family="DejaVu Sans" font-size="9.2" fill="#008751" text-anchor="middle" font-weight="bold">a convection current</text>
<path d="M 66 74 L 66 210 Q 66 222 78 222 L 224 222 Q 236 222 236 210 L 236 74" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
<rect x="76" y="190" width="150" height="28" rx="4" fill="#FCA5A5" stroke="#DC2626" stroke-width="1.0"/>
<text x="150" y="209" font-family="DejaVu Sans" font-size="8.0" fill="#DC2626" text-anchor="middle" font-weight="normal">heat</text>
<line x1="96" y1="182" x2="96.0" y2="112.4" stroke="#DC2626" stroke-width="1.8"/><polygon points="96.0,100.0 100.6,112.4 91.4,112.4" fill="#DC2626"/>
<line x1="206" y1="100" x2="206.0" y2="169.6" stroke="#2563EB" stroke-width="1.8"/><polygon points="206.0,182.0 201.4,169.6 210.6,169.6" fill="#2563EB"/>
<text x="96" y="90" font-family="DejaVu Sans" font-size="7.8" fill="#DC2626" text-anchor="middle" font-weight="bold">warm: rises</text>
<text x="206" y="90" font-family="DejaVu Sans" font-size="7.8" fill="#2563EB" text-anchor="middle" font-weight="bold">cool: sinks</text>
<text x="166" y="250" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">Heat the bottom, not the top —</text>
<text x="166" y="266" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">a current cannot start above the flame.</text>
<rect x="330" y="34" width="314" height="254" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
<text x="487" y="52" font-family="DejaVu Sans" font-size="9.2" fill="#2563EB" text-anchor="middle" font-weight="bold">the sea breeze</text>
<rect x="348" y="86" width="150" height="74" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.0"/>
<rect x="498" y="86" width="128" height="74" rx="4" fill="#FDE68A" stroke="#D97706" stroke-width="1.0"/>
<text x="423" y="126" font-family="DejaVu Sans" font-size="8.6" fill="#2563EB" text-anchor="middle" font-weight="bold">SEA</text>
<text x="562" y="126" font-family="DejaVu Sans" font-size="8.6" fill="#D97706" text-anchor="middle" font-weight="bold">LAND</text>
<text x="423" y="144" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">cool, slow to warm</text>
<text x="562" y="144" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">hot by midday</text>
<line x1="586" y1="84" x2="586.0" y2="68.85" stroke="#DC2626" stroke-width="1.6"/><polygon points="586.0,58.0 590.1,68.8 581.9,68.8" fill="#DC2626"/>
<text x="586" y="50" font-family="DejaVu Sans" font-size="7.6" fill="#DC2626" text-anchor="middle" font-weight="normal">air rises</text>
<line x1="500" y1="74" x2="364.4" y2="74.0" stroke="#008751" stroke-width="1.8"/><polygon points="352.0,74.0 364.4,69.4 364.4,78.6" fill="#008751"/>
<text x="426" y="64" font-family="DejaVu Sans" font-size="7.6" fill="#008751" text-anchor="middle" font-weight="normal">cool air flows in</text>
<text x="487" y="186" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">By day the land is hotter than the sea, so the air</text>
<text x="487" y="201" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">above it rises and cooler air flows in from the sea.</text>
<text x="487" y="226" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">At night the land cools faster and the current reverses:</text>
<text x="487" y="241" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">the land breeze. The same physics as a radiator</text>
<text x="487" y="256" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">under a window, and as the monsoon.</text>
</svg>
