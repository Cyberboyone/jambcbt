<rect x="271" y="92" width="6" height="52" rx="2" fill="#DC2626" stroke="#DC2626" stroke-width="1.0"/>
<text x="149.0" y="222" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">N molecules, each of mass m,</text>
<text x="149.0" y="236" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">in a box of volume V</text>
<line x1="292" y1="80" x2="277.3" y2="80.0" stroke="#DC2626" stroke-width="1.4"/><polygon points="268.0,80.0 277.3,76.5 277.3,83.5" fill="#DC2626"/>
<rect x="300" y="38" width="336" height="168" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="468" y="58" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="middle" font-weight="bold">THE ONE-LINE DERIVATION</text>
<text x="312" y="78" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">each collision changes</text>
<text x="624" y="78" font-family="DejaVu Sans" font-size="8.6" fill="#008751" text-anchor="end" font-weight="bold">2 m v</text>
<text x="312" y="96" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">momentum by</text>
<text x="312" y="114" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">collisions per second</text>
<text x="624" y="114" font-family="DejaVu Sans" font-size="8.6" fill="#008751" text-anchor="end" font-weight="bold">N m v² / 3 L</text>
<text x="312" y="132" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">on one wall</text>
<text x="312" y="150" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">force on the wall</text>
<text x="624" y="150" font-family="DejaVu Sans" font-size="8.6" fill="#008751" text-anchor="end" font-weight="bold">N m v² / 3 L</text>
<text x="312" y="168" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">pressure = force / area</text>
<text x="624" y="168" font-family="DejaVu Sans" font-size="8.6" fill="#008751" text-anchor="end" font-weight="bold">N m v² / 3 V</text>
<line x1="312" y1="186" x2="624" y2="186" stroke="#CBD5E1" stroke-width="1.0"/>
<text x="468" y="200" font-family="DejaVu Sans" font-size="10.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">p V  =  ⅓ N m c²</text>
<text x="330" y="254" font-family="DejaVu Sans" font-size="8.5" fill="#0E1F40" text-anchor="middle" font-weight="normal">Temperature is the average kinetic energy of the molecules.</text>
<text x="330" y="272" font-family="DejaVu Sans" font-size="8.5" fill="#334155" text-anchor="middle" font-weight="normal">½ m c²  =  3/2 k T, so doubling the kelvin temperature makes the molecules √2 times faster.</text>
<text x="330" y="306" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="middle" font-weight="normal">This is why a gas pressure rises with temperature even when the volume is fixed.</text>
</svg>
