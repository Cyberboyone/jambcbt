<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="660" height="300" fill="#FFFFFF"/>
<text x="330" y="20" font-family="DejaVu Sans" font-size="10.2" fill="#0E1F40" text-anchor="middle" font-weight="bold">THE METHOD OF MIXTURES: LOST BY THE HOT, GAINED BY THE COLD</text>
<rect x="30" y="52" width="250" height="172" rx="8" fill="#F8FAFC" stroke="#334155" stroke-width="1.6"/>
<rect x="30" y="52" width="250" height="18" rx="6" fill="#E2E8F0" stroke="#334155" stroke-width="1.0"/>
<rect x="48" y="84" width="214" height="120" rx="4" fill="#BFDBFE" stroke="#2563EB" stroke-width="1.2"/>
<text x="155" y="112" font-family="DejaVu Sans" font-size="9.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">water</text>
<text x="155" y="130" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">mass m_w,  specific heat c_w</text>
<text x="155" y="146" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="middle" font-weight="normal">initial temperature θ₁</text>
<text x="155" y="178" font-family="DejaVu Sans" font-size="7.4" fill="#64748B" text-anchor="middle" font-weight="normal">the calorimeter itself has</text>
<text x="155" y="192" font-family="DejaVu Sans" font-size="7.4" fill="#64748B" text-anchor="middle" font-weight="normal">a heat capacity C</text>
<line x1="92" y1="34" x2="92" y2="88" stroke="#DC2626" stroke-width="1.4"/>
<circle cx="92" cy="92" r="4" fill="#DC2626"/>
<text x="92" y="28" font-family="DejaVu Sans" font-size="7.4" fill="#DC2626" text-anchor="middle" font-weight="normal">thermometer</text>
<line x1="214" y1="38" x2="214" y2="92" stroke="#64748B" stroke-width="1.2"/>
<text x="238" y="34" font-family="DejaVu Sans" font-size="7.4" fill="#64748B" text-anchor="middle" font-weight="normal">stirrer</text>
<rect x="320" y="46" width="320" height="62" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.3"/>
<text x="480" y="66" font-family="DejaVu Sans" font-size="9.0" fill="#DC2626" text-anchor="middle" font-weight="bold">THE HOT SOLID</text>
<text x="480" y="84" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">mass m, specific heat c, temperature θ₂</text>
<text x="480" y="99" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="middle" font-weight="normal">dropped in, and the mixture settles at θ</text>
<rect x="320" y="118" width="320" height="74" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="480" y="138" font-family="DejaVu Sans" font-size="8.8" fill="#0E1F40" text-anchor="middle" font-weight="bold">heat lost = heat gained</text>
<text x="480" y="162" font-family="DejaVu Sans" font-size="10.2" fill="#008751" text-anchor="middle" font-weight="bold">m c (θ₂ − θ) = (m_w c_w + C)(θ − θ₁)</text>
<text x="480" y="180" font-family="DejaVu Sans" font-size="7.4" fill="#64748B" text-anchor="middle" font-weight="normal">if C is ignored, the answer for c comes out too high.</text>
<text x="330" y="240" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="normal">Every mixture question is this one sentence: what the hot body lost, the cold body and the calorimeter gained.</text>
<text x="330" y="262" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="middle" font-weight="normal">The insulation is not decoration — it is what makes the two sides equal.</text>
<text x="330" y="284" font-family="DejaVu Sans" font-size="8.2" fill="#64748B" text-anchor="middle" font-weight="normal">Weigh the water, read the two starting temperatures, stir, and read the highest steady temperature.</text>
</svg>
