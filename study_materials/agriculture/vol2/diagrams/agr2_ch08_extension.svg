<text x="150" y="151" font-family="DejaVu Sans" font-size="7.2" fill="#334155" text-anchor="start" font-weight="normal">the early adopter the village trusts</text>
<text x="40" y="163" font-family="DejaVu Sans" font-size="7.0" fill="#334155" text-anchor="middle" font-weight="normal"></text>
<rect x="26" y="170" width="332" height="30" rx="5" fill="#FFFFFF" stroke="#008751" stroke-width="1.0"/>
<text x="40" y="183" font-family="DejaVu Sans" font-size="8.4" fill="#0E1F40" text-anchor="start" font-weight="bold">Farmer groups</text>
