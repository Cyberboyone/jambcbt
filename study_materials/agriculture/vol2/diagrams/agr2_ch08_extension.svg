<text x="412" y="134" font-family="DejaVu Sans" font-size="7.2" fill="#334155" text-anchor="start" font-weight="normal">meeting, demonstration, field day</text>
<rect x="398" y="142" width="336" height="32" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.0"/>
<text x="412" y="156" font-family="DejaVu Sans" font-size="8.4" fill="#0E1F40" text-anchor="start" font-weight="bold">Mass</text>
<text x="412" y="168" font-family="DejaVu Sans" font-size="7.2" fill="#334155" text-anchor="start" font-weight="normal">radio, television, poster, leaflet</text>
<rect x="398" y="176" width="336" height="32" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.0"/>
<text x="412" y="190" font-family="DejaVu Sans" font-size="8.4" fill="#0E1F40" text-anchor="start" font-weight="bold">Result demonstration</text>
<text x="412" y="202" font-family="DejaVu Sans" font-size="7.2" fill="#334155" text-anchor="start" font-weight="normal">the plot the farmer can see</text>
<rect x="398" y="210" width="336" height="32" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.0"/>
<text x="412" y="224" font-family="DejaVu Sans" font-size="8.4" fill="#0E1F40" text-anchor="start" font-weight="bold">Method demonstration</text>
<text x="412" y="236" font-family="DejaVu Sans" font-size="7.2" fill="#334155" text-anchor="start" font-weight="normal">the skill the farmer can copy</text>
<rect x="12" y="254" width="736" height="76" rx="7" fill="#ECFDF5" stroke="#008751" stroke-width="1.2"/>
<text x="380" y="274" font-family="DejaVu Sans" font-size="8.6" fill="#008751" text-anchor="middle" font-weight="bold">THE POLICY LADDER — FROM THE FARM TO THE MINISTRY</text>
<text x="380" y="292" font-family="DejaVu Sans" font-size="8.2" fill="#0E1F40" text-anchor="middle" font-weight="normal">credit · subsidy · guaranteed price · extension · research · storage · insurance · market</text>
<text x="380" y="310" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="middle" font-weight="normal">every policy in the syllabus is one rung of this ladder, and every one is judged by whether the farmer climbs</text>
</svg>
