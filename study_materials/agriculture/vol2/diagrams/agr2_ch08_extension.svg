<text x="40" y="195" font-family="DejaVu Sans" font-size="7.0" fill="#334155" text-anchor="middle" font-weight="normal"></text>
<rect x="26" y="202" width="332" height="30" rx="5" fill="#ECFDF5" stroke="#008751" stroke-width="1.0"/>
