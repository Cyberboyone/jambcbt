<text x="412" y="88" font-family="DejaVu Sans" font-size="8.4" fill="#0E1F40" text-anchor="start" font-weight="bold">Individual</text>
<text x="412" y="100" font-family="DejaVu Sans" font-size="7.2" fill="#334155" text-anchor="start" font-weight="normal">farm visit, office call, phone</text>
<rect x="398" y="108" width="336" height="32" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.0"/>
