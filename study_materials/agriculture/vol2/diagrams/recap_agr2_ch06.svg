  <rect x="0" y="0" width="760" height="202" fill="#ECFDF5"/>
<text x="380" y="20" font-family="DejaVu Sans" font-size="11.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">Chapter 6 — fisheries and forestry</text>
<rect x="12" y="34" width="736" height="34" rx="6" fill="#FFFFFF" stroke="#008751" stroke-width="1.1"/>
<text x="28" y="49" font-family="DejaVu Sans" font-size="8.8" fill="#008751" text-anchor="start" font-weight="bold">Fish</text>
<text x="28" y="62" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="start" font-weight="normal">catfish and tilapia; a pond that holds water, drains and is limed</text>
<rect x="12" y="74" width="736" height="34" rx="6" fill="#FFFFFF" stroke="#008751" stroke-width="1.1"/>
<text x="28" y="89" font-family="DejaVu Sans" font-size="8.8" fill="#008751" text-anchor="start" font-weight="bold">Stocking</text>
<text x="28" y="102" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="start" font-weight="normal">5–10 fingerlings per m²; feed 3 per cent of body weight a day</text>
<rect x="12" y="114" width="736" height="34" rx="6" fill="#FFFFFF" stroke="#008751" stroke-width="1.1"/>
<text x="28" y="129" font-family="DejaVu Sans" font-size="8.8" fill="#008751" text-anchor="start" font-weight="bold">Forest</text>
<text x="28" y="142" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="start" font-weight="normal">reserve, plantation and community forest; timber, fuel, water and carbon</text>
<rect x="12" y="154" width="736" height="34" rx="6" fill="#FFFFFF" stroke="#008751" stroke-width="1.1"/>
<text x="28" y="169" font-family="DejaVu Sans" font-size="8.8" fill="#008751" text-anchor="start" font-weight="bold">Agroforestry</text>
<text x="28" y="182" font-family="DejaVu Sans" font-size="8.0" fill="#334155" text-anchor="start" font-weight="normal">windbreak, alley cropping and woodlot on the same farm</text>
</svg>
