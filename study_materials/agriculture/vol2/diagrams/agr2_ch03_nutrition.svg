<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="310" fill="#ECFDF5"/>
<text x="380" y="22" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">The six nutrients, the feeds that carry them, and the ration</text>
<rect x="12" y="34" width="340" height="196" rx="8" fill="#FFFFFF" stroke="#008751" stroke-width="1.4"/>
<text x="182" y="54" font-family="DejaVu Sans" font-size="9.4" fill="#008751" text-anchor="middle" font-weight="bold">THE SIX CLASSES OF NUTRIENT</text>
<rect x="26" y="70" width="154" height="42" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.1"/>
<text x="103" y="87" font-family="DejaVu Sans" font-size="8.4" fill="#2563EB" text-anchor="middle" font-weight="bold">Water</text>
<text x="103" y="102" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="middle" font-weight="normal">the largest need of all</text>
<rect x="192" y="70" width="154" height="42" rx="5" fill="#FFFFFF" stroke="#D97706" stroke-width="1.1"/>
<text x="269" y="87" font-family="DejaVu Sans" font-size="8.4" fill="#D97706" text-anchor="middle" font-weight="bold">Carbohydrate</text>
<text x="269" y="102" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="middle" font-weight="normal">energy — maize, sorghum</text>
<rect x="26" y="120" width="154" height="42" rx="5" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.1"/>
<text x="103" y="137" font-family="DejaVu Sans" font-size="8.4" fill="#DC2626" text-anchor="middle" font-weight="bold">Protein</text>
<text x="103" y="152" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="middle" font-weight="normal">growth — cake, fish meal</text>
<rect x="192" y="120" width="154" height="42" rx="5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.1"/>
<text x="269" y="137" font-family="DejaVu Sans" font-size="8.4" fill="#7C3AED" text-anchor="middle" font-weight="bold">Fat</text>
<text x="269" y="152" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="middle" font-weight="normal">concentrated energy</text>
<rect x="26" y="170" width="154" height="42" rx="5" fill="#FFFFFF" stroke="#008751" stroke-width="1.1"/>
<text x="103" y="187" font-family="DejaVu Sans" font-size="8.4" fill="#008751" text-anchor="middle" font-weight="bold">Minerals</text>
<text x="103" y="202" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="middle" font-weight="normal">bone, shell, milk</text>
<rect x="192" y="170" width="154" height="42" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.1"/>
<text x="269" y="187" font-family="DejaVu Sans" font-size="8.4" fill="#2563EB" text-anchor="middle" font-weight="bold">Vitamins</text>
<text x="269" y="202" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="middle" font-weight="normal">the small regulators</text>
<rect x="364" y="34" width="384" height="196" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
<text x="556" y="54" font-family="DejaVu Sans" font-size="9.4" fill="#2563EB" text-anchor="middle" font-weight="bold">THE PEARSON SQUARE — MIXING TWO FEEDS</text>
<rect x="392" y="72" width="150" height="52" rx="5" fill="#ECFDF5" stroke="#008751" stroke-width="1.1"/>
<text x="467" y="94" font-family="DejaVu Sans" font-size="9.0" fill="#008751" text-anchor="middle" font-weight="bold">maize</text>
<text x="467" y="110" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">9 % protein</text>
<rect x="560" y="72" width="150" height="52" rx="5" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.1"/>
<text x="635" y="94" font-family="DejaVu Sans" font-size="9.0" fill="#DC2626" text-anchor="middle" font-weight="bold">groundnut cake</text>
<text x="635" y="110" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">40 % protein</text>
<rect x="392" y="140" width="150" height="52" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
<text x="467" y="162" font-family="DejaVu Sans" font-size="9.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">target</text>
<text x="467" y="178" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">18 % protein</text>
<rect x="560" y="140" width="150" height="52" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
<text x="635" y="162" font-family="DejaVu Sans" font-size="9.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">the answer</text>
<text x="635" y="178" font-family="DejaVu Sans" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="normal">22 : 9</text>
<line x1="542" y1="98" x2="558" y2="98" stroke="#64748B" stroke-width="1.2" marker-end="url(#an)"/>
<line x1="635" y1="126" x2="635" y2="138" stroke="#64748B" stroke-width="1.2" marker-end="url(#an)"/>
<line x1="542" y1="166" x2="558" y2="166" stroke="#64748B" stroke-width="1.2" marker-end="url(#an)"/>
<rect x="12" y="240" width="736" height="58" rx="7" fill="#ECFDF5" stroke="#008751" stroke-width="1.2"/>
<text x="380" y="260" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="middle" font-weight="normal">subtract on the diagonals: 40 − 18 = 22 parts maize, 18 − 9 = 9 parts cake</text>
<text x="380" y="276" font-family="DejaVu Sans" font-size="8.6" fill="#008751" text-anchor="middle" font-weight="bold">22 : 9 means 22 kg maize to 9 kg cake in every 31 kg of the mixture</text>
<text x="380" y="290" font-family="DejaVu Sans" font-size="8.0" fill="#64748B" text-anchor="middle" font-weight="normal">check: (22 × 9 + 9 × 40) ÷ 31 = 18 per cent — the square is self-checking</text>
</svg>
