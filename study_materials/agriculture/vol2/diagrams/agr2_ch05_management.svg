<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="370" fill="#ECFDF5"/>
<text x="380" y="22" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">The poultry year, and the four management systems</text>
<rect x="12" y="34" width="736" height="118" rx="8" fill="#FFFFFF" stroke="#008751" stroke-width="1.4"/>
<text x="380" y="54" font-family="DejaVu Sans" font-size="9.6" fill="#008751" text-anchor="middle" font-weight="bold">THE BROILER CYCLE — EIGHT WEEKS FROM CHICK TO TABLE</text>
<rect x="24" y="68" width="136" height="74" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.1"/>
<text x="92" y="86" font-family="DejaVu Sans" font-size="8.4" fill="#2563EB" text-anchor="middle" font-weight="bold">Day 1</text>
<text x="92" y="102" font-family="DejaVu Sans" font-size="6.9" fill="#334155" text-anchor="middle" font-weight="normal">brooder 32 °C</text>
<text x="92" y="114" font-family="DejaVu Sans" font-size="6.9" fill="#334155" text-anchor="middle" font-weight="normal">glucose water</text>
<text x="92" y="126" font-family="DejaVu Sans" font-size="6.9" fill="#334155" text-anchor="middle" font-weight="normal">vaccine day 1</text>
<rect x="168" y="68" width="136" height="74" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.1"/>
<text x="236" y="86" font-family="DejaVu Sans" font-size="8.4" fill="#2563EB" text-anchor="middle" font-weight="bold">Week 2</text>
<text x="236" y="102" font-family="DejaVu Sans" font-size="6.9" fill="#334155" text-anchor="middle" font-weight="normal">Gumboro vaccine</text>
<text x="236" y="114" font-family="DejaVu Sans" font-size="6.9" fill="#334155" text-anchor="middle" font-weight="normal">expand brooder</text>
<text x="236" y="126" font-family="DejaVu Sans" font-size="6.9" fill="#334155" text-anchor="middle" font-weight="normal">24 °C</text>
<rect x="312" y="68" width="136" height="74" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.1"/>
<text x="380" y="86" font-family="DejaVu Sans" font-size="8.4" fill="#2563EB" text-anchor="middle" font-weight="bold">Week 4</text>
<text x="380" y="102" font-family="DejaVu Sans" font-size="6.9" fill="#334155" text-anchor="middle" font-weight="normal">finisher feed</text>
<text x="380" y="114" font-family="DejaVu Sans" font-size="6.9" fill="#334155" text-anchor="middle" font-weight="normal">2 000 cm² per bird</text>
<text x="380" y="126" font-family="DejaVu Sans" font-size="6.9" fill="#334155" text-anchor="middle" font-weight="normal">turn the litter</text>
<rect x="456" y="68" width="136" height="74" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.1"/>
<text x="524" y="86" font-family="DejaVu Sans" font-size="8.4" fill="#2563EB" text-anchor="middle" font-weight="bold">Week 6</text>
<text x="524" y="102" font-family="DejaVu Sans" font-size="6.9" fill="#334155" text-anchor="middle" font-weight="normal">withdraw drugs</text>
<text x="524" y="114" font-family="DejaVu Sans" font-size="6.9" fill="#334155" text-anchor="middle" font-weight="normal">1.8–2.2 kg</text>
<text x="524" y="126" font-family="DejaVu Sans" font-size="6.9" fill="#334155" text-anchor="middle" font-weight="normal">live weight</text>
<rect x="600" y="68" width="136" height="74" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.1"/>
<text x="668" y="86" font-family="DejaVu Sans" font-size="8.4" fill="#2563EB" text-anchor="middle" font-weight="bold">Week 8</text>
<text x="668" y="102" font-family="DejaVu Sans" font-size="6.9" fill="#334155" text-anchor="middle" font-weight="normal">to market</text>
<text x="668" y="114" font-family="DejaVu Sans" font-size="6.9" fill="#334155" text-anchor="middle" font-weight="normal">clean the house</text>
<text x="668" y="126" font-family="DejaVu Sans" font-size="6.9" fill="#334155" text-anchor="middle" font-weight="normal">rest it a week</text>
<rect x="12" y="162" width="360" height="152" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/>
<text x="192" y="182" font-family="DejaVu Sans" font-size="9.4" fill="#D97706" text-anchor="middle" font-weight="bold">BREEDING SYSTEMS</text>
<text x="28" y="196" font-family="DejaVu Sans" font-size="8.2" fill="#0E1F40" text-anchor="start" font-weight="bold">Inbreeding</text>
<text x="150" y="196" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="start" font-weight="normal">closely related; fixes type, lowers vigour</text>
<text x="28" y="218" font-family="DejaVu Sans" font-size="8.2" fill="#0E1F40" text-anchor="start" font-weight="bold">Line breeding</text>
<text x="150" y="218" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="start" font-weight="normal">one ancestor repeated; keeps a family</text>
<text x="28" y="240" font-family="DejaVu Sans" font-size="8.2" fill="#0E1F40" text-anchor="start" font-weight="bold">Out-crossing</text>
<text x="150" y="240" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="start" font-weight="normal">unrelated within a breed; restores vigour</text>
<text x="28" y="262" font-family="DejaVu Sans" font-size="8.2" fill="#0E1F40" text-anchor="start" font-weight="bold">Cross-breeding</text>
<text x="150" y="262" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="start" font-weight="normal">two breeds; hybrid vigour in the offspring</text>
<text x="28" y="284" font-family="DejaVu Sans" font-size="8.2" fill="#0E1F40" text-anchor="start" font-weight="bold">Up-grading</text>
<text x="150" y="284" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="start" font-weight="normal">sire of a better breed onto local dams</text>
<rect x="384" y="162" width="364" height="152" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
<text x="566" y="182" font-family="DejaVu Sans" font-size="9.4" fill="#7C3AED" text-anchor="middle" font-weight="bold">THE FOUR MANAGEMENT TASKS</text>
<text x="398" y="200" font-family="DejaVu Sans" font-size="8.2" fill="#0E1F40" text-anchor="start" font-weight="bold">Debeaking</text>
<text x="490" y="200" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="start" font-weight="normal">fowl — stops cannibalism at day 7–10</text>
<text x="398" y="226" font-family="DejaVu Sans" font-size="8.2" fill="#0E1F40" text-anchor="start" font-weight="bold">Dehorning</text>
<text x="490" y="226" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="start" font-weight="normal">cattle — safety in the crush</text>
<text x="398" y="252" font-family="DejaVu Sans" font-size="8.2" fill="#0E1F40" text-anchor="start" font-weight="bold">Castration</text>
<text x="490" y="252" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="start" font-weight="normal">males not kept for breeding; fatter, quieter</text>
<text x="398" y="278" font-family="DejaVu Sans" font-size="8.2" fill="#0E1F40" text-anchor="start" font-weight="bold">Identification</text>
<text x="490" y="278" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="start" font-weight="normal">ear notch, tag or brand — for the record</text>
<rect x="12" y="322" width="736" height="36" rx="7" fill="#ECFDF5" stroke="#008751" stroke-width="1.2"/>
<text x="380" y="344" font-family="DejaVu Sans" font-size="8.6" fill="#008751" text-anchor="middle" font-weight="bold">housing is not a shed — it is the control of temperature, air, space and hygiene</text>
</svg>
