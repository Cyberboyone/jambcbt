<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 324" width="760" height="324">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="324" fill="#ECFDF5"/>
<text x="380" y="22" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">The disease triangle, and the programme that keeps it closed</text>
<rect x="12" y="34" width="360" height="226" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.4"/>
<text x="192" y="54" font-family="DejaVu Sans" font-size="9.6" fill="#DC2626" text-anchor="middle" font-weight="bold">THE DISEASE TRIANGLE</text>
<polygon points="192,78 96,196 288,196" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/>
<text x="192" y="118" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">HOST</text>
<text x="192" y="132" font-family="DejaVu Sans" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="normal">a susceptible animal</text>
<text x="130" y="172" font-family="DejaVu Sans" font-size="10.0" fill="#0E1F40" text-anchor="middle" font-weight="bold">AGENT</text>
<text x="130" y="186" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="middle" font-weight="normal">virus, bacterium,</text>
<text x="130" y="196" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="middle" font-weight="normal">parasite</text>
<text x="254" y="172" font-family="DejaVu Sans" font-size="9.2" fill="#0E1F40" text-anchor="middle" font-weight="bold">ENVIRONMENT</text>
<text x="254" y="186" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="middle" font-weight="normal">damp, dirty,</text>
<text x="254" y="196" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="middle" font-weight="normal">crowded, cold</text>
<text x="192" y="224" font-family="DejaVu Sans" font-size="8.4" fill="#DC2626" text-anchor="middle" font-weight="bold">remove any one side and the disease cannot spread</text>
<text x="192" y="244" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">hygiene removes the agent; vaccination hardens the host;</text>
<text x="192" y="254" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">ventilation and stocking density change the environment</text>
<rect x="384" y="34" width="364" height="226" rx="8" fill="#FFFFFF" stroke="#008751" stroke-width="1.4"/>
<text x="566" y="54" font-family="DejaVu Sans" font-size="9.6" fill="#008751" text-anchor="middle" font-weight="bold">THE HERD HEALTH YEAR</text>
<rect x="398" y="74" width="336" height="32" rx="5" fill="#ECFDF5" stroke="#008751" stroke-width="1.0"/>
<text x="412" y="88" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="bold">Quarantine</text>
<text x="412" y="100" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="start" font-weight="normal">every new animal, 21 days</text>
<rect x="398" y="107" width="336" height="32" rx="5" fill="#FFFFFF" stroke="#008751" stroke-width="1.0"/>
<text x="412" y="121" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="bold">Vaccinate</text>
<text x="412" y="133" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="start" font-weight="normal">the schedule, never late</text>
<rect x="398" y="140" width="336" height="32" rx="5" fill="#ECFDF5" stroke="#008751" stroke-width="1.0"/>
<text x="412" y="154" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="bold">Dose and dip</text>
<text x="412" y="166" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="start" font-weight="normal">internal and external parasites</text>
<rect x="398" y="173" width="336" height="32" rx="5" fill="#FFFFFF" stroke="#008751" stroke-width="1.0"/>
<text x="412" y="187" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="bold">Observe</text>
<text x="412" y="199" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="start" font-weight="normal">feed, water, dung, gait, coat</text>
<rect x="398" y="206" width="336" height="32" rx="5" fill="#ECFDF5" stroke="#008751" stroke-width="1.0"/>
<text x="412" y="220" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="bold">Isolate</text>
<text x="412" y="232" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="start" font-weight="normal">the sick animal at once</text>
<rect x="398" y="239" width="336" height="32" rx="5" fill="#FFFFFF" stroke="#008751" stroke-width="1.0"/>
<text x="412" y="253" font-family="DejaVu Sans" font-size="8.6" fill="#0E1F40" text-anchor="start" font-weight="bold">Record</text>
<text x="412" y="265" font-family="DejaVu Sans" font-size="7.4" fill="#334155" text-anchor="start" font-weight="normal">what was given, when and why</text>
<rect x="12" y="272" width="736" height="40" rx="7" fill="#ECFDF5" stroke="#008751" stroke-width="1.2"/>
<text x="380" y="290" font-family="DejaVu Sans" font-size="8.4" fill="#0E1F40" text-anchor="middle" font-weight="normal">the cost of a vaccination is a few naira; the cost of the outbreak it prevents is the herd</text>
<text x="380" y="303" font-family="DejaVu Sans" font-size="8.4" fill="#008751" text-anchor="middle" font-weight="bold">and a farmer who waits for the symptom has already lost the animal</text>
</svg>
