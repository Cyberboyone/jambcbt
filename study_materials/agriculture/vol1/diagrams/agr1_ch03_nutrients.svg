<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 286" width="760" height="286">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="286" fill="#ECFDF5"/>
<text x="380" y="22" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">What each nutrient does, and how nitrogen goes round</text>
<rect x="12" y="34" width="372" height="214" rx="8" fill="#FFFFFF" stroke="#008751" stroke-width="1.4"/>
<text x="198" y="54" font-family="DejaVu Sans" font-size="9.6" fill="#008751" text-anchor="middle" font-weight="bold">THE THREE MACRONUTRIENTS</text>
<rect x="28" y="72" width="340" height="46" rx="6" fill="#ECFDF5" stroke="#008751" stroke-width="1.1"/>
<text x="44" y="92" font-family="DejaVu Sans" font-size="9.4" fill="#0E1F40" text-anchor="start" font-weight="bold">N — nitrogen</text>
<text x="44" y="108" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">leaves, stems and the green colour</text>
<rect x="28" y="128" width="340" height="46" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.1"/>
<text x="44" y="148" font-family="DejaVu Sans" font-size="9.4" fill="#0E1F40" text-anchor="start" font-weight="bold">P — phosphorus</text>
<text x="44" y="164" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">roots, flowering, seed formation</text>
<rect x="28" y="184" width="340" height="46" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.1"/>
<text x="44" y="204" font-family="DejaVu Sans" font-size="9.4" fill="#0E1F40" text-anchor="start" font-weight="bold">K — potassium</text>
<text x="44" y="220" font-family="DejaVu Sans" font-size="8.4" fill="#334155" text-anchor="start" font-weight="normal">strength, disease resistance, fruit</text>
<text x="198" y="240" font-family="DejaVu Sans" font-size="8" fill="#64748B" text-anchor="middle" font-weight="normal">deficiency shows first where the plant grows</text>
<rect x="396" y="34" width="352" height="240" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
<text x="572" y="54" font-family="DejaVu Sans" font-size="9.6" fill="#2563EB" text-anchor="middle" font-weight="bold">THE NITROGEN CYCLE</text>
<rect x="447.0" y="63" width="250" height="30" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.0"/>
<text x="572" y="82" font-family="DejaVu Sans" font-size="8.2" fill="#0E1F40" text-anchor="middle" font-weight="normal">atmospheric N₂</text>
<rect x="427.0" y="107" width="290" height="30" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.0"/>
<text x="572" y="126" font-family="DejaVu Sans" font-size="8.2" fill="#0E1F40" text-anchor="middle" font-weight="normal">fixation: legumes, lightning, factory</text>
<rect x="447.0" y="151" width="250" height="30" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.0"/>
<text x="572" y="170" font-family="DejaVu Sans" font-size="8.2" fill="#0E1F40" text-anchor="middle" font-weight="normal">soil nitrate</text>
<rect x="447.0" y="195" width="250" height="30" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.0"/>
<text x="572" y="214" font-family="DejaVu Sans" font-size="8.2" fill="#0E1F40" text-anchor="middle" font-weight="normal">plant protein</text>
<line x1="572" y1="93" x2="572" y2="107" stroke="#2563EB" stroke-width="1.3" marker-end="url(#an)"/>
<line x1="572" y1="137" x2="572" y2="151" stroke="#2563EB" stroke-width="1.3" marker-end="url(#an)"/>
<line x1="572" y1="181" x2="572" y2="195" stroke="#2563EB" stroke-width="1.3" marker-end="url(#an)"/>
<line x1="510" y1="78" x2="430" y2="78" stroke="#DC2626" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="470" y="70" font-family="DejaVu Sans" font-size="7.4" fill="#DC2626" text-anchor="middle" font-weight="normal">loss</text>
<text x="572" y="250" font-family="DejaVu Sans" font-size="7.6" fill="#64748B" text-anchor="middle" font-weight="normal">leaching, denitrification and crop removal all take N away</text>
</svg>
