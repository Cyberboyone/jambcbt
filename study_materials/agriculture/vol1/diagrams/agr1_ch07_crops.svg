<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#008751"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E1F40"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="310" fill="#ECFDF5"/>
<text x="380" y="22" font-family="DejaVu Sans" font-size="12.6" fill="#0E1F40" text-anchor="middle" font-weight="bold">Nigeria's belts, from the coast to the Sahel, and what each grows</text>
<rect x="12" y="42" width="736" height="36" rx="5" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.1"/>
<rect x="12" y="42" width="8" height="36" rx="3" fill="#0F766E"/>
<text x="32" y="57" font-family="DejaVu Sans" font-size="8.4" fill="#0F766E" text-anchor="start" font-weight="bold">MANGROVE &amp; FRESH-WATER SWAMP</text>
<text x="32" y="70" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">rice, fish, mangrove timber, raffia</text>
<text x="730" y="64" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="end" font-weight="normal">over 3 000 mm</text>
<rect x="12" y="82" width="736" height="36" rx="5" fill="#FFFFFF" stroke="#15803D" stroke-width="1.1"/>
<rect x="12" y="82" width="8" height="36" rx="3" fill="#15803D"/>
<text x="32" y="97" font-family="DejaVu Sans" font-size="8.4" fill="#15803D" text-anchor="start" font-weight="bold">RAIN FOREST</text>
<text x="32" y="110" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">cocoa, oil palm, rubber, kola, plantain</text>
<text x="730" y="104" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="end" font-weight="normal">1 500–3 000 mm</text>
<rect x="12" y="122" width="736" height="36" rx="5" fill="#FFFFFF" stroke="#65A30D" stroke-width="1.1"/>
<rect x="12" y="122" width="8" height="36" rx="3" fill="#65A30D"/>
<text x="32" y="137" font-family="DejaVu Sans" font-size="8.4" fill="#65A30D" text-anchor="start" font-weight="bold">DERIVED SAVANNA</text>
<text x="32" y="150" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">yam, cassava, maize, cashew, citrus</text>
<text x="730" y="144" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="end" font-weight="normal">1 200–1 500 mm</text>
<rect x="12" y="162" width="736" height="36" rx="5" fill="#FFFFFF" stroke="#CA8A04" stroke-width="1.1"/>
<rect x="12" y="162" width="8" height="36" rx="3" fill="#CA8A04"/>
<text x="32" y="177" font-family="DejaVu Sans" font-size="8.4" fill="#CA8A04" text-anchor="start" font-weight="bold">GUINEA SAVANNA</text>
<text x="32" y="190" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">maize, sorghum, groundnut, cotton, yam</text>
<text x="730" y="184" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="end" font-weight="normal">900–1 200 mm</text>
<rect x="12" y="202" width="736" height="36" rx="5" fill="#FFFFFF" stroke="#D97706" stroke-width="1.1"/>
<rect x="12" y="202" width="8" height="36" rx="3" fill="#D97706"/>
<text x="32" y="217" font-family="DejaVu Sans" font-size="8.4" fill="#D97706" text-anchor="start" font-weight="bold">SUDAN SAVANNA</text>
<text x="32" y="230" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">millet, sorghum, cowpea, groundnut, onion</text>
<text x="730" y="224" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="end" font-weight="normal">500–900 mm</text>
<rect x="12" y="242" width="736" height="36" rx="5" fill="#FFFFFF" stroke="#B45309" stroke-width="1.1"/>
<rect x="12" y="242" width="8" height="36" rx="3" fill="#B45309"/>
<text x="32" y="257" font-family="DejaVu Sans" font-size="8.4" fill="#B45309" text-anchor="start" font-weight="bold">SAHEL</text>
<text x="32" y="270" font-family="DejaVu Sans" font-size="8.2" fill="#334155" text-anchor="start" font-weight="normal">millet, sorghum, gum arabic, livestock</text>
<text x="730" y="264" font-family="DejaVu Sans" font-size="7.8" fill="#64748B" text-anchor="end" font-weight="normal">under 500 mm</text>
<text x="380" y="296" font-family="DejaVu Sans" font-size="8" fill="#64748B" text-anchor="middle" font-weight="normal">the crop follows the rain, and the rain falls northwards in steps</text>
</svg>
